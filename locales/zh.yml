  csv-to-json:
    title: 'CSV 转 JSON'
    description: '把 CSV（或 TSV）解析成 JSON，可自动检测分隔符、转换类型，并提供表格预览。'
    input: '你的 CSV'
    inputPlaceholder: '把 CSV 粘贴在这里…'
    output: '转换后的 JSON'
    preview: '表格预览'
    previewTruncated: '显示前 {shown} 行，共 {total} 行。'
    delimiter: '分隔符'
    autoDetect: '自动检测'
    comma: '逗号（,）'
    semicolon: '分号（;）'
    tab: 'Tab'
    pipe: '竖线（|）'
    indent: '缩进空格数'
    hasHeader: '第一行是标题'
    inferTypes: '转换数字与布尔值'
    trimValues: '去除值前后空白'
    guide:
      intro: 'CSV 是试算表与数据库最通用的交换格式，JSON 则是 API 与程序最常用的格式。这个工具依 RFC 4180 解析 CSV，正确处理引号内的逗号与换行，并输出结构化的 JSON。'
      useCases:
        - '把 Excel 或 Google 试算表导出的数据喂给 API 或前端程序。'
        - '拿到一份 CSV，想先用表格预览确认字段对齐、有没有解析错位。'
        - '把数据库导出的 CSV 转成 JSON 当作测试数据或设置档。'
      steps:
        - '把 CSV 内容贴进输入框，分隔符号默认自动侦测。'
        - '在表格预览确认字段切得正确，特别注意含逗号的字段有没有被切开。'
        - '视需要调整「第一列是标题」「转换数字与布尔值」等选项。'
        - '从下方的 JSON 输出拷贝结果。'
      notes:
        - '含有逗号、换行或双引号的字段，在 CSV 里必须用双引号包住，内部的双引号要写成两个。工具会正确还原这类字段。'
        - '「转换数字与布尔值」刻意保守：像 007、1.0、超过安全整数范围的长数字都会保持字符串，避免静默失真。'
        - '如果自动侦测选错分隔符号，手动指定即可。分号常见于欧洲地区的 Excel 导出档。'
        - '所有解析都在你的浏览器里完成，数据不会上传。'
      faq:
        - q: '中文显示成乱码怎么办？'
          a: '那是文件编码问题，不是这个工具造成的。Excel 导出的 CSV 常是 Big5 或带 BOM 的 UTF-8。用文本编辑器另存成 UTF-8 之后再贴进来即可。'
        - q: '可以反过来把 JSON 转成 CSV 吗？'
          a: '可以，用「JSON 转 CSV」那个工具。两者的引号处理都遵循 RFC 4180，所以来回转换不会失真。'

