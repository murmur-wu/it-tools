  date-converter:
    title: 日期时间转换器
    description: 将日期和时间转换为各种不同的格式
    timezone: '时区'
    guide:
      intro: '同一个时间点在不同系统里有不同的写法：Unix 时间戳、ISO 8601、RFC 3339、Excel 串行值、MongoDB ObjectID 等等。这个工具把你贴进去的值辨识出来，同时输出所有常见格式，并可指定时区。'
      useCases:
        - '在日志或 API 回应里看到一串数字，想知道那是什么时间。'
        - '要把时间写进设置档或数据库，需要特定格式的字符串。'
        - '跨时区协作时，想确认某个时间点在对方时区是几点。'
        - '从 Excel 导出的数据里日期变成一串小数，需要还原成日期。'
      steps:
        - '把时间值贴进输入框，工具会自动辨识格式并切换下方的格式菜单。'
        - '若辨识错误，手动在右边的菜单指定输入格式。'
        - '在时区菜单选择你要的时区，所有输出会跟着换算。'
        - '点各字段右侧的拷贝图标取用结果。'
      notes:
        - '输入的字符串如果没有带时区偏移（例如 2023-04-12 23:10:24），会以你选的时区解读；带了偏移（例如结尾有 Z 或 +08:00）则以该偏移为准，不受时区菜单影响。'
        - 'Unix 时间戳有秒与毫秒两种，十位数通常是秒、十三位数是毫秒。工具会依位数判断。'
        - 'Excel 的日期串行值是从 1900 年起算的天数，小数部分代表当天的时间。'
      faq:
        - q: '要一次转很多笔时间戳怎么办？'
          a: '用「时间戳批量转换」那个工具，可以一次贴多笔并输出成表格。'
        - q: 'ISO 8601 和 RFC 3339 有什么差别？'
          a: 'RFC 3339 可以视为 ISO 8601 的严格子集，强制要求日期与时间之间用 T 分隔、并且一定要带时区偏移。实务上要写进 API 或设置档时，选 RFC 3339 比较不会出错。'

