    guide:
      intro: '把照片和截屏重新编码成 WebP、JPEG 或 PNG，并可选择缩小尺寸，借此减少文件大小。可以一次处理多张图片，再逐张下载或打包成一个 zip。全部在浏览器中完成。'
      useCases:
        - '图片太大无法通过上传限制、电子邮件附件限制，或内容管理系统拒收超过数 MB 的文件时，把它压小。'
        - '提升网页速度：把很大的 PNG、JPEG 转成 WebP，并把宽度限制在版面实际需要的大小。'
        - '替文档或商店商品页准备一批截屏或商品照片。'
      steps:
        - '把图片拖动到上传区，或点一下选择文件。'
        - '选择输出格式（或保留每张图片原本的格式）、质量，以及选用的最大宽度与高度。'
        - '确认每张结果的大小，再逐张下载，或全部打包成 zip 下载。'
      notes:
        - '质量只对 WebP 和 JPEG 有效。PNG 是无损格式，滑块会禁用，PNG 主要靠降低像素尺寸来缩小。质量设在 75 到 85 之间通常是不错的平衡。'
        - '最大宽度和高度只会缩小图片，并保持长宽比；小图不会被放大。'
        - 'JPEG 不支持透明，透明的区域会变成白色。想保留透明请用 WebP 或 PNG。'
        - '重新编码会移除 EXIF 等元数据，包括相机信息与 GPS 位置；动画 GIF 则只会保留第一个帧。'
        - '已经优化过的图片压缩后可能反而变大，这时请比较大小，保留原文件即可。'
      faq:
        - q: '我的图片会被上传到服务器吗？'
          a: '不会。压缩是用浏览器的 canvas 完成的，文件留在您的设备上。这也表示非常大的图片会使用设备的内存，处理时可能需要一点时间。'
        - q: '该选哪种格式？'
          a: '多数照片用 WebP 能得到最小的文件，当前主流浏览器都支持。需要与旧软件最大兼容性时选 JPEG，有锐利线条的图形或需要透明时选 PNG。'

  pdf-compressor:
    title: 'PDF 压缩'
    description: '在浏览器里压缩 PDF，大幅缩小扫描件与照片多的文档，文字仍可选取，文件不会上传。'
    preset: '压缩程度'
    presets:
      screen:
        label: '最小文件'
        hint: '适合屏幕阅读、邮件或聊天软件发送'
      ebook:
        label: '平衡'
        hint: '大多数情况的最佳选择'
      printer:
        label: '高品质'
        hint: '需要打印时使用，缩小幅度较小'
    upload: '把 PDF 拖曳到这里，或点击选择文件'
    privacy: 'PDF 只在你的浏览器里处理，不会上传。'
    engine: '压缩引擎：Ghostscript（AGPL-3.0）。'
    sourceCode: '本站源代码'
    largeFile: '有文件超过 100 MB，处理需要较久，在手机上可能因内存不足而失败。'
    clear: '清除'
    download: '下载'
    recompress: '用目前设置重新压缩'
    waiting: '等待中…'
    loadingEngine: '正在下载压缩引擎（约 15 MB，只需下载一次）…'
    compressing: '压缩中…'
    progress: '正在处理第 {page} / {total} 页'
    notSmaller: '用这个设置无法再缩小，原文件已经很精简。可以换成较小的压缩程度再试一次。'
    errors:
      notPdf: '这不是 PDF 文件。'
      password: '这个 PDF 有打开密码，请先移除密码再压缩。'
      invalid: '无法读取这个 PDF，文件可能已损毁或不完整。'
      failed: '压缩失败，请再试一次。'
      engine: '无法下载压缩引擎，请确认网络连接后再试一次。'
    guide:
      intro: 'PDF 会变大，通常不是因为文本，而是里面的图片：扫描件的每一页都是一张高分辨率照片，报告或产品目录也常直接放入手机拍的原图。这个工具用 Ghostscript 把图片重新采样到适合用途的分辨率并重新压缩，文本、字体与版面维持原样，全程在你的浏览器里完成。'
      useCases:
        - '邮件附件超过大小限制（常见上限是 10 到 25 MB），需要缩小后再寄出。'
        - '上传到政府、学校或求职网站时，系统限制文件不能超过某个大小。'
        - '手机扫描的合同、收据或证件，一页就好几 MB，想缩小后再存盘或发送。'
        - '照片很多的报告或产品目录，想在不影响阅读的前提下减少容量。'
      steps:
        - '选择压缩程度：一般情况选「平衡」，要发送或只在屏幕上看选「最小文件」，需要打印选「高品质」。'
        - '把一个或多个 PDF 拖曳到上方区域，或点击选择文件。第一次使用会先下载约 15 MB 的压缩引擎。'
        - '等待处理完成，进度会依页数显示，完成后会列出压缩前后的大小。'
        - '按「下载」取得压缩后的文件。不满意的话，换一个压缩程度后按「用目前设置重新压缩」。'
      notes:
        - '压缩效果取决于文件内容：扫描件与照片多的 PDF 通常可以缩小一半以上，甚至 90%；纯文本的 PDF 本来就很小，可能只省下一点点。'
        - '「最小文件」会把图片降到 72 dpi，在屏幕上看没问题，但打印时照片和小字可能会模糊。要打印的文档请用「高品质」。'
        - '如果压缩后反而变大，工具会提示并保留原文件，不会提供较大的版本下载。这通常代表源文件已经过优化。'
        - '有打开密码的 PDF 无法处理，请先用原本的软件移除密码。压缩会重新产生文件，数字签名会因此失效，交互表单等高级功能也可能无法完整保留，重要文档请确认压缩后的内容。'
        - '所有处理都在你的浏览器中进行，PDF 不会上传。文件很大（超过 100 MB）时，特别是在手机上，可能因内存不足而失败，建议改用电脑处理。'
      faq:
        - q: '压缩后文字还能选取和搜索吗？'
          a: '可以。这个工具只重新压缩图片，文字仍然是文字，可以选取、搜索与拷贝。如果源文件是没有经过文字识别的扫描图，压缩后也一样只是图片。'
        - q: '为什么有些 PDF 几乎没有变小？'
          a: 'PDF 的大小主要来自图片。以文本或矢量图为主的文件，或是已经用其他工具压缩过的文件，能再缩小的空间很有限。'
        - q: '三种压缩程度差在哪里？'
          a: '差别在图片的分辨率：最小文件是 72 dpi、平衡是 150 dpi、高品质是 300 dpi。分辨率越低文件越小，但放大或打印时越容易看出模糊。'
        - q: '我的文件会被上传吗？'
          a: '不会。压缩引擎 Ghostscript 会下载到你的浏览器，在你的设备上运行，PDF 不会离开你的电脑或手机。'

  qrcode-generator:
    title: 二维码生成器
    description: 生成并下载url或文本的QR代码，并自定义背景和前景颜色。
    decode:
      title: '从图片读取二维码'
      upload: '把图片拖拽到这里，或点击选择图片'
      pasteHint: '也可以直接从剪贴板粘贴图片（Ctrl+V）。'
      result: '解码内容'
      notFound: '这张图片里找不到二维码。'
      error: '无法读取这张图片。'
      useAsInput: '填入上方文本'
      privacy: '图片只在你的浏览器里处理，不会上传。'
    guide:
      intro: '把网址或任何文本转成 QR Code，可下载成图片，并自定义颜色与容错等级。也可以从图片中读出 QR Code 的内容。'
      useCases:
        - '替链接、Wi-Fi 密码提示、联系信息或活动页面创建代码，印在海报或名片上。'
        - '使用自己的前景与背景颜色，做出匹配品牌风格的代码。'
        - '打开来路不明的 QR Code 之前，先上传或粘贴截屏，看它实际指向哪里。'
      steps:
        - '在文本字段输入文本或网址，代码会随输入即时更新。'
        - '视需要调整前景色、背景色与容错等级。'
        - '下载图片。要读取代码时，把图片拖曳到读取区，或按 Ctrl+V 粘贴。'
      notes:
        - '容错等级 low、medium、quartile、high 分别约可容许 7%、15%、25%、30% 的面积损毁仍可扫描。等级越高，代码越密，内容很长时建议用较低的等级。'
        - '两种颜色要保持明显的对比，而且前景要比背景深。对比太低或颜色反转，在很多扫描器上会失败。'
        - '内容越长，代码越密，需要印得更大。扫不好时请缩短内容，例如改用短网址。'
        - 'QR Code 保存的是固定内容，印出后就不能更改。创建与读取都在浏览器中进行，图片不会上传。'
      faq:
        - q: '为什么我的 QR Code 扫不出来？'
          a: '常见原因：对比不足、数据量大但印得太小、代码四周没有留白，或是内容很长又选了很高的容错等级，导致代码太密。'
        - q: 'QR Code 会过期吗？'
          a: '不会。代码只是把您输入的文本编码起来，如果内容是网址，只要那个网址还能用，代码就有效。'

