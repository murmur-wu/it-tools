      dateOnly: '只要日期'
      timeOnly: '只要时间'
      verbose: '含星期与时区'
    columns:
      input: '输入'
      unit: '单位'
      result: '结果（{timezone}）'
    errors:
      notANumber: '不是数字'
      outOfRange: '超出范围'
    guide:
      intro: '一次转换大量的 Unix 时间戳。把日志、数据库导出文件或电子表格里的一整栏粘贴过来，就能得到您指定时区与格式的可读日期，无效的行也会个别标示。'
      useCases:
        - '不必逐条转换，直接读懂应用程序日志或 API 响应里的一整串 epoch 值。'
        - '把数据库导出的时间戳换成自己的时区，确认哪些落在某一天。'
        - '把数字时间戳转成 ISO 8601 字符串，粘贴到工单、测试数据或报告。'
      steps:
        - '粘贴时间戳，可以一行一个，或用逗号、分号、Tab 分隔。'
        - '单位维持自动检测，或手动选择秒、毫秒、微秒、纳秒。'
        - '选择输出格式与时区，再阅读或复制结果表格。'
      notes:
        - '自动检测是看数字的位数：11 位以内视为秒，12 到 14 位视为毫秒，15 到 17 位视为微秒，更多则视为纳秒。很小的毫秒值（例如 1970 年附近）看起来会像秒，所以明确知道单位时请手动指定。'
        - '接受小数（例如 1700000000.5）和负数（1970 年以前的日期）。'
        - 'Unix 时间戳本身没有时区。您选择的时区只会改变显示方式，不会改变它代表的那个时间点。'
        - '不是数字的行，或超出 JavaScript 日期可表示范围的行会标示错误，其他行仍然会正常转换。'
      faq:
        - q: '为什么我的时间戳显示成 1970 年的日期？'
          a: '这个值很可能是毫秒或微秒却被当成秒，或是相反。请不要用自动检测，改为明确指定单位。'
        - q: '一次可以贴多少条？'
          a: '没有固定上限。转换在浏览器中进行，几千行是瞬间完成，非常大量的内容则取决于您的设备。'

