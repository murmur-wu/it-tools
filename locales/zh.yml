  json-prettify:
    title: JSON美化和格式化
    description: 将JSON字符串修饰为友好的可读格式。
    guide:
      intro: '把一长串 JSON 整理成有缩进、方便阅读的格式。也接受较宽松的 JSON5 写法（可含注释、结尾逗号、不加引号的键），输出一律是标准 JSON。'
      useCases:
        - '阅读被压缩成单行的 API 响应或日志内容。'
        - '提交配置文件之前先整理格式，让 diff 只显示真正的修改。'
        - '找出 JSON 坏在哪里，输入不合法时会显示错误信息。'
      steps:
        - '把 JSON 粘贴到上方输入框，下方会立刻显示整理后的结果。'
        - '选择缩进大小（0 到 10 个空格）。'
        - '视需要开关「排序键」，再按复制取用结果。'
      notes:
        - '「排序键」默认是打开的，会把每个对象的键依字母重新排序。这对比较差异很方便，但会改变数据的顺序，如果键的顺序对您有意义，请把它关掉。'
        - '因为接受 JSON5，带有注释或结尾逗号的输入也能成功整理，但输出会移除注释，变成纯 JSON。'
        - '超出 JavaScript 安全整数范围（约 9×10^15）的数字在解析时可能损失精度，过长的 ID 可能被改掉，这类值请用字符串保存。'
        - '上次输入的内容与设置只记录在这个浏览器中，不会传到服务器。'
      faq:
        - q: '为什么没有输出结果？'
          a: '输入不是合法的 JSON 或 JSON5 时，输入框下方会显示错误信息，输出会是空的。常见原因是漏了逗号、括号没有成对，或是 JSON 前后多贴了其他文本。'
        - q: '可以用 Schema 验证字段吗？'
          a: '不行。这个工具只检查语法是否正确并重新排版，不会检查字段类型或必填字段。'

