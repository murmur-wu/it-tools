    capitalize: '每个单前缀字母大写'
    addNumber: '结尾加上两位数字'
    regenerate: '重新产生'
    strength: '强度'
    levels:
      0: '非常弱'
      1: '弱'
      2: '普通'
      3: '强'
      4: '非常强'
    entropy: '熵值 {bits} 比特'
    crackTime: '以每秒一百亿次脱机猜测，平均破解时间：'
    crack:
      instant: '瞬间'
      ages: '比宇宙年龄还长'
      seconds: '{n} 秒'
      minutes: '{n} 分钟'
      hours: '{n} 小时'
      days: '{n} 天'
      years: '{n} 年'
    privacy: '由浏览器内置的密码学乱数来源产生，不会发送到任何地方，也不会保存。'
    guide:
      intro: '好的密码要够长、够随机，而且一个帐号只用一次。这个工具用浏览器内置的密码学乱数来源产生密码，结果无法被预测，也不会离开你的设备，同时估算攻击者要猜多久才猜得到。'
      useCases:
        - '注册新帐号，密码打算存在密码管理器里而不是用背的。'
        - '需要一组真的打得出来、念得出来的密语，例如 Wi-Fi 密码或笔电登录。'
        - '替手机、卡片或门锁产生 PIN 码。'
        - '一次产生好几组，从中挑一个顺眼的。'
      steps:
        - '选类型：存进密码管理器的用随机密码，需要手打的用密语，数字锁用 PIN。'
        - '调整长度或单字数与字符类型，下方的强度面板会即时更新。'
        - '点结果旁的拷贝图标取用，或按 Ctrl+Enter 重新产生一批。'
      notes:
        - '长度比符号重要得多。16 个随机英数字比 8 个混杂各种符号的字符强。'
        - '从 2048 个单字的清单挑四个字组成的密语约有 44 比特的熵值，跟 8 个字符的完全随机密码差不多，但好打非常多。'
        - '破解时间的估算假设攻击者拿到哈希后脱机猜测，速度每秒一百亿次。有登录次数限制的网站慢得多；用弱算法哈希的外泄数据库大约就是这个速度。'
        - '产生的密码不要在多个帐号重复使用，一个网站外泄就会连带影响其他帐号。'
      faq:
        - q: '在网站上产生密码安全吗？'
          a: '在这里是安全的：产生过程完全在你的浏览器里用 Web Crypto API 完成，不会对任何服务器发出请求。你可以在产生时打开浏览器的网络面板自行确认。'
        - q: '为什么有些网站不接受产生出来的符号？'
          a: '有些服务只接受部分符号。把符号选项取消勾选，然后把长度多加几个字符，强度一样够。'

