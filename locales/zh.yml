        4: '四月'
        5: '五月'
        6: '六月'
        7: '七月'
        8: '八月'
        9: '九月'
        10: '十月'
        11: '十一月'
        12: '十二月'
    guide:
      intro: 'Cron 是 Unix 与 Linux 上的调度格式，用五个（或六个）字段描述「什么时候要运行」。这个工具帮你验证表达式、翻成易读的说明，并列出接下来几次实际的运行时间，让你在写进 crontab 之前就先确认调度是对的。'
      useCases:
        - '设置服务器的定期备份、日志轮替或数据同步，写完想先确认调度真的如预期。'
        - '看到同事或旧项目留下的 cron 表达式，想知道它到底多久跑一次。'
        - '设置 GitHub Actions、Kubernetes CronJob 或 Cloudflare Workers 的调度，这些平台都用同一套语法。'
      steps:
        - '在上方输入框填入 cron 表达式，或用下方的「组出表达式」用菜单组出来再套用。'
        - '看中间那行易读说明，确认语意与你想的一致。'
        - '在「接下来的运行时间」选择时区，核对列出的五次时间点。'
      notes:
        - '五栏格式是「分 时 日 月 星期」，六栏则在最前面多一个「秒」。多数服务器的 crontab 只支持五栏，秒字段常见于应用层的调度器。'
        - '星期日可以写 0 或 7，两者等价。「星期从 0 开始」的开关只影响易读说明的文本，不影响表达式本身。'
        - '时区很重要。服务器的 crontab 通常跑在系统时区（常是 UTC），而不是你所在的时区，所以务必用时区菜单核对。'
        - "{'@'}reboot 只在系统启动时运行一次，没有固定调度，因此不会列出运行时间。"
      faq:
        - q: '每 15 分钟运行一次要怎么写？'
          a: '写成 */15 * * * *。斜线代表间隔，所以会在每小时的 0、15、30、45 分运行。'
        - q: '为什么我的调度在服务器上跑的时间跟这里显示的不一样？'
          a: '几乎都是时区问题。用 date 指令确认服务器时区，再把上面的时区菜单切到同一个时区重新核对。另一个常见原因是 crontab 的 PATH 与登录 shell 不同，导致指令找不到而没有实际运行。'

  http-status-codes:
    title: HTTP 状态码
    description: 所有HTTP状态的列表对其名称和含义解释。
    guide:
      intro: '可搜索的 HTTP 状态码速查表，收录所有标准状态码，依五大类（1xx 信息、2xx 成功、3xx 重定向、4xx 客户端错误、5xx 服务器错误）分组，每个都有正式名称与简短说明。'
      useCases:
        - '查询在日志、浏览器网络面板或 API 响应中看到的陌生状态码。'
        - '替 API 端点击择正确的返回码，例如 204 还是 200、401 还是 403。'
        - '复习相似状态码的差别，例如 301、302、307、308。'
      steps:
        - '在搜索框输入状态码、名称或关键字；结果会随输入实时更新，并支持模糊比较。'
        - '搜索框留空可以依分类浏览全部状态码。'
        - '阅读您需要的状态码的名称与说明。'
      notes:
        - '第一个数字代表分类：2xx 请求成功、3xx 到别处找、4xx 客户端弄错了、5xx 服务器失败。遇到不认识的状态码，应依它的分类处理。'
        - '401 表示未验证（没有证书或证书无效），403 表示已验证但没有权限。选错会让客户端困惑，也可能泄漏信息。'
        - '301 与 308 是永久重定向，302 与 307 是暂时的。307 与 308 会保留请求方法与内容，而 301 与 302 时浏览器可能把 POST 改成 GET。'
        - '有些状态码只属于特定的协定扩充，或是非正式的（例如 418 与 451）；在依赖某个状态码之前，先确认您的框架与客户端支持它。'
      faq:
        - q: 'API 找不到资源时应该返回哪个状态码？'
          a: '路径正确但资源不存在用 404；资源曾经存在但已刻意移除用 410。如果问题出在请求内容而不是路径，用 400 或 422。'
        - q: '500、502、503、504 有什么差别？'
          a: '500 是泛用的服务器错误；502 表示网关从上游服务器收到无效响应；503 表示服务暂时无法使用或重载；504 表示上游没有在时限内响应。'

  sql-prettify:
    title: SQL 美化和格式化
    description: 在线格式化和美化您的 SQL 查询（它支持各种 SQL 方言）。
    guide:
      intro: '把 SQL 整理成一致缩进、易读的布局，可选择数据库方言（PostgreSQL、MySQL、SQL Server、BigQuery 等）、关键字大小写与缩进样式。由 sql-formatter 库驱动。'
      useCases:
        - '从日志、ORM 或 BI 工具复制出来的一长串查询，先整理成可读再调试。'
        - '提交或粘贴到审查之前，统一查询的风格。'
        - '整理脚本生成的单行查询。'
      steps:
        - '选择匹配您数据库的方言，让它特有的关键字与语法能被正确辨识。'
        - '选择关键字大小写（大写、小写或保留）与缩进样式。'
        - '粘贴查询，复制整理后的结果。'
      notes:
        - '格式化只调整空格与关键字大小写，绝不改变查询的意义，也不会对照数据库结构做验证。'
        - '选错方言可能误读方言特有的语法（例如 T-SQL 的中括号或 PostgreSQL 的 :: 转型），生成奇怪的断行。Standard SQL 是安全的保底选项。'
        - '表格式缩进会把关键字对齐成一栏，有些团队偏好用在很长的 SELECT 列表；Standard 则是常见的嵌套布局。'
        - '以分号分隔的多个语句会依序逐一格式化。'
      faq:
        - q: '为什么某个语法附近的输出看起来不对？'
          a: '最可能是方言不符。请切换到您数据库的方言；如果是不常见的语法，Standard SQL 可能会格式化得比较稳定。'
        - q: '格式化会改变数据库运行查询的方式吗？'
          a: '不会。空格与关键字大小写对数据库没有影响，字符串字面量与标识符也都不会被动到，查询的行为完全一样。'

  benchmark-builder:
    title: 基准生成器
    description: 简单的在线基准构建器可以轻松比较任务的执行时间。
    guide:
      intro: '比较您自己测量的多组数据，例如两种实现的运行时间：输入每组测试的数值，就能得到排名后的平均值与方差，以及可直接粘贴到 issue 或 PR 的 Markdown 表格。'
      useCases:
        - '在 PR 说明中呈现两三种程序写法的耗时。'
        - '不用电子表格就汇整重复的手动测量（页面加载、建置时间、请求延迟）。'
        - '确认两种做法的差异是稳定存在，还是只是噪音。'
      steps:
        - '替每组测试命名并输入测量值，一个字段一个数字；用加号添加测试组。'
        - '设置单位（ms、s、MB），表格才有标示。'
        - '阅读平均值与方差，再以 Markdown 表格或纯文本复制结果。'
      notes:
        - '显示的方差是母体方差（偏差平方的平均）。方差相对于平均值很大，代表测量很吵，两组之间的小差距可能没有意义。'
        - '每组至少测量五次、舍弃第一次（冷缓存、JIT 预热），并在相同条件下测量各变体，否则比较不公平。'
        - '这个工具不会运行任何代码，只汇整您提供的数字；数字请用您语言的性能测试库生成。'
        - '测试组与单位会记在这个浏览器中，之后可以回来补充测量。'
      faq:
        - q: '为什么我比较快的版本有时量起来比较慢？'
          a: '背景活动、CPU 频率调整与垃圾回收都会增加噪音。多重复几次，并报告平均值与方差（或更好的中位数），比较才稳健。'
        - q: '可以一次粘贴一串数字吗？'
          a: '当前不行，数值要一个字段一个输入。很长的串行请先在性能测试工具中汇整，再把摘要值填进来。'

  git-memo:
    title: Git 备忘录
    description: Git是一种去中心化的版本管理软件。使用此备忘单，您可以快速访问最常见的git命令.
    guide:
      intro: '一页式的 Git 速查表，收录最常用的命令，依任务分组：设置 Git、创建保存库、提交、复原错误，以及日常的其他操作。'
      useCases:
        - '查询不常用命令的确切语法，例如修改上一个提交或还原某个文件。'
        - '在压力下从错误中复原（开错分支、提交错误、误加文件）。'
        - '用一份简短实用的参考带新人入门 Git。'
      steps:
        - '扫过各节标题找到您的任务。'
        - '复制命令，把占位符（分支名称、文件路径）换成自己的。'
        - '用浏览器的搜索（Ctrl+F）找关键字。'
      notes:
        - '会改写历史的命令（amend、rebase、reset --hard、强制推送）在尚未推送的提交上是安全的。一旦别人可能已经拉取，请改用 git revert，它会添加一个提交而不是改写。'
        - 'git reset --hard 与 git checkout -- file 会永久丢弃未提交的工作。可能还需要的话，先运行 git stash。'
        - 'git pull 等于 fetch 加 merge；许多团队偏好 git pull --rebase，避免在功能分支上生成合并提交。'
        - '速查表覆盖命令行客户端。图形接口客户端与 IDE 提供相同的操作，只是名称不同。'
      faq:
        - q: '怎么取消上一个提交但保留修改？'
          a: 'git reset --soft HEAD~1 会把分支退回一个提交，文件维持在暂存区。用 --mixed（默认）会同时取消暂存，--hard 则只在想丢弃修改时使用。'
        - q: 'git revert 和 git reset 有什么差别？'
          a: 'revert 会创建一个新的提交来抵销先前的提交，历史完整、可以安全推送。reset 会移动分支指针并改写历史，所以只适合本地尚未推送的提交。'

  slugify-string:
    title: 打乱字符串
    description: 确保字符串 url、文件名和 id 安全。
    guide:
      intro: '把任意文本转成 slug：以连字号分隔的小写 ASCII 字母与数字，可以安全地用在网址、文件名或 HTML id。带重音的字母会转写成基本字母，符号会被移除或改写成单字。'
      useCases:
        - '从博客文章或商品页的标题生成网址路径。'
        - '从用户输入的标签创建没有空格与特殊字符的文件或文件夹名称。'
        - '替生成的 HTML 标题创建锚点 id。'
      steps:
        - '粘贴文本，例如一个标题。'
        - '下方会显示 slug，随输入实时更新。'
        - '复制它。'
      notes:
        - '带重音与特殊的拉丁字母会被转写（é 变 e、ö 变 oe、ß 变 ss），& 会变成 and，其他非字母数字的字符都会变成连字号。连续的连字号会合并，开头与结尾的连字号会移除。'
        - '中文、日文、阿拉伯文等非拉丁文本在这里没有转写规则，会被直接丢掉。只用这些文本写的标题会得到空的 slug，请提供拉丁字母的标题，或先用转写工具处理。'
        - '单字内的大小写变化会被视为单字边界，所以 fooBar 会变成 foo-bar。'
        - 'slug 不保证唯一。只差在标点或重音的两个标题会生成相同的 slug，所以系统通常会在后面加上 id 或序号。'
      faq:
        - q: '为什么网址用 slug 比直接用原始标题好？'
          a: '它可以避免百分比编码、容易阅读、在处理 Unicode 有问题的系统间也稳定，而且是搜索引擎与用户预期的形式。连字号比底线好，因为搜索引擎把连字号当成单字分隔。'
        - q: '为什么我的中文标题什么都没生成？'
          a: '这个库只转写拉丁字母系的字符。其他文本请先翻译或罗马化（例如用拼音）再做 slug。'

  encryption:
    title: 加密/解密文本
    description: 使用加密算法（如AES、TripleDES、Rabbit或RC4）加密和解密文本明文。
    guide:
      intro: '用口令快速加密一段文本，可选 AES、TripleDES、Rabbit 或 RC4，也能解密以相同方式生成的文本。它以 CryptoJS 库为基础，其口令模式与 OpenSSL 格式兼容。'
      useCases:
        - '在发送到不完全可信的管道之前，先保护一段简短的笔记或程序片段。'
        - '给定口令，解开网页应用程序中用 CryptoJS 生成的值。'
        - '在教学中示范或测试以口令为基础的加密。'
      steps:
        - '输入文本、密钥（口令）并选择算法，下方就会显示加密后的文本。'
        - '要解密时，粘贴加密后的文本，输入相同的密钥并选择相同的算法。'
        - '复制结果。密钥或算法错误时会显示错误，而不是文本。'
      notes:
        - '输出是以 U2FsdGVkX1 开头的 Base64 字符串，那是 Salted__ 经过编码的结果。每次都会生成随机盐，所以同一段文本加密两次会得到不同的结果，而且两者都能正确解密。'
        - '密钥与 IV 是用 OpenSSL 风格的密钥派生（单轮、以 MD5 为基础）从口令生成的，抵挡猜测的能力很弱，请使用长且随机的口令。'
        - 'AES 是合理的选择。TripleDES 速度慢且正在被淘汰，RC4 已被破解，Rabbit 很少使用，其他算法是为了兼容性而提供。'
        - '没有验证机制，所以被修改过的密文可能解出乱码而不是干净地失败。这不适合用来保护真正的机密或密码。'
      faq:
        - q: '为什么相同的输入每次结果都不同？'
          a: '因为有随机盐，这是刻意的设计：避免两则相同的消息生成相同的密文。解密时会从密文开头读回盐。'
        - q: '什么时候该改用 AES 高级工具？'
          a: '需要配合其他系统所用的特定密钥、IV 与模式时。这个工具把这些细节隐藏起来，无法重现它们。'

  aes-advanced-encryption:
    title: AES 高级加密 / 解密
    description: 使用明确指定的密钥与 IV（hex、base64 或文本），以 CBC、GCM、CTR 或 ECB 模式进行 AES 加密与解密，便于与其他系统互通。
    guide:
      intro: '使用您自己指定的密钥与 IV，以 CBC、GCM、CTR 或 ECB 模式进行 AES 加密与解密。和以口令为基础的工具不同，它能精确重现其他系统或库的做法，这正是做互操作性测试所需要的。'
      useCases:
        - '给定密钥与 IV，重现 API 或旧系统预期的密文，或解开它传来的值。'
        - '确认自己写的程序对测试向量加密后，和参考实现得到相同的字节。'
        - '学习模式、IV 长度与填充（padding）如何改变输出。'
      steps:
        - '选择模式，输入密钥，并选择它的编码（十六进制、base64 或 UTF-8 文本）。'
        - '用同样的方式输入 IV 或 nonce；ECB 不需要。GCM 还可以加入选用的额外验证数据。'
        - '输入明文就会得到您所选编码的密文；在解密区粘贴密文，则会显示明文。'
      notes:
        - '密钥长度必须刚好是 16、24 或 32 字节（AES-128、192、256），工具会告诉您收到的长度。请注意 64 个字符的十六进制密钥是 32 字节，但同样 64 个字符若当成文本输入就是 64 字节，会被拒绝。'
        - 'CBC 与 CTR 需要 16 字节的 IV，GCM 使用 12 字节的 nonce（建议），ECB 不使用 IV。'
        - 'GCM 是带验证的加密：16 字节的验证标签会附加在密文后面，只要内容被改过，解密就会失败。CBC、CTR、ECB 则没有完整性保护。'
        - '在 GCM 或 CTR 中，绝对不要用同一把密钥重复使用同一个 IV，否则可能泄漏明文。每则消息都要生成新的随机 IV。'
        - 'ECB 会把相同的块加密成相同的结果，泄漏数据的规律，只为了兼容性而提供，不要用在新的设计上。'
      faq:
        - q: '为什么解密失败或得到乱码？'
          a: '几乎都是设置不一致：密钥或 IV 不同、模式选错、密文编码不对（十六进制与 base64），或在 GCM 中缺少验证标签、额外数据不同。请逐项对照生成数据的那个系统。'
        - q: '这和简易的加密／解密工具一样吗？'
          a: '不一样。简易工具输入的是口令，并用随机盐自行推导密钥与 IV，所以每次输出都不同，也只和采用相同做法的工具兼容。这个工具直接使用原始的密钥与 IV，每个字节都由您决定。'

  random-port-generator:
    title: 随机端口生成
    description: 生成“已知”端口范围（0-1023）之外的随机端口号。
    guide:
      intro: '在 1024 到 65535 之间随机挑一个 TCP/UDP 连接端口号，避开需要管理员权限、保留给标准服务的知名连接端口范围（0 到 1023）。'
      useCases:
        - '替新的开发服务器、测试数据库或本地服务挑一个不会和常见默认值撞到的连接端口。'
        - '替信道、代理或暂时的容器连接端口对应随意挑一个端口号。'
        - '替配置文件生成测试值。'
      steps:
        - '阅读生成的连接端口号。'
        - '按刷新（或 Ctrl+Enter）再抽一个。'
        - '复制到您的设置中。'
      notes:
        - '1024 到 49151 是 IANA 分配给特定应用程序的注册连接端口；随机抽到的号码可能正好是您机器上其他程序已在用的，例如 3306（MySQL）或 5432（PostgreSQL）。决定使用前请用 netstat、ss 或 lsof 确认。'
        - '49152 到 65535 是操作系统分配给对外连接用的动态（暂时）范围。服务监听这段可以运作，但偶尔会和正在使用的暂时连接端口冲突。'
        - '生成器不会检查您的机器，它只是抽一个数字。'
      faq:
        - q: '为什么要避开 1024 以下的连接端口？'
          a: '那些是知名连接端口（HTTP 80、HTTPS 443、SSH 22 等）。在多数系统上绑定它们需要 root 或管理员权限，也可能和标准服务冲突。'
        - q: '用随机连接端口算是一种安全措施吗？'
          a: '几乎不算。连接端口扫描器几秒内就能找到开放的端口，不常见的端口号只能减少自动探测的噪音。请改用身分验证与防火墙保护服务。'

  yaml-prettify:
    title: YAML美化和格式化
    description: 将YAML字符串修饰为友好的可读格式。
    guide:
      intro: '以一致的缩进重新排版 YAML 文档，并可选择把每个映射的键排序。文档会先解析再写回，所以输出是合法、标准化的 YAML。'
      useCases:
        - '统一多人或多个工具编辑过的配置文件的缩进。'
        - '把键排序，让两份 YAML 可以用一般的 diff 比较。'
        - '验证 YAML 文件：语法错误会被报告，而不是输出排版结果。'
      steps:
        - '把 YAML 粘贴到输入字段。'
        - '设置缩进大小（1 到 10 个空格），并切换「Sort keys」。'
        - '复制排版后的输出。'
      notes:
        - '因为文档是解析后重新串行化，注释会被移除、锚点与别名会被展开，字符串原本的引号风格也可能改变。值与结构维持不变。'
        - '「Sort keys」会在每一层依字母重新排序映射。列表维持原顺序，因为列表的顺序是有意义的。'
        - '会被读成其他类型的字符串（true、1.0、null）在输出中会加上引号以保留原意。'
        - '只处理单一文档；用 --- 分隔多份文档的文件会被拒绝。'
      faq:
        - q: '为什么我的注释不见了？'
          a: 'YAML 的注释不属于数据模型，而排版器处理的是解析后的数据。注释重要的话请保留原文件，或排版后再加回去。'
        - q: '这和「YAML 转 JSON」工具一样吗？'
          a: '两者共用解析器，但这个工具把 YAML 写回 YAML，转换器则输出 JSON。结果必须维持 YAML 时请用这个。'

  eta-calculator:
    title: ETA 计算器
    description: ETA（估计到达时间）计算器，用于知道任务的近似结束时间，例如下载的结束时刻。
    guide:
      intro: '从当前的进度速度估算任务何时完成：输入总工作量、开始时间与当前观察到的速率（多少单位需要多少时间），就能得到总耗时与预计结束时间。'
      useCases:
        - '从当前的吞吐量预测下载、备份、数据迁移或批量作业何时完成。'
        - '依当前观察到的节奏估算重复性手工作业要花多久。'
        - '规划：确认某个流程能否在期限前或维护时段结束前完成。'
      steps:
        - '输入要处理的总单位数（文件、数据列、MB、项目）。'
        - '设置开始时间与观察到的速率，例如每 5 分钟 3 个单位。'
        - '阅读总耗时与相对的结束时间（例如明天 14:30）。'
      notes:
        - '估算假设速率固定。下载、建置与迁移常会变慢或变快，请不时重新测量速率并更新字段。'
        - '耗时是总单位数除以速率；结束时间是开始时间加上耗时，以您设备的时区显示。'
        - '总量与速率要用同一种单位。速率若是每秒多少 MB，总量也必须以 MB 计。'
        - '结束时间以相对于现在的方式显示（今天、明天、星期几），读起来自然，但如果很久以后才回到这个页面，请重新确认。'
      faq:
        - q: '下载的速率要怎么获取？'
          a: '记下一到两分钟内传输的量（多数下载管理器会显示），把那个量和那段时间填进去。测量时间越长，估算越稳定。'
        - q: '为什么结束时间和我的工具预测的不同？'
          a: '工具通常使用最近速度的移动平均，而这个计算器只用您输入的单一速率。如果测量之后速度变了，两边的估算就会分歧。'

  roman-numeral-converter:
    title: 罗马数字转换器
    description: 将罗马数字转换为数字，并将数字转换为罗马数字。
    guide:
      intro: '把 1 到 3999 的数字转成罗马数字，也能把罗马数字转回数字，采用标准的减法记法（写 IV 而不是 IIII）。'
      useCases:
        - '用罗马数字写年份、章节编号或续集片名（Rocky IV）。'
        - '读懂纪念碑、电影版权声明或钟面上的日期与数字。'
        - '核对作业或谜题的答案。'
      steps:
        - '在第一个字段输入数字，就会看到它的罗马数字。'
        - '在第二个字段输入罗马数字，就会看到对应的数字。'
        - '复制任一结果。'
      notes:
        - '七个符号是 I（1）、V（5）、X（10）、L（50）、C（100）、D（500）、M（1000）。小符号放在大符号前面是相减（IX 是 9），放在后面是相加（XI 是 11）。'
        - '只支持 1 到 3999，因为古典记法没有大于 M 的符号，同一符号最多重复三次。更大的数字古时会在数字上加一条横线，纯文本无法输入。'
        - '罗马数字没有零，也没有负数或分数。'
        - '验证只接受标准形式：IIII、VX、IC 会被拒绝，即使某些钟面和碑文上有这种写法。'
      faq:
        - q: '为什么不能转换 4000 以上的数字？'
          a: '标准罗马数字到 3999（MMMCMXCIX）为止。古罗马人写更大的数值时会在上面加横线表示乘以一千，纯文本没有对应的写法。'
        - q: '为什么 MCMXCIX 是 1999？'
          a: '分组来读：M（1000）、CM（900）、XC（90）、IX（9）。每一组都是一个大符号减去放在它前面的小符号。'

  hmac-generator:
    title: Hmac 生成器
    description: 使用密钥和您喜欢的哈希函数计算基于哈希的消息身份验证代码（HMAC）。
    guide:
      intro: '计算 HMAC，也就是把消息和密钥混在一起生成的哈希，可使用 MD5、SHA-1、SHA-2（224、256、384、512）、SHA-3 或 RIPEMD-160。HMAC 能证明消息是由知道密钥的人生成，而且传递过程中没有被改动。'
      useCases:
        - '验证服务用共享密钥对请求内容签署的 Webhook 签名。'
        - '重现 API 预期的签名（请求签署、签名网址），找出自己的签名为什么被拒绝。'
        - '拿已知正确的结果检查自己的 HMAC 实现。'
      steps:
        - '在明文字段输入消息，在密钥字段输入共享密钥。'
        - '选择哈希函数，一般使用 SHA256。'
        - '选择输出编码（十六进制、base64、base64url 或二进制），复制 HMAC。'
      notes:
        - '消息和密钥都是当成 UTF-8 文本处理。如果您的密钥是二进制，或以十六进制、base64 提供，请先解码；否则工具会把那串文本的字符本身当成密钥。'
        - '消息中多一个空格或换行，整个结果就会完全不同，所以请粘贴实际被签署的字节，例如原始的请求内容，而不是重新排版过的版本。'
        - '建议使用 SHA-256 或更强的函数。HMAC-MD5 与 HMAC-SHA1 作为消息验证码仍被认为安全，但主要是为了旧系统而保留。'
        - '在服务器上请以固定时间的方式比较 HMAC（例如 crypto.timingSafeEqual），而不是用一般的字符串比较。'
      faq:
        - q: 'HMAC 和单纯的哈希有什么不同？'
          a: '单纯的哈希任何人都能算，所以只能检测意外的变动。HMAC 需要密钥，因此还能证明消息的来源，并让攻击者无法伪造出相符的值。'
        - q: '为什么我算出的 HMAC 和服务传来的不一样？'
          a: '常见原因是输出编码不同（十六进制与 base64）、密钥应该先解码、哈希函数选错，或是请求内容在您签署之前已被框架修改过。'

  bip39-generator:
    title: BIP39密码生成器
    description: 从现有或随机助记符生成BIP39密码短语，或从密码短语获取助记符。
    guide:
      intro: '处理 BIP39 助记词，也就是加密货币钱包使用的 12 或 24 个单词的复原短语：生成新的随机短语、从十六进制的熵推导短语，或从既有短语还原熵，支持十种官方单词表。'
      useCases:
        - '了解钱包的复原短语是如何从随机熵推导出来的。'
        - '替钱包软件、教学或自动化测试创建测试用短语。'
        - '检查某个短语在其语言中是否有效（单词正确且校验码相符）。'
      steps:
        - '选择单词表的语言。'
        - '按刷新生成新的随机熵，或粘贴自己的十六进制熵，获取短语。'
        - '或粘贴既有的短语，查看它编码的熵。'
      notes:
        - '绝对不要把保护真实资金的短语输入任何网站，包括这个。虽然计算在本地运行，但浏览器扩充功能、截屏或剪贴板管理器都可能截取它。这个工具只用于学习与测试。'
        - '128 比特的熵生成 12 个单词，256 比特生成 24 个；最后一个单词含有校验码，所以随机凑出的单词几乎不可能是有效短语。'
        - '单词表是标准的一部分，短语只在它自己的语言中有意义。同一个熵换成另一种语言会得到不同的短语。'
        - '短语要搭配推导路径与选用的口令（「第 25 个字」）才能推导出钱包密钥。这个工具只覆盖助记词这一步。'
      faq:
        - q: '为什么我的短语被判定为无效？'
          a: '可能有单词拼错或来自其他语言的单词表、单词数量不对（12、15、18、21 或 24），或最后一个单词的校验码不符。请逐字对照官方单词表。'
        - q: '可以用自己喜欢的单词拼出短语吗？'
          a: '不安全。人挑的单词熵很低，而且校验码几乎一定不会过。请一律使用安全随机数来源生成的熵，最好由钱包本身生成。'

  base64-file-converter:
    title: Base64 文件转换器
    description: 将字符串、文件或图像转换为其 Base64 表示形式。
    guide:
      intro: '把任何文件（图片、PDF、字体、压缩文件）编码成 Base64 字符串，也能把 Base64 字符串还原成可下载的文件，并尽可能从数据内容检测文件类型。全部在浏览器中完成。'
      useCases:
        - '把小图片或字体以 data URL 的形式直接嵌进 HTML、CSS 或 JSON。'
        - '通过只能传文本的管道（JSON API、电子邮件内文、配置文件）发送二进制文件。'
        - '把从 API 收到的 Base64 内容存成真正的文件来打开。'
      steps:
        - '要编码时，把文件拖到上传区，复制 Base64 输出。'
        - '要解码时，粘贴 Base64 字符串（有无 data: 前缀都可以），类型检测不到时设置文件名与扩展名，再按下载。'
        - '用预览确认图片有正确解码。'
      notes:
        - 'Base64 会让数据大约增加 33%。嵌入适合几 KB 以下的文件（图标、小字体）；较大的资源最好以独立文件提供，让浏览器可以缓存。'
        - 'data URL 前面需要 MIME 类型（data:image/png;base64,...）。这里的编码输出是纯 Base64 内容；组 data URL 时请自己加上类型，或从图片预览复制。'
        - '文件类型是从解码后数据的前几个字节猜测的。没有可辨识标头的格式（纯文本、CSV、某些二进制文件）请手动设置扩展名。'
        - '大文件在内存中编码，数百 MB 的文件依设备而定可能很慢或失败。'
      faq:
        - q: '为什么解码出来的文件损毁或打不开？'
          a: '通常是 Base64 字符串被截断、被邮件软件插入换行或空格，或是 URL 安全版的 Base64（含 - 与 _）。请清理字符串，并确认长度是 4 的倍数（用 = 补位）。'
        - q: 'Base64 可以用来隐藏或保护文件吗？'
          a: '不行。它是任何人都能立刻还原的编码。需要保密请使用加密。'
  list-converter:
    title: List 转换器
    description: 该工具可以处理基于数组的数据，并将各种更改（转置、添加前缀和后缀、反向列表、排序列表、小写值、截断值）应用于每一行。
    guide:
      intro: '把一行一项的列表刷新成需要的格式：修剪空格、去重复、转小写、排序或反转，替每一项加上前缀与后缀，用分隔符号相连，再把整个列表包起来。常见的输出是逗号分隔列表或可直接用在 SQL 的列表。'
      useCases:
        - '把从电子表格复制的一栏转成 ''a'', ''b'', ''c''，给 SQL 的 IN 子句或代码的数组用。'
        - '清理列表：移除重复与空行、修剪空格、排序。'
        - '一次替每一项加上引号、括号或网址前缀。'
      steps:
        - '粘贴项目，一行一个。'
        - '切换要做的转换：修剪、去重复、转小写、排序、反转、保留换行。'
        - '设置项目的前缀与后缀、分隔符号，以及整个列表的前缀与后缀，然后复制结果。'
      notes:
        - '转换以固定顺序进行：转小写、去重复、反转、排序、修剪、移除空行，最后包装与相连。因此去重复发生在修剪之前，即使打开修剪，''a'' 与 ''a '' 仍是两个项目；在意的话把修剪后的输出再贴回来跑第二次。'
        - '排序是以文本方式按字母顺序，所以 10 会排在 2 前面。需要数值顺序时请先补零或在别处排序。'
        - '分隔符号只插在项目之间；搭配「Keep line breaks」可以得到一行一项、每行结尾仍有逗号的格式。'
        - '设置会记在这个浏览器中，下次打开会是上次使用的配置。'
      faq:
        - q: '怎么做出 SQL 的 IN 列表？'
          a: '把项当前缀与后缀各设为一个单引号，分隔符号设为逗号加空格，列表前缀与后缀设为 ( 与 )。a、b、c 三行就会变成 (''a'', ''b'', ''c'')。'
        - q: '为什么重复的项目没有被移除？'
          a: '项目是在转小写之后、修剪之前精确比较的，所以结尾空格或看不见的字符会让两项不同。请先只开修剪跑一次，再把结果贴回来做第二次去重复。'

  base64-string-converter:
    title: Base64 字符串编码/解码
    description: 将字符串编码和解码为其 Base64 格式表示形式即可。
    guide:
      intro: 'Base64 会把任意字节转成由 64 个可打印字符组成的文本，让数据能通过只能处理文本的管道，例如 JSON 字段、网址、电子邮件或 HTTP 标头。这个工具可以把文本编码成 Base64，也能解码还原，并正确处理 UTF-8 字符。'
      useCases:
        - '解读配置文件、HTTP 标头或 JSON 数据中的 Base64 值，看里面实际是什么。'
        - '生成要放进环境变量或 Kubernetes Secret 清单的 Base64 字符串。'
        - '生成可放在网址参数或类似 JWT 片段中的 URL 安全版本。'
      steps:
        - '要编码时，在「String to encode」输入或粘贴文本，下方会显示 Base64 结果。'
        - '要解码时，在第二张卡片粘贴 Base64 字符串，下方会显示解码后的文本。'
        - '如果值要用在网址或 JWT 中，打开任一边的 URL 安全选项。'
        - '用复制按钮取用结果。'
      notes:
        - 'Base64 只是编码，不是加密，任何人都能解开，无法用来保护机密。'
        - 'URL 安全版本会把 + 和 / 换成 - 和 _，并省略结尾的 = 补位。用错选项解码会显示字符串无效。'
        - '编码后的数据约比原本大三分之一（3 个字节变成 4 个字符）。'
        - '如果解码出来的字节不是合法文本（例如图片、压缩文件），在这里看不出有意义的内容，二进制数据请改用文件转换工具。'
      faq:
        - q: '为什么解码时显示字符串无效？'
          a: '常见原因：URL 安全字符串没开 URL 安全选项解码（或反过来）、含有不属于字母表的字符，或复制时被截断。'
        - q: '解码后为什么出现乱码？'
          a: '原始字节可能不是 UTF-8 文本，例如二进制文件或其他编码的文本。解码只有对从 UTF-8 编码来的文本才有意义。'

  toml-to-yaml:
    title: TOML 到 YAML
    description: Parse and convert TOML to YAML.
    guide:
      intro: '把 TOML 文档转成 YAML。从以 TOML 为主的工具把设置搬到需要 YAML 的工具时很有用，也可以用较熟悉的 YAML 排版查看 TOML 文件。'
      useCases:
        - '把 TOML 设置转成 Kubernetes、Compose、CI 或 Ansible 用的 YAML 文件。'
        - '把有许多嵌套表格的密集 TOML 文件读成缩进的 YAML 树。'
        - '从 TOML 文档准备 YAML 示例。'
      steps:
        - '把 TOML 粘贴到左侧字段。'
        - '右侧会显示 YAML。'
        - '复制结果。'
      notes:
        - 'TOML 的日期时间会变成 ISO 8601 时间戳，例如 1979-05-27T07:32:00.000Z，YAML 同样把它视为时间戳。'
        - '像 [server.tls] 这样的表格标头在 YAML 中会变成嵌套映射，[[items]] 表格数组会变成映射的列表。'
        - '注释会被丢掉。输出使用两个空格缩进。'
        - '会被 YAML 读成其他类型的字符串（true、1.0、null）会自动加引号以保留原意。'
      faq:
        - q: '为什么 YAML 帮我某些值加了引号？'
          a: '只有读回 YAML 时会改变类型的值才会加引号，例如字符串 "on" 或以字符串保存的数字。数据本身完全相同。'
        - q: '可以反过来转吗？'
          a: '可以，用「YAML 转 TOML」工具，但文档最上层必须是映射；null 值会被丢掉。'

  math-evaluator:
    title: 数学计算器
    description: 计算数学表达式的计算器。您可以使用sqrt、cos、sin、abs等函数。
    guide:
      intro: '实时计算数学表达式，提供 math.js 库的函数与常数：四则运算、次方、根号、三角函数、对数、阶乘、单位换算等。'
      useCases:
        - '不开计算机 App 就能快速计算：1920/1080、2^32、sqrt(2)*10。'
        - '用正式的函数做三角与对数运算：sin(pi/4)、log(1000, 10)、atan2(1, 1)。'
        - '直接换算单位：5 inch to cm、100 km/h to m/s、72 degF to degC。'
      steps:
        - '在字段输入表达式。'
        - '下方会显示结果；表达式还没写完时会显示错误。'
        - '复制结果。'
      notes:
        - '应用标准的运算优先级：^ 高于 * 和 /，再高于 + 和 −。不确定时请加括号。'
        - '三角函数使用弧度。角度请写成 sin(45 deg) 或 sin(45 * pi / 180)。'
        - 'log(x) 是自然对数；以 10 为底请用 log10(x) 或 log(x, 10)。阶乘写成 5!，取余数用 mod 或 %。'
        - '数字是 IEEE 双精度浮点数，所以 0.1 + 0.2 会显示 0.30000000000000004。用 round(x, 2) 可以四舍五入到两位小数。'
      faq:
        - q: '为什么 0.1 + 0.2 不是刚好 0.3？'
          a: '二进制浮点数无法精确表示 0.1 或 0.2，几乎所有计算机与编程语言都有这个限制。把表达式包进 round(..., 2) 就能显示干净的结果。'
        - q: '可以换算单位吗？'
          a: '可以，math.js 认得很多单位：写下带单位的数值，接着 to 和目标单位，例如 3 ft to m 或 1 GB to MB。'

  json-to-yaml-converter:
    title: JSON到YAML转换器
    description: 在线转换将JSON转换为YAML。
    guide:
      intro: '实时把 JSON 转成 YAML。YAML 是多数配置文件的格式（Kubernetes、GitHub Actions、Docker Compose、Ansible），这个工具让您输入或粘贴 JSON，得到等价的 YAML 文档。'
      useCases:
        - '把 JSON 设置或 API 响应转成 YAML 的 manifest 或 workflow 文件。'
        - '在手动编辑一份很长的配置文件之前，先看看 JSON 结构在 YAML 中长什么样。'
        - '把 JSON 测试数据转成 Ansible、Helm 等工具需要的 YAML。'
      steps:
        - '把 JSON 粘贴到左侧字段。接受较宽松的 JSON5 语法（注释、结尾逗号、不加引号的键）。'
        - '右侧会显示 YAML，每次修改都会实时更新。'
        - '用复制按钮取用结果。'
      notes:
        - 'JSON5 输入中的注释会被丢掉：转换是对解析后的数据进行，不是对文本。'
        - '会被 YAML 读成其他类型的字符串，例如 "true"、"null" 或写成字符串的数字，会自动加上引号以保留原意。yes、no 这类字在 YAML 1.2 中就是一般字符串，不会加引号。'
        - '输出使用两个空格缩进与块样式。含有空格的长字符串可能会被折成多行，这仍是合法的 YAML，但看起来可能有点意外。'
        - '键的顺序会保留。JSON 没有注释、锚点或多文档的概念，所以输出中也不会出现。'
      faq:
        - q: '为什么有些字符串有引号、有些没有？'
          a: 'YAML 只在裸值会被解读成其他东西时才需要引号，例如字符串 "true" 或 "1.0"。转换器就只在这些情况加引号。'
        - q: '可以把 YAML 转回 JSON 吗？'
          a: '可以，请用「YAML 转 JSON」工具。来回转换数据不会变，但注释和排版不会保留。'

  url-parser:
    title: Url分析器
    description: 解析url字符串以获取所有不同的部分（协议、来源、参数、端口、用户名密码…）
    guide:
      intro: '把网址拆成各个部分：通信协定、用户名与密码、主机名、连接端口、路径、查询字符串与片段（hash），并把每个查询参数分开列出，使用的是和浏览器相同的网址解析器。'
      useCases:
        - '阅读又长又乱的跟踪网址或 OAuth 重定向网址，看它实际带了哪些参数。'
        - '确认程序组出来的网址，主机、连接端口与路径是否匹配预期。'
        - '不必手动数字元，直接取出主机名或某个参数的值。'
      steps:
        - '粘贴完整网址，包含 https:// 这类的 scheme。'
        - '每个部分会显示在各自的字段中，旁边的复制按钮只复制那一部分。'
        - '往下卷到参数表格，可看到每个查询键解码后的值。'
      notes:
        - '网址必须是绝对网址。像 /api/users 这种纯路径，或没有 scheme 的主机名会被判定为无效；在前面加上 https:// 就能解析。'
        - '网址使用该 scheme 的默认连接端口时（http 的 80、https 的 443），连接端口字段会是空的，因为浏览器的解析器会把它范式掉。'
        - '参数表格中的值已经过百分比解码，而原始查询字符串字段则维持原本的写法。'
        - '同一个键出现多次（?tag=a&tag=b）时，表格只会显示一次并取最后一个值。要看全部请看原始查询字符串。'
      faq:
        - q: '为什么主机名的大写字母消失了？'
          a: '主机名不分大小写，所以解析器会转成小写。国际化域名也会转成 punycode（xn--）形式。'
        - q: '用户名与密码是用在哪里的？'
          a: '那是嵌在主机前面、以 user:password{''@''} 形式写的证书，是旧的 HTTP 功能。现在的浏览器大多忽略它，而且请不要分享含有真实帐密的网址。'

  iban-validator-and-parser:
    title: IBAN验证器和解析器
    description: 验证和分析IBAN编号。检查IBAN是否有效，并获取国家BBAN，如果它是QR-IBAN和IBAN友好格式。
    guide:
      intro: '检查 IBAN（国际银行帐户号码）是否有效，并拆解它：国家、BBAN（国内账号部分）、是否为瑞士的 QR-IBAN，以及每四码一组的标准显示格式。验证以 ibantools 库在本地运行。'
      useCases:
        - '汇款前验证表单中输入或发票上收到的 IBAN。'
        - '查出某个 IBAN 属于哪个国家与银行。'
        - '把 IBAN 排成每四码一组的易读格式放进文档。'
      steps:
        - '粘贴 IBAN，有无空格都可以。'
        - '阅读有效性、找到的错误、国家代码、BBAN 与 QR-IBAN 标记。'
        - '需要的话复制易读格式。'
      notes:
        - '验证会检查该国家定义的长度与结构，以及 ISO 7064 mod-97 校验码。IBAN 有效代表号码格式正确，不代表帐户存在或属于某个人。'
        - '校验码几乎能抓到所有单一打错字与位置互换，所以银行会立刻拒绝无效的 IBAN。'
        - 'QR-IBAN 是银行代码在 30000 到 31999 范围内的瑞士或列支敦士登 IBAN，只用于 QR 帐单，不能用于一般转帐。'
        - 'IBAN 在浏览器中检查，不会发送到任何地方。即便如此，仍请把账号视为个人数据。'
      faq:
        - q: '为什么真实的 IBAN 被判定为无效？'
          a: '最常见的是打错字、字母 O 和数字 0 混淆，或复制时掉了字符。有些国家也更新过格式；请确认粘贴的是包含两位校验码的完整 IBAN。'
        - q: '可以告诉我银行名称吗？'
          a: '只会解析出国家与 BBAN。银行代码是 BBAN 的一部分，意义因国家而异，请到该国的银行登录数据查询。'

  user-agent-parser:
    title: 用户代理分析器
    description: 从用户代理字符串中检测和分析浏览器、引擎、操作系统、CPU和设备类型/型号。
    guide:
      intro: '用 ua-parser-js 库把浏览器的 User-Agent 字符串解读成浏览器名称与版本、渲染引擎、操作系统、设备类型与型号，以及 CPU 架构。默认会带入您自己浏览器的字符串。'
      useCases:
        - '阅读错误回报或服务器日志时，找出用户当时用的浏览器与操作系统。'
        - '看看自己的浏览器对外声明的信息是什么。'
        - '用真实的 User-Agent 字符串创建或测试设备检测规则。'
      steps:
        - '粘贴 User-Agent 字符串，或直接使用预先带入的浏览器字符串。'
        - '阅读各张卡片：浏览器、引擎、操作系统、设备与 CPU。'
        - '空格的字段表示字符串中没有那项信息。'
      notes:
        - 'User-Agent 是浏览器自行声明的，而且常刻意误导：所有现代浏览器都自称 Mozilla，Chrome 系浏览器会包含 Safari 和 AppleWebKit，Edge 会包含 Chrome。请相信解析结果，而不是原始文本。'
        - '从 2021 年起 Chrome 冻结了部分字符串（reduced User-Agent）：Android 与 Windows 的版本不再精确，浏览器的次版号永远是 0，Android 上通常也没有设备型号。'
        - '桌机浏览器很少回报设备类型，在 PC 上设备字段空格是正常的。'
        - '解析是依库的规则做启发式判断，非常新的浏览器或特殊的 App 可能会部分误判。'
      faq:
        - q: '为什么我的 iPad 显示成 Mac？'
          a: '从 iPadOS 13 起，iPad 上的 Safari 会要求桌面版网站，并使用类似 Mac 的 User-Agent 字符串。字符串本身已经不再提到 iPad，所以任何解析器都分不出来。'
        - q: '为什么操作系统版本看起来不对？'
          a: 'Chrome 与 Chromium 系浏览器回报的是冻结的通用版本（例如 Windows 11 显示成 Windows 10）。精确版本只能通过 Client Hints 获取，User-Agent 字符串里没有。'

  numeronym-generator:
    title: 数字名称生成器
    description: 数字名是一个用数字构成缩写的词。例如，“i18n”是“国际化”的名词，其中18表示单词中第一个i和最后一个n之间的字母数。
    guide:
      intro: '生成单字的数字缩写（numeronym）：第一个字母、中间字母的数量、最后一个字母，也就是 i18n（internationalization）、l10n（localization）、a11y（accessibility）背后的规则。'
      useCases:
        - '替代码、文件夹名称、工单或聊天中的长术语创造简短的标签。'
        - '解读或核对既有的缩写，例如 k8s 或 o11y。'
        - '替功能标志或设置键挑选一致的短名称。'
      steps:
        - '输入一个单字。'
        - '旁边会显示它的数字缩写。'
        - '复制它。'
      notes:
        - '三个字母以内的单字会原样返回，因为缩写不会比原字短。'
        - '一次只处理一个单字；空格也会被算成字母，所以请输入没有空格或连字号的单一单字。'
        - '数字是第一个与最后一个字符之间的字符数，不是总长度：internationalization 有 20 个字母，所以变成 i18n。'
        - '数字缩写很方便但对新人不透明，请在文档中定义一次。'
      faq:
        - q: 'k8s 代表什么？'
          a: 'Kubernetes：k，接着 8 个字母 ubernete，再接 s。同理 o11y 是 observability，a11y 是 accessibility。'
        - q: '两个不同的单字可能有相同的数字缩写吗？'
          a: '很容易：首尾字母相同且长度相同的任两个单字就会撞到。只在上下文足以说明意思的地方使用数字缩写。'

  case-converter:
    title: 大小写转换
    description: 更改字符串的大小写并在不同格式之间进行选择
    guide:
      intro: '一次把一段文本显示成所有常见的命名惯例：小写、大写、camelCase、PascalCase、snake_case、CONSTANT_CASE、kebab-case（param case）、dot.case、path/case、Header-Case、Sentence case、Capital Case、no case 与 mOcKiNg cAsE。'
      useCases:
        - '在不同语言或层次之间转换标识符，例如 JSON 字段（snake_case）转成 JavaScript 属性（camelCase），再转成 CSS 类别（kebab-case）。'
        - '从人类可读的标签生成常数名称（CONSTANT_CASE）或文件路径（path/case）。'
        - '把风格不一致的标题或标签统一成同一种写法。'
      steps:
        - '在输入字段输入或粘贴文本。'
        - '下方会列出所有转换结果，每个都有复制按钮。'
        - '复制需要的那一种。'
      notes:
        - '单字是依空格、标点与大小写变化切分的，所以 helloWorld、hello_world 和 Hello World 都会切成同样的两个字。数字会被当成分隔符号并移除（v2 会变成 v）。'
        - '小写与大写会保留原文只改字母；其他变体则是用切出来的单字重组，标点会被去掉。'
        - '带重音的拉丁字母（é、ö、ñ）算是单字字符；中文、日文等其他文本不会被切成单字，在以单字为基础的变体中可能被移除。'
        - 'Mocking case 逐字交替大小写，空格也算在计数内，所以每个空格之后规律会重新开始。'
      faq:
        - q: 'camelCase 和 PascalCase 有什么差别？'
          a: '两者都把单字直接相连并让每个前缀大写；camelCase 第一个字母维持小写（userName），PascalCase 连第一个字母也大写（UserName）。JavaScript 的变量用 camelCase，类别用 PascalCase。'
        - q: '为什么我文本中的数字不见了？'
          a: '切字规则把数字当成分隔符号，所以 item2name 会变成 item name。数字是标识符的一部分时，请手动加回去。'

  html-entities:
    title: 转义html实体
    description: 转义或unescape html实体（将<、>、&、“和\'替换为其html版本）
    guide:
      intro: '把 HTML 中有特殊意义的五个字符（&、<、>、" 与 ''）转成实体写法（&amp;、&lt;、&gt;、&quot;、&#39;），也能把这些实体还原成一般文本。'
      useCases:
        - '在 HTML 页面中显示代码示例或用户输入的文本，而不被当成标记解读。'
        - '阅读从网页原代码或 API 复制来、带有实体的文本。'
        - '准备要放进 HTML 属性中的值。'
      steps:
        - '要转义时，在第一个字段输入文本，下方会显示转义后的版本。'
        - '要还原时，在第二区粘贴含有实体的文本，就会显示一般文本。'
        - '复制结果。'
      notes:
        - '转义这五个字符正是把不可信的文本插入 HTML 时防止跨站脚本攻击（XSS）的方法。请在输出时用框架提供的转义函数处理，不要手动做。'
        - '只会转义 &、<、>、" 与 ''，其他字符（包括非 ASCII 文本）会原样保留，这对 UTF-8 页面来说是正确的。'
        - '还原时处理同样的五个实体加上 &#39; 这类数字形式；&apos;、&nbsp;、&copy; 这类具名实体不会被处理。'
        - '这种转义只适用于 HTML 文本与属性。在 <script> 内、网址中或 CSS 里，各有不同的转义规则。'
      faq:
        - q: '为什么还原后 &apos; 没有变？'
          a: '&apos; 是 XML 的实体，旧版 HTML 并没有定义它，所以这个工具和许多库一样不会转换。HTML 中的单引号请用 &#39;。'
        - q: '在 Vue 或 React 这类框架里还需要转义吗？'
          a: '使用一般的文本绑定时不需要，它们会自动转义。只有直接插入原始 HTML（v-html、dangerouslySetInnerHTML、innerHTML）时才需要自行注意。'

  json-prettify:
    title: JSON美化和格式化
    description: 将JSON字符串修饰为友好的可读格式。
    guide:
      intro: '把一长串 JSON 整理成有缩进、方便阅读的格式。也接受较宽松的 JSON5 写法（可含注释、结尾逗号、不加引号的键），输出一律是标准 JSON。'
      useCases:
        - '阅读被压缩成单行的 API 响应或日志内容。'
        - '提交配置文件之前先整理格式，让 diff 只显示真正的修改。'
        - '找出 JSON 坏在哪里，输入不合法时会显示错误信息。'
      steps:
        - '把 JSON 粘贴到上方输入框，下方会立刻显示整理后的结果。'
        - '选择缩进大小（0 到 10 个空格）。'
        - '视需要开关「排序键」，再按复制取用结果。'
      notes:
        - '「排序键」默认是打开的，会把每个对象的键依字母重新排序。这对比较差异很方便，但会改变数据的顺序，如果键的顺序对您有意义，请把它关掉。'
        - '因为接受 JSON5，带有注释或结尾逗号的输入也能成功整理，但输出会移除注释，变成纯 JSON。'
        - '超出 JavaScript 安全整数范围（约 9×10^15）的数字在解析时可能损失精度，过长的 ID 可能被改掉，这类值请用字符串保存。'
        - '上次输入的内容与设置只记录在这个浏览器中，不会传到服务器。'
      faq:
        - q: '为什么没有输出结果？'
          a: '输入不是合法的 JSON 或 JSON5 时，输入框下方会显示错误信息，输出会是空的。常见原因是漏了逗号、括号没有成对，或是 JSON 前后多贴了其他文本。'
        - q: '可以用 Schema 验证字段吗？'
          a: '不行。这个工具只检查语法是否正确并重新排版，不会检查字段类型或必填字段。'

  docker-run-to-docker-compose-converter:
    title: Docker Run 到 docker-compose 转换器
    description: 将 docker run 命令行转换为 docker-compose 文件!
    guide:
      intro: '把 docker run 命令翻译成等价的 docker-compose.yml 服务定义，对应连接端口、卷、环境变量、重启策略、网络与其他常用标志，使用 composerize 库。'
      useCases:
        - '把镜像文件 README 里的一行 docker run 转成可以纳入版本控制的 Compose 文件。'
        - '把手动启动的多个容器集成成单一堆栈。'
        - '学习某个 docker run 标志在 Compose 语法中怎么写。'
      steps:
        - '粘贴完整的 docker run 命令，包含镜像文件名称。'
        - '右侧会显示生成的 Compose 文件。'
        - '检查下方关于无法翻译标志的提示，再复制结果。'
      notes:
        - 'Compose 无法表达、或库不认识的标志会列为无法翻译或尚未实现。请逐一查看，不要假设输出是完整的；例如 --rm 与 -it 就没有对应，因为 Compose 服务是长时间运行的。'
        - '相对路径的卷与环境变量会照原样复制。请确认它们相对于 Compose 文件所在的目录是合理的。'
        - '输出只描述一个服务。多个容器请分别转换，再把各个 services 块合并到同一个 services 键底下。'
        - '引号很重要：引号不成对或含有 shell 续行符号（结尾反斜线）的命令，粘贴前要先整理干净。'
      faq:
        - q: '为什么输出没有 version 字段？'
          a: '新版 Docker Compose 把 version 字段视为过时并直接忽略。生成的文件遵循当前的 Compose 规范，不需要它。'
        - q: '要怎么启动这个堆栈？'
          a: '把输出存成 docker-compose.yml（或 compose.yaml），在同一个目录运行 docker compose up -d。docker compose down 会停止并移除容器。'

  mac-address-lookup:
    title: MAC地址查找
    description: 通过设备的MAC地址查找设备的供应商和制造商。
    guide:
      intro: '从 MAC 地址的前三个字节，也就是 IEEE 分配的 OUI（组织唯一标识符），查出背后的制造商，使用的是脱机的注册数据库副本。查询完全在浏览器中进行。'
      useCases:
        - '辨识 Wi-Fi 或 DHCP 租约表中不认识的设备。'
        - '确认某台设备是否真的是它宣称的品牌。'
        - '审计网络时依厂商把设备分组。'
      steps:
        - '以任何常见写法输入或粘贴 MAC 地址：冒号、连字号、点，或不加分隔符号都可以。'
        - '下方会显示厂商名称与登记地址。'
        - '需要的话复制结果。'
      notes:
        - '只有前六个十六进制数字有意义；剩下的三个字节用来识别个别设备，查询时不会用到。'
        - '现代手机与笔电在 Wi-Fi 上会使用随机化的 MAC 地址以保护隐私。随机地址的第二个十六进制数字是 2、6、A 或 E，查不到任何厂商。'
        - '数据库是随网站打包的快照，非常新注册的前缀在依赖套件更新之前可能查不到。'
        - '有些前缀登记在零件制造商（网络芯片厂）名下，而不是设备上的品牌，所以结果可能显示芯片厂。'
      faq:
        - q: '为什么我的地址查不到厂商？'
          a: '最常见的原因是它是随机化（私有）的 MAC 地址，这在近年的 iOS、Android 与 Windows 设备上很正常。否则就是前缀比打包的数据库新，或属于本地管理的范围。'
        - q: '可以从 MAC 地址查出设备的拥有者或位置吗？'
          a: '不行。注册数据库只把前缀对应到购买它的公司，完全不涉及特定设备的拥有者或所在位置。'

  mime-types:
    title: mime类型
    description: 将mime类型转换为扩展，反之亦然。
    guide:
      intro: '查询某个 MIME 类型对应的扩展名，以及某个扩展名对应的 MIME 类型，使用的是多数网页服务器与 Node.js 共用的数据库（mime-db 项目）。'
      useCases:
        - '找出服务器发送某种文件时应该带的 Content-Type 标头。'
        - '确认收到某个 MIME 类型的文件时，应该用什么扩展名保存。'
        - '设置需要列出 MIME 类型的上传过滤规则或 accept 属性。'
      steps:
        - '在第一个列表选择或输入 MIME 类型，例如 application/pdf，就能看到它的扩展名。'
        - '在第二个列表选择或输入扩展名，例如 png，就能看到它的 MIME 类型。'
        - '两个列表都可以搜索，开始输入就会过滤。'
      notes:
        - '有些类型有多个扩展名（image/jpeg 有 jpeg、jpg、jpe、jfif），有些扩展名也登记了不只一种类型。第一个通常是建议使用的。'
        - 'application/octet-stream 是未知二进制数据的保底类型；浏览器会下载这类文件，而不是直接显示。'
        - 'MIME 类型是服务器声明的，不是文件实际的内容。两者不一致时，浏览器可能拒绝运行脚本或应用样式。'
        - '文本类型通常需要加上字符集，例如 text/html; charset=utf-8。列表中只显示类型本身。'
      faq:
        - q: '为什么找不到我要的扩展名？'
          a: '数据库只收录已登记或广泛使用的类型。非常新或专有的格式可能没有；请改用 application/octet-stream，或厂商文档中列出的类型。'
        - q: 'text/javascript 和 application/javascript 有什么差别？'
          a: '两者都曾被使用，当前的标准是 text/javascript。浏览器对脚本文件两种都接受。'

  toml-to-json:
    title: TOML 到 JSON
    description: 解析TOML并将其转换为JSON。
    guide:
      intro: '解析 TOML 文档并输出成缩进的 JSON，方便查看 Cargo.toml、pyproject.toml 或其他 TOML 设置，或交给只读 JSON 的程序。'
      useCases:
        - '在预期 JSON 的脚本或 jq 管线中读取 TOML 文件。'
        - '确认 TOML 的表格、点号键与表格数组如何对应到嵌套对象。'
        - '验证 TOML 文件：语法错误会在输入时实时显示。'
      steps:
        - '把 TOML 粘贴到左侧字段。'
        - '右侧会显示以三个空格缩进的 JSON。'
        - '复制结果。'
      notes:
        - 'TOML 的日期时间（例如 1979-05-27T07:32:00Z）在 JSON 中会变成 ISO 8601 字符串，因为 JSON 没有日期类型。'
        - '超出 JavaScript 安全范围（约 9×10^15）的整数不被支持，输出会是空的。'
        - '注释会被丢掉，输出一定是 JSON 对象，因为 TOML 文档本身就是一个表格。'
        - '重复的键与定义两次的表格在 TOML 中是错误，转换器会直接拒绝，而不是默默保留其中一个。'
      faq:
        - q: '为什么我的日期变成了字符串？'
          a: 'TOML 有原生的日期时间值，但 JSON 没有，所以会串行化成 ISO 8601 文本。需要的话请在读取端再解析回日期。'
        - q: '可以把 JSON 转回 TOML 吗？'
          a: '可以，用「JSON 转 TOML」工具，但 JSON 的最上层必须是对象；null 值在转换时会被丢掉。'

  lorem-ipsum-generator:
    title: Lorem ipsum生成器
    description: Lorem ipsum是一种占位符文本，通常用于演示文档或字体的视觉形式，而不依赖于有意义的内容
    guide:
      intro: '依您指定的段落数、每段句数与每句字数生成 Lorem ipsum 占位文本，可选择以 HTML 段落标签包起来，用来在真实内容还没有之前填满布局与原型。'
      useCases:
        - '用看起来像真实文本的内容填满页面设计、模板或组件，以评估布局与字体排版。'
        - '替 CMS、数据库种子数据或 UI 测试创建示例内容。'
        - '生成特定长度的假段落，测试截断与溢出的行为。'
      steps:
        - '设置段落数，以及每段句数与每句字数的范围。'
        - '选择是否以经典的 Lorem ipsum dolor sit amet 开头，以及是否用 <p> 标签包住每个段落。'
        - '复制文本，或按刷新（Ctrl+Enter）用相同设置生成另一段随机文本。'
      notes:
        - '这些是伪拉丁文，没有任何意义，而这正是重点：读者会专注在设计上，而不是去读内容。'
        - '句数与字数是在范围内随机挑选的，每个段落各自决定，所以两个段落很少长度相同，和真实文本类似。'
        - 'HTML 选项会把每个段落用 <p>...</p> 包起来并各自成行，可直接粘贴到模板。'
        - 'Lorem ipsum 只有拉丁字母的单字，无法反映中文、日文等文本的宽度与断行方式。这类布局请改用目标语言的真实示例文本。'
      faq:
        - q: 'Lorem ipsum 是从哪里来的？'
          a: '它是西塞罗《论善与恶之极限》（De finibus bonorum et malorum）中一段被打乱的文本，至少从 1960 年代起就被印刷业当作填充文本，后来因桌面出版软件而普及。'
        - q: '为什么每次生成的文本都不同？'
          a: '单字是在您设置的范围内随机挑选的，所以每次刷新都会得到新的文本。喜欢的版本请直接复制，因为无法再生成一模一样的。'

  image-compressor:
    title: '图片压缩'
    description: '压缩图片并转成 WebP、JPEG 或 PNG，可调整尺寸，单张下载或打包成 zip。'
    format: '输出格式'
    keepFormat: '保持原格式'
    quality: '质量'
    maxWidth: '最大宽度（px）'
    maxHeight: '最大高度（px）'
    noLimit: '不限制'
    upload: '把图片拖拽到这里，或点击选择图片'
    privacy: '图片只在你的浏览器里处理，不会上传。'
    pngHint: 'PNG 是无损格式，质量滑块对它没有作用。'
    download: '下载'
    downloadAll: '全部下载（zip）'
    clear: '清除'
    notAnImage: '{name} 不是图片。'
    failed: '无法压缩 {name}。'
    guide:
      intro: '把照片和截屏重新编码成 WebP、JPEG 或 PNG，并可选择缩小尺寸，借此减少文件大小。可以一次处理多张图片，再逐张下载或打包成一个 zip。全部在浏览器中完成。'
      useCases:
        - '图片太大无法通过上传限制、电子邮件附件限制，或内容管理系统拒收超过数 MB 的文件时，把它压小。'
        - '提升网页速度：把很大的 PNG、JPEG 转成 WebP，并把宽度限制在版面实际需要的大小。'
        - '替文档或商店商品页准备一批截屏或商品照片。'
      steps:
        - '把图片拖动到上传区，或点一下选择文件。'
        - '选择输出格式（或保留每张图片原本的格式）、质量，以及选用的最大宽度与高度。'
        - '确认每张结果的大小，再逐张下载，或全部打包成 zip 下载。'
      notes:
        - '质量只对 WebP 和 JPEG 有效。PNG 是无损格式，滑块会禁用，PNG 主要靠降低像素尺寸来缩小。质量设在 75 到 85 之间通常是不错的平衡。'
        - '最大宽度和高度只会缩小图片，并保持长宽比；小图不会被放大。'
        - 'JPEG 不支持透明，透明的区域会变成白色。想保留透明请用 WebP 或 PNG。'
        - '重新编码会移除 EXIF 等元数据，包括相机信息与 GPS 位置；动画 GIF 则只会保留第一个帧。'
        - '已经优化过的图片压缩后可能反而变大，这时请比较大小，保留原文件即可。'
      faq:
        - q: '我的图片会被上传到服务器吗？'
          a: '不会。压缩是用浏览器的 canvas 完成的，文件留在您的设备上。这也表示非常大的图片会使用设备的内存，处理时可能需要一点时间。'
        - q: '该选哪种格式？'
          a: '多数照片用 WebP 能得到最小的文件，当前主流浏览器都支持。需要与旧软件最大兼容性时选 JPEG，有锐利线条的图形或需要透明时选 PNG。'
  video-compressor:
    title: '视频压缩'
    description: '压缩视频并转成 MP4 或 WebM，可缩小到 1080p 或 720p，显示进度，完全不上传。使用浏览器的硬件视频编码器。'
    format: '输出格式'
    quality: '画质'
    maxResolution: '最大分辨率'
    original: '保留原始'
    upload: '把视频拖动到这里，或点一下选择文件'
    privacy: '视频通过 WebCodecs 在您的浏览器中处理，不会上传。'
    unsupported: '这个浏览器不支持本工具需要的 WebCodecs。请使用新版的 Chrome、Edge、Safari（16.4 以上）或 Firefox（130 以上）。'
    cancel: '取消'
    clear: '清除'
    download: '下载'
    notAVideo: '{name} 不是视频。'
    qualityLevels:
      high: '高（文件较大）'
      medium: '中（推荐）'
      low: '低（文件最小）'
    status:
      queued: '等待中'
      error: '失败'
    errors:
      noVideoTrack: '这个文件没有视频轨。'
      undecodable: '这个浏览器无法解码此文件的视频编码。'
      noEncoder: '这个浏览器没有所选输出格式的编码器，请试试另一种格式。'
      unsupportedInput: '不支持的文件格式。支持 MP4、MOV、WebM 与 MKV。'
      canceled: '已取消。'
      failed: '无法压缩这个视频。'
    guide:
      intro: '用浏览器内置的硬件编码器（WebCodecs）重新编码视频，让文件变小，并可同时缩小分辨率、把容器换成 MP4 或 WebM。只要输出格式允许，声音轨会原样复制，音质不会改变。'
      useCases:
        - '把手机录的视频压到通信软件、电子邮件或表单上传的大小限制以内。'
        - '分享或归档之前，把屏幕录像或 4K 片段缩到 1080p 或 720p。'
        - '不安装软件，把 MOV 或 MKV 转成到处都能播放的 MP4。'
      steps:
        - '选择输出格式（MP4 兼容性最好，WebM 适合网页）、画质等级与最大分辨率。'
        - '把一个或多个视频拖到上传区。它们会依序处理，每一个都有进度条。'
        - '比较大小后下载结果。按「取消」会停止当前的文件，并放弃还在等待的文件。'
      notes:
        - '压缩的原理是用较低的比特率重新编码，所以每次都会损失一些细节。之后可能还要剪辑的话请保留原文件，也避免把同一个文件反复压缩。'
        - '降低分辨率省下的空间远比降低画质等级多。1080p 对多数屏幕已经足够，720p 用于通信软件和预览很合适。来源不会被放大。'
        - '画质等级是依分辨率换算的比特率目标：「中」是合理的默认值，「高」保留细节但文件约大一倍，「低」给最在意大小的情况。'
        - '编码器由浏览器能编码的格式决定：MP4 通常是 H.264，WebM 通常是 VP9。容器允许时声音会原样复制（MP4 的 AAC、WebM 的 Opus），否则才重新编码。'
        - '全部在浏览器中运行，不会上传，这也表示非常大的文件（数 GB）可能超出浏览器可用的内存。速度取决于设备；多数笔电的硬件编码器处理 1080p 比实时播放还快。'
        - '有 DRM 加密的视频与部分专业用编码无法在浏览器中解码，会显示为不支持。'
      faq:
        - q: '为什么压缩后的文件比原本还大？'
          a: '源文件案的比特率本来就比您选的画质等级还低。请选较低的画质或较小的分辨率，或是直接保留原文件。'
        - q: '为什么显示我的浏览器不支持？'
          a: '这个工具需要 WebCodecs API，Chrome 与 Edge、Safari 16.4 以上、Firefox 130 以上都有提供。较旧的浏览器和部分强化隐私的浏览器没有。'
        - q: '可以剪辑或裁切视频吗？'
          a: '当前不行。它会重新编码整个文件，这个工具没有剪辑与裁切功能。'

  pdf-compressor:
    title: 'PDF 压缩'
    description: '在浏览器里压缩 PDF，大幅缩小扫描件与照片多的文档，文字仍可选取，文件不会上传。'
    preset: '压缩程度'
    presets:
      screen:
        label: '最小文件'
        hint: '适合屏幕阅读、邮件或聊天软件发送'
      ebook:
        label: '平衡'
        hint: '大多数情况的最佳选择'
      printer:
        label: '高品质'
        hint: '需要打印时使用，缩小幅度较小'
    upload: '把 PDF 拖曳到这里，或点击选择文件'
    privacy: 'PDF 只在你的浏览器里处理，不会上传。'
    engine: '压缩引擎：Ghostscript（AGPL-3.0）。'
    sourceCode: '本站源代码'
    largeFile: '有文件超过 100 MB，处理需要较久，在手机上可能因内存不足而失败。'
    clear: '清除'
    download: '下载'
    recompress: '用目前设置重新压缩'
    waiting: '等待中…'
    loadingEngine: '正在下载压缩引擎（约 15 MB，只需下载一次）…'
    compressing: '压缩中…'
    progress: '正在处理第 {page} / {total} 页'
    notSmaller: '用这个设置无法再缩小，原文件已经很精简。可以换成较小的压缩程度再试一次。'
    errors:
      notPdf: '这不是 PDF 文件。'
      password: '这个 PDF 有打开密码，请先移除密码再压缩。'
      invalid: '无法读取这个 PDF，文件可能已损毁或不完整。'
      failed: '压缩失败，请再试一次。'
      engine: '无法下载压缩引擎，请确认网络连接后再试一次。'
    guide:
      intro: 'PDF 会变大，通常不是因为文本，而是里面的图片：扫描件的每一页都是一张高分辨率照片，报告或产品目录也常直接放入手机拍的原图。这个工具用 Ghostscript 把图片重新采样到适合用途的分辨率并重新压缩，文本、字体与版面维持原样，全程在你的浏览器里完成。'
      useCases:
        - '邮件附件超过大小限制（常见上限是 10 到 25 MB），需要缩小后再寄出。'
        - '上传到政府、学校或求职网站时，系统限制文件不能超过某个大小。'
        - '手机扫描的合同、收据或证件，一页就好几 MB，想缩小后再存盘或发送。'
        - '照片很多的报告或产品目录，想在不影响阅读的前提下减少容量。'
      steps:
        - '选择压缩程度：一般情况选「平衡」，要发送或只在屏幕上看选「最小文件」，需要打印选「高品质」。'
        - '把一个或多个 PDF 拖曳到上方区域，或点击选择文件。第一次使用会先下载约 15 MB 的压缩引擎。'
        - '等待处理完成，进度会依页数显示，完成后会列出压缩前后的大小。'
        - '按「下载」取得压缩后的文件。不满意的话，换一个压缩程度后按「用目前设置重新压缩」。'
      notes:
        - '压缩效果取决于文件内容：扫描件与照片多的 PDF 通常可以缩小一半以上，甚至 90%；纯文本的 PDF 本来就很小，可能只省下一点点。'
        - '「最小文件」会把图片降到 72 dpi，在屏幕上看没问题，但打印时照片和小字可能会模糊。要打印的文档请用「高品质」。'
        - '如果压缩后反而变大，工具会提示并保留原文件，不会提供较大的版本下载。这通常代表源文件已经过优化。'
        - '有打开密码的 PDF 无法处理，请先用原本的软件移除密码。压缩会重新产生文件，数字签名会因此失效，交互表单等高级功能也可能无法完整保留，重要文档请确认压缩后的内容。'
        - '所有处理都在你的浏览器中进行，PDF 不会上传。文件很大（超过 100 MB）时，特别是在手机上，可能因内存不足而失败，建议改用电脑处理。'
      faq:
        - q: '压缩后文字还能选取和搜索吗？'
          a: '可以。这个工具只重新压缩图片，文字仍然是文字，可以选取、搜索与拷贝。如果源文件是没有经过文字识别的扫描图，压缩后也一样只是图片。'
        - q: '为什么有些 PDF 几乎没有变小？'
          a: 'PDF 的大小主要来自图片。以文本或矢量图为主的文件，或是已经用其他工具压缩过的文件，能再缩小的空间很有限。'
        - q: '三种压缩程度差在哪里？'
          a: '差别在图片的分辨率：最小文件是 72 dpi、平衡是 150 dpi、高品质是 300 dpi。分辨率越低文件越小，但放大或打印时越容易看出模糊。'
        - q: '我的文件会被上传吗？'
          a: '不会。压缩引擎 Ghostscript 会下载到你的浏览器，在你的设备上运行，PDF 不会离开你的电脑或手机。'

  qrcode-generator:
    title: 二维码生成器
    description: 生成并下载url或文本的QR代码，并自定义背景和前景颜色。
    decode:
      title: '从图片读取二维码'
      upload: '把图片拖拽到这里，或点击选择图片'
      pasteHint: '也可以直接从剪贴板粘贴图片（Ctrl+V）。'
      result: '解码内容'
      notFound: '这张图片里找不到二维码。'
      error: '无法读取这张图片。'
      useAsInput: '填入上方文本'
      privacy: '图片只在你的浏览器里处理，不会上传。'
    guide:
      intro: '把网址或任何文本转成 QR Code，可下载成图片，并自定义颜色与容错等级。也可以从图片中读出 QR Code 的内容。'
      useCases:
        - '替链接、Wi-Fi 密码提示、联系信息或活动页面创建代码，印在海报或名片上。'
        - '使用自己的前景与背景颜色，做出匹配品牌风格的代码。'
        - '打开来路不明的 QR Code 之前，先上传或粘贴截屏，看它实际指向哪里。'
      steps:
        - '在文本字段输入文本或网址，代码会随输入即时更新。'
        - '视需要调整前景色、背景色与容错等级。'
        - '下载图片。要读取代码时，把图片拖曳到读取区，或按 Ctrl+V 粘贴。'
      notes:
        - '容错等级 low、medium、quartile、high 分别约可容许 7%、15%、25%、30% 的面积损毁仍可扫描。等级越高，代码越密，内容很长时建议用较低的等级。'
        - '两种颜色要保持明显的对比，而且前景要比背景深。对比太低或颜色反转，在很多扫描器上会失败。'
        - '内容越长，代码越密，需要印得更大。扫不好时请缩短内容，例如改用短网址。'
        - 'QR Code 保存的是固定内容，印出后就不能更改。创建与读取都在浏览器中进行，图片不会上传。'
      faq:
        - q: '为什么我的 QR Code 扫不出来？'
          a: '常见原因：对比不足、数据量大但印得太小、代码四周没有留白，或是内容很长又选了很高的容错等级，导致代码太密。'
        - q: 'QR Code 会过期吗？'
          a: '不会。代码只是把您输入的文本编码起来，如果内容是网址，只要那个网址还能用，代码就有效。'

  wifi-qrcode-generator:
    title: WiFi 二维码生成器
    description: 生成和下载QR码以快速连接到WiFi网络。
    guide:
      intro: '创建扫描后就能让手机连上 Wi-Fi 的 QR Code：输入网络名称、安全类型与密码，下载代码来打印或显示。支持隐藏网络与 WPA2-Enterprise（EAP）。'
      useCases:
        - '让访客加入家里或办公室的 Wi-Fi，不必念出一长串密码。'
        - '替咖啡店、会议室或度假租屋打印连接卡。'
        - '分享手机无法自行搜索到的隐藏网络。'
      steps:
        - '选择加密方式（多数网络用 WPA/WPA2，非常旧的用 WEP，开放网络选无密码，企业登录选 WPA2-EAP）。'
        - '输入与广播完全一致的网络名称（SSID）、密码，需要时勾选隐藏 SSID。'
        - '下载 QR Code 并打印或显示。'
      notes:
        - '代码以明文编码密码（WIFI:S:name;T:WPA;P:password;;）。任何扫描或拍下它的人都能读到密码，请放在只有预期对象看得到的地方。'
        - 'iOS（11 以上）与 Android（10 以上）用内置相机就能扫 Wi-Fi 代码；较旧的设备需要认得这种格式的 QR 扫描 App。'
        - 'SSID 与密码区分大小写，必须完全一致。特殊字符会自动转义。'
        - 'WPA3 网络请选 WPA 选项，手机能接受。WPA2-EAP 还需要提供 EAP 方法、第二阶段方法与身分。'
      faq:
        - q: '为什么手机扫了之后连不上？'
          a: '请确认 SSID 与密码完全一致（含大小写），安全类型也正确（WPA 网络选成 WEP 会失败）。有些手机还要求扫描当下网络在范围内。'
        - q: '之后可以改密码吗？'
          a: '代码是固定的：换密码就要重印新的代码。可以考虑设一个很少换密码的访客专用网络。'

  xml-formatter:
    title: XML 格式化
    description: 将XML字符串修饰为友好的可读格式。
    guide:
      intro: '替 XML 文档加上缩进，让结构容易阅读，可设置缩进大小，并可选择让简短的文本内容和元素留在同一行。不合法的 XML 会回报错误而不是硬排版。'
      useCases:
        - '阅读被压成单行的 XML 内容、SOAP 封包或配置文件。'
        - '提交之前统一 XML 文件的格式，让 diff 只显示真正的修改。'
        - '检查一份 XML 文档是否格式良好（well-formed）。'
      steps:
        - '把 XML 粘贴到左侧字段。'
        - '设置缩进大小（0 到 10 个空格），并切换「Collapse content」。'
        - '复制整理后的结果。'
      notes:
        - '「Collapse content」会让元素和它的文本留在同一行（<name>Ann</name>）。关掉后文本会移到独立的缩进行，更整齐但也更长。'
        - '格式化会改变元素之间的空格，通常不影响意义。但在文本内的空格有意义的文档（混合内容、预先排版的文本）中，请检查结果。'
        - '检查只测试格式良好与否：标签成对、正确嵌套、属性加引号。不会对照 DTD 或 XML Schema 验证。'
        - '注释、CDATA 区段与 XML 声明都会保留。'
      faq:
        - q: '为什么我的 XML 被判定为不合法？'
          a: '常见原因：标签没关闭、文本中有未转义的 & 或 <（要写成 &amp; 与 &lt;）、属性值没加引号，或有多个根元素。HTML 不是 XML，所以 HTML 网页通常也会失败。'
        - q: '可以反过来压缩 XML 吗？'
          a: '不能直接做。把缩进大小设为 0 可以去掉缩进，得到紧凑但仍有换行的文档。'

  temperature-converter:
    title: 温度转换器
    description: 开尔文、摄氏度、华氏度、兰金、德莱尔、牛顿、雷奥穆尔和罗默温度度数转换。
    guide:
      intro: '同时在克氏（Kelvin）、摄氏、华氏、兰氏（Rankine）、德利尔（Delisle）、牛顿、列氏（Réaumur）与罗默（Rømer）温标之间换算。在任一温标输入数值，其他温标会跟着更新。'
      useCases:
        - '习惯摄氏的人阅读以华氏标示的食谱、气象报告或规格表，或反过来。'
        - '物理或化学计算时换算成克氏温度。'
        - '查看古籍与老仪器上出现的历史温标（德利尔、列氏、罗默、牛顿）。'
      steps:
        - '在您手上那个温标的字段输入温度。'
        - '阅读其他所有温标中的同一个温度。'
        - '用加减按钮做小幅调整。'
      notes:
        - '换算一律经过克氏温度并使用精确定义：0 °C 是 273.15 K，°F = K × 9/5 − 459.67。结果不会四舍五入，所以可能看到很长的小数。'
        - '克氏与兰氏是绝对温标，不可能是负数。输入低于 −273.15 的摄氏温度会得到负的克氏值，那不是物理上存在的温度。'
        - '德利尔温标是反向的：数值越大越冷，水的沸点是 0 °De、冰点是 150 °De。'
        - '华氏的心算捷径：摄氏乘以 2 再加 30（20 °C 约 70 °F）。工具给的是精确值 68 °F。'
      faq:
        - q: '为什么 0 K 显示成 −273.15 °C 而不是 −273？'
          a: '克氏温标的定义就是绝对零度等于精确的 −273.15 °C。四舍五入成 −273 是常见的近似，但换算器使用精确值。'
        - q: '兰氏与罗默温标用在哪里？'
          a: '兰氏是与华氏搭配的绝对温标，美国部分工程领域仍在使用。罗默、德利尔、牛顿与列氏是 18 世纪的历史温标，主要在阅读早期科学文献时会遇到。'

  chmod-calculator:
    title: Chmod 计算器
    description: 使用此在线的chmod计算器计算chmod权限和命令。
    guide:
      intro: '用勾选框组出 Unix 文件权限：分别替所有者、组与其他人勾选读取、写入、运行，就能得到八进位值（例如 755）、符号形式（rwxr-xr-x）与可直接运行的 chmod 命令。'
      useCases:
        - '替脚本、网站目录或私钥文件决定正确的 chmod 值。'
        - '把 ls -l 看到的权限字符串解读成各类用户能做什么。'
        - '在复制网络上的命令之前，先确认 644、600 或 777 实际授予了什么。'
      steps:
        - '勾选所有者（u）、组（g）与其他人（o）的权限。'
        - '阅读八进位与符号表示。'
        - '复制 chmod 命令，把 path 换成您的文件或目录。'
      notes:
        - '每一位数字是读取（4）、写入（2）、运行（1）相加：7 是 rwx、6 是 rw-、5 是 r-x、4 是 r--、0 是 ---。三位数依序是所有者、组、其他人。'
        - '对目录来说，运行权限代表可以进入与列出目录，所以目录通常需要 x（755 或 700），而文件只需要 r（644 或 600）。'
        - '私钥文件与证书应该是 600（或 400）：SSH 会拒绝其他人可读的密钥。777 让所有人都能写入，几乎永远不是正确的解法。'
        - '这个工具只覆盖基本比特。setuid、setgid、sticky 比特（开头的第四位数，例如 4755）与 ACL 都不在范围内。'
      faq:
        - q: '755 和 644 有什么差别？'
          a: '两者都让所有者可读写、其他人可读；755 另外让所有人都可运行。目录与脚本用 755，HTML、图片等一般文件用 644。'
        - q: '怎么把权限应用到整个目录树？'
          a: '在命令加上 -R（chmod -R 755 dir），但要小心：它会给文件和目录相同的比特。建议改用 find dir -type d -exec chmod 755 {''{''}{''}''} + 与 find dir -type f -exec chmod 644 {''{''}{''}''} + 分开处理。'

  rsa-key-pair-generator:
    title: RSA密钥对生成器
    description: 生成新的随机RSA私钥和公钥pem证书。
    guide:
      intro: '生成一组全新的随机 RSA 私钥与公钥，并以 PEM 文本显示。生成过程在浏览器中以后台工作线程完成，页面不会卡住，密钥也不会传到任何地方。'
      useCases:
        - '创建一组用完即丢的密钥，测试签名、加密、SSH 或 JWT 的程序。'
        - '替本地开发环境或教学示例生成密钥。'
        - '尝试不同的密钥长度，看生成需要多久。'
      steps:
        - '设置比特数（默认 2048，范围 256 到 16384，以 8 为间隔）。'
        - '等待密钥生成；长度越大，花的时间越明显越长。'
        - '复制公钥和私钥，或按按钮重新生成一组。'
      notes:
        - '至少使用 2048 比特；长期使用的密钥建议 3072 或 4096。低于 2048 比特的密钥被认为不安全，在这里只用于实验。'
        - '4096 比特以上的密钥可能要数秒到更久才能生成，时间不固定，因为是随机搜索素数。'
        - '私钥是传统格式（-----BEGIN RSA PRIVATE KEY-----，PKCS#1），公钥是 -----BEGIN PUBLIC KEY-----。有些库需要 PKCS#8（-----BEGIN PRIVATE KEY-----），可用以下命令转换：openssl pkcs8 -topk8 -nocrypt -in key.pem。'
        - '不要把在网页上生成的密钥用在正式系统或任何有价值的东西。那些密钥请在可信任的机器上用 openssl 或云平台的密钥管理服务生成。'
      faq:
        - q: '生成的密钥真的是随机的吗？'
          a: '是的。生成过程使用 node-forge 库与浏览器的安全随机数来源，每次按下去都会创建独立的密钥。但和所有网页工具一样，您无法审查正在使用的页面，所以正式环境的密钥仍应在其他地方生成。'
        - q: '为什么页面要一段时间才生成密钥？'
          a: '慢的部分是寻找两个很大的随机素数，而且耗时会随密钥长度快速增加。2048 比特的密钥通常几秒内就会出现。'

  html-wysiwyg-editor:
    title: HTML所见即所得编辑器
    description: 在线HTML编辑器具有功能丰富的所见即所得编辑器，立即获得内容的源代码。
    guide:
      intro: '会替您写 HTML 的富文本编辑器：像文字处理器一样用工具列设置格式，对应的原代码就会在下方以整齐的缩进出现。以 Tiptap 编辑器为基础。'
      useCases:
        - '撰写有格式的说明、公告或邮件内文，获取 HTML 放进 CMS 或模板。'
        - '不用打标签就生成标题、列表、引用与代码块的干净 HTML。'
        - '学习某种格式会生成什么 HTML。'
      steps:
        - '在编辑器中输入，用工具列设置标题、粗体、斜体、列表、引用、代码与分隔线。'
        - '下方会显示生成的 HTML，随编辑实时更新。'
        - '把 HTML 复制到您的页面或系统。'
      notes:
        - '输出是语意化的 HTML（<h1>、<p>、<ul>、<blockquote>、<pre>），没有行内样式或 class，所以会继承粘贴位置的样式。'
        - '从文字处理器粘贴的格式化文本会被清理成支持的元素；颜色、字体与表格会被去掉。'
        - '内容会存在这个浏览器中，离开再回来仍在。设备共用时请手动清除。'
        - '编辑器只覆盖常见格式：这个版本没有图片、表格或链接。需要的话请在 HTML 中手动加入。'
      faq:
        - q: '可以直接编辑 HTML 并在编辑器中看到结果吗？'
          a: '这个工具不行：流程是从编辑器到 HTML。请在视觉编辑器中编辑再复制结果；以 HTML 为主的工作请用代码编辑器。'
        - q: '为什么 HTML 比文字处理器导出的短很多？'
          a: '文字处理器会把字体、大小与布局以行内样式和包装元素嵌入。这个编辑器只输出结构标签，这正是网页与 CMS 需要的。'

  yaml-to-toml:
    title: YAML 到 TOML
    description: 解析YAML并将其转换为TOML。
    guide:
      intro: '把 YAML 文档直接转成 TOML，不必手动经过 JSON。项目从 YAML 设置改用 TOML，或某个工具只读 TOML 时很方便。'
      useCases:
        - '把配置文件从 YAML 迁移到 TOML，例如改成 pyproject.toml。'
        - '从文档中找到的 YAML 示例生成 TOML 片段。'
        - '比较同一份数据在两种格式中的写法。'
      steps:
        - '把 YAML 粘贴到左侧字段。'
        - '右侧会显示 TOML。'
        - '复制结果。'
      notes:
        - '结果要匹配 TOML 的规则：最上层必须是映射（mapping），null 值会被丢掉。最上层是列表或标量的 YAML 文档不会有输出。'
        - 'YAML 的隐含类型会先发生：没加引号的 true 在转换前就已经变成布尔值，1.10 变成数字。想维持字符串请在 YAML 中加引号。'
        - '锚点、别名与合并键会被展开，所以重复的数据在 TOML 中会完整写出。'
        - '注释不会带过去。'
      faq:
        - q: '错误信息说我的 JSON 不合法，但我贴的是 YAML？'
          a: '这个消息是通用的，意思是 YAML 无法解析。如果 YAML 合法但输出一直是空的，文档的最上层很可能是列表或标量，TOML 无法表示。'
        - q: '为什么 TOML 中少了一些键？'
          a: '值为 null 的键（YAML 中的空值也会解析成 null）会被省略，因为 TOML 无法表示 null。'

  mac-address-generator:
    title: MAC 地址生成器
    description: 输入数量和前缀。MAC地址将以您选择的大小写（大写或小写）生成
    guide:
      intro: '生成随机的 MAC 地址，可选择指定开头的前缀、大写或小写，以及需要的分隔符号（冒号、连字号、点或不加）。一次最多 100 个。'
      useCases:
        - '替虚拟机、容器或网络仿真器分配地址。'
        - '替资产管理系统、DHCP 设置或解析器创建测试数据。'
        - '替实验室设备生成特定厂商前缀（OUI）范围内的地址。'
      steps:
        - '设置数量（1 到 100），需要的话输入前缀，例如 64:16:7F。'
        - '选择大写或小写，以及分隔符号。'
        - '复制生成的列表，或刷新获取新的一批。'
      notes:
        - '前缀可以用任何分隔符号或不加分隔符号输入；会先范式，剩下的字节再随机填入。给满 6 个字节的前缀就会得到那个固定地址。'
        - '没有前缀时第一个字节完全随机，所以有些地址会是多播地址（第一个字节为奇数）或被标记为本地管理。要生成不会和真实厂商冲突的单播地址，请设置第二个十六进制数字为 2、6、A 或 E 的前缀，例如 02:00:00。'
        - '这里的随机数不是密码学等级，当测试数据没问题，但不适合任何与安全相关的用途。'
        - '数量、前缀与分隔符号会记在这个浏览器中。'
      faq:
        - q: '为什么我的虚拟化平台拒绝生成的地址？'
          a: '许多虚拟化平台要求单播且本地管理的地址，会拒绝多播地址。请使用 02:xx:xx 这类前缀，或平台文档列出的厂商范围，例如 QEMU/KVM 的 52:54:00 或 VMware 的 00:50:56。'
        - q: '分隔符号有什么意义？'
          a: '技术上没有差别，只是显示惯例。Linux 与 macOS 常用冒号，Windows 用连字号，Cisco 设备则用四位一组的点分写法（0000.0000.0000）。'

  json-diff:
    title: JSON 差异比较
    description: 比较两个JSON对象并获得它们之间的差异。
    guide:
      intro: '比较两份 JSON 文档，以带颜色标示的树状结构显示哪些内容被添加、移除或修改。两个输入框都接受较宽松的 JSON5，所以注释和结尾逗号不会造成困扰。'
      useCases:
        - '比较部署前后的 API 响应，确切找出哪些字段改变了。'
        - '查看配置文件的两个版本，不必依赖逐行的文本差异。'
        - '确认序列化器或数据迁移生成的数据和原本一致。'
      steps:
        - '把原始的 JSON 粘贴到第一个输入框。'
        - '把要比较的 JSON 粘贴到第二个输入框。'
        - '看下方的树状结果：添加、移除与修改的项目会被标示，未变动的项目则显示作为上下文。'
      notes:
        - '对象是逐个键比较的，所以键的顺序不影响结果，单纯调整顺序不会被视为差异。'
        - '数组是依位置比较的。在开头插入一个项目，后面所有项目都会往后移，可能出现大量「已修改」。顺序没有意义的数组，请先排序或改用键值结构再比较。'
        - '值的类型改变（例如数字 1 变成字符串 "1"）会被视为差异。'
        - '任一边不是合法的 JSON 时，输入框会显示错误，也不会进行比较。'
      faq:
        - q: '这和一般的文本差异比较有什么不同？'
          a: '文本比较是以行为单位，重新排版或调整键的顺序都会生成大量噪音。这个工具比较的是解析后的数据，所以只会显示键、值与类型真正的差异。'
        - q: '可以忽略时间戳之类的特定字段吗？'
          a: '目前不行，请在比较前先从两边移除这些字段。'
  jwt-parser:
    title: JWT 解析器
    description: 解析和解码JSON Web Token（jwt）并显示其内容。
    guide:
      intro: 'JSON Web Token（JWT）由三段以点号相连的 Base64URL 字符串组成：标头、带有各种声明（claims）的内容，以及签名。这个工具会把标头与内容解码出来给您阅读，并标示每个标准声明的意思。'
      useCases:
        - 'API 返回 401 时，确认令牌是否已过期、是不是发给别的对象（aud），或是缺少预期的权限范围（scope）。'
        - '检查登录流程发出的令牌，看后端实际收到哪些声明，例如 sub、角色或租户。'
        - '调试时钟误差问题时，把 iat、nbf、exp 从 Unix 时间戳转成看得懂的日期。'
      steps:
        - '把完整的令牌（三段以点号分隔）粘贴到输入框。'
        - '从标头看签名算法（alg）与令牌类型。'
        - '从内容看各项声明；exp、nbf、iat 除了原始数字，也会显示成本地时间。'
      notes:
        - '这个工具只做解码，不会验证签名，所以能读出内容不代表令牌是真的。签名要在服务器端验证，或使用本站的「JWT 签名与验证」工具。'
        - '内容只是编码，并未加密，拿到令牌的人都读得到。不要把密码或其他机密放进声明。'
        - '解码在浏览器内完成，令牌不会传到任何地方。即便如此，仍有效的正式环境令牌要当成密码看待，能用过期或测试用的令牌就尽量用。'
        - '日期会依您设备的时区显示，而 exp 与 iat 本身是以 UTC 为基准的 Unix 秒数。'
      faq:
        - q: '为什么我的令牌无法解码？'
          a: '有效的 JWT 一定是三段以点号分隔，且前两段必须是 Base64URL 编码的 JSON。常见原因是多带了「Bearer 」前缀、复制时被截断，或根本不是 JWT（例如随机字符串形式的不透明令牌）。'
        - q: '把令牌粘贴在这里安全吗？'
          a: '解码在页面本地运行，不会上传。但令牌若仍有效，任何看到的人都能拿去使用，所以请避免把它粘贴到截屏、聊天室或会把数据送到服务器的网站。'

  timestamp-batch-converter:
    title: '时间戳批量转换'
    description: '一次把多个 Unix 时间戳转成你要的时区与格式。'
    input: '你的时间戳'
    inputPlaceholder: '一行一个，或用逗号、分号、Tab 分隔…'
    output: '转换结果'
    unit: '单位'
    format: '格式'
    timezone: '时区'
    result: '结果（{total} 个中有 {valid} 个有效）'
    units:
      auto: '自动检测'
      seconds: '秒'
      milliseconds: '毫秒'
      microseconds: '微秒'
      nanoseconds: '纳秒'
    formats:
      iso8601: 'ISO 8601'
      iso9075: 'ISO 9075（yyyy-MM-dd HH:mm:ss）'
      dateOnly: '只要日期'
      timeOnly: '只要时间'
      verbose: '含星期与时区'
    columns:
      input: '输入'
      unit: '单位'
      result: '结果（{timezone}）'
    errors:
      notANumber: '不是数字'
      outOfRange: '超出范围'
    guide:
      intro: '一次转换大量的 Unix 时间戳。把日志、数据库导出文件或电子表格里的一整栏粘贴过来，就能得到您指定时区与格式的可读日期，无效的行也会个别标示。'
      useCases:
        - '不必逐条转换，直接读懂应用程序日志或 API 响应里的一整串 epoch 值。'
        - '把数据库导出的时间戳换成自己的时区，确认哪些落在某一天。'
        - '把数字时间戳转成 ISO 8601 字符串，粘贴到工单、测试数据或报告。'
      steps:
        - '粘贴时间戳，可以一行一个，或用逗号、分号、Tab 分隔。'
        - '单位维持自动检测，或手动选择秒、毫秒、微秒、纳秒。'
        - '选择输出格式与时区，再阅读或复制结果表格。'
      notes:
        - '自动检测是看数字的位数：11 位以内视为秒，12 到 14 位视为毫秒，15 到 17 位视为微秒，更多则视为纳秒。很小的毫秒值（例如 1970 年附近）看起来会像秒，所以明确知道单位时请手动指定。'
        - '接受小数（例如 1700000000.5）和负数（1970 年以前的日期）。'
        - 'Unix 时间戳本身没有时区。您选择的时区只会改变显示方式，不会改变它代表的那个时间点。'
        - '不是数字的行，或超出 JavaScript 日期可表示范围的行会标示错误，其他行仍然会正常转换。'
      faq:
        - q: '为什么我的时间戳显示成 1970 年的日期？'
          a: '这个值很可能是毫秒或微秒却被当成秒，或是相反。请不要用自动检测，改为明确指定单位。'
        - q: '一次可以贴多少条？'
          a: '没有固定上限。转换在浏览器中进行，几千行是瞬间完成，非常大量的内容则取决于您的设备。'

  date-calculator:
    title: '日期计算器'
    description: '计算两个日期之间的天数，或从某天加减天数；可排除指定星期与台湾国定假日，算出工作天。'
    modes:
      count: '计算天数'
      add: '增加天数'
      subtract: '减去天数'
    startDate: '开始日期'
    endDate: '结束日期'
    today: '今天'
    pickDate: '选择日期'
    daysToAdd: '要增加的天数'
    daysToSubtract: '要减去的天数'
    settings: '计算设置'
    includeEnd: '包含结束日期'
    exclude: '排除'
    workdaysPreset: '只算工作天'
    clearExclusions: '清除'
    excludeHolidays: '排除国定假日'
    holidaysHint: '依人事行政总处公布的办公日历表（{first}–{last} 年），包含补假；周六补班日会算成工作天。'
    calculate: '计算'
    weekdays:
      mon: '星期一'
      tue: '星期二'
      wed: '星期三'
      thu: '星期四'
      fri: '星期五'
      sat: '星期六'
      sun: '星期日'
    errors:
      startDate: '请选择开始日期。'
      endDate: '请选择结束日期。'
      amount: '请输入天数。'
      allExcluded: '不能排除一周中的每一天，否则没有任何一天可以计算。'
    result:
      days: '相差天数'
      countedDays: '排除后的天数'
      daysValue: '{count} 天'
      reversed: '结束日期早于开始日期，所以结果是负数。'
      calendarDays: '日历天数 {count} 天'
      excludedPrefix: '，已排除 {count} 天：'
      excludedWeekday: '{weekday} {count} 天'
      excludedHolidays: '国定假日 {count} 天'
      separator: '、'
      weeks: '相当于 {weeks} 周又 {days} 天'
      calendarDifference: '两个日期相差 {value}'
      unitSeparator: ' '
      units:
        years: '{count} 年'
        months: '{count} 个月'
        days: '{count} 天'
      date: '结果日期'
      shiftedAfter: '开始日期之后第 {count} 个计算日，日历上相隔 {calendarDays} 天'
      shiftedBefore: '开始日期之前第 {count} 个计算日，日历上相隔 {calendarDays} 天'
      skippedPrefix: '途中跳过 {count} 天：'
      holidaysInRange: '期间的国定假日'
      missingHolidayYears: '{years} 年还没有国定假日数据（目前涵盖 {first}–{last} 年），这些年份的国定假日没有被排除。'
    guide:
      intro: '日期计算器有三种用法：算出两个日期之间有几天、从某一天往后推算，以及往前推算。可以排除指定的星期几，也能依人事行政总处公布的办公日历表排除台湾的国定假日与补假，直接算出「工作天」。'
      useCases:
        - '计算合同、租赁合同或试用期从哪天到哪天共有几天，或还剩几天。'
        - '公文、法规或合同写「于 10 个工作天内」，要算出实际的截止日期。'
        - '项目排期：从开工日往后推算 30 个工作天，跳过周末、春节与连假。'
        - '回推日期：交件日往前 5 个工作天要先完成内部审核，算出最晚哪天要送审。'
      steps:
        - '在上方选择模式：「计算天数」、「增加天数」或「减去天数」。'
        - '选择开始日期（可按「今天」快速带入）；计算天数时再选结束日期，加减天数时输入天数。'
        - '在「计算设置」勾选要排除的星期与国定假日；按「只算工作天」可一次勾好周六、周日与国定假日。'
        - '按「计算」看结果。结果会列出排除了哪些天与期间的国定假日；之后修改日期或设置，结果会自动更新。'
      notes:
        - '计算天数时，默认算到结束日期的前一天为止，也就是「1 月 1 日到 1 月 31 日」是 30 天；要把结束日期也算进去，请勾选「包含结束日期」。'
        - '增加或减去天数时，开始日期本身不算在内：从星期五往后加 1 个工作天，结果是下周一。'
        - '同时排除周六、周日与国定假日时，人事行政总处公告的周六补班日会算成工作天，结果与政府机关的上班日一致。'
        - '国定假日数据涵盖的年份写在「排除国定假日」下方。政府每年约 6 月公布隔年的办公日历表后会再更新，超出范围的年份会显示提醒。'
        - '这里的国定假日指政府行政机关的放假日。民营企业、学校或特定行业（如劳动节只有劳工放假）的实际休假可能不同，重要期限请以主管机关或契约规定为准。'
      faq:
        - q: '为什么 1 月 1 日到 1 月 31 日是 30 天，不是 31 天？'
          a: '两个日期「相差」的天数不含结束日期，这和大多数日历与电子表格的算法一致。如果要算「共几天」（头尾都算），请勾选「包含结束日期」，结果就会是 31 天。'
        - q: '工作天是怎么算的？'
          a: '按「只算工作天」会排除周六、周日与国定假日（含补假），并把周六补班日算回来。用这个设置算出的一整年天数，与人事行政总处办公日历表上的上班日完全相同。'
        - q: '台风假会算进去吗？'
          a: '不会。台风假由各县市临时公布，无法事先列入；如果期间有放台风假，请自行扣除。'
        - q: '可以算其他国家的假日吗？'
          a: '目前只内置台湾的国定假日。其他国家可以只用「排除星期」的功能，再自行扣除当地假日。'

  date-converter:
    title: 日期时间转换器
    description: 将日期和时间转换为各种不同的格式
    timezone: '时区'
    guide:
      intro: '同一个时间点在不同系统里有不同的写法：Unix 时间戳、ISO 8601、RFC 3339、Excel 串行值、MongoDB ObjectID 等等。这个工具把你贴进去的值辨识出来，同时输出所有常见格式，并可指定时区。'
      useCases:
        - '在日志或 API 回应里看到一串数字，想知道那是什么时间。'
        - '要把时间写进设置档或数据库，需要特定格式的字符串。'
        - '跨时区协作时，想确认某个时间点在对方时区是几点。'
        - '从 Excel 导出的数据里日期变成一串小数，需要还原成日期。'
      steps:
        - '把时间值贴进输入框，工具会自动辨识格式并切换下方的格式菜单。'
        - '若辨识错误，手动在右边的菜单指定输入格式。'
        - '在时区菜单选择你要的时区，所有输出会跟着换算。'
        - '点各字段右侧的拷贝图标取用结果。'
      notes:
        - '输入的字符串如果没有带时区偏移（例如 2023-04-12 23:10:24），会以你选的时区解读；带了偏移（例如结尾有 Z 或 +08:00）则以该偏移为准，不受时区菜单影响。'
        - 'Unix 时间戳有秒与毫秒两种，十位数通常是秒、十三位数是毫秒。工具会依位数判断。'
        - 'Excel 的日期串行值是从 1900 年起算的天数，小数部分代表当天的时间。'
      faq:
        - q: '要一次转很多笔时间戳怎么办？'
          a: '用「时间戳批量转换」那个工具，可以一次贴多笔并输出成表格。'
        - q: 'ISO 8601 和 RFC 3339 有什么差别？'
          a: 'RFC 3339 可以视为 ISO 8601 的严格子集，强制要求日期与时间之间用 T 分隔、并且一定要带时区偏移。实务上要写进 API 或设置档时，选 RFC 3339 比较不会出错。'

  phone-parser-and-formatter:
    title: 电话分析器和格式化程序
    description: 解析、验证和格式化电话号码。获取有关电话号码的信息，如国家/地区代码、类型等。
    guide:
      intro: '以 Google 的 libphonenumber 规则解析电话号码：告诉您国家与国码、号码是有效还是只是可能、类型（行动、市话、免付费……），并以国际、国内、E.164 与 RFC 3966 格式呈现。'
      useCases:
        - '把表单收集到的电话号码在保存前范式成 E.164（+886912345678）。'
        - '确认号码在该国是否有效，以及是否为能收短信的移动电话。'
        - '依本地或国际惯例格式化号码以供显示。'
      steps:
        - '选择默认国家，用于没有 + 前缀的号码；默认会依浏览器语言预选。'
        - '以任何常见形式输入号码（空格、连字号、括号、开头的 0 或 +）。'
        - '阅读国家、有效性、类型与四种格式，复制需要的那一种。'
      notes:
        - '「可能」代表长度匹配该国的模式；「有效」代表号码落在实际分配的号段。只替有效的号码保存 E.164。'
        - '没有 + 的号码会以默认国家解读，所以 0912 345 678 在选台湾时是台湾号码，选其他国家时则无效。'
        - '类型检测（行动与市话）在多数国家可靠，但在某些国家有歧义，特别是美国，两者共用相同号段。'
        - '号码计划会变动；库会定期更新，但全新的号段可能有一段时间被判定为无效。'
      faq:
        - q: '数据库应该存哪种格式？'
          a: 'E.164：加号、国码与国内号码，没有空格（+886912345678）。它没有歧义，也是短信与电话 API 预期的格式。'
        - q: '为什么我打得通的号码被判定为无效？'
          a: '可能是没有 + 的号码配上错误的默认国家，或号码属于库还不认识的号段。先加上 + 与国码试试，排除第一个原因。'

  ipv4-subnet-calculator:
    title: IPv4子网计算器
    description: 解析IPv4 CIDR块，并获取有关子网络的所有所需信息。
    guide:
      intro: '输入带有掩码的 IPv4 地址（CIDR，例如 192.168.0.1/24，或子网掩码），就能得到网络地址、掩码、通配符掩码（wildcard）、第一个与最后一个可用地址、广播地址与地址数量，同时显示地址等级。'
      useCases:
        - '规划如何把网络切成多个子网，并检查两个范围是否重叠。'
        - '弄清楚云安全组或防火墙规则中的某个 CIDR 块实际覆盖哪些地址。'
        - '找出某台主机所在网段的网络地址与广播地址，或在 /24 与 255.255.255.0 两种写法之间转换。'
      steps:
        - '输入地址与掩码，例如 10.0.0.0/22。'
        - '看表格：网络地址、点分十进制与二进制的掩码、通配符掩码、网络大小、第一个与最后一个地址、广播地址与 IP 等级。'
        - '用上一个、下一个按钮切换到相邻且大小相同的块。'
      notes:
        - '「Network size」是块内的地址总数。一般子网中，第一个（网络地址）与最后一个（广播地址）不能分配给主机，所以可用主机数是总数减 2。'
        - '「First address」与「Last address」是第一个与最后一个可用的主机地址，因此和网络地址、广播地址不同。'
        - '/31 与 /32 块没有广播地址，该字段会显示不存在。/31 用于点对点连接，/32 则代表单一主机。'
        - '通配符掩码就是子网掩码取反，用于部分路由器的访问控制列表，例如 Cisco ACL。'
      faq:
        - q: '/24 可以放多少台主机？'
          a: '/24 共有 256 个地址，其中 254 个可分配给主机。前缀每缩短一位，大小就加倍，所以 /23 有 512 个地址。'
        - q: '支持 IPv6 吗？'
          a: '不支持，这个计算器只处理 IPv4。'

  og-meta-generator:
    title: 开放式图形元生成器
    description: 为您的网站生成开放式图形和社交html元标记。
    guide:
      intro: '生成 Open Graph 与 Twitter Card 的 meta 标签，控制页面在社群网站与通信软件中分享时的外观：标题、描述、图片、网址、页面类型，以及文章、书籍、个人文件、音乐与视频等类型专属的字段。'
      useCases:
        - '替新网站、落地页或博客加上分享预览。'
        - '修正贴到 Slack、Facebook、X 或 LINE 时没有图片或标题错误的链接。'
        - '替文章（作者、发布日期）或视频页面生成正确的标签。'
      steps:
        - '选择页面类型，填入标题、描述、网址与图片。'
        - '需要的话填入类型专属字段与 Twitter Card 设置。'
        - '把生成的标签复制到页面的 <head> 中。'
      notes:
        - 'og:image 请用绝对网址（https://...），大型预览图至少 1200×630 像素。许多平台会拒绝相对路径与太小的图片。'
        - '各平台会大量缓存预览。修改标签后，请用它们的调试工具（Facebook 分享调试工具、LinkedIn Post Inspector、X Card Validator）刷新缓存。'
        - '标签必须出现在提供给爬虫的 HTML 中。加载后才用 JavaScript 加上标签的页面，社群爬虫通常读不到。'
        - 'og:title 尽量控制在约 60 个字符内，og:description 约 160 个字符内，太长会在预览中被截断。'
      faq:
        - q: '为什么我改了标签，链接预览还是旧的？'
          a: '平台缓存了旧版本。把网址丢进该平台的分享调试工具强制重新抓取，最后手段是在网址加上查询参数。'
        - q: 'Open Graph 和 Twitter 标签都需要吗？'
          a: 'X 在没有 Twitter 标签时会退回使用 Open Graph，但要有 twitter:card 才能得到大图布局。多数网站两组都会放。'

  ipv6-ula-generator:
    title: IPv6 ULA生成器
    description: 根据RFC4193在网络上生成您自己的本地不可路由IP地址。
    guide:
      intro: '依 RFC 4193 生成 IPv6 唯一本地地址（ULA，fd00::/8）前缀：用 MAC 地址与当前时间推导出 40 比特的伪随机全局 ID，给您一个私有网络用的 /48 前缀，以及其中第一个与最后一个 /64 子网。'
      useCases:
        - '替家用实验室、办公室区网、VPN 或容器网络挑选不需要在互联网上路由的内部 IPv6 前缀。'
        - '避免两个私有网络日后通过 VPN 相连时，因为都用 fd00::/48 或 fd00:1::/64 而冲突。'
        - '学习 ULA 前缀的结构。'
      steps:
        - '输入您某张网络接口的 MAC 地址；任何合法的 MAC 都可以，它只用来当随机部分的种子。'
        - '阅读 /48 前缀（IPv6 ULA），以及可以从中切出的第一个与最后一个 /64 块。'
        - '复制前缀并记录下来；结果每次刷新都会变，不要期待能再生成同一个。'
      notes:
        - '全局 ID 是 MAC 地址与当前时间戳的哈希，这是 RFC 4193 建议的做法，所以每次生成都会得到新的前缀。请把决定使用的那个存起来。'
        - '一个 /48 含有 65536 个 /64 子网，从 xxxx:0::/64 到 xxxx:ffff::/64。每个区网段通常分配一个 /64。'
        - 'ULA 像 IPv4 的 10.0.0.0/8 一样是私有的，但设计上不做 NAT；主机会同时拥有 ULA 与全球地址，随机前缀则让两个网络合并时不会混在一起。'
        - 'fc00::/8 是 ULA 空间的另一半，保留给一个从未实施的集中分配方案，所以生成的前缀一律以 fd 开头。'
      faq:
        - q: '直接用 fd00::/48 不行吗？'
          a: '能用，但每个走这条捷径的人都会选到同一个前缀，两个这样的网络一旦相连就会冲突。随机的全局 ID 正是 RFC 4193 的重点。'
        - q: '生成的前缀保证唯一吗？'
          a: '不保证，但有 40 个随机比特，两个独立生成的前缀相撞的概率，对任何实际数量的网络来说都可以忽略。'

  hash-text:
    title: Hash 文本
    description: '使用所需的函数哈希文本字符串：MD5、SHA1、SHA256、SHA224、SHA512、SHA384、SHA3或RIPEMD160'
    file:
      title: '文件哈希'
      upload: '把文件拖拽到这里，或点击选择文件'
      algorithms: '算法'
      compare: '比对哈希值'
      comparePlaceholder: '粘贴预期的哈希值来验证文件…'
      match: '与 {algorithm} 相符'
      mismatch: '没有任何哈希值相符'
      hashing: '计算中…'
      clear: '清除文件'
      privacy: '文件只在你的浏览器里计算，不会上传。'
      error: '无法读取这个文件。'
    guide:
      intro: '哈希函数把任意长度的数据转成固定长度的指纹。相同输入永远得到相同结果，而且无法从结果反推原文。常用来验证文件完整性、比对数据是否被窜改。'
      useCases:
        - '下载文件后比对官方提供的 SHA-256，确认文件没有损毁或被掉包。'
        - '确认两份看起来一样的文件内容是否真的相同。'
        - '在开发时产生固定长度的识别码，或为缓存键值做范式。'
      steps:
        - '把文本贴进上方输入框，八种算法的结果会即时算出来。'
        - '需要不同输出格式时，用「Digest encoding」切换十六进位、Base64 或二进位。'
        - '要算文件的话，卷到下方的「文件哈希」区块，勾选需要的算法后拖入文件。'
        - '要验证下载的文件，把官方公布的哈希值贴进「比对哈希值」字段，相符会显示绿色标签。'
      notes:
        - '文件完全在你的浏览器里计算，以分段串流处理，不会上传，大文件也不会吃爆内存。'
        - 'MD5 和 SHA-1 已被证实可以制造碰撞，不应再用于安全用途。仅用于比对非恶意情境下的文件完整性时仍可接受。'
        - '本工具的「SHA3」实际上是 Keccak-512，也就是 NIST 定案前的版本，结果与 sha3sum 指令不同。需要标准 SHA3-512 时请勿使用这一栏。'
        - '哈希不是加密，没有密钥也无法还原。要保护密码请用 bcrypt，要加解密请用文本加密工具。'
      faq:
        - q: '为什么同一个文件在不同网站算出来的 SHA-256 不一样？'
          a: '正常情况下不会不一样。若结果不同，通常是文件本身不同（例如换行符号 CRLF 与 LF 的差异、或下载不完整），或是其中一边算的是文本而非二进位内容。'
        - q: '该选哪一种算法？'
          a: '验证文件完整性用 SHA-256 就够了，这是目前最通用的选择。需要更长的摘要可以用 SHA-512。避免用 MD5 和 SHA-1 做任何安全相关的判断。'

  json-to-toml:
    title: JSON 转 TOML
    description: 解析JSON并将其转换为TOML。
    guide:
      intro: '把 JSON 转成 TOML，也就是 Cargo（Rust）、pyproject.toml（Python）、Hugo 与许多命令行工具使用的设置格式。对象会变成表格（table），对象数组会变成表格数组。'
      useCases:
        - '用手上已有的 JSON 数据写出 pyproject.toml 或 Cargo.toml 的区段。'
        - '把 JSON 设置翻成 TOML，给只读 TOML 的工具。'
        - '通过熟悉的 JSON 结构在 TOML 中的写法来学习 TOML 语法。'
      steps:
        - '把 JSON（接受 JSON5 语法）粘贴到左侧字段。'
        - '右侧会显示 TOML。'
        - '复制结果。'
      notes:
        - '最上层必须是对象。TOML 无法把整份文档表示成单纯的数组或标量，这类输入不会有输出。'
        - '混合类型的数组（例如数字与字符串）会写成行内数组，TOML 1.0 允许这样做；仍要求数组单一类型的旧版 TOML 解析器可能会拒绝。'
        - 'null 在 TOML 中没有对应的写法，值为 null 的键会从输出中省略。'
        - '嵌套对象会写成 [table] 与 [table.sub] 标头，对象数组会写成 [[array]] 项目，这是惯用的 TOML 排版。'
      faq:
        - q: '为什么合法的 JSON 转换会失败？'
          a: 'TOML 比 JSON 严格：文档必须是对象，而且没有 null。最上层是数组或标量时不会有输出，值为 null 的键会默默消失。'
        - q: '我值为 null 的键跑去哪了？'
          a: '它被省略了，因为 TOML 无法表示 null。请改用空字符串、特定的替代值，或在读取端直接省略这个键。'

  device-information:
    title: 设备信息
    description: 获取有关当前设备的信息（屏幕大小、像素比率、用户代理…）
    guide:
      intro: '显示浏览器对它所在设备的了解：屏幕尺寸、方向、色彩深度、像素比、窗口大小、浏览器厂商、语言、平台与 User-Agent 字符串。'
      useCases:
        - '报告显示问题时，告诉客服您的屏幕尺寸、像素比与浏览器。'
        - '设计响应式布局时，确认手机或平板的 CSS 像素尺寸。'
        - '确认浏览器送给网站的语言列表，它决定网站的默认语言。'
      steps:
        - '在想检查的设备上打开这个页面。'
        - '阅读各项数值；调整窗口大小或旋转设备，数值会跟着更新。'
        - '用复制按钮复制任一数值。'
      notes:
        - '屏幕与窗口尺寸是 CSS 像素，不是实体像素。乘上像素比才是实体分辨率：显示 390×844、像素比 3 的手机，屏幕是 1170×2532。'
        - '窗口大小是页面可用的可视区域，地址栏、开发者工具或侧边面板出现时会变小。'
        - '现代 Chrome 的 User-Agent 字符串部分被冻结，所以操作系统与设备细节刻意模糊；要解读它请用 User-Agent 解析工具。'
        - '这里显示的一切，您造访的任何网站都早已能获取；这个页面只是把它显示出来，不会发送任何数据。'
      faq:
        - q: '为什么屏幕尺寸和我屏幕的分辨率不一样？'
          a: '浏览器报告的是 CSS 像素，会受操作系统的显示缩放与浏览器缩放影响。4K 屏幕在 200% 缩放下会报告 1920×1080、像素比 2。'
        - q: '像素比是做什么用的？'
          a: '它告诉网站一个 CSS 像素由几个实体像素组成，网站就能在高密度屏幕上提供更清晰的图片（srcset、2x 素材）。'

  pdf-signature-checker:
    title: PDF签名检查器
    description: '验证PDF文件的签名。签名的PDF文件包含一个或多个签名，可用于确定文件的内容在签名后是否已被更改。'
    guide:
      intro: '读取 PDF 中嵌入的数字签名，对每一个签名显示文档自签署后是否未被更动，以及是谁签的：签署者证书的细节（姓名、组织、国家）与有效期间。文件在浏览器中解析。'
      useCases:
        - '确认已签署的合约、发票或公文在签署后没有被更动。'
        - '查看谁签了这份 PDF，以及当时证书是否有效。'
        - '寄出前确认自己签过的文档确实含有签名。'
      steps:
        - '把 PDF 拖到上传区或点一下选择。'
        - '每个签名会连同验证结果列出。'
        - '展开签名可看到证书细节。'
      notes:
        - '完整性验证通过代表被签署的字节范围仍与签名相符。如果文档事后被修改而没有重新签署，检查会失败。'
        - '工具以数学方式验证签名，但不像 Adobe Reader 那样对照受信任的根证书与撤销列表检查证书链。来自未知或自签证书的通过签名只证明完整性，不证明身分。'
        - '有些 PDF 使用可见的签名图片，那只是图片，没有密码学签名；这类文档会显示找不到签名。'
        - '不会上传任何内容；PDF 留在您的设备上。'
      faq:
        - q: '为什么显示找不到签名？'
          a: '这份 PDF 没有数字签名（扫描或手绘的签名只是图片），或使用解析器不认识的签名格式。可以用 PDF 阅读器打开，查看它的签名面板。'
        - q: '签名通过就可以信任这份文档吗？'
          a: '它证明内容未变且与显示的证书绑定。要信任身分，还要确认证书是由您认可的机构签发，这个工具不会做这件事。'

  json-minify:
    title: JSON 压缩
    description: 通过删除不必要的空白来缩小和压缩JSON。
    guide:
      intro: '移除 JSON 中所有不必要的空格，生成最短的等价单行文本。JSON5 输入中的注释与结尾逗号也会被去掉，所以输出一定是标准 JSON。'
      useCases:
        - '把 JSON 内容嵌进网址、HTML 属性或设置字符串之前先缩小。'
        - '把带注释的 JSON5 设置转成解析器要求的严格 JSON。'
        - '把 JSON 文档放成一行，用在日志、环境变量或 curl 命令中。'
      steps:
        - '把 JSON 粘贴到左侧字段；接受带注释的 JSON5 语法。'
        - '右侧会显示单行的结果。'
        - '复制它。'
      notes:
        - '只会移除字符串以外的空格。字符串值里的空格与换行会保留，因为它们是数据的一部分。'
        - '输入会被解析后重新串行化，所以注释会消失、重复的键只保留最后一个值，数字也会被范式（1.0 变成 1，1e3 变成 1000）。'
        - '压缩通常能让有缩进的 JSON 缩小 20% 到 40%。真正要省带宽，服务器端的 gzip 或 brotli 压缩重要得多。'
        - '输入不合法时会显示错误，没有输出。'
      faq:
        - q: '为什么 1.0 变成了 1？'
          a: 'JSON 数字没有格式的概念，1.0 和 1 是同一个值，串行化时会写成最短的形式。如果这个差异很重要，请把值存成字符串。'
        - q: '怎么把它变回可读的格式？'
          a: '用「JSON 美化与格式化」工具，它会把同样的数据重新缩进成多行布局。'

  ulid-generator:
    title: ULID 生成器
    description: 生成随机的通用唯一词典可排序标识符（ULID）。
    guide:
      intro: '生成 ULID（通用唯一字典序可排序标识符）：26 个字符的标识符，开头是时间戳，所以会依创建时间排序，后面接 80 比特的随机值。可输出成逐行文本或 JSON 数组。'
      useCases:
        - '需要唯一且能依时间排序的主键或对象 ID，例如事件、订单或日志项目。'
        - '在重视索引局部性、可读且网址安全的 ID 时取代 UUID v4。'
        - '生成具有真实感、有顺序的测试标识符。'
      steps:
        - '设置需要的 ULID 数量（1 到 100）。'
        - '选择逐行文本或 JSON 数组。'
        - '复制结果，或按刷新（Ctrl+Enter）生成新的一批。'
      notes:
        - '前 10 个字符编码毫秒时间戳，后 16 个是随机值。同一毫秒内置立的 ULID 会保持单调递增（随机部分加一），所以仍依创建顺序排序。'
        - 'ULID 使用 Crockford 的 Base32 字母表，省略 I、L、O、U 以避免混淆；不分大小写，可安全用在网址中。'
        - '因为时间戳是可见的，ULID 会透露记录大约的创建时间。若这是敏感信息，请改用 UUID v4。'
        - 'ULID 是 128 比特，和 UUID 相同大小，转换比特后可存进 UUID 字段；许多数据库与库都支持。'
      faq:
        - q: 'ULID 还是 UUID v7？'
          a: '两者都是依时间排序的 128 比特 ID。UUID v7 是较新的标准，更多数据库与库原生支持；ULID 的文本形式较短也较友善。选您的技术堆栈支持最好的那个。'
        - q: '为什么连续的 ULID 只有最后几个字符不同？'
          a: '它们在同一毫秒内生成，所以时间戳部分相同，随机部分递增以维持可排序。这是刻意的设计。'

  string-obfuscator:
    title: 字符串混淆器
    description: 混淆字符串（如秘密、IBAN 或令牌），使其可共享和可识别，而不泄露其内容。
    guide:
      intro: '把字符串中段换成星号，只保留开头与结尾少数几个字符，让密钥、令牌、IBAN 或卡号可以分享或放进截屏，既能辨识是哪一个，又无法被拿去使用。'
      useCases:
        - '把 API 密钥或令牌粘贴到错误回报、工单或聊天室，让对方知道是哪一把密钥，却看不到内容。'
        - '在接口或截屏中显示部分屏蔽的 IBAN、卡号或电话号码。'
        - '在日志中记录标识符，而不把完整的密钥写进日志。'
      steps:
        - '粘贴字符串。'
        - '选择开头与结尾各保留几个字符，以及空格是否维持可见。'
        - '复制屏蔽后的结果。'
      notes:
        - '保留部分之间的每个字符都会变成星号，所以原文的长度仍然看得出来。如果长度本身也是敏感信息，请留意这点。'
        - '保留空格能让分组的数字（IBAN、卡号）更容易阅读，同时仍隐藏数字本身。'
        - '保留的字符越多，密钥就越容易被猜到或和外泄数据比较。对 API 密钥来说，开头几个字符通常就足以辨识。'
        - '这是显示上的辅助，不是安全控制。屏蔽在浏览器中完成、不会发送任何数据，但握有原始字符串的人当然还是能使用它。'
      faq:
        - q: '屏蔽后的字符串可以还原吗？'
          a: '不能，被隐藏的字符已经被取代，无法从输出复原。所以如果还需要原文，请另外安全保存。'
        - q: '信用卡号应该保留多少可见？'
          a: '业界惯例（PCI DSS）最多允许显示前六码与后四码；多数收据只显示后四码。'

  base-converter:
    title: 整数基转换器
    description: 在不同的基数（十进制、十六进制、二进制、八进制、base64…）之间转换数字
    guide:
      intro: '在 2 到 64 之间的任何进制之间转换整数：二进制、八进位、十进制、十六进制、类 base64 的数字，以及介于其间的所有进位。可处理远超过 64 比特的数字而不损失精度。'
      useCases:
        - '把代码、寄存器对照表或封包内容中的十六进制或二进制常数读成十进制。'
        - '把十进制值写成十六进制，用于颜色、内存地址或比特掩码。'
        - '并排查看八进位与二进制的文件权限或标志。'
      steps:
        - '输入数字并设置它所用的进位（2 到 64）。'
        - '同时读取它的二进制、八进位、十进制与十六进制。'
        - '在底部设置自定义的输出进位，例如 36 或 58 进位。'
      notes:
        - '数字符号依序是 0-9、a-z、A-Z、+ 和 /。所以 10 以上的进位先用小写字母（十六进制是 a-f），36 以上的进位则区分大小写，a 和 A 是不同的数字。'
        - '这里的 64 进位是位置记数法（真正的 64 进位数字），不是用于文件与字符串的 Base64 文本编码。那个请用 Base64 工具。'
        - '只支持非负整数：不能有负号、小数点或 0x、0b 等前缀。粘贴前请先把前缀去掉。'
        - '运算使用任意精度整数，所以 128 比特以上的值也能精确转换。'
      faq:
        - q: '为什么我的十六进制输入被拒绝？'
          a: '大概是因为用了大写字母或 0x 前缀。这里的十六进制数字必须是小写 a-f（大写字母是 36 以上进位的数字），前缀也必须移除。'
        - q: '36 进位或 58 进位用在哪里？'
          a: '36 进位（0-9、a-z）能生成精简、不分大小写的标识符，例如短网址。58 进位用于比特币地址，但比特币的字母表和这里不同，结果不能互换。'

  yaml-to-json-converter:
    title: YAML到JSON转换器
    description: 使用此在线转换器将YAML转换为JSON。
    guide:
      intro: '解析 YAML 文档，输出相同数据的缩进 JSON。适合把配置文件喂给只接受 JSON 的工具与 API，或确认一份 YAML 文件到底被怎么解读。'
      useCases:
        - '把 Kubernetes manifest、Compose 文件或 CI workflow 转成 JSON，用于 API 调用或脚本。'
        - '查看 YAML 的隐含类型如何解读您的值：哪些变成了数字、布尔或 null。'
        - '找出 YAML 文件的缩进错误，不合法的 YAML 会显示错误。'
      steps:
        - '把 YAML 粘贴到左侧字段。'
        - '右侧会显示以三个空格缩进的 JSON。'
        - '用复制按钮取用结果。'
      notes:
        - 'YAML 会隐含地判断类型：没加引号的 true、false 会变成布尔值，1.10 会变成数字 1.1，空值或 ~ 会变成 null。这个解析器遵循 YAML 1.2，所以 yes、no、on、off 维持字符串。如果某个值的类型不对，请在 YAML 中加上引号。'
        - '合并键（<<: *defaults）会被解析，锚点与别名会被展开，所以 JSON 中是合并、复制后的数据。'
        - '多文档文件（用 --- 分隔的区段）会被拒绝并显示错误，请一次转换一份文档。'
        - '注释会遗失，因为 JSON 没有注释。'
      faq:
        - q: '为什么版本号 1.10 变成了 1.1？'
          a: '没加引号的 1.10 在 YAML 中是浮点数，数字不会保留结尾的零。写成带引号的 "1.10" 才会维持字符串。'
        - q: '为什么输出是空的却没有错误？'
          a: 'YAML 解析出来是空值，例如整个文件只有注释。请确认文档至少有一个键或列表项目。'

  uuid-generator:
    title: UUIDs 生成器
    description: 通用唯一标识符（UUID）是一个128位数字，用于标识计算机系统中的信息。可能的UUID数量为16^32，即2^128或约3.4x10^38（这是一个很大的数字！）。
    guide:
      intro: 'UUID 是 128 比特的识别码，设计目的是让不同系统各自产生时几乎不可能重复，因此不需要中央发号机制。常用于数据库主键、交易追踪编号、文件命名等场景。'
      useCases:
        - '为数据表产生主键，特别是需要在写入数据库前就先决定 ID 的情况。'
        - '产生请求追踪编号，方便在分布式系统的日志中串起同一笔请求。'
        - '创建不会撞名的暂存盘名或上传文件识别码。'
      steps:
        - '在版本菜单选择需要的 UUID 版本，默认是 v4。'
        - '调整数量后即时产生，点拷贝取用。'
        - '按 Ctrl+Enter 可以重新产生一批。'
      notes:
        - 'v4 是完全随机，最常用，适合绝大多数情境。'
        - 'v1 内含时间戳与网络卡地址，可排序但会泄漏产生时间与机器信息。'
        - 'v7 同样内含时间戳但排在前面，所以字典序等同时间序，对数据库索引比 v4 友善，是近年推荐的选择。'
        - '产生过程使用浏览器的密码学乱数来源，不会连到服务器。'
      faq:
        - q: 'UUID 真的不会重复吗？'
          a: 'v4 有 122 比特的随机性。以实务角度，即使每秒产生十亿个，要碰到一次重复也需要数十年以上的量级，可以视为不会重复。'
        - q: '拿 UUID 当数据库主键会不会影响性能？'
          a: '会，特别是 v4。随机值会让 B-tree 索引频繁分裂，写入性能与索引大小都比递增整数差。如果在意这点，改用 v7，它的时间前缀让新数据集中在索引尾端。'

  ipv4-address-converter:
    title: Ipv4地址转换器
    description: 在ipv6中，将ip地址转换为十进制、二进制、十六进制或事件
    guide:
      intro: '显示一个 IPv4 地址的各种写法：单一十进制整数、十六进制、二进制，以及长格式与短格式的 IPv4 对应 IPv6 地址。'
      useCases:
        - '读懂数据库或日志中以整数保存的地址，或是把地址转成整数以便保存。'
        - '逐比特了解子网掩码或地址的组成。'
        - '替双协定（dual-stack）设置或防火墙规则写出 IPv4 地址的 IPv6 形式（::ffff:a.b.c.d）。'
      steps:
        - '以点分十进制输入地址，例如 192.168.1.1。'
        - '阅读十进制、十六进制、二进制与 IPv6 形式，每个都有复制按钮。'
        - '地址无效时会显示验证消息，结果字段为空。'
      notes:
        - '十进制形式是把四个字节当成一个 32 比特数字（a.b.c.d = a×16777216 + b×65536 + c×256 + d）。许多数据库用这种方式保存地址，因为整数排序与比较更快。'
        - '二进制形式有 32 位数；和子网掩码并排阅读，网络部分与主机部分一目了然。'
        - '::ffff:192.168.1.1 是 IPv4 对应 IPv6 地址，也是双协定服务器看到 IPv4 客户端时的形式。它是同一台主机，不是另一台。'
        - '输入中不接受前导零（192.168.001.001），因为有些系统会把它当成八进位。'
      faq:
        - q: '为什么浏览器接受 http://3232235777 这种地址？'
          a: '那是 192.168.1.1 的十进制形式。浏览器与许多任务具接受整数写法，这也是攻击者用它来伪装地址的原因。'
        - q: '可以反过来从数字转成地址吗？'
          a: '这个工具不行。地址运算请用 IPv4 范围或子网工具，或用进位转换工具把数字转成十六进制，再每两位读成一个字节。'

  text-statistics:
    title: 文本统计
    description: 获取有关文本、字符数、字数、大小等的信息
    guide:
      intro: '计算一段文本的字符数、单字数与行数，并显示它以 UTF-8 编码后的字节大小，随输入实时更新。'
      useCases:
        - '确认文本是否超过长度限制：推文、meta 描述、表单字段或数据库字段。'
        - '估算一段内容的保存空间或传输大小。'
        - '计算有字数限制的文章、摘要或答案的字数。'
      steps:
        - '粘贴或输入文本。'
        - '阅读字段上方的四个计数。'
        - '编辑文本，数字会跟着变。'
      notes:
        - '字符数是 UTF-16 码元的数量，也就是 JavaScript 的 length 回报的值。多数表情符号与部分罕见字符会算成 2，所以数字可能和某些平台显示的不同。'
        - '字节大小是 UTF-8 长度：ASCII 字母占 1 个字节，多数欧洲重音字母 2 个，中日韩文本 3 个，表情符号通常 4 个。所以以字节计的限制（数据库字段、某些 API）和以字符计的限制不一样。'
        - '单字是依空格切分计算的，适用于用空格分隔单字的语言。没有空格的中文、日文每一行只会算成一个单字。'
        - '行数依换行符号计算，所以在屏幕上自动折行的长段落仍然算一行。'
      faq:
        - q: '为什么我的表情符号算成两个字符？'
          a: '基本多文种平面以外的表情符号以两个 UTF-16 码元保存。有些平台算一个、有些算两个；这个工具遵循 JavaScript 的做法，算两个。'
        - q: '为什么字节大小比字符数大？'
          a: '任何非纯 ASCII 的字符在 UTF-8 中都占超过一个字节。含有重音、中日韩文本或表情符号的文本，字节数因此会大于字符数。'

  text-to-nato-alphabet:
    title: 文本转北约字母表
    description: 将文本转换为北约拼音字母以进行口头传播。
    guide:
      intro: '用 NATO 音标字母（Alpha、Bravo、Charlie……）逐字拼出文本，这是航空、无线电与客服中心使用的标准，避免口头传达时字母被听错。'
      useCases:
        - '在电话中念出订位代号、车牌、序号或密码。'
        - '准备无线电通信或客服通话的讲稿。'
        - '学习或核对音标字母。'
      steps:
        - '输入文本。'
        - '下方会显示拼读版本，每个字母对应一个单字。'
        - '复制它或照着念。'
      notes:
        - '只会转换 26 个拉丁字母，不分大小写。数字、标点与其他字符会原样保留，所以 7 还是 7、空格还是空格。'
        - '实务上数字会逐个念出（seven 而不是 seventy），航空用语还常用 tree、fife、niner 来避免混淆；这个工具不会改动数字。'
        - '带重音的字母（é、ü）不会转换；请用基本字母拼读并说明重音，或先把重音去掉。'
        - '这是 ICAO／NATO 字母表（Alfa、Juliett 是官方拼法，发音相同）。还有其他拼读字母表，例如 LAPD 或德国的版本，用的单字不同。'
      faq:
        - q: '为什么输出中的数字没有变？'
          a: 'NATO 字母表只覆盖字母。数字请照平常一个一个念；工具把它们留在原位，让整个串行仍然好读。'
        - q: '为什么是 Alpha 而不是 A for apple？'
          a: 'Alpha、Bravo 等单字是特别挑选过的，在各主要语言中和信号不佳时都能清楚区分。像 apple、ice 这类临时想到的词更容易被听错。'

  basic-auth-generator:
    title: 基本身份验证生成器
    description: 从用户名和密码生成 base64 基本身份验证标头。
    guide:
      intro: '从用户名与密码组出 HTTP Basic 验证的 Authorization 标头：两者以冒号相连后做 Base64 编码，得到 Authorization: Basic dXNlcjpwYXNz 这样的结果。'
      useCases:
        - '用 curl、Postman 或需要原始标头的脚本调用 API 或受保护的端点。'
        - '确认客户端使用 Basic 验证时送出的内容，例如调试 401 问题。'
        - '设置只接受预先组好标头的 webhook 或集成。'
      steps:
        - '输入用户名与密码。'
        - '阅读完整的标头字符串。'
        - '复制到您的请求中（curl 写法：-H "Authorization: Basic ..."）。'
      notes:
        - 'Base64 是编码，不是加密。看到标头的人都能读出密码，所以 Basic 验证只能在 HTTPS 上使用。'
        - '用户名不能含有冒号，因为冒号是它和密码之间的分隔符号。密码可以含冒号。'
        - '非 ASCII 字符会先以 UTF-8 编码再做 Base64，这是现代服务器预期的做法；少数旧系统预期 Latin-1，会拒绝这类密码。'
        - '计算在浏览器中完成，不会传到任何地方。即便如此，试用时仍建议用测试帐密。'
      faq:
        - q: '为什么服务器还是回 401？'
          a: '请确认标头有送达服务器（代理与某些框架会把它去掉）、该端点预期的是 Basic 而不是 Bearer 或 Digest，以及帐密正确。复制时夹带的空格或换行也是常见原因。'
        - q: '可以把标头解回帐密吗？'
          a: '可以：把 Basic 后面那段粘贴到 Base64 解码工具就行。这正是 Basic 验证只能走加密连接的原因。'

  text-to-unicode:
    title: 文本转 Unicode
    description: 解析文本并将其转换为 unicode，反之亦然
    guide:
      intro: '把文本转成 HTML 数字字符参照（Hi 变成 &#72;&#105;），也能转回来。这是在 HTML 或 XML 文档中只用 ASCII 写出任何字符的方法之一。'
      useCases:
        - '在必须维持纯 ASCII 的 HTML 文件或电子邮件模板中嵌入特殊字符、符号或非拉丁文本。'
        - '解读网页原代码或数据导出中出现的一串 &#...; 参照。'
        - '在网页中稍微屏蔽电子邮件地址，让简单的爬虫读不到。'
      steps:
        - '要编码时，在第一个字段输入文本，下方会显示 &#...; 串行。'
        - '要解码时，在第二个字段粘贴一串 &#...; 参照，就会显示文本。'
        - '复制结果。'
      notes:
        - '每个字符都会被编码，包括一般字母与空格，所以输出比输入长很多。浏览器显示的结果完全相同。'
        - '参照使用十进制码位（欧元符号是 &#8364;）。十六进制参照（&#x20AC;）在 HTML 中等价，但这里不会生成也不会解码。'
        - '基本多文种平面以外的字符，例如多数表情符号，会编码成两个代理对参照（例如 &#55357;&#56832;）。浏览器能正确显示，但那不是该字符的单一码位。'
        - '这不是加密也不是安全措施。任何人都能解码，多数爬虫也会。'
      faq:
        - q: '这和 Unicode 码位 U+XXXX 一样吗？'
          a: '相关但不完全相同：&# 后面的数字是 U+FFFF 以内字符的十进制码位。表情符号等补充字符在这个工具会输出两个代理对数字，而不是单一码位。'
        - q: '什么时候该用参照而不是直接输入字符？'
          a: '只有在文件无法以 UTF-8 保存，或会经过破坏非 ASCII 文本的系统时。UTF-8 文档中直接输入字符更简单也更好读。'

  ipv4-range-expander:
    title: IPv4范围扩展器
    description: 给定起始和结束IPv4地址，此工具使用其CIDR表示法计算有效的IPv4网络。
    guide:
      intro: '给定一段范围的起始与结束地址，找出能覆盖整段范围的最小 CIDR 块，并显示该块覆盖的地址数与您要求的范围相差多少。'
      useCases:
        - '把 10.0.4.17 到 10.0.6.200 这类范围转成防火墙、安全组或路由用的 CIDR。'
        - '确认对齐后的块比实际需要的范围多了多少地址。'
        - '把旧式的起始／结束白名单转成前缀表示法。'
      steps:
        - '输入起始地址与结束地址。'
        - '阅读结果表格：原始与扩展后的起始、结束地址、地址数量与 CIDR。'
        - '如果结束地址比起始地址小，用交换按钮对调两者。'
      notes:
        - 'CIDR 块必须对齐到 2 的次方，所以结果常常比范围大：起始会往下取整、结束会往上取整到块边界。把 CIDR 放进规则之前请先看「Addresses in range」那一列，因为多出来的地址也会被包含。'
        - '本身不是块的范围，无法在不多包含地址的情况下写成单一 CIDR。如果不能接受，请手动拆成多个块。'
        - '扩展的方式是逐比特比较两个地址并保留共同前缀，所以起始与结束在高比特就不同的范围，会扩展成非常大的块（甚至 /0）。'
        - '起始与结束地址会记在这个浏览器中，下次打开仍在。'
      faq:
        - q: '为什么我 1000 个地址的范围变成了有 1024 个的 /22？'
          a: '因为 1000 不是 2 的次方，而且范围没有对齐。能包含全部 1000 个地址的最小块就是 1024 个地址宽。'
        - q: '我想要精确的多个块，而不是一个放大的块，怎么做？'
          a: '在 2 的次方边界把范围切开：反复取从当前起始地址开始、对齐且能放进范围的最大块，再从下一个地址继续。'

  text-diff:
    title: 文本比较
    description: 比较两个文本并查看它们之间的差异。
    guide:
      intro: '并排比较两段文本，标示出不同的行与字符，使用的是和 Visual Studio Code 相同的差异编辑器。两边都可以编辑，所以可以边修文本边看差异消失。'
      useCases:
        - '找出配置文件、合约条款或代码两个版本之间的改动。'
        - '确认复制或重新输入的文本和原文完全一致。'
        - '把脚本的输出和预期结果对照检查。'
      steps:
        - '把原始文本粘贴在左侧，修改后的文本粘贴在右侧。'
        - '有改动的行会被标示；在同一行内，确切不同的字符也会标记出来。'
        - '可以直接编辑任一侧，比较结果会随输入更新。'
      notes:
        - '比较先以行为单位，再在有改动的行内以字符为单位。行的顺序调换会显示成一个删除加一个添加，而不是搬移。'
        - '空格的差异，例如 Tab 与空格、行尾多一个空格，都是真实差异，会被标示。如果这些是噪音，请先把两段文本范式。'
        - '换行符号不同（Windows 的 CRLF 与 Unix 的 LF）会让每一行都看起来有改动。比较前请先把两段文本转成相同的换行符号。'
        - '全部在浏览器中进行。大型文本也能用，但超过几 MB 后编辑器可能变慢。'
      faq:
        - q: '为什么每一行都显示有改动？'
          a: '通常是看不见的差异：换行符号、缩进（Tab 与空格）或行尾空格。看任一行被标示的字符就能知道是哪一种。'
        - q: '可以直接比较两个文件吗？'
          a: '请分别用文本编辑器打开文件，复制内容后贴到各一侧。这个工具不会直接读取文件。'

  otp-generator:
    title: OTP代码生成器
    description: 为多因素身份验证生成和验证基于时间的OTP（一次性密码）。
    guide:
      intro: '生成并检查以时间为基础的一次性密码（TOTP，RFC 6238），也就是身份验证器 App 在两步验证登录时显示的 6 位数代码。它会显示当前的代码，连同前一个与下一个，并提供可转成 QR Code 的密钥 URI。'
      useCases:
        - '测试正在开发的两步验证登录，把服务器生成的代码和参考实现比较。'
        - '开发时生成密钥与配置用的 URI，加入身份验证器 App。'
        - '找出代码被拒绝的原因，例如服务器与手机的时钟有误差。'
      steps:
        - '使用自动生成的密钥，或粘贴您自己的 Base32 密钥。'
        - '查看当前的 6 位数代码；每 30 秒会更换一次，旁边也会显示前一个与下一个代码。'
        - '要在 App 中登录时，使用密钥 URI（otpauth://）或它的 QR Code，再把 App 显示的代码和这里的比较。'
      notes:
        - '密钥是 Base32 编码（英文字母 A 到 Z 和数字 2 到 7）。不在这个范围内的字符，例如 0、1、8、9，在密钥中是无效的。'
        - '代码使用 HMAC-SHA1、6 位数与 30 秒间隔，也就是几乎所有身份验证器 App 的默认值。8 位数或 SHA-256 等不同设置不在这个工具的范围内。'
        - '代码是依当前时间推导的，所以服务器与设备的时钟都必须准确。服务器通常也会接受前一个与下一个代码，这就是这里一并显示它们的原因。'
        - '知道密钥的人可以永远生成有效的代码。请把它当成密码，并且只使用测试用的密钥。'
      faq:
        - q: '为什么我的代码和手机 App 不一样？'
          a: '可能是密钥不同、App 使用其他设置（位数、算法或周期），或是时钟相差超过约 30 秒。请先检查手机的时间，并确认已打开自动设置时间。'
        - q: 'TOTP 和 HOTP 有什么差别？'
          a: 'HOTP 使用每次使用后递增的计数器，TOTP 则使用当前时间除以 30 秒所得的步数。身份验证器 App 用的是 TOTP，这个工具也是围绕它设计的。'

  url-encoder:
    title: 编码/解码url格式的字符串
    description: 编码为url编码格式（也称为“百分比编码”）或从中解码。
    guide:
      intro: '网址只能包含有限的字符，其他字符（例如空白、中文或保留符号）必须改写成百分比编码，也就是 % 加上两位十六进制数字。这个工具会做这样的编码与解码，规则和 JavaScript 的 encodeURIComponent 相同。'
      useCases:
        - '组出含有空白、&、= 或中文的查询参数值。'
        - '把日志或网址列中一长串 %E4%B8%AD%E6%96%87 之类的内容解码，看懂原文。'
        - '准备放在另一个网址里的重定向目标或回调网址（callback URL）。'
      steps:
        - '在编码字段输入或粘贴文本，获取百分比编码的结果。'
        - '在解码字段粘贴已编码的字符串，获取原始文本。'
        - '用复制按钮取用结果。'
      notes:
        - '编码时除了英文字母、数字和 - _ . ! ~ * '' ( ) 之外的字符都会被转换，包括 / ? & = : #。所以不要对整个网址编码，只编码要放进网址的那个值，否则网址会失效。'
        - '空白会变成 %20，而不是 +。只有 HTML 表单送出时 + 才代表空白，所以解码表单格式的字符串时 + 会原样保留。'
        - '非 ASCII 字符会先转成 UTF-8 字节，所以一个汉字会变成三组 %XX。'
        - '遇到 % 后面不是两位十六进制数字，或字节不是合法的 UTF-8 时，解码会失败。'
      faq:
        - q: '要编码整个网址，还是只编码参数值？'
          a: '只编码参数值（必要时含参数名称）。对整个网址编码会连 :// 和 / 分隔符号一起转掉，得到的字符串就不再是可用的网址。'
        - q: '为什么加号没有被解回空白？'
          a: '百分比解码不会特别处理 +。如果文本来自表单送出（application/x-www-form-urlencoded），请先把 + 换成空白再解码。'

  text-to-binary:
    title: 文本到 ASCII 二进制
    description: 将文本转换为其 ASCII 二进制表示形式，反之亦然。
    guide:
      intro: '把文本写成二进制，每个字符 8 个比特，也能把这种二进制转回文本。每个字符会变成它的 ASCII 码的二进制表示，补足 8 位数并以空格分隔。'
      useCases:
        - '教学或学习字符是如何以比特保存的。'
        - '解开谜题、CTF 挑战或地理藏宝线索中看起来像二进制的字符串。'
        - '替设计、T 恤或展示制作二进制表示。'
      steps:
        - '在第一个字段输入文本，就会得到二进制形式。'
        - '在第二个字段粘贴每组 8 个 0 与 1，就会得到文本；空格与其他分隔符号会被忽略。'
        - '复制结果。'
      notes:
        - '每个字符以它的 UTF-16 码元编成 8 比特，对 ASCII（0 到 127）与 Latin-1（最多 255）是精确的。超过 255 的字符，包括中文与多数表情符号，放不进 8 比特，编码会不正确，请只使用 ASCII。'
        - '解码时会先去掉所有非 0、1 的字符，然后要求位数是 8 的倍数，否则会回报二进制字符串无效。'
        - '大写字母和它的小写形式只差一个比特（代表 32 的那一位）：A 是 01000001，a 是 01100001。'
        - '这只是一种表示法，不是压缩也不是加密，会让文本长度变成 8 倍。'
      faq:
        - q: '为什么解码出来的文本不对？'
          a: '可能是输入没有以 8 比特为一组（谜题中常见 7 比特一组，请在每组前面补一个 0），或是原文含有非 ASCII 字符，无法在 8 比特编码中保留。'
        - q: '电脑真的是这样保存文本的吗？'
          a: '对 ASCII 来说是的，一个字符一个字节。现代系统使用 UTF-8，ASCII 以外的字符占 2 到 4 个字节；这个工具只呈现最简单的单字节情况。'

  ascii-text-drawer:
    title: ASCII 艺术字生成器
    description: 使用多种字体和样式生成 ASCII 艺术字。
    guide:
      intro: '用 FIGlet 字体把文本画成大型的 ASCII 艺术字，有近 300 种样式可选，并可调整每行宽度。适合用在终端的欢迎横幅、README 标题与代码注释。'
      useCases:
        - '替命令行工具的启动画面或 shell 脚本加上横幅。'
        - '替 README、纯文本电子邮件或注释块制作装饰性标题。'
        - '替终端风格的网站制作复古文本。'
      steps:
        - '输入文本，再从列表挑选字体；Standard、Big、Slant、Shadow 是常用的选择。'
        - '如果长文本需要提早或延后换行，调整宽度。'
        - '把结果复制到文件或终端。'
      notes:
        - 'ASCII 艺术字必须用等宽字体显示。在比例字体（多数聊天软件与文字处理器）中字母会散掉，所以请贴到终端、代码块或 <pre> 元素中。'
        - '多数 FIGlet 字体只覆盖 ASCII 字母、数字与标点。带重音或非拉丁字符通常会留空，或画成最接近的 ASCII 形式。'
        - '字体会在第一次选用时从 unpkg CDN 下载，所以每种字体第一次绘制需要网络连接。您输入的文本不会传到任何地方。'
        - '多行输出很宽：大字体下一个短单字就可能超过 80 栏。要放进窄的终端，请降低宽度或改用小字体（Small、Mini、Thin）。'
      faq:
        - q: '为什么贴过去之后看起来是坏的？'
          a: '目的地没有使用等宽字体，或是把连续空格合并了。请用代码块（Markdown 的三个反引号）、<pre> 标签或终端。'
        - q: '哪个字体像经典的 Linux 登录横幅？'
          a: 'Standard 是许多横幅使用的 FIGlet 默认字体；Slant、Big 与 Doom 也是广为人知的样式。'

  email-normalizer:
    title: Email 规范化
    description: 将电子邮件地址规范化为标准格式以便比较，适用于去重和数据清理。
    guide:
      intro: '把电子邮件地址改写成供应商实际投递的标准形式：转成小写、在供应商忽略的情况下移除点与 +标签（Gmail）、在支持的供应商移除 +标签（Outlook、Hotmail、Live），并把 googlemail.com 这类别名网域对应到 gmail.com。可一次粘贴多个地址，一行一个。'
      useCases:
        - '找出用 john.doe+promo{''@''}gmail.com 与 johndoe{''@''}gmail.com 指向同一个信箱的重复注册。'
        - '在去重复或合并记录之前清理邮件列表或 CRM 导出数据。'
        - '比较在不同系统中以不同写法保存同一地址的用户账号。'
      steps:
        - '粘贴地址，一行一个。'
        - '右侧会显示范式后的列表；不是有效地址的行会被标示。'
        - '复制结果。'
      notes:
        - '规则因供应商而异：Gmail 忽略本地部分的点与 + 之后的内容，Outlook、Hotmail 与 Live 忽略 +标签但不忽略点，多数其他供应商则把点与 + 视为有意义，所以只会统一大小写。'
        - '范式是为了比较与去重复。寄信与显示请保留用户实际输入的地址，因为有些供应商只投递到完全一致的形式。'
        - '把本地部分转小写在标准上并不保证安全，但所有主要供应商都不分大小写，实务上没有问题。'
        - '架在 Google Workspace 或 Microsoft 365 上的自定义网域不会被视为 Gmail 或 Outlook，因为光看网域无法得知供应商。'
      faq:
        - q: '为什么 a.b+c{''@''}yahoo.com 没有改变？'
          a: 'Yahoo 把点视为有意义，抛弃式地址用的是另一种方式（连字号），所以只统一了大小写。只有规则已知的供应商会被改写。'
        - q: '可以用范式后的地址寄信吗？'
          a: '对列出的供应商通常寄得到，但安全的做法是两种都存：范式形式用于比较，原始形式用于通信。'

  json-to-xml:
    title: JSON 转 XML
    description: 将 JSON 转换为 XML
    guide:
      intro: '依 xml-js 库的 compact 惯例把 JSON 转成 XML：_attributes 对象变成元素属性，_text 变成文本内容，数组变成重复的元素。它是「XML 转 JSON」工具的反向操作。'
      useCases:
        - '用保存为 JSON 的数据组出 SOAP 或旧式 API 的 XML 请求内容。'
        - '把先前转成 JSON 编辑过的数据再转回 XML。'
        - '从脚本输出的 JSON 生成 XML 设置或 sitemap 片段。'
      steps:
        - '把 JSON（接受 JSON5 语法）粘贴到左侧字段。'
        - '右侧会显示 XML。'
        - '复制结果。'
      notes:
        - '一般的键会变成元素，一般的值会变成文本：{''{''}"a":"hi"{''}''} 会得到 <a>hi</a>。要得到 <a id="1">hi</a>，请写成 {''{''}"a":{''{''}"_attributes":{''{''}"id":"1"{''}''},"_text":"hi"{''}''}{''}''}。'
        - 'XML 需要单一根元素，所以 JSON 对象最上层应该只有一个键。多个键会生成多个根元素，不是合法的文档。'
        - '键必须是合法的 XML 名称：不能以数字开头，也不能含空格。像 "1st" 或 "first name" 这样的键会生成不合法的 XML。'
        - '数字、布尔与 null 会写成文本；null 和空对象会变成空元素。输出是单行的，可以再丢进「XML 格式化」工具缩进。'
      faq:
        - q: '为什么输出没有 XML 声明？'
          a: '只有 JSON 中有 _declaration 键时才会写出，例如 {''{''}"_declaration":{''{''}"_attributes":{''{''}"version":"1.0","encoding":"utf-8"{''}''}{''}''},"root":{''{''}...{''}''}{''}''}。'
        - q: '怎么替元素设置属性？'
          a: '把元素的值写成对象，用 _attributes 键放属性，需要文本内容的话再加 _text 键。'

  markdown-to-html:
    title: Markdown 转 HTML
    description: 将 Markdown 转换为 HTML，并支持打印（保存为 PDF）
    guide:
      intro: '用 markdown-it 解析器（CommonMark 加上表格与删除线）把 Markdown 转成 HTML，显示渲染结果，并可送到打印对话框存成 PDF。'
      useCases:
        - '获取 README 或笔记的 HTML，粘贴到 CMS、电子邮件或网页。'
        - '不安装任何东西就把 Markdown 文档打印或存成 PDF。'
        - '发布之前先确认一段 Markdown 的渲染效果。'
      steps:
        - '在左侧字段粘贴或输入 Markdown。'
        - '右侧会显示生成的 HTML 与渲染预览。'
        - '复制 HTML，或按打印按钮打开打印对话框，选择「另存为 PDF」。'
      notes:
        - 'Markdown 中的原始 HTML 不会被透传，会以文本显示。请改用 Markdown 语法做格式。'
        - '基本 CommonMark 之外还支持表格与删除线（~~文本~~），这是 markdown-it 默认打开的功能；待办列表、注脚与数学公式则不支持。'
        - '输出是片段（没有 <html>、<head>、<body>），可直接插入既有的页面或模板。'
        - '打印使用浏览器的打印对话框，纸张大小、边界与页眉页脚都在那里设置。目的地请选「另存为 PDF」。'
      faq:
        - q: '为什么我写的行内 HTML 显示成文本？'
          a: '为了安全起见禁用了 HTML 透传，标签会被转义并原样显示。请用 Markdown 表达格式，或在转换后再加入 HTML。'
        - q: '可以替 PDF 加样式吗？'
          a: '只能通过浏览器的打印选项（纸张大小、边界、缩放）。需要自定义字体或颜色时，请把 HTML 粘贴到有样式表的自有页面再从那里打印。'

  regex-memo:
    title: 正则表达式速查表
    description: JavaScript 正则表达式速查表
    guide:
      intro: 'JavaScript 正则表达式的精简参考：字符类别、锚点、量词、组与反向参照、环视、标志与跳脱串行，并说明每个符号的意义。'
      useCases:
        - '写规则时回想后向环视、命名分组或懒惰量词的确切语法。'
        - '查看有哪些标志，以及 u、s、y 标志的作用。'
        - '用一页式的总览教正则表达式。'
      steps:
        - '找到您需要的语法所在的区段。'
        - '阅读符号与意义，再到「正则表达式测试」工具试试。'
        - '用浏览器的搜索（Ctrl+F）找特定符号。'
      notes:
        - '这份速查表描述的是 JavaScript 版本。命名分组写成 (?<name>...)，\d、\w、\s 只比较 ASCII，除非使用 u 标志与 \p{''{''}L{''}''} 这类 Unicode 属性转义。'
        - '量词默认是贪婪的；加上 ?（例如 .*?）就变成懒惰。(a+)+ 这类嵌套量词在某些输入上会造成灾难性回溯。'
        - '后向环视（(?<=...) 与 (?<!...)）当前所有浏览器都支持，但 Safari 16.4 之前没有；请确认目标环境。'
        - '字符类别内多数元字符会失去特殊意义，所以 [.] 比较字面的点，而 - 与 ] 需要跳脱或小心放置。'
      faq:
        - q: '.* 和 .*? 有什么差别？'
          a: '.* 是贪婪的，先尽量多吃再回退；.*? 是懒惰的，尽量少吃。对 <b>a</b><b>b</b> 而言，<b>.*</b> 会比较整段，<b>.*?</b> 只比较第一组标签。'
        - q: '为什么 \d 比较不到阿拉伯-印度数字或其他数字？'
          a: 'JavaScript 的 \d 永远等于 [0-9]。要比较其他文本的数字请用 \p{''{''}Nd{''}''} 搭配 u 标志。'

  regex-tester:
    title: 正则表达式测试器
    description: 使用示例文本测试您的正则表达式。
    guide:
      intro: '用示例文本测试正则表达式，所有匹配的部分会被标示出来，并列出位置与捕获组。使用的是您浏览器内置的 JavaScript 正则表达式引擎。'
      useCases:
        - '在把规则粘贴到代码、验证规则或日志搜索语法之前，先反复调整测试。'
        - '通过每个匹配结果与捕获组，调试规则为什么匹配过多或过少。'
        - '边试边学正则表达式语法，立即看到结果。'
      steps:
        - '在规则字段输入表达式（不需要前后的斜线）。'
        - '勾选需要的标志：全局、忽略大小写、多行、dot-all、unicode 或 unicode sets。'
        - '输入或粘贴要比较的文本，下方会列出匹配的结果与群组。'
      notes:
        - '这是 JavaScript 版本的语法。命名分组写成 (?<name>...)，不是 Python 的 (?P<name>...)，也没有占有型量词、原子群组等功能。要把规则用在其他语言之前，请先确认差异。'
        - '没有打开全局标志时，只会返回第一个匹配结果。多行标志让 ^ 和 $ 对每一行生效，dot-all 则让 . 可以匹配换行字符。'
        - 'Unicode（u）与 unicode sets（v）是二选一；两者都勾选时会使用 u。规则含有表情符号或 \p{''{''}...{''}''} 属性转义时，请打开其中一个。'
        - '规则不合法时只会显示没有结果。像 (a+)+ 这种嵌套量词，在某些输入上会花费指数时间，可能让标签页卡死。'
      faq:
        - q: '为什么规则在这里可以，换成其他语言却不行？'
          a: '各语言的正则表达式引擎不同。后行断言、命名分组、标志与 Unicode 处理方式在 JavaScript、Python、PCRE、Java 之间都有差异，请用程序实际运行的引擎测试。'
        - q: '为什么只看到一个匹配结果？'
          a: '全局（g）标志没有打开。打开它就会找出所有匹配的结果，而不是找到第一个就停止。'

  safelink-decoder:
    title: Outlook Safelink 解码器
    description: 解码 Outlook SafeLink 链接
    guide:
      intro: '从 Microsoft Outlook 的 Safe Links 网址还原原始网址，也就是 Microsoft 365 把邮件中链接换成的那种 https://...safelinks.protection.outlook.com/?url=... 长链接。'
      useCases:
        - '在打开之前，先看看转寄或引用邮件中的链接实际指向哪里。'
        - '把想保存、分享或粘贴到文档的网址中的 Safe Links 包装去掉。'
        - '不点击就检查可疑链接。'
      steps:
        - '粘贴 Safe Links 网址。'
        - '下方会显示解码后的目的地。'
        - '复制它。'
      notes:
        - 'Safe Links 会改写链接，让 Microsoft 能在点击时扫描目的地。原始网址以 URL 编码放在 url 参数中；这个工具只是把它取出并解码。'
        - '只接受 safelinks.protection.outlook.com 主机上的网址。其他链接包装服务（Proofpoint urldefense、Mimecast、Google）使用不同格式。'
        - '解码等于绕过 Microsoft 的点击时检查。造访前请仔细看解码后的网址，特别是登录页面或预期之外的网域。'
        - '解码在浏览器中进行；不会造访链接，也不会发送到任何地方。'
      faq:
        - q: '为什么我的邮件里会有这些长链接？'
          a: '您的组织在 Microsoft Defender for Office 365 激活了 Safe Links。它改写链接，让已知的恶意目的地即使在邮件送达后也能被封锁。'
        - q: '解码后的网址看起来又是另一个跟踪链接，可以再解吗？'
          a: '行销链接常串接多层重定向。把结果粘贴到网址解析工具查看参数；最终目的地可能只有实际跟随重定向才知道。'

  xml-to-json:
    title: XML 转 JSON
    description: 将 XML 转换为 JSON
    guide:
      intro: '以 xml-js 库的 compact 惯例把 XML 文档转成 JSON：属性放在 _attributes 底下，文本内容放在 _text，重复的元素会变成数组。全部在浏览器中运行。'
      useCases:
        - '在脚本或浏览器工具中，把 SOAP 响应、RSS 订阅或配置文件当成 JSON 读取。'
        - '探索一份不熟悉的 XML 文档的结构。'
        - '把 XML 数据准备给只接受 JSON 的 API 或 NoSQL 数据库。'
      steps:
        - '把 XML 粘贴到左侧字段。不合法的 XML 会显示错误。'
        - '右侧会显示 JSON。'
        - '复制结果。'
      notes:
        - '属性会集中在 _attributes 对象，元素文本放在 _text，所以 <a id="1">hi</a> 会变成 {''{''}"a":{''{''}"_attributes":{''{''}"id":"1"{''}''},"_text":"hi"{''}''}{''}''}。'
        - '只出现一次的元素会变成对象，同一个元素出现两次就会变成数组。读取结果的程序必须处理这两种形状，或先把它们统一。'
        - '所有的值都是字符串。XML 没有类型，所以 42 和 true 会维持 "42" 与 "true"。'
        - 'XML 声明、注释、CDATA 与处理指令会保留在 _declaration、_comment、_cdata 等键底下。命名空间会留在元素名称里（ns:item）。'
      faq:
        - q: '为什么同一个元素有时是对象、有时是数组？'
          a: '转换器无法知道哪些元素是设计成会重复的。出现一次是对象，两次以上是数组。在程序中用类似 [].concat(value) 的方式统一即可。'
        - q: '为什么我的数字变成字符串？'
          a: 'XML 不带类型信息，所以每个值都是文本。请在读取端再转成数字或布尔值。'

  certificate-parser:
    title: X.509 证书解析
    description: 解析 PEM 或 DER 证书（或整条证书链），显示主体、签发者、有效期与剩余天数、SAN、密钥类型、密钥用途、扩展字段与指纹。全部在浏览器中完成。
    guide:
      intro: '解析 X.509 证书或整条证书链，列出主体（subject）、颁发者、有效期间与剩余天数、主体别名、公钥类型、密钥用途、扩展字段，以及 SHA-1 和 SHA-256 指纹。解析在浏览器中进行。'
      useCases:
        - '查出 TLS 证书何时到期，以及它实际覆盖哪些域名（SAN）。'
        - '比较指纹，确认服务器出示的证书就是您刚签发的那一张。'
        - '查看 PEM 合并文件里的证书链，看哪一张是叶证书、哪一张是中间证书，以及各由谁签发。'
      steps:
        - '粘贴 PEM 块（-----BEGIN CERTIFICATE-----）或纯 base64 的 DER 证书。粘贴多张证书会被视为证书链。'
        - '查看每张证书的状态标签（有效、已过期或尚未生效）与剩余天数。'
        - '展开详细数据，查看名称、密钥信息、用途与指纹，并复制需要的内容。'
      notes:
        - '现代浏览器是用主体别名（SAN）比较主机名称，而不是通用名称（CN），所以证书因名称不符被拒绝时，请检查 SAN 清单。'
        - '这个工具只做解析，不会用受信任的根证书验证证书链、检查是否已撤销，也不会确认证书是否匹配某把私钥。'
        - '只会读取证书。粘贴的内容里如果有私钥会被忽略，也请不要把私钥粘贴到任何网页工具。'
        - '有效期间是依您设备的时钟判断的，系统日期不对的话，状态标签和剩余天数也会跟着改变。'
      faq:
        - q: '怎么获取网站的证书？'
          a: '在浏览器中，从地址栏的锁形图标打开证书详细数据，导出成 PEM。在命令行可以用 openssl s_client -connect example.com:443 -showcerts，它会以 PEM 格式打印出证书链。'
        - q: '指纹是做什么用的？'
          a: '指纹是整张证书的哈希值。拿它和对方公布的值比较，就能确认看到的是完全相同的证书，证书固定（certificate pinning）和许多手动信任检查都是这个原理。'

  jwt-signer:
    title: JWT 签名与验证
    description: 由 header 与 payload 生成已签名的 JSON Web Token，或验证 token 的签名，支持 HS256/384/512、RS256/384/512、PS256/384/512 与 ES256/384/512。密钥不会离开浏览器。
    guide:
      intro: '依照您撰写的标头与内容生成签署过的 JSON Web Token，也能验证既有令牌的签名。支持 HMAC（HS256/384/512）、RSA（RS 与 PS）和 ECDSA（ES256/384/512），使用浏览器内置的 Web Crypto，密钥不会离开这个页面。'
      useCases:
        - '不写脚本，直接生成匹配 API 需求（声明、到期时间、算法）的测试令牌。'
        - '调试 401 或签名无效的错误时，确认某个令牌的签名是否匹配特定的密钥或公钥。'
        - '在把算法接进服务之前，先试试 HS256、RS256、ES256 的差异。'
      steps:
        - '选择算法，再编辑标头与内容的 JSON。alg 字段会自动设置，typ 默认为 JWT。'
        - 'HS 系列请输入共享密钥（可选 UTF-8 文本或 base64url）。RS、PS、ES 系列请粘贴私钥，或按按钮生成一组密钥。'
        - '复制签署后的令牌。要验证时，在验证区粘贴令牌与密钥或公钥，看结果。'
      notes:
        - '私钥必须是 PKCS#8 格式的 PEM，开头为 -----BEGIN PRIVATE KEY-----。以 BEGIN RSA PRIVATE KEY 或 BEGIN EC PRIVATE KEY 开头的密钥不被接受，请先转换：openssl pkcs8 -topk8 -nocrypt -in key.pem。'
        - '曲线要和算法对应：ES256 用 P-256，ES384 用 P-384，ES512 用 P-521（不是 P-512）。密钥不符时会有明确的错误信息。'
        - '验证只检查签名，不会检查 exp、nbf、aud、iss，所以已过期的令牌也可能显示为有效。声明请用 JWT 解析工具检查。'
        - '验证时可以贴公钥（-----BEGIN PUBLIC KEY-----）；贴 PKCS#8 私钥也可以，因为会从中推导出公钥。'
        - '请只使用测试用的密钥，不要把正式环境的私钥或密钥粘贴到任何网页，即使它在本地运行也一样。'
      faq:
        - q: 'HS256 和 RS256 有什么差别？'
          a: 'HS256 用同一组共享密钥签署与验证，所以能验证的人也能伪造令牌。RS256 用私钥签署、公钥验证，因此可以公开验证的能力，而不必公开签署的能力。'
        - q: '为什么验证显示签名无效？'
          a: '最常见的原因是密钥不同、密钥的编码选错（UTF-8 文本与 base64url）、令牌标头指定的算法和您预期的不同，或是令牌在签署后被修改过。'

  chinese-converter:
    title: 繁简中文转换
    description: 使用 OpenCC 在简体中文与繁体中文（台湾、香港，可选择台湾惯用词，例如「软件」→「軟體」）之间转换文本，全部在浏览器中完成。
    guide:
      intro: '使用开源的 OpenCC 字典在简体与繁体中文之间转换。除了逐字转换之外，也能应用台湾、香港的用字，并可选择一并转换台湾的惯用词汇，例如「软件」变成「軟體」。'
      useCases:
        - '把简体中文的文档、字幕文件或 README 转成繁体，给台湾或香港的读者。'
        - '本地化产品文案，让用字和日常用语（軟體、記憶體、影片）都读起来自然。'
        - '把繁体文本转成简体，提供给中国大陆的读者，或用来比较简体数据。'
      steps:
        - '在「From」选择来源变体，在「To」选择目标变体；交换按钮可以对调两者。'
        - '只转换字形请选「台湾」；连用语一起转换请选「台湾，含惯用词」。'
        - '粘贴文本，复制转换后的结果。'
      notes:
        - '只做字形转换无法得到自然的繁体中文，因为两地对同一件事用不同的词，例如「内存」与「記憶體」、「软件」与「軟體」。要给台湾读者看的文本，请使用「台湾，含惯用词」。'
        - '有些简体字对应到多个繁体字（「发」可能是「發」或「髮」，「后」可能是「后」或「後」）。OpenCC 多半能依前后文判断，但专有名词和不常见的词组仍可能转错，请务必校对。'
        - '转换不等于翻译。语法、标点风格和人名的地区写法差异都不会被改动。'
        - '您上次选择的转换方向会记在这个浏览器中，文本内容不会上传。'
      faq:
        - q: '繁体的几个选项有什么差别？'
          a: '「台湾」把字形转成台湾标准用字；「台湾，含惯用词」另外会替换地区性词汇；「香港」使用香港字形；「OpenCC 标准」则是不含地区差异的中性字形。'
        - q: '为什么有个词转错了？'
          a: '转换是以字典为基础，所以罕见的人名、引文和有歧义的字可能对应错误。请手动修正，或把文本拆开，让有歧义的词有更多上下文。'
