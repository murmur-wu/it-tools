  regex-tester:
    title: 正则表达式测试器
    description: 使用示例文本测试您的正则表达式。
    guide:
      intro: '用示例文本测试正则表达式，所有匹配的部分会被标示出来，并列出位置与捕获组。使用的是您浏览器内置的 JavaScript 正则表达式引擎。'
      useCases:
        - '在把规则粘贴到代码、验证规则或日志搜索语法之前，先反复调整测试。'
        - '通过每个匹配结果与捕获组，调试规则为什么匹配过多或过少。'
        - '边试边学正则表达式语法，立即看到结果。'
      steps:
        - '在规则字段输入表达式（不需要前后的斜线）。'
        - '勾选需要的标志：全局、忽略大小写、多行、dot-all、unicode 或 unicode sets。'
        - '输入或粘贴要比较的文本，下方会列出匹配的结果与群组。'
      notes:
        - '这是 JavaScript 版本的语法。命名分组写成 (?<name>...)，不是 Python 的 (?P<name>...)，也没有占有型量词、原子群组等功能。要把规则用在其他语言之前，请先确认差异。'
        - '没有打开全局标志时，只会返回第一个匹配结果。多行标志让 ^ 和 $ 对每一行生效，dot-all 则让 . 可以匹配换行字符。'
        - 'Unicode（u）与 unicode sets（v）是二选一；两者都勾选时会使用 u。规则含有表情符号或 \p{''{''}...{''}''} 属性转义时，请打开其中一个。'
        - '规则不合法时只会显示没有结果。像 (a+)+ 这种嵌套量词，在某些输入上会花费指数时间，可能让标签页卡死。'
      faq:
        - q: '为什么规则在这里可以，换成其他语言却不行？'
          a: '各语言的正则表达式引擎不同。后行断言、命名分组、标志与 Unicode 处理方式在 JavaScript、Python、PCRE、Java 之间都有差异，请用程序实际运行的引擎测试。'
        - q: '为什么只看到一个匹配结果？'
          a: '全局（g）标志没有打开。打开它就会找出所有匹配的结果，而不是找到第一个就停止。'

