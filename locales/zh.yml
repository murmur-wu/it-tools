  crontab-generator:
    title: Crontab 表达式生成
    description: 验证并生成crontab，并获取cron调度的可读描述。
    verbose: '详细说明'
    use24Hour: '使用 24 小时制'
    daysStartAtZero: '星期从 0 开始'
    invalid: '这个 cron 表达式无效'
    nextRuns: '接下来的执行时间'
    timezone: '时区'
    runAt: '执行时间（{timezone}）'
    rebootHint: '这个表达式只在系统启动时执行一次，没有计划可以预览。'
    noNextRuns: '输入有效的 cron 表达式即可预览接下来的执行时间。'
    builder:
      title: '生成表达式'
      frequency: '频率'
      everyMinutes: '每几分钟'
      minute: '分'
      hour: '时'
      dayOfWeek: '星期'
      dayOfMonth: '日'
      month: '月份'
      apply: '套用这个表达式'
      frequencies:
        minutely: '每几分钟'
        hourly: '每小时'
        daily: '每天'
        weekly: '每周'
        monthly: '每月'
        yearly: '每年'
      weekDays:
        0: '星期日'
        1: '星期一'
        2: '星期二'
        3: '星期三'
        4: '星期四'
        5: '星期五'
        6: '星期六'
      months:
        1: '一月'
        2: '二月'
        3: '三月'
        4: '四月'
        5: '五月'
        6: '六月'
        7: '七月'
        8: '八月'
        9: '九月'
        10: '十月'
        11: '十一月'
        12: '十二月'
    guide:
      intro: 'Cron 是 Unix 与 Linux 上的调度格式，用五个（或六个）字段描述「什么时候要运行」。这个工具帮你验证表达式、翻成易读的说明，并列出接下来几次实际的运行时间，让你在写进 crontab 之前就先确认调度是对的。'
      useCases:
        - '设置服务器的定期备份、日志轮替或数据同步，写完想先确认调度真的如预期。'
        - '看到同事或旧项目留下的 cron 表达式，想知道它到底多久跑一次。'
        - '设置 GitHub Actions、Kubernetes CronJob 或 Cloudflare Workers 的调度，这些平台都用同一套语法。'
      steps:
        - '在上方输入框填入 cron 表达式，或用下方的「组出表达式」用菜单组出来再套用。'
        - '看中间那行易读说明，确认语意与你想的一致。'
        - '在「接下来的运行时间」选择时区，核对列出的五次时间点。'
      notes:
        - '五栏格式是「分 时 日 月 星期」，六栏则在最前面多一个「秒」。多数服务器的 crontab 只支持五栏，秒字段常见于应用层的调度器。'
        - '星期日可以写 0 或 7，两者等价。「星期从 0 开始」的开关只影响易读说明的文本，不影响表达式本身。'
        - '时区很重要。服务器的 crontab 通常跑在系统时区（常是 UTC），而不是你所在的时区，所以务必用时区菜单核对。'
        - "{'@'}reboot 只在系统启动时运行一次，没有固定调度，因此不会列出运行时间。"
      faq:
        - q: '每 15 分钟运行一次要怎么写？'
          a: '写成 */15 * * * *。斜线代表间隔，所以会在每小时的 0、15、30、45 分运行。'
        - q: '为什么我的调度在服务器上跑的时间跟这里显示的不一样？'
          a: '几乎都是时区问题。用 date 指令确认服务器时区，再把上面的时区菜单切到同一个时区重新核对。另一个常见原因是 crontab 的 PATH 与登录 shell 不同，导致指令找不到而没有实际运行。'

