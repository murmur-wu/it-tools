  rsa-key-pair-generator:
    title: RSA密钥对生成器
    description: 生成新的随机RSA私钥和公钥pem证书。
    guide:
      intro: '生成一组全新的随机 RSA 私钥与公钥，并以 PEM 文本显示。生成过程在浏览器中以后台工作线程完成，页面不会卡住，密钥也不会传到任何地方。'
      useCases:
        - '创建一组用完即丢的密钥，测试签名、加密、SSH 或 JWT 的程序。'
        - '替本地开发环境或教学示例生成密钥。'
        - '尝试不同的密钥长度，看生成需要多久。'
      steps:
        - '设置比特数（默认 2048，范围 256 到 16384，以 8 为间隔）。'
        - '等待密钥生成；长度越大，花的时间越明显越长。'
        - '复制公钥和私钥，或按按钮重新生成一组。'
      notes:
        - '至少使用 2048 比特；长期使用的密钥建议 3072 或 4096。低于 2048 比特的密钥被认为不安全，在这里只用于实验。'
        - '4096 比特以上的密钥可能要数秒到更久才能生成，时间不固定，因为是随机搜索素数。'
        - '私钥是传统格式（-----BEGIN RSA PRIVATE KEY-----，PKCS#1），公钥是 -----BEGIN PUBLIC KEY-----。有些库需要 PKCS#8（-----BEGIN PRIVATE KEY-----），可用以下命令转换：openssl pkcs8 -topk8 -nocrypt -in key.pem。'
        - '不要把在网页上生成的密钥用在正式系统或任何有价值的东西。那些密钥请在可信任的机器上用 openssl 或云平台的密钥管理服务生成。'
      faq:
        - q: '生成的密钥真的是随机的吗？'
          a: '是的。生成过程使用 node-forge 库与浏览器的安全随机数来源，每次按下去都会创建独立的密钥。但和所有网页工具一样，您无法审查正在使用的页面，所以正式环境的密钥仍应在其他地方生成。'
        - q: '为什么页面要一段时间才生成密钥？'
          a: '慢的部分是寻找两个很大的随机素数，而且耗时会随密钥长度快速增加。2048 比特的密钥通常几秒内就会出现。'

  html-wysiwyg-editor:
