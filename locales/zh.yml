      useCases:
        - '注册新帐号，密码打算存在密码管理器里而不是用背的。'
        - '需要一组真的打得出来、念得出来的密语，例如 Wi-Fi 密码或笔电登录。'
        - '替手机、卡片或门锁产生 PIN 码。'
        - '一次产生好几组，从中挑一个顺眼的。'
      steps:
        - '选类型：存进密码管理器的用随机密码，需要手打的用密语，数字锁用 PIN。'
        - '调整长度或单字数与字符类型，下方的强度面板会即时更新。'
        - '点结果旁的拷贝图标取用，或按 Ctrl+Enter 重新产生一批。'
      notes:
        - '长度比符号重要得多。16 个随机英数字比 8 个混杂各种符号的字符强。'
        - '从 2048 个单字的清单挑四个字组成的密语约有 44 比特的熵值，跟 8 个字符的完全随机密码差不多，但好打非常多。'
        - '破解时间的估算假设攻击者拿到哈希后脱机猜测，速度每秒一百亿次。有登录次数限制的网站慢得多；用弱算法哈希的外泄数据库大约就是这个速度。'
        - '产生的密码不要在多个帐号重复使用，一个网站外泄就会连带影响其他帐号。'
      faq:
        - q: '在网站上产生密码安全吗？'
          a: '在这里是安全的：产生过程完全在你的浏览器里用 Web Crypto API 完成，不会对任何服务器发出请求。你可以在产生时打开浏览器的网络面板自行确认。'
        - q: '为什么有些网站不接受产生出来的符号？'
          a: '有些服务只接受部分符号。把符号选项取消勾选，然后把长度多加几个字符，强度一样够。'

  token-generator:
    title: Token 生成器
    description: 使用您想要的字符、大写或小写字母、数字和/或符号生成随机字符串。

    uppercase: '大写 (ABC...)'
    lowercase: '小写 (abc...)'
    numbers: '数字 (123...)'
    symbols: '符号 (!-;...)'
    length: '长度'
    tokenPlaceholder: '令牌...'
    copied: 复制到剪贴板
    button:
      copy: 复制
      refresh: 刷新
    guide:
      intro: '依照您选择的字符集合生成一串随机字符串，适合用来当作 API 密钥、Session 密钥、测试数据或一次性标识符。随机数来源是浏览器内置的密码学安全随机数。'
      useCases:
        - '替应用程序配置文件生成 API 密钥、Webhook 密钥或 Session 密钥。'
        - '生成指定长度的随机字符串，当作测试数据或暂时的标识符。'
        - '系统不接受符号时，生成只含英文字母与数字的令牌。'
      steps:
        - '开关字符集合：大写、小写、数字、符号。'
        - '拖动滑块设置长度（1 到 512，默认 64）。'
        - '复制令牌，或按刷新（也可按 Ctrl+Enter）获取新的一组。'
      notes:
        - '随机数来自浏览器的 crypto.getRandomValues，并用拒绝采样避免偏差，每个字符出现的概率相同，不会用到 Math.random。'
        - '强度取决于长度与字符集合大小。64 个英文字母和数字约有 380 比特的熵，远超过多数系统需求；当作密钥的话 32 个字符就已经很够。'
        - '四种字符集合全部关闭时，结果会是空的。'
        - '设置会记在网址上，把网址加入书签，下次打开会是相同选项；生成出来的令牌本身不会写进网址。'
      faq:
        - q: '令牌会被发送到哪里吗？'
          a: '不会。它在您的浏览器中生成，不会上传也不会保存，请复制后存放在密码管理工具或密钥管理服务中。'
        - q: '可以拿来生成用户密码吗？'
          a: '需要人输入或记忆的密码，请改用「密码生成器」，它可以避开容易混淆的字符。这个工具适合系统之间使用的密钥。'
  percentage-calculator:
    title: 百分比计算器
    description: 轻松计算从一个值到另一个值的百分比，或从百分比到值的百分比。
    guide:
      intro: '回答三个日常的百分比问题：Y 的 X% 是多少、X 是 Y 的百分之几，以及从一个值变到另一个值的百分比变化。'
      useCases:
        - '算折扣、小费、营业税或佣金（80 的 15% 是多少）。'
        - '求占比或得分率（45 分满分 60 是百分之几）。'
        - '衡量两个数字之间的成长或衰退（从 120 到 150 是 +25%）。'
      steps:
        - '挑选匹配您问题的那一列，填入两个数字。'
        - '旁边会显示结果，随输入实时更新。'
        - '用复制按钮复制。'
      notes:
        - '百分比变化是相对于起始值计算：(to − from) ÷ from × 100。从 100 到 150 是 +50%，但从 150 回到 100 是 −33.3%，不是 −50%。'
        - '百分点的变化和百分比变化不同：从 10% 到 15% 是 +5 个百分点，但是 +50% 的变化。'
        - '结果只做有限的四舍五入，所以 33.33 这类循环小数会被截断显示。'
        - '三列都接受负数，但起始值为 0 时百分比变化没有定义。'
      faq:
        - q: '怎么把百分比加到价格上？'
          a: '用第一列算出价格的 X% 再加上去，或把价格乘以 (1 + X/100)。要从含税价反推未税价，请除以 (1 + 税率)，不要直接减掉百分比。'
        - q: '为什么先跌 20% 再涨 20% 回不到原点？'
          a: '因为每次变化都是相对于当下的值：100 → 80 → 96。百分比变化不会对称地互相抵销。'

  svg-placeholder-generator:
    title: SVG 占位符生成器
    description: 生成 svg 图像以用作应用程序中的占位符。
    guide:
      intro: '以 SVG 创建占位图：一个有颜色的矩形，中央写着尺寸（或您自定义的文本），可获取 SVG 原代码、Base64 data URL，或下载成文件。'
      useCases:
        - '在真实图片还没有之前，先填满布局或原型中的图片位置。'
        - '在网页应用程序中提供轻量的备用图或加载中图片。'
        - '替测试或文档截屏快速生成固定尺寸的图片。'
      steps:
        - '设置宽度与高度、背景与文本颜色、字体大小，可选择自定义文本。'
        - '选择 SVG 是否声明精确尺寸，或只保留 viewBox 让它随容器缩放。'
        - '复制 SVG 原代码或 Base64 data URL，或下载 .svg 文件。'
      notes:
        - 'SVG 占位图不论尺寸多大都只有几百个字节，和 PNG、JPEG 占位图不同，而且任何缩放等级都清晰。'
        - '打开「use exact size」时 SVG 会带 width 与 height 属性，以该尺寸显示；关闭时只保留 viewBox，图片会填满 <img> 或 CSS 给它的任何尺寸。'
        - 'Base64 data URL 可以直接粘贴到 <img src> 或 CSS 的 background-image，省掉一次额外请求。'
        - '文本使用浏览者的默认无衬线字体显示，所以外观在不同系统间会略有差异。'
      faq:
        - q: '为什么用 SVG 而不是占位图服务？'
          a: '不需要网络请求、不依赖第三方、脱机与测试环境都能用，文件也很小。只有需要逼真照片时，服务才比较好。'
        - q: '可以直接当 img 标签的 src 吗？'
          a: '可以，存成文件后引用，或把 data URL 直接粘贴到 src 都行。所有浏览器都支持。'

  csv-to-json:
    title: 'CSV 转 JSON'
    description: '把 CSV（或 TSV）解析成 JSON，可自动检测分隔符、转换类型，并提供表格预览。'
    input: '你的 CSV'
    inputPlaceholder: '把 CSV 粘贴在这里…'
    output: '转换后的 JSON'
    preview: '表格预览'
    previewTruncated: '显示前 {shown} 行，共 {total} 行。'
    delimiter: '分隔符'
    autoDetect: '自动检测'
    comma: '逗号（,）'
    semicolon: '分号（;）'
    tab: 'Tab'
    pipe: '竖线（|）'
    indent: '缩进空格数'
    hasHeader: '第一行是标题'
    inferTypes: '转换数字与布尔值'
    trimValues: '去除值前后空白'
    guide:
      intro: 'CSV 是试算表与数据库最通用的交换格式，JSON 则是 API 与程序最常用的格式。这个工具依 RFC 4180 解析 CSV，正确处理引号内的逗号与换行，并输出结构化的 JSON。'
      useCases:
        - '把 Excel 或 Google 试算表导出的数据喂给 API 或前端程序。'
        - '拿到一份 CSV，想先用表格预览确认字段对齐、有没有解析错位。'
        - '把数据库导出的 CSV 转成 JSON 当作测试数据或设置档。'
      steps:
        - '把 CSV 内容贴进输入框，分隔符号默认自动侦测。'
        - '在表格预览确认字段切得正确，特别注意含逗号的字段有没有被切开。'
        - '视需要调整「第一列是标题」「转换数字与布尔值」等选项。'
        - '从下方的 JSON 输出拷贝结果。'
      notes:
        - '含有逗号、换行或双引号的字段，在 CSV 里必须用双引号包住，内部的双引号要写成两个。工具会正确还原这类字段。'
        - '「转换数字与布尔值」刻意保守：像 007、1.0、超过安全整数范围的长数字都会保持字符串，避免静默失真。'
        - '如果自动侦测选错分隔符号，手动指定即可。分号常见于欧洲地区的 Excel 导出档。'
        - '所有解析都在你的浏览器里完成，数据不会上传。'
      faq:
        - q: '中文显示成乱码怎么办？'
          a: '那是文件编码问题，不是这个工具造成的。Excel 导出的 CSV 常是 Big5 或带 BOM 的 UTF-8。用文本编辑器另存成 UTF-8 之后再贴进来即可。'
        - q: '可以反过来把 JSON 转成 CSV 吗？'
          a: '可以，用「JSON 转 CSV」那个工具。两者的引号处理都遵循 RFC 4180，所以来回转换不会失真。'

  json-to-csv:
    title: JSON 转 CSV
    description: 使用自动标头检测将JSON转换为CSV。
    guide:
      intro: '把 JSON 对象数组转成 CSV。标题列由所有对象出现过的键并集而成，所以字段不一致的记录也会对齐到正确的栏。'
      useCases:
        - '在 Excel 或 Google 电子表格中打开 API 响应或数据库导出的数据。'
        - '把一份记录列表交给习惯用电子表格工作的同事。'
        - '把 JSON 日志或问卷结果转换后在 BI 工具中分析。'
      steps:
        - '粘贴 JSON 对象数组，例如 [{''{''}"name":"Ann","age":30{''}''},{''{''}"name":"Bob"{''}''}]。接受 JSON5 语法。'
        - '右侧会显示 CSV：第一行是标题，之后每个对象一行。'
        - '复制结果并存成 .csv 文件。'
      notes:
        - '标题是所有键的并集，依第一次出现的顺序排列。缺少的键会是空单元格；值为 null 会写成 null。'
        - '含有逗号或双引号的字段会加引号，内部的引号会写成两个，匹配 RFC 4180。值里的换行会写成 \n，让每笔记录维持一行。'
        - '嵌套对象与数组不会被摊平：会显示成 [object Object]，或是以逗号相连的项目。转换前请先把数据摊平（例如 address.city）。'
        - '输入必须是对象数组。单一对象或标量数组无法生成有用的表格。'
      faq:
        - q: '为什么某一栏显示 [object Object]？'
          a: '那个字段放的是嵌套对象。CSV 是平面的，请先把嵌套数据摊平成独立的键，例如 address_city，再转换。'
        - q: 'Excel 把所有内容塞在同一栏，怎么回事？'
          a: '某些语系的 Excel 预期分号作为分隔符号。请用「数据 > 从文本/CSV」导入并选逗号作为分隔符号，或改用 Google 电子表格打开。'

  camera-recorder:
    title: 摄像机记录器
    description: 从网络摄像头或照相机拍摄照片或录制视频。
    guide:
      intro: '直接在浏览器中用网络摄像头或手机镜头拍照与录制短片，并下载结果。可选择要使用的摄像头与麦克风；不会上传任何内容。'
      useCases:
        - '不开其他 App，快速拍下白板、文档或自己。'
        - '录一段简短的说明视频或留言，附加到工单或聊天中。'
        - '测试网络摄像头与麦克风是否正常，以及浏览器选到哪个设备。'
      steps:
        - '浏览器询问时允许访问摄像头与麦克风，再从列表选择设备。'
        - '按拍照按钮获取静态照片，或开始与停止录像获取视频。'
        - '下载拍到的照片或视频。'
      notes:
        - '视频以 WebM 格式录制，Chrome、Edge、Firefox 都能播放。需要 MP4 给其他播放器时，可用视频压缩工具转换。'
        - '访问摄像头需要安全连接（HTTPS）与您的授权；如果之前拒绝过，请到浏览器的网站设置重新打开，因为页面无法再次询问。'
        - '全部留在您的设备上。影像串流在本地截取与编码，文件只会存到您下载的位置。'
        - 'Safari 对 MediaRecorder 与 WebM 的支持有限，那里可能无法录像，但拍照仍可用。'
      faq:
        - q: '为什么摄像头列表是空的？'
          a: '浏览器要在授权之后才会列出设备，有些系统也会隐藏被其他 App 占用的摄像头。请先授权、关闭其他使用摄像头的 App，再重新加载。'
        - q: '为什么录像按钮显示不支持？'
          a: '该浏览器不支持用 MediaRecorder 录制 WebM，部分 Safari 版本就是如此。录像请改用 Chrome、Edge 或 Firefox。'

  keycode-info:
    title: Keycode 信息
    description: 查找任何按下的键的javascript键代码、代码、位置和修饰符。
    guide:
      intro: '按下任意键，看看 JavaScript 报告的内容：key 值、旧式的 keyCode 数字、实体的 code、位置（左右 Shift、数字键盘）以及按住了哪些修饰键。'
      useCases:
        - '找出在 keydown 处理函数或快速键库中应该比较的值。'
        - '调试为什么某个快速键在一种键盘配置可用、在另一种却不行。'
        - '确认特殊键（媒体键、Fn 组合键、死键）送到页面的是什么。'
      steps:
        - '点一下页面让它获取焦点，然后按一个键。'
        - '阅读各个值，每个字段都有复制按钮。'
        - '按住修饰键（Shift、Ctrl、Alt、Meta）可看到它们被报告。'
      notes:
        - 'key 是生成的字符或名称（a、A、Enter、ArrowLeft），会随键盘配置与修饰键改变；code 是实体位置（KeyA、Digit1、NumpadEnter），不会改变。游戏类的操作用 code，打字导向的快速键用 key。'
        - 'keyCode 已被淘汰，在不同浏览器与配置间不一致（许多键还是 0）。这里显示它只是为了旧代码；新代码请用 key 或 code。'
        - '有些键永远到不了页面：浏览器或操作系统会先处理（Cmd+Q、Alt+Tab、部分功能键、Print Screen）。'
        - 'macOS 上 Meta 键是 Cmd，Windows 上是 Windows 键。欧洲配置的右 Alt 会显示为 AltGraph。'
      faq:
        - q: '为什么 key 显示 Dead 或 Unidentified？'
          a: 'Dead 代表死键（例如 ´ 或 ^），正在等待与下一个字母组合。Unidentified 代表浏览器没有这个键的名称，部分笔电专用键或媒体键常见。'
        - q: '为什么 keyCode 是 0，或不同的键有相同的值？'
          a: 'keyCode 从来没有被标准化。浏览器对无法对应的键报告 0，有些键也共用同一个码。这正是 key 与 code 取代它的原因。'

  emoji-picker:
    title: Emoji 选择器
    description: 轻松复制和粘贴Emoji表情符号，并获得每个表情符号的unicode和code points值.
    guide:
      intro: '浏览与搜索约 1900 个表情符号，点一下就能复制，并查看它的 Unicode 码位，以及在 JavaScript、HTML 或 CSS 中需要的转义形式。'
      useCases:
        - '在没有内置选择器的桌机上找到并复制表情符号。'
        - '获取码位（U+1F600）或 JavaScript 跳脱串行，在原代码中使用表情符号。'
        - '查询表情符号的正式名称，用于文档或无障碍替代文本。'
      steps:
        - '在搜索框输入关键字（smile、cat、flag、heart），或依分类浏览。'
        - '点一下表情符号就会复制。'
        - '打开它的卡片可看到名称、码位与各种转义表示。'
      notes:
        - '一个表情符号可能是多个码位以零宽连接符相连（家庭、职业与旗帜表情符号），所以一个看得见的符号可能是 2 到 7 个码位、最多 20 个 UTF-16 码元。JavaScript 的字符串长度因此不等于表情符号的数量。'
        - '表情符号的外观取决于平台字体（Apple、Google、Microsoft、Samsung），较新的表情符号在旧系统上会缺失，显示成方框或拆开的部件。'
        - '肤色变体是基本表情符号后面接一个修饰码位（U+1F3FB 到 U+1F3FF）。'
        - '搜索使用 Unicode 数据中的英文名称与关键字，所以即使接口是其他语言，也请用英文搜索。'
      faq:
        - q: '为什么某个表情符号在我的电脑上显示成两个符号或方框？'
          a: '您的系统字体缺少那个表情符号，或缺少把部件组合起来的连接串行。较新的表情符号需要新版操作系统；复制出来的文本仍然正确，在更新过的设备上会正常显示。'
        - q: '怎么在 JavaScript 原代码中使用表情符号？'
          a: '直接在 UTF-8 文件中粘贴字符，或使用卡片上显示的跳脱写法，例如 \u{''{''}1F600{''}''}。CSS 的 content 请用十六进制形式 \1F600。'

  color-converter:
    title: Color 选择器
    description: 在不同格式（十六进制、rgb、hsl和css名称）之间转换颜色
    guide:
      intro: '在网页与设计工具使用的各种颜色表示法之间转换：hex、rgb()、hsl()、hwb()、lch()、cmyk() 与 CSS 颜色名称。修改任一字段或使用选色器，其他格式都会跟着更新。'
      useCases:
        - '把设计稿中的 hex 色码转成样式表使用的 hsl() 或 rgb()。'
        - '找出某个 hex 值最接近的 CSS 颜色名称，或查 rebeccapurple 这类名称的 hex 值。'
        - '获取 CMYK 值交给印刷设计师，或获取 LCH 值做感知均匀的配色。'
      steps:
        - '在任一字段输入颜色（例如 #1ea54c、rgb(30, 165, 76) 或 seagreen），或用选色器挑一个。'
        - '只要输入是有效的颜色，其他字段会立刻更新。'
        - '用复制按钮取用需要的格式。'
      notes:
        - 'Hex 接受 3、4、6、8 位数；4 位与 8 位的形式带有透明度，rgb() 与 hsl() 会以第四个 alpha 值显示。'
        - '这里的 CMYK 是从 RGB 做单纯的数学换算，没有色彩管理。实际印刷结果取决于纸张、油墨与 ICC 色彩描述文件，数字只能当起点。'
        - '名称字段只在颜色与某个 CSS 颜色名称完全相同时才会显示；多数颜色没有名称，字段会是空的。'
        - '当前的浏览器在 CSS 中支持 LCH 与 HWB，但旧浏览器会忽略它们，所以在样式表中使用时请保留 hex 或 rgb() 的回退值。'
      faq:
        - q: '为什么名称字段一直是空的？'
          a: '只有 148 个 CSS 具名颜色有名称，而且必须完全一致。#1ea54c 很接近 seagreen 但不是 seagreen，所以不显示名称。'
        - q: 'CSS 里该用哪种格式？'
          a: 'Hex 最精简、支持度最广。hsl() 比较容易手动微调（调亮、调暗、调饱和）。需要透明度时用 8 位 hex 或带 alpha 的 rgb()。'
  bcrypt:
    title: 加密
    description: 使用bcrypt对文本字符串进行哈希和比较。Bcrypt是一个基于Blowfish密码的密码哈希函数。
    guide:
      intro: 'bcrypt 是以 Blowfish 加密算法为基础的密码哈希函数。和一般的哈希不同，它刻意设计得很慢，还会加入随机盐（salt），让外泄的密码数据库更难被破解。这个工具可以生成 bcrypt 哈希，也能检查某段文本是否匹配既有的哈希。'
      useCases:
        - '替测试账号生成哈希，放进数据库或种子（seed）脚本。'
        - '调试登录问题时，确认数据库中的哈希是否真的对应某组密码。'
        - '试不同的成本系数，看在您的设备上哈希要多久，再决定正式环境用多少。'
      steps:
        - '在哈希部分输入文本，并设置 salt 次数（成本系数，默认 10）。'
        - '复制生成的哈希，开头是 $2，接着是成本与盐。'
        - '在比较部分输入文本与哈希，看结果是否相符。'
      notes:
        - '次数每加 1，运算量大约变成两倍。目前常见设置是 10 到 12；设得越高，每个人登录都会越慢，太高甚至会让这个页面卡住。'
        - '每次的结果都不同，因为每次都会生成新的随机盐。同一段文本的两个不同哈希都是有效的，所以验证时必须用比较功能，不能直接比较字符串。'
        - 'bcrypt 只会读取输入的前 72 个字节，超过的部分（包括很长的密码短语）会被忽略。'
        - '哈希在浏览器中计算。不要在任何在线工具输入真实用户的密码，包括这个工具，请用测试值。'
      faq:
        - q: '为什么我算出的哈希和数据库里的不一样？'
          a: '这是正常的。盐是随机的，而且存放在哈希里面，所以同一组密码每次生成的字符串都不同。请用比较功能验证，它会从哈希中读出盐再计算。'
        - q: '成本系数该选多少？'
          a: '选一个能让单次哈希在正式环境硬件上约耗时 100 到 300 毫秒的最高值，之后随着电脑变快，每隔几年再评估调整。'

  crontab-generator:
    title: Crontab 表达式生成
    description: 验证并生成crontab，并获取cron调度的可读描述。
    verbose: '详细说明'
    use24Hour: '使用 24 小时制'
    daysStartAtZero: '星期从 0 开始'
