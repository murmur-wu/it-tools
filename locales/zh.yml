  certificate-parser:
    title: X.509 证书解析
    description: 解析 PEM 或 DER 证书（或整条证书链），显示主体、签发者、有效期与剩余天数、SAN、密钥类型、密钥用途、扩展字段与指纹。全部在浏览器中完成。
    guide:
      intro: '解析 X.509 证书或整条证书链，列出主体（subject）、颁发者、有效期间与剩余天数、主体别名、公钥类型、密钥用途、扩展字段，以及 SHA-1 和 SHA-256 指纹。解析在浏览器中进行。'
      useCases:
        - '查出 TLS 证书何时到期，以及它实际覆盖哪些域名（SAN）。'
        - '比较指纹，确认服务器出示的证书就是您刚签发的那一张。'
        - '查看 PEM 合并文件里的证书链，看哪一张是叶证书、哪一张是中间证书，以及各由谁签发。'
      steps:
        - '粘贴 PEM 块（-----BEGIN CERTIFICATE-----）或纯 base64 的 DER 证书。粘贴多张证书会被视为证书链。'
        - '查看每张证书的状态标签（有效、已过期或尚未生效）与剩余天数。'
        - '展开详细数据，查看名称、密钥信息、用途与指纹，并复制需要的内容。'
      notes:
        - '现代浏览器是用主体别名（SAN）比较主机名称，而不是通用名称（CN），所以证书因名称不符被拒绝时，请检查 SAN 清单。'
        - '这个工具只做解析，不会用受信任的根证书验证证书链、检查是否已撤销，也不会确认证书是否匹配某把私钥。'
        - '只会读取证书。粘贴的内容里如果有私钥会被忽略，也请不要把私钥粘贴到任何网页工具。'
        - '有效期间是依您设备的时钟判断的，系统日期不对的话，状态标签和剩余天数也会跟着改变。'
      faq:
        - q: '怎么获取网站的证书？'
          a: '在浏览器中，从地址栏的锁形图标打开证书详细数据，导出成 PEM。在命令行可以用 openssl s_client -connect example.com:443 -showcerts，它会以 PEM 格式打印出证书链。'
        - q: '指纹是做什么用的？'
          a: '指纹是整张证书的哈希值。拿它和对方公布的值比较，就能确认看到的是完全相同的证书，证书固定（certificate pinning）和许多手动信任检查都是这个原理。'

  jwt-signer:
    title: JWT 签名与验证
    description: 由 header 与 payload 生成已签名的 JSON Web Token，或验证 token 的签名，支持 HS256/384/512、RS256/384/512、PS256/384/512 与 ES256/384/512。密钥不会离开浏览器。
    guide:
      intro: '依照您撰写的标头与内容生成签署过的 JSON Web Token，也能验证既有令牌的签名。支持 HMAC（HS256/384/512）、RSA（RS 与 PS）和 ECDSA（ES256/384/512），使用浏览器内置的 Web Crypto，密钥不会离开这个页面。'
      useCases:
        - '不写脚本，直接生成匹配 API 需求（声明、到期时间、算法）的测试令牌。'
        - '调试 401 或签名无效的错误时，确认某个令牌的签名是否匹配特定的密钥或公钥。'
        - '在把算法接进服务之前，先试试 HS256、RS256、ES256 的差异。'
      steps:
        - '选择算法，再编辑标头与内容的 JSON。alg 字段会自动设置，typ 默认为 JWT。'
        - 'HS 系列请输入共享密钥（可选 UTF-8 文本或 base64url）。RS、PS、ES 系列请粘贴私钥，或按按钮生成一组密钥。'
        - '复制签署后的令牌。要验证时，在验证区粘贴令牌与密钥或公钥，看结果。'
      notes:
        - '私钥必须是 PKCS#8 格式的 PEM，开头为 -----BEGIN PRIVATE KEY-----。以 BEGIN RSA PRIVATE KEY 或 BEGIN EC PRIVATE KEY 开头的密钥不被接受，请先转换：openssl pkcs8 -topk8 -nocrypt -in key.pem。'
        - '曲线要和算法对应：ES256 用 P-256，ES384 用 P-384，ES512 用 P-521（不是 P-512）。密钥不符时会有明确的错误信息。'
        - '验证只检查签名，不会检查 exp、nbf、aud、iss，所以已过期的令牌也可能显示为有效。声明请用 JWT 解析工具检查。'
        - '验证时可以贴公钥（-----BEGIN PUBLIC KEY-----）；贴 PKCS#8 私钥也可以，因为会从中推导出公钥。'
        - '请只使用测试用的密钥，不要把正式环境的私钥或密钥粘贴到任何网页，即使它在本地运行也一样。'
      faq:
        - q: 'HS256 和 RS256 有什么差别？'
          a: 'HS256 用同一组共享密钥签署与验证，所以能验证的人也能伪造令牌。RS256 用私钥签署、公钥验证，因此可以公开验证的能力，而不必公开签署的能力。'
        - q: '为什么验证显示签名无效？'
          a: '最常见的原因是密钥不同、密钥的编码选错（UTF-8 文本与 base64url）、令牌标头指定的算法和您预期的不同，或是令牌在签署后被修改过。'

  chinese-converter:
    title: 繁简中文转换
    description: 使用 OpenCC 在简体中文与繁体中文（台湾、香港，可选择台湾惯用词，例如「软件」→「軟體」）之间转换文本，全部在浏览器中完成。
    guide:
      intro: '使用开源的 OpenCC 字典在简体与繁体中文之间转换。除了逐字转换之外，也能应用台湾、香港的用字，并可选择一并转换台湾的惯用词汇，例如「软件」变成「軟體」。'
      useCases:
        - '把简体中文的文档、字幕文件或 README 转成繁体，给台湾或香港的读者。'
        - '本地化产品文案，让用字和日常用语（軟體、記憶體、影片）都读起来自然。'
        - '把繁体文本转成简体，提供给中国大陆的读者，或用来比较简体数据。'
      steps:
        - '在「From」选择来源变体，在「To」选择目标变体；交换按钮可以对调两者。'
        - '只转换字形请选「台湾」；连用语一起转换请选「台湾，含惯用词」。'
        - '粘贴文本，复制转换后的结果。'
      notes:
        - '只做字形转换无法得到自然的繁体中文，因为两地对同一件事用不同的词，例如「内存」与「記憶體」、「软件」与「軟體」。要给台湾读者看的文本，请使用「台湾，含惯用词」。'
        - '有些简体字对应到多个繁体字（「发」可能是「發」或「髮」，「后」可能是「后」或「後」）。OpenCC 多半能依前后文判断，但专有名词和不常见的词组仍可能转错，请务必校对。'
        - '转换不等于翻译。语法、标点风格和人名的地区写法差异都不会被改动。'
        - '您上次选择的转换方向会记在这个浏览器中，文本内容不会上传。'
      faq:
        - q: '繁体的几个选项有什么差别？'
          a: '「台湾」把字形转成台湾标准用字；「台湾，含惯用词」另外会替换地区性词汇；「香港」使用香港字形；「OpenCC 标准」则是不含地区差异的中性字形。'
        - q: '为什么有个词转错了？'
          a: '转换是以字典为基础，所以罕见的人名、引文和有歧义的字可能对应错误。请手动修正，或把文本拆开，让有歧义的词有更多上下文。'
