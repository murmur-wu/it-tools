about:
  content: >
    # 关于 IT-Tools

    IT-Tools 汇集了对开发者与 IT 从业人员实用的在线工具，所有工具都直接在浏览器中运行。如果您觉得好用，欢迎分享给需要的朋友，也别忘了加入书签！

    本站是开源项目 [IT-Tools](https://github.com/CorentinTh/it-tools)（作者 Corentin Thomasset，GPL-3.0 许可证）的定制部署版本。此版本的源代码公开在 [GitHub](https://github.com/murmur-wu/it-tools)。

    ## 技术

    IT-Tools 使用 Vue.js（Vue 3）搭配 Naive UI 组件库开发，并托管于 Cloudflare。部分工具使用了第三方开源库，完整列表请见仓库中的 [package.json](https://github.com/murmur-wu/it-tools/blob/main/package.json)。

    ## 这个版本新增了什么

    本站在原始项目之外独立维护，另外加入了：

    - 完整的繁体中文翻译，并根据浏览器语言自动切换。

    - 新工具：密码生成器、PDF 压缩、图片压缩、日期计算器（含台湾法定节假日与工作日计算）、cron 表达式构建器、CSV 转 JSON、时间戳批量转换、JWT 签名与验证、繁简中文转换、X.509 证书解析与 AES 加密。

    - 工具页底部的长篇说明，介绍适用场景、各选项的含义与常见陷阱，陆续补齐更多工具。

    - 工具页通用功能：加载示例、分享输入内容的链接、键盘快捷键，以及首页的“最近使用”与“粘贴即处理”。

    ## 联系方式

    - Email：[murmur20260202{'@'}gmail.com](mailto:murmur20260202{'@'}gmail.com)

    - 错误报告与工具需求：GitHub 仓库的 [issues 区](https://github.com/murmur-wu/it-tools/issues)。

    ## 隐私

    您在工具中输入的内容不会离开您的浏览器。本站使用会设置 Cookie 的 Google Analytics 与 Google AdSense，详情请见[隐私政策](/privacy)。

privacy:
  title: '隐私政策'
  content: |
    # 隐私政策

    最后更新：2026 年 9 月 24 日

    本政策说明 IT-Tools（ittools.heitang.info，以下称「本站」）会处理哪些数据、用在哪里，以及您可以怎么控制。

    ## 您在工具中输入的数据

    本站所有工具都在您的浏览器中运行。您输入的文本、选择的文件与产生的结果，都只在您的设备上处理，不会发送到本站的服务器；本站也没有任何保存这些数据的后端。

    以下几种情况，数据会留在您的设备或网址中：

    - 部分工具会把设置或上次的输入存在浏览器的 localStorage，方便您下次使用。
    - 收藏、最近使用的工具、语言与深色模式等偏好设置，也存在 localStorage。
    - 使用「分享链接」时，输入内容会放进网址的 `input` 参数，任何拿到这个链接的人都看得到。请不要分享含有密码、密钥或个人数据的链接。
    - 本站使用 Service Worker 缓存网站文件，让网站可以离线使用。缓存的只有网站本身的程序与图片，不包含您的输入。

    清除浏览器中本站的网站数据，就能删除以上所有内容。

    ## Google Analytics

    本站使用 Google Analytics 4 统计访问情形，例如浏览的页面、设备与浏览器类型、大致地区与来源网站，用来了解哪些工具最常被使用、该优先改进什么。Google Analytics 会使用 Cookie（例如 `_ga`）。您在工具中输入的内容不会发送给 Google Analytics。

    如果不想被统计，可以安装 [Google Analytics 停用浏览器插件](https://tools.google.com/dlpage/gaoptout)。

    ## Google AdSense 广告与 Cookie

    本站使用 Google AdSense 显示广告，以支应网站的维运：

    - Google 等第三方供应商会使用 Cookie，根据用户先前访问本站或其他网站的记录来投放广告。
    - Google 使用广告 Cookie，让 Google 及其合作伙伴能根据用户访问本站或互联网上其他网站的记录，向用户投放广告。
    - 您可以前往 [Google 广告设置](https://adssettings.google.com/) 停用个性化广告，也可以前往 [www.aboutads.info](https://www.aboutads.info/choices/) 停用第三方供应商用于个性化广告的 Cookie。

    Google 如何使用这些数据，请见 [Google 如何使用与我们合作的网站或应用程序所提供的信息](https://policies.google.com/technologies/partner-sites)。

    ## 网站托管

    本站托管于 Cloudflare。和所有网站一样，Cloudflare 在发送网页时会处理您的 IP 地址等连接信息，用于提供服务与防范攻击。详见 [Cloudflare 隐私政策](https://www.cloudflare.com/privacypolicy/)。

    ## 您的选择

    - 清除浏览器中本站的网站数据，即可删除本站存在您设备上的所有数据。
    - 可以在浏览器设置中封锁 Cookie。工具本身不需要 Cookie 也能正常使用。
    - 可以通过上方的链接停用 Google Analytics 统计与个性化广告。

    ## 儿童

    本站不是为 13 岁以下儿童设计，也不会刻意收集儿童的个人数据。

    ## 政策变更

    本政策如有修改，会更新本页内容与上方的「最后更新」日期。

    ## 联系方式

    对本政策有任何疑问，欢迎到 GitHub 保存库的 [issues 区](https://github.com/murmur-wu/it-tools/issues) 提出。
