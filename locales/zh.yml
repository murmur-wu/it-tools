    description: 为多因素身份验证生成和验证基于时间的OTP（一次性密码）。
    guide:
      intro: '生成并检查以时间为基础的一次性密码（TOTP，RFC 6238），也就是身份验证器 App 在两步验证登录时显示的 6 位数代码。它会显示当前的代码，连同前一个与下一个，并提供可转成 QR Code 的密钥 URI。'
      useCases:
        - '测试正在开发的两步验证登录，把服务器生成的代码和参考实现比较。'
        - '开发时生成密钥与配置用的 URI，加入身份验证器 App。'
        - '找出代码被拒绝的原因，例如服务器与手机的时钟有误差。'
      steps:
        - '使用自动生成的密钥，或粘贴您自己的 Base32 密钥。'
        - '查看当前的 6 位数代码；每 30 秒会更换一次，旁边也会显示前一个与下一个代码。'
        - '要在 App 中登录时，使用密钥 URI（otpauth://）或它的 QR Code，再把 App 显示的代码和这里的比较。'
      notes:
        - '密钥是 Base32 编码（英文字母 A 到 Z 和数字 2 到 7）。不在这个范围内的字符，例如 0、1、8、9，在密钥中是无效的。'
        - '代码使用 HMAC-SHA1、6 位数与 30 秒间隔，也就是几乎所有身份验证器 App 的默认值。8 位数或 SHA-256 等不同设置不在这个工具的范围内。'
        - '代码是依当前时间推导的，所以服务器与设备的时钟都必须准确。服务器通常也会接受前一个与下一个代码，这就是这里一并显示它们的原因。'
        - '知道密钥的人可以永远生成有效的代码。请把它当成密码，并且只使用测试用的密钥。'
      faq:
        - q: '为什么我的代码和手机 App 不一样？'
          a: '可能是密钥不同、App 使用其他设置（位数、算法或周期），或是时钟相差超过约 30 秒。请先检查手机的时间，并确认已打开自动设置时间。'
        - q: 'TOTP 和 HOTP 有什么差别？'
          a: 'HOTP 使用每次使用后递增的计数器，TOTP 则使用当前时间除以 30 秒所得的步数。身份验证器 App 用的是 TOTP，这个工具也是围绕它设计的。'

  url-encoder:
    title: 编码/解码url格式的字符串
    description: 编码为url编码格式（也称为“百分比编码”）或从中解码。
    guide:
      intro: '网址只能包含有限的字符，其他字符（例如空白、中文或保留符号）必须改写成百分比编码，也就是 % 加上两位十六进制数字。这个工具会做这样的编码与解码，规则和 JavaScript 的 encodeURIComponent 相同。'
      useCases:
        - '组出含有空白、&、= 或中文的查询参数值。'
        - '把日志或网址列中一长串 %E4%B8%AD%E6%96%87 之类的内容解码，看懂原文。'
        - '准备放在另一个网址里的重定向目标或回调网址（callback URL）。'
      steps:
        - '在编码字段输入或粘贴文本，获取百分比编码的结果。'
        - '在解码字段粘贴已编码的字符串，获取原始文本。'
        - '用复制按钮取用结果。'
      notes:
        - '编码时除了英文字母、数字和 - _ . ! ~ * '' ( ) 之外的字符都会被转换，包括 / ? & = : #。所以不要对整个网址编码，只编码要放进网址的那个值，否则网址会失效。'
        - '空白会变成 %20，而不是 +。只有 HTML 表单送出时 + 才代表空白，所以解码表单格式的字符串时 + 会原样保留。'
        - '非 ASCII 字符会先转成 UTF-8 字节，所以一个汉字会变成三组 %XX。'
        - '遇到 % 后面不是两位十六进制数字，或字节不是合法的 UTF-8 时，解码会失败。'
      faq:
        - q: '要编码整个网址，还是只编码参数值？'
          a: '只编码参数值（必要时含参数名称）。对整个网址编码会连 :// 和 / 分隔符号一起转掉，得到的字符串就不再是可用的网址。'
        - q: '为什么加号没有被解回空白？'
          a: '百分比解码不会特别处理 +。如果文本来自表单送出（application/x-www-form-urlencoded），请先把 + 换成空白再解码。'

