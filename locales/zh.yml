  password-strength-analyser:
    title: 密码强度分析仪
    description: 使用此密码强度分析器和破解时间估计工具来发现密码的强度。
    guide:
      intro: '从长度与使用的字符类别估算密码强度：计算以比特表示的熵、字符集合大小、分数，以及以每秒十亿次猜测的暴力破解需要多久。数据不会离开浏览器。'
      useCases:
        - '确认即将使用的密码是否够长、够多样。'
        - '用具体数字向团队说明为什么长度比符号更重要。'
        - '比较候选的密码政策（8 个混合字符与 16 个小写字母）。'
      steps:
        - '输入或粘贴密码。'
        - '阅读长度、熵、字符集合大小、分数与估计的破解时间。'
        - '加长或增加变化，看数字如何改变。'
      notes:
        - '熵的算法是 log2(字符集合大小) × 长度，所以只衡量对暴力破解的抵抗力。它不知道 password123 或字典单词很弱：真实的攻击者会先试常见密码，所以这里的高分是必要条件，不是充分条件。'
        - '破解时间假设对快速哈希每秒 10^9 次猜测。对 bcrypt 这类慢哈希会长很多；对外泄的快速哈希用 GPU 攻击则可能更短。'
        - '字符集合小写是 26，加大写 52，加数字 62，加符号约 94。长度多一个字符，比多一类符号更有帮助。'
        - '密码在本地分析，不会发送。即便如此，请避免把正在使用的密码输入任何网站。'
      faq:
        - q: '为什么四个常见单词组成的口令分数很高？'
          a: '因为分析器只算字符，25 个小写字母约有 117 比特。真实的字典攻击对 7000 字列表中的四个单词只需约 51 比特，所以用这个工具评估单词体口令时，分数偏乐观。'
        - q: '分数要多少才够？'
          a: '分数在 128 比特时达到 1。对有慢哈希与速率限制保护的账号，60 到 80 比特（12 个混合字符的密码或 5 个随机单词的短语）已经非常强。用密码管理器，长度就不是负担。'

  chronometer:
    title: 计时器
    description: 监控事物的持续时间。基本上是一种具有简单计时器功能的计时器。
    guide:
      intro: '简单的计时器：开始、暂停、继续与归零，经过时间显示到毫秒。它在浏览器标签页中运行，不需要登录或安装。'
      useCases:
        - '替一项任务、演示文稿排练、冲煮步骤或一组运动计时。'
        - '测量一道手动流程需要多久，以便估算或记录。'
        - '在没有内置计时器的电脑上有一个计时器可用。'
      steps:
        - '按下开始。'
        - '按下停止会暂停；再按开始会从停下的地方继续。'
        - '按下重置会归零。'
      notes:
        - '时间是用系统时钟测量的，所以暂停与继续不会造成误差；画面则依浏览器重绘的速度更新。'
        - '标签页在背景时计时器仍在走，但浏览器会放慢背景标签页，所以切回来时画面可能会跳一下。经过时间本身仍然正确。'
        - '重新加载或关闭页面会让计时器归零；没有保存功能，也不会记录分段。'
        - '重要或很长的计时，请同时记下开始时间作为保险。'
      faq:
        - q: '切换标签页或锁定屏幕时还会继续计时吗？'
          a: '会，经过时间是用时间戳计算的，回来时仍然正确。在背景时只有画面的更新会暂停。'
        - q: '可以记录分段或同时用多个计时器吗？'
          a: '这个工具不行，它只是单一的计时器。需要分段时间时请手动记下。'
