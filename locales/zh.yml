  base64-string-converter:
    title: Base64 字符串编码/解码
    description: 将字符串编码和解码为其 Base64 格式表示形式即可。
    guide:
      intro: 'Base64 会把任意字节转成由 64 个可打印字符组成的文本，让数据能通过只能处理文本的管道，例如 JSON 字段、网址、电子邮件或 HTTP 标头。这个工具可以把文本编码成 Base64，也能解码还原，并正确处理 UTF-8 字符。'
      useCases:
        - '解读配置文件、HTTP 标头或 JSON 数据中的 Base64 值，看里面实际是什么。'
        - '生成要放进环境变量或 Kubernetes Secret 清单的 Base64 字符串。'
        - '生成可放在网址参数或类似 JWT 片段中的 URL 安全版本。'
      steps:
        - '要编码时，在「String to encode」输入或粘贴文本，下方会显示 Base64 结果。'
        - '要解码时，在第二张卡片粘贴 Base64 字符串，下方会显示解码后的文本。'
        - '如果值要用在网址或 JWT 中，打开任一边的 URL 安全选项。'
        - '用复制按钮取用结果。'
      notes:
        - 'Base64 只是编码，不是加密，任何人都能解开，无法用来保护机密。'
        - 'URL 安全版本会把 + 和 / 换成 - 和 _，并省略结尾的 = 补位。用错选项解码会显示字符串无效。'
        - '编码后的数据约比原本大三分之一（3 个字节变成 4 个字符）。'
        - '如果解码出来的字节不是合法文本（例如图片、压缩文件），在这里看不出有意义的内容，二进制数据请改用文件转换工具。'
      faq:
        - q: '为什么解码时显示字符串无效？'
          a: '常见原因：URL 安全字符串没开 URL 安全选项解码（或反过来）、含有不属于字母表的字符，或复制时被截断。'
        - q: '解码后为什么出现乱码？'
          a: '原始字节可能不是 UTF-8 文本，例如二进制文件或其他编码的文本。解码只有对从 UTF-8 编码来的文本才有意义。'

