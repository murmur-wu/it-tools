  json-diff:
    title: JSON 差异比较
    description: 比较两个JSON对象并获得它们之间的差异。
    guide:
      intro: '比较两份 JSON 文档，以带颜色标示的树状结构显示哪些内容被添加、移除或修改。两个输入框都接受较宽松的 JSON5，所以注释和结尾逗号不会造成困扰。'
      useCases:
        - '比较部署前后的 API 响应，确切找出哪些字段改变了。'
        - '查看配置文件的两个版本，不必依赖逐行的文本差异。'
        - '确认序列化器或数据迁移生成的数据和原本一致。'
      steps:
        - '把原始的 JSON 粘贴到第一个输入框。'
        - '把要比较的 JSON 粘贴到第二个输入框。'
        - '看下方的树状结果：添加、移除与修改的项目会被标示，未变动的项目则显示作为上下文。'
      notes:
        - '对象是逐个键比较的，所以键的顺序不影响结果，单纯调整顺序不会被视为差异。'
        - '数组是依位置比较的。在开头插入一个项目，后面所有项目都会往后移，可能出现大量「已修改」。顺序没有意义的数组，请先排序或改用键值结构再比较。'
        - '值的类型改变（例如数字 1 变成字符串 "1"）会被视为差异。'
        - '任一边不是合法的 JSON 时，输入框会显示错误，也不会进行比较。'
      faq:
        - q: '这和一般的文本差异比较有什么不同？'
          a: '文本比较是以行为单位，重新排版或调整键的顺序都会生成大量噪音。这个工具比较的是解析后的数据，所以只会显示键、值与类型真正的差异。'
        - q: '可以忽略时间戳之类的特定字段吗？'
          a: '目前不行，请在比较前先从两边移除这些字段。'
  jwt-parser:
    title: JWT 解析器
    description: 解析和解码JSON Web Token（jwt）并显示其内容。
    guide:
      intro: 'JSON Web Token（JWT）由三段以点号相连的 Base64URL 字符串组成：标头、带有各种声明（claims）的内容，以及签名。这个工具会把标头与内容解码出来给您阅读，并标示每个标准声明的意思。'
      useCases:
        - 'API 返回 401 时，确认令牌是否已过期、是不是发给别的对象（aud），或是缺少预期的权限范围（scope）。'
        - '检查登录流程发出的令牌，看后端实际收到哪些声明，例如 sub、角色或租户。'
        - '调试时钟误差问题时，把 iat、nbf、exp 从 Unix 时间戳转成看得懂的日期。'
      steps:
        - '把完整的令牌（三段以点号分隔）粘贴到输入框。'
        - '从标头看签名算法（alg）与令牌类型。'
        - '从内容看各项声明；exp、nbf、iat 除了原始数字，也会显示成本地时间。'
      notes:
        - '这个工具只做解码，不会验证签名，所以能读出内容不代表令牌是真的。签名要在服务器端验证，或使用本站的「JWT 签名与验证」工具。'
        - '内容只是编码，并未加密，拿到令牌的人都读得到。不要把密码或其他机密放进声明。'
        - '解码在浏览器内完成，令牌不会传到任何地方。即便如此，仍有效的正式环境令牌要当成密码看待，能用过期或测试用的令牌就尽量用。'
        - '日期会依您设备的时区显示，而 exp 与 iat 本身是以 UTC 为基准的 Unix 秒数。'
      faq:
        - q: '为什么我的令牌无法解码？'
          a: '有效的 JWT 一定是三段以点号分隔，且前两段必须是 Base64URL 编码的 JSON。常见原因是多带了「Bearer 」前缀、复制时被截断，或根本不是 JWT（例如随机字符串形式的不透明令牌）。'
        - q: '把令牌粘贴在这里安全吗？'
          a: '解码在页面本地运行，不会上传。但令牌若仍有效，任何看到的人都能拿去使用，所以请避免把它粘贴到截屏、聊天室或会把数据送到服务器的网站。'

