  uuid-generator:
    title: UUIDs 生成器
    description: 通用唯一标识符（UUID）是一个128位数字，用于标识计算机系统中的信息。可能的UUID数量为16^32，即2^128或约3.4x10^38（这是一个很大的数字！）。
    guide:
      intro: 'UUID 是 128 比特的识别码，设计目的是让不同系统各自产生时几乎不可能重复，因此不需要中央发号机制。常用于数据库主键、交易追踪编号、文件命名等场景。'
      useCases:
        - '为数据表产生主键，特别是需要在写入数据库前就先决定 ID 的情况。'
        - '产生请求追踪编号，方便在分布式系统的日志中串起同一笔请求。'
        - '创建不会撞名的暂存盘名或上传文件识别码。'
      steps:
        - '在版本菜单选择需要的 UUID 版本，默认是 v4。'
        - '调整数量后即时产生，点拷贝取用。'
        - '按 Ctrl+Enter 可以重新产生一批。'
      notes:
        - 'v4 是完全随机，最常用，适合绝大多数情境。'
        - 'v1 内含时间戳与网络卡地址，可排序但会泄漏产生时间与机器信息。'
        - 'v7 同样内含时间戳但排在前面，所以字典序等同时间序，对数据库索引比 v4 友善，是近年推荐的选择。'
        - '产生过程使用浏览器的密码学乱数来源，不会连到服务器。'
      faq:
        - q: 'UUID 真的不会重复吗？'
          a: 'v4 有 122 比特的随机性。以实务角度，即使每秒产生十亿个，要碰到一次重复也需要数十年以上的量级，可以视为不会重复。'
        - q: '拿 UUID 当数据库主键会不会影响性能？'
          a: '会，特别是 v4。随机值会让 B-tree 索引频繁分裂，写入性能与索引大小都比递增整数差。如果在意这点，改用 v7，它的时间前缀让新数据集中在索引尾端。'

