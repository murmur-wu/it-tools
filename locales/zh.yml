  bcrypt:
    title: 加密
    description: 使用bcrypt对文本字符串进行哈希和比较。Bcrypt是一个基于Blowfish密码的密码哈希函数。
    guide:
      intro: 'bcrypt 是以 Blowfish 加密算法为基础的密码哈希函数。和一般的哈希不同，它刻意设计得很慢，还会加入随机盐（salt），让外泄的密码数据库更难被破解。这个工具可以生成 bcrypt 哈希，也能检查某段文本是否匹配既有的哈希。'
      useCases:
        - '替测试账号生成哈希，放进数据库或种子（seed）脚本。'
        - '调试登录问题时，确认数据库中的哈希是否真的对应某组密码。'
        - '试不同的成本系数，看在您的设备上哈希要多久，再决定正式环境用多少。'
      steps:
        - '在哈希部分输入文本，并设置 salt 次数（成本系数，默认 10）。'
        - '复制生成的哈希，开头是 $2，接着是成本与盐。'
        - '在比较部分输入文本与哈希，看结果是否相符。'
      notes:
        - '次数每加 1，运算量大约变成两倍。目前常见设置是 10 到 12；设得越高，每个人登录都会越慢，太高甚至会让这个页面卡住。'
        - '每次的结果都不同，因为每次都会生成新的随机盐。同一段文本的两个不同哈希都是有效的，所以验证时必须用比较功能，不能直接比较字符串。'
        - 'bcrypt 只会读取输入的前 72 个字节，超过的部分（包括很长的密码短语）会被忽略。'
        - '哈希在浏览器中计算。不要在任何在线工具输入真实用户的密码，包括这个工具，请用测试值。'
      faq:
        - q: '为什么我算出的哈希和数据库里的不一样？'
          a: '这是正常的。盐是随机的，而且存放在哈希里面，所以同一组密码每次生成的字符串都不同。请用比较功能验证，它会从哈希中读出盐再计算。'
        - q: '成本系数该选多少？'
          a: '选一个能让单次哈希在正式环境硬件上约耗时 100 到 300 毫秒的最高值，之后随着电脑变快，每隔几年再评估调整。'

  crontab-generator:
    title: Crontab 表达式生成
    description: 验证并生成crontab，并获取cron调度的可读描述。
    verbose: '详细说明'
    use24Hour: '使用 24 小时制'
    daysStartAtZero: '星期从 0 开始'
    invalid: '这个 cron 表达式无效'
    nextRuns: '接下来的执行时间'
    timezone: '时区'
    runAt: '执行时间（{timezone}）'
    rebootHint: '这个表达式只在系统启动时执行一次，没有计划可以预览。'
    noNextRuns: '输入有效的 cron 表达式即可预览接下来的执行时间。'
    builder:
      title: '生成表达式'
      frequency: '频率'
      everyMinutes: '每几分钟'
      minute: '分'
      hour: '时'
      dayOfWeek: '星期'
      dayOfMonth: '日'
      month: '月份'
      apply: '套用这个表达式'
      frequencies:
        minutely: '每几分钟'
        hourly: '每小时'
        daily: '每天'
        weekly: '每周'
        monthly: '每月'
        yearly: '每年'
      weekDays:
        0: '星期日'
        1: '星期一'
        2: '星期二'
        3: '星期三'
        4: '星期四'
        5: '星期五'
        6: '星期六'
      months:
        1: '一月'
        2: '二月'
        3: '三月'
        4: '四月'
        5: '五月'
        6: '六月'
        7: '七月'
        8: '八月'
        9: '九月'
        10: '十月'
        11: '十一月'
        12: '十二月'
    guide:
      intro: 'Cron 是 Unix 与 Linux 上的调度格式，用五个（或六个）字段描述「什么时候要运行」。这个工具帮你验证表达式、翻成易读的说明，并列出接下来几次实际的运行时间，让你在写进 crontab 之前就先确认调度是对的。'
      useCases:
        - '设置服务器的定期备份、日志轮替或数据同步，写完想先确认调度真的如预期。'
        - '看到同事或旧项目留下的 cron 表达式，想知道它到底多久跑一次。'
        - '设置 GitHub Actions、Kubernetes CronJob 或 Cloudflare Workers 的调度，这些平台都用同一套语法。'
      steps:
        - '在上方输入框填入 cron 表达式，或用下方的「组出表达式」用菜单组出来再套用。'
        - '看中间那行易读说明，确认语意与你想的一致。'
        - '在「接下来的运行时间」选择时区，核对列出的五次时间点。'
      notes:
        - '五栏格式是「分 时 日 月 星期」，六栏则在最前面多一个「秒」。多数服务器的 crontab 只支持五栏，秒字段常见于应用层的调度器。'
        - '星期日可以写 0 或 7，两者等价。「星期从 0 开始」的开关只影响易读说明的文本，不影响表达式本身。'
        - '时区很重要。服务器的 crontab 通常跑在系统时区（常是 UTC），而不是你所在的时区，所以务必用时区菜单核对。'
        - "{'@'}reboot 只在系统启动时运行一次，没有固定调度，因此不会列出运行时间。"
      faq:
        - q: '每 15 分钟运行一次要怎么写？'
          a: '写成 */15 * * * *。斜线代表间隔，所以会在每小时的 0、15、30、45 分运行。'
        - q: '为什么我的调度在服务器上跑的时间跟这里显示的不一样？'
          a: '几乎都是时区问题。用 date 指令确认服务器时区，再把上面的时区菜单切到同一个时区重新核对。另一个常见原因是 crontab 的 PATH 与登录 shell 不同，导致指令找不到而没有实际运行。'

