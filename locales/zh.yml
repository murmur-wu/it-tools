  hash-text:
    title: Hash 文本
    description: '使用所需的函数哈希文本字符串：MD5、SHA1、SHA256、SHA224、SHA512、SHA384、SHA3或RIPEMD160'
    file:
      title: '文件哈希'
      upload: '把文件拖拽到这里，或点击选择文件'
      algorithms: '算法'
      compare: '比对哈希值'
      comparePlaceholder: '粘贴预期的哈希值来验证文件…'
      match: '与 {algorithm} 相符'
      mismatch: '没有任何哈希值相符'
      hashing: '计算中…'
      clear: '清除文件'
      privacy: '文件只在你的浏览器里计算，不会上传。'
      error: '无法读取这个文件。'
    guide:
      intro: '哈希函数把任意长度的数据转成固定长度的指纹。相同输入永远得到相同结果，而且无法从结果反推原文。常用来验证文件完整性、比对数据是否被窜改。'
      useCases:
        - '下载文件后比对官方提供的 SHA-256，确认文件没有损毁或被掉包。'
        - '确认两份看起来一样的文件内容是否真的相同。'
        - '在开发时产生固定长度的识别码，或为缓存键值做范式。'
      steps:
        - '把文本贴进上方输入框，八种算法的结果会即时算出来。'
        - '需要不同输出格式时，用「Digest encoding」切换十六进位、Base64 或二进位。'
        - '要算文件的话，卷到下方的「文件哈希」区块，勾选需要的算法后拖入文件。'
        - '要验证下载的文件，把官方公布的哈希值贴进「比对哈希值」字段，相符会显示绿色标签。'
      notes:
        - '文件完全在你的浏览器里计算，以分段串流处理，不会上传，大文件也不会吃爆内存。'
        - 'MD5 和 SHA-1 已被证实可以制造碰撞，不应再用于安全用途。仅用于比对非恶意情境下的文件完整性时仍可接受。'
        - '本工具的「SHA3」实际上是 Keccak-512，也就是 NIST 定案前的版本，结果与 sha3sum 指令不同。需要标准 SHA3-512 时请勿使用这一栏。'
        - '哈希不是加密，没有密钥也无法还原。要保护密码请用 bcrypt，要加解密请用文本加密工具。'
      faq:
        - q: '为什么同一个文件在不同网站算出来的 SHA-256 不一样？'
          a: '正常情况下不会不一样。若结果不同，通常是文件本身不同（例如换行符号 CRLF 与 LF 的差异、或下载不完整），或是其中一边算的是文本而非二进位内容。'
        - q: '该选哪一种算法？'
          a: '验证文件完整性用 SHA-256 就够了，这是目前最通用的选择。需要更长的摘要可以用 SHA-512。避免用 MD5 和 SHA-1 做任何安全相关的判断。'

