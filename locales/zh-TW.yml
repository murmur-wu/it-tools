  hash-text:
    title: 文字雜湊
    description: '使用您需要的雜湊函式對文字進行雜湊：MD5、SHA1、SHA256、SHA224、SHA512、SHA384、SHA3 或 RIPEMD160'
    file:
      title: '檔案雜湊'
      upload: '把檔案拖曳到這裡，或點擊選擇檔案'
      algorithms: '演算法'
      compare: '比對雜湊值'
      comparePlaceholder: '貼上預期的雜湊值來驗證檔案…'
      match: '與 {algorithm} 相符'
      mismatch: '沒有任何雜湊值相符'
      hashing: '計算中…'
      clear: '清除檔案'
      privacy: '檔案只在你的瀏覽器裡計算，不會上傳。'
      error: '無法讀取這個檔案。'
    guide:
      intro: '雜湊函式把任意長度的資料轉成固定長度的指紋。相同輸入永遠得到相同結果，而且無法從結果反推原文。常用來驗證檔案完整性、比對資料是否被竄改。'
      useCases:
        - '下載檔案後比對官方提供的 SHA-256，確認檔案沒有損毀或被掉包。'
        - '確認兩份看起來一樣的檔案內容是否真的相同。'
        - '在開發時產生固定長度的識別碼，或為快取鍵值做正規化。'
      steps:
        - '把文字貼進上方輸入框，八種演算法的結果會即時算出來。'
        - '需要不同輸出格式時，用「Digest encoding」切換十六進位、Base64 或二進位。'
        - '要算檔案的話，捲到下方的「檔案雜湊」區塊，勾選需要的演算法後拖入檔案。'
        - '要驗證下載的檔案，把官方公布的雜湊值貼進「比對雜湊值」欄位，相符會顯示綠色標籤。'
      notes:
        - '檔案完全在你的瀏覽器裡計算，以分段串流處理，不會上傳，大檔案也不會吃爆記憶體。'
        - 'MD5 和 SHA-1 已被證實可以製造碰撞，不應再用於安全用途。僅用於比對非惡意情境下的檔案完整性時仍可接受。'
        - '本工具的「SHA3」實際上是 Keccak-512，也就是 NIST 定案前的版本，結果與 sha3sum 指令不同。需要標準 SHA3-512 時請勿使用這一欄。'
        - '雜湊不是加密，沒有金鑰也無法還原。要保護密碼請用 bcrypt，要加解密請用文字加密工具。'
      faq:
        - q: '為什麼同一個檔案在不同網站算出來的 SHA-256 不一樣？'
          a: '正常情況下不會不一樣。若結果不同，通常是檔案本身不同（例如換行符號 CRLF 與 LF 的差異、或下載不完整），或是其中一邊算的是文字而非二進位內容。'
        - q: '該選哪一種演算法？'
          a: '驗證檔案完整性用 SHA-256 就夠了，這是目前最通用的選擇。需要更長的摘要可以用 SHA-512。避免用 MD5 和 SHA-1 做任何安全相關的判斷。'

