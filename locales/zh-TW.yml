  uuid-generator:
    title: UUID 產生器
    description: 通用唯一識別碼（UUID）是一個 128 位元的數字，用於在電腦系統中識別資訊。可能的 UUID 數量為 16^32，也就是 2^128，約為 3.4x10^38（非常多！）。
    guide:
      intro: 'UUID 是 128 位元的識別碼，設計目的是讓不同系統各自產生時幾乎不可能重複，因此不需要中央發號機制。常用於資料庫主鍵、交易追蹤編號、檔案命名等場景。'
      useCases:
        - '為資料表產生主鍵，特別是需要在寫入資料庫前就先決定 ID 的情況。'
        - '產生請求追蹤編號，方便在分散式系統的日誌中串起同一筆請求。'
        - '建立不會撞名的暫存檔名或上傳檔案識別碼。'
      steps:
        - '在版本選單選擇需要的 UUID 版本，預設是 v4。'
        - '調整數量後即時產生，點複製取用。'
        - '按 Ctrl+Enter 可以重新產生一批。'
      notes:
        - 'v4 是完全隨機，最常用，適合絕大多數情境。'
        - 'v1 內含時間戳與網路卡位址，可排序但會洩漏產生時間與機器資訊。'
        - 'v7 同樣內含時間戳但排在前面，所以字典序等同時間序，對資料庫索引比 v4 友善，是近年推薦的選擇。'
        - '產生過程使用瀏覽器的密碼學亂數來源，不會連到伺服器。'
      faq:
        - q: 'UUID 真的不會重複嗎？'
          a: 'v4 有 122 位元的隨機性。以實務角度，即使每秒產生十億個，要碰到一次重複也需要數十年以上的量級，可以視為不會重複。'
        - q: '拿 UUID 當資料庫主鍵會不會影響效能？'
          a: '會，特別是 v4。隨機值會讓 B-tree 索引頻繁分裂，寫入效能與索引大小都比遞增整數差。如果在意這點，改用 v7，它的時間前綴讓新資料集中在索引尾端。'

