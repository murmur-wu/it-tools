  password-strength-analyser:
    title: 密碼強度分析器
    description: 使用這個純前端的密碼強度分析與破解時間估算工具，了解您的密碼有多安全。

  chronometer:
    title: 碼錶
    description: 測量一件事情持續的時間。基本上就是一個具備基本功能的碼錶。

  password-generator:
    title: '密碼產生器'
    description: '在瀏覽器裡產生高強度隨機密碼、容易記憶的密語或 PIN 碼，並估算破解所需時間。'
    mode: '類型'
    modes:
      random: '隨機密碼'
      passphrase: '密語'
      pin: 'PIN 碼'
    length: '長度'
