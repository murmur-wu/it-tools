    modes:
      count: '計算天數'
      add: '增加天數'
      subtract: '減去天數'
    startDate: '開始日期'
    endDate: '結束日期'
    today: '今天'
    pickDate: '選擇日期'
    daysToAdd: '要增加的天數'
    daysToSubtract: '要減去的天數'
    settings: '計算設定'
    includeEnd: '包含結束日期'
    exclude: '排除'
    workdaysPreset: '只算工作天'
    clearExclusions: '清除'
    excludeHolidays: '排除國定假日'
    holidaysHint: '依人事行政總處公布的辦公日曆表（{first}–{last} 年），包含補假；週六補班日會算成工作天。'
    calculate: '計算'
    weekdays:
      mon: '星期一'
      tue: '星期二'
