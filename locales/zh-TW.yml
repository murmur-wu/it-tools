    cancel: '取消'
    clear: '清除'
    download: '下載'
    notAVideo: '{name} 不是影片。'
    qualityLevels:
      high: '高（檔案較大）'
      medium: '中（建議）'
      low: '低（檔案最小）'
    status:
      queued: '等待中'
      error: '失敗'
    errors:
      noVideoTrack: '這個檔案沒有影片軌。'
      undecodable: '這個瀏覽器無法解碼此檔案的影片編碼。'
      noEncoder: '這個瀏覽器沒有所選輸出格式的編碼器，請試試另一種格式。'
      unsupportedInput: '不支援的檔案格式。支援 MP4、MOV、WebM 與 MKV。'
      canceled: '已取消。'
      failed: '無法壓縮這個影片。'
    guide:
      intro: '用瀏覽器內建的硬體編碼器（WebCodecs）重新編碼影片，讓檔案變小，並可同時縮小解析度、把容器換成 MP4 或 WebM。只要輸出格式允許，聲音軌會原樣複製，音質不會改變。'
      useCases:
        - '把手機錄的影片壓到通訊軟體、電子郵件或表單上傳的大小限制以內。'
        - '分享或歸檔之前，把螢幕錄影或 4K 片段縮到 1080p 或 720p。'
        - '不安裝軟體，把 MOV 或 MKV 轉成到處都能播放的 MP4。'
      steps:
        - '選擇輸出格式（MP4 相容性最好，WebM 適合網頁）、畫質等級與最大解析度。'
        - '把一個或多個影片拖到上傳區。它們會依序處理，每一個都有進度條。'
        - '比較大小後下載結果。按「取消」會停止目前的檔案，並放棄還在等待的檔案。'
      notes:
        - '壓縮的原理是用較低的位元率重新編碼，所以每次都會損失一些細節。之後可能還要剪輯的話請保留原檔，也避免把同一個檔案反覆壓縮。'
        - '降低解析度省下的空間遠比降低畫質等級多。1080p 對多數螢幕已經足夠，720p 用於通訊軟體和預覽很合適。來源不會被放大。'
        - '畫質等級是依解析度換算的位元率目標：「中」是合理的預設值，「高」保留細節但檔案約大一倍，「低」給最在意大小的情況。'
        - '編碼器由瀏覽器能編碼的格式決定：MP4 通常是 H.264，WebM 通常是 VP9。容器允許時聲音會原樣複製（MP4 的 AAC、WebM 的 Opus），否則才重新編碼。'
        - '全部在瀏覽器中執行，不會上傳，這也表示非常大的檔案（數 GB）可能超出瀏覽器可用的記憶體。速度取決於裝置；多數筆電的硬體編碼器處理 1080p 比即時播放還快。'
        - '有 DRM 加密的影片與部分專業用編碼無法在瀏覽器中解碼，會顯示為不支援。'
      faq:
        - q: '為什麼壓縮後的檔案比原本還大？'
          a: '原始檔案的位元率本來就比您選的畫質等級還低。請選較低的畫質或較小的解析度，或是直接保留原檔。'
        - q: '為什麼顯示我的瀏覽器不支援？'
          a: '這個工具需要 WebCodecs API，Chrome 與 Edge、Safari 16.4 以上、Firefox 130 以上都有提供。較舊的瀏覽器和部分強化隱私的瀏覽器沒有。'
        - q: '可以剪輯或裁切影片嗎？'
          a: '目前不行。它會重新編碼整個檔案，這個工具沒有剪輯與裁切功能。'

  pdf-compressor:
    title: 'PDF 壓縮'
    description: '在瀏覽器裡壓縮 PDF，大幅縮小掃描檔與照片多的文件，文字仍可選取，檔案不會上傳。'
    preset: '壓縮程度'
    presets:
      screen:
        label: '最小檔案'
        hint: '適合螢幕閱讀、Email 或通訊軟體傳送'
      ebook:
        label: '平衡'
        hint: '大多數情況的最佳選擇'
      printer:
        label: '高品質'
        hint: '需要列印時使用，縮小幅度較小'
    upload: '把 PDF 拖曳到這裡，或點擊選擇檔案'
    privacy: 'PDF 只在你的瀏覽器裡處理，不會上傳。'
    engine: '壓縮引擎：Ghostscript（AGPL-3.0）。'
    sourceCode: '本站原始碼'
    largeFile: '有檔案超過 100 MB，處理需要較久，在手機上可能因記憶體不足而失敗。'
    clear: '清除'
    download: '下載'
    recompress: '用目前設定重新壓縮'
    waiting: '等待中…'
    loadingEngine: '正在下載壓縮引擎（約 15 MB，只需下載一次）…'
    compressing: '壓縮中…'
    progress: '正在處理第 {page} / {total} 頁'
    notSmaller: '用這個設定無法再縮小，原始檔案已經很精簡。可以換成較小的壓縮程度再試一次。'
    errors:
      notPdf: '這不是 PDF 檔案。'
      password: '這個 PDF 有開啟密碼，請先移除密碼再壓縮。'
      invalid: '無法讀取這個 PDF，檔案可能已損毀或不完整。'
      failed: '壓縮失敗，請再試一次。'
      engine: '無法下載壓縮引擎，請確認網路連線後再試一次。'
    guide:
      intro: 'PDF 會變大，通常不是因為文字，而是裡面的圖片：掃描檔的每一頁都是一張高解析度照片，報告或型錄也常直接放入手機拍的原圖。這個工具用 Ghostscript 把圖片重新取樣到適合用途的解析度並重新壓縮，文字、字型與版面維持原樣，全程在你的瀏覽器裡完成。'
      useCases:
        - 'Email 附件超過大小限制（常見上限是 10 到 25 MB），需要縮小後再寄出。'
        - '上傳到政府、學校或求職網站時，系統限制檔案不能超過某個大小。'
        - '手機掃描的合約、收據或證件，一頁就好幾 MB，想縮小後再存檔或傳送。'
        - '照片很多的報告或型錄，想在不影響閱讀的前提下減少容量。'
      steps:
        - '選擇壓縮程度：一般情況選「平衡」，要傳送或只在螢幕上看選「最小檔案」，需要列印選「高品質」。'
        - '把一個或多個 PDF 拖曳到上方區域，或點擊選擇檔案。第一次使用會先下載約 15 MB 的壓縮引擎。'
        - '等待處理完成，進度會依頁數顯示，完成後會列出壓縮前後的大小。'
        - '按「下載」取得壓縮後的檔案。不滿意的話，換一個壓縮程度後按「用目前設定重新壓縮」。'
      notes:
        - '壓縮效果取決於檔案內容：掃描檔與照片多的 PDF 通常可以縮小一半以上，甚至 90%；純文字的 PDF 本來就很小，可能只省下一點點。'
        - '「最小檔案」會把圖片降到 72 dpi，在螢幕上看沒問題，但列印時照片和小字可能會模糊。要列印的文件請用「高品質」。'
        - '如果壓縮後反而變大，工具會提示並保留原始檔案，不會提供較大的版本下載。這通常代表原始檔已經過最佳化。'
        - '有開啟密碼的 PDF 無法處理，請先用原本的軟體移除密碼。壓縮會重新產生檔案，數位簽章會因此失效，互動表單等進階功能也可能無法完整保留，重要文件請確認壓縮後的內容。'
        - '所有處理都在你的瀏覽器中進行，PDF 不會上傳。檔案很大（超過 100 MB）時，特別是在手機上，可能因記憶體不足而失敗，建議改用電腦處理。'
      faq:
        - q: '壓縮後文字還能選取和搜尋嗎？'
          a: '可以。這個工具只重新壓縮圖片，文字仍然是文字，可以選取、搜尋與複製。如果原始檔是沒有經過文字辨識的掃描圖，壓縮後也一樣只是圖片。'
        - q: '為什麼有些 PDF 幾乎沒有變小？'
          a: 'PDF 的大小主要來自圖片。以文字或向量圖為主的檔案，或是已經用其他工具壓縮過的檔案，能再縮小的空間很有限。'
        - q: '三種壓縮程度差在哪裡？'
          a: '差別在圖片的解析度：最小檔案是 72 dpi、平衡是 150 dpi、高品質是 300 dpi。解析度越低檔案越小，但放大或列印時越容易看出模糊。'
        - q: '我的檔案會被上傳嗎？'
          a: '不會。壓縮引擎 Ghostscript 會下載到你的瀏覽器，在你的裝置上執行，PDF 不會離開你的電腦或手機。'

  qrcode-generator:
    title: QR Code 產生器
    description: 為網址（或純文字）產生並下載 QR Code，並可自訂前景與背景顏色。
    decode:
      title: '從圖片讀取 QR Code'
      upload: '把圖片拖曳到這裡，或點擊選擇圖片'
      pasteHint: '也可以直接從剪貼簿貼上圖片（Ctrl+V）。'
      result: '解碼內容'
      notFound: '這張圖片裡找不到 QR Code。'
      error: '無法讀取這張圖片。'
      useAsInput: '帶入上方文字'
      privacy: '圖片只在你的瀏覽器裡處理，不會上傳。'
    guide:
      intro: '把網址或任何文字轉成 QR Code，可下載成圖片，並自訂顏色與容錯等級。也可以從圖片中讀出 QR Code 的內容。'
      useCases:
        - '替連結、Wi-Fi 密碼提示、聯絡資訊或活動頁面建立代碼，印在海報或名片上。'
        - '使用自己的前景與背景顏色，做出符合品牌風格的代碼。'
        - '開啟來路不明的 QR Code 之前，先上傳或貼上截圖，看它實際指向哪裡。'
      steps:
        - '在文字欄位輸入文字或網址，代碼會隨輸入即時更新。'
        - '視需要調整前景色、背景色與容錯等級。'
        - '下載圖片。要讀取代碼時，把圖片拖曳到讀取區，或按 Ctrl+V 貼上。'
      notes:
        - '容錯等級 low、medium、quartile、high 分別約可容許 7%、15%、25%、30% 的面積損毀仍可掃描。等級越高，代碼越密，內容很長時建議用較低的等級。'
        - '兩種顏色要保持明顯的對比，而且前景要比背景深。對比太低或顏色反相，在很多掃描器上會失敗。'
        - '內容越長，代碼越密，需要印得更大。掃不好時請縮短內容，例如改用短網址。'
        - 'QR Code 儲存的是固定內容，印出後就不能更改。建立與讀取都在瀏覽器中進行，圖片不會上傳。'
      faq:
        - q: '為什麼我的 QR Code 掃不出來？'
          a: '常見原因：對比不足、資料量大但印得太小、代碼四周沒有留白，或是內容很長又選了很高的容錯等級，導致代碼太密。'
        - q: 'QR Code 會過期嗎？'
          a: '不會。代碼只是把您輸入的文字編碼起來，如果內容是網址，只要那個網址還能用，代碼就有效。'

  wifi-qrcode-generator:
    title: WiFi QR Code 產生器
    description: 產生並下載可快速連線 WiFi 網路的 QR Code。

  xml-formatter:
    title: XML 格式化
    description: 將您的 XML 字串美化為友善、易讀的格式。
    guide:
      intro: '替 XML 文件加上縮排，讓結構容易閱讀，可設定縮排大小，並可選擇讓簡短的文字內容和元素留在同一行。不合法的 XML 會回報錯誤而不是硬排版。'
      useCases:
        - '閱讀被壓成單行的 XML 內容、SOAP 封包或設定檔。'
        - '提交之前統一 XML 檔的格式，讓 diff 只顯示真正的修改。'
        - '檢查一份 XML 文件是否格式良好（well-formed）。'
      steps:
        - '把 XML 貼進左側欄位。'
        - '設定縮排大小（0 到 10 個空格），並切換「Collapse content」。'
        - '複製整理後的結果。'
      notes:
        - '「Collapse content」會讓元素和它的文字留在同一行（<name>Ann</name>）。關掉後文字會移到獨立的縮排行，更整齊但也更長。'
        - '格式化會改變元素之間的空白，通常不影響意義。但在文字內的空白有意義的文件（混合內容、預先排版的文字）中，請檢查結果。'
        - '檢查只測試格式良好與否：標籤成對、正確巢狀、屬性加引號。不會對照 DTD 或 XML Schema 驗證。'
        - '註解、CDATA 區段與 XML 宣告都會保留。'
      faq:
        - q: '為什麼我的 XML 被判定為不合法？'
          a: '常見原因：標籤沒關閉、文字中有未轉義的 & 或 <（要寫成 &amp; 與 &lt;）、屬性值沒加引號，或有多個根元素。HTML 不是 XML，所以 HTML 網頁通常也會失敗。'
        - q: '可以反過來壓縮 XML 嗎？'
          a: '不能直接做。把縮排大小設為 0 可以去掉縮排，得到緊湊但仍有換行的文件。'

  temperature-converter:
    title: 溫度轉換器
    description: 在克耳文、攝氏、華氏、蘭金、德利爾、牛頓、列氏與羅默等溫標之間轉換。

  chmod-calculator:
    title: Chmod 計算器
    description: 使用這個線上 chmod 計算器，計算您的 chmod 權限與指令。

  rsa-key-pair-generator:
    title: RSA 金鑰對產生器
    description: 產生一組新的隨機 RSA 私鑰與公鑰 PEM 憑證金鑰對。
    guide:
      intro: '產生一組全新的隨機 RSA 私鑰與公鑰，並以 PEM 文字顯示。產生過程在瀏覽器中以背景工作執行緒完成，頁面不會卡住，金鑰也不會傳到任何地方。'
      useCases:
        - '建立一組用完即丟的金鑰，測試簽章、加密、SSH 或 JWT 的程式。'
        - '替本機開發環境或教學範例產生金鑰。'
        - '嘗試不同的金鑰長度，看產生需要多久。'
      steps:
        - '設定位元數（預設 2048，範圍 256 到 16384，以 8 為間隔）。'
        - '等待金鑰產生；長度越大，花的時間越明顯越長。'
        - '複製公鑰和私鑰，或按按鈕重新產生一組。'
      notes:
        - '至少使用 2048 位元；長期使用的金鑰建議 3072 或 4096。低於 2048 位元的金鑰被認為不安全，在這裡只用於實驗。'
        - '4096 位元以上的金鑰可能要數秒到更久才能產生，時間不固定，因為是隨機搜尋質數。'
        - '私鑰是傳統格式（-----BEGIN RSA PRIVATE KEY-----，PKCS#1），公鑰是 -----BEGIN PUBLIC KEY-----。有些函式庫需要 PKCS#8（-----BEGIN PRIVATE KEY-----），可用以下指令轉換：openssl pkcs8 -topk8 -nocrypt -in key.pem。'
        - '不要把在網頁上產生的金鑰用在正式系統或任何有價值的東西。那些金鑰請在可信任的機器上用 openssl 或雲端平台的金鑰管理服務產生。'
      faq:
        - q: '產生的金鑰真的是隨機的嗎？'
          a: '是的。產生過程使用 node-forge 函式庫與瀏覽器的安全亂數來源，每次按下去都會建立獨立的金鑰。但和所有網頁工具一樣，您無法審查正在使用的頁面，所以正式環境的金鑰仍應在其他地方產生。'
        - q: '為什麼頁面要一段時間才產生金鑰？'
          a: '慢的部分是尋找兩個很大的隨機質數，而且耗時會隨金鑰長度快速增加。2048 位元的金鑰通常幾秒內就會出現。'

  html-wysiwyg-editor:
    title: HTML 所見即所得編輯器
    description: 功能豐富的線上所見即所得 HTML 編輯器，可即時產生內容的原始碼。

  yaml-to-toml:
    title: YAML 轉 TOML
    description: 解析 YAML 並轉換為 TOML。
    guide:
      intro: '把 YAML 文件直接轉成 TOML，不必手動經過 JSON。專案從 YAML 設定改用 TOML，或某個工具只讀 TOML 時很方便。'
      useCases:
        - '把設定檔從 YAML 遷移到 TOML，例如改成 pyproject.toml。'
        - '從文件中找到的 YAML 範例產生 TOML 片段。'
        - '比較同一份資料在兩種格式中的寫法。'
      steps:
        - '把 YAML 貼進左側欄位。'
        - '右側會顯示 TOML。'
        - '複製結果。'
      notes:
        - '結果要符合 TOML 的規則：最上層必須是對應表（mapping），null 值會被丟掉。最上層是清單或純量的 YAML 文件不會有輸出。'
        - 'YAML 的隱含型別會先發生：沒加引號的 true 在轉換前就已經變成布林值，1.10 變成數字。想維持字串請在 YAML 中加引號。'
        - '錨點、別名與合併鍵會被展開，所以重複的資料在 TOML 中會完整寫出。'
        - '註解不會帶過去。'
      faq:
        - q: '錯誤訊息說我的 JSON 不合法，但我貼的是 YAML？'
          a: '這個訊息是通用的，意思是 YAML 無法解析。如果 YAML 合法但輸出一直是空的，文件的最上層很可能是清單或純量，TOML 無法表示。'
        - q: '為什麼 TOML 中少了一些鍵？'
          a: '值為 null 的鍵（YAML 中的空值也會解析成 null）會被省略，因為 TOML 無法表示 null。'

  mac-address-generator:
    title: MAC 位址產生器
    description: 輸入數量與前綴，即可以您選擇的大小寫（大寫或小寫）產生 MAC 位址

  json-diff:
    title: JSON 差異比對
    description: 比較兩個 JSON 物件，並找出它們之間的差異。
    guide:
      intro: '比較兩份 JSON 文件，以帶顏色標示的樹狀結構顯示哪些內容被新增、移除或修改。兩個輸入框都接受較寬鬆的 JSON5，所以註解和結尾逗號不會造成困擾。'
      useCases:
        - '比較部署前後的 API 回應，確切找出哪些欄位改變了。'
        - '檢視設定檔的兩個版本，不必依賴逐行的文字差異。'
        - '確認序列化程式或資料遷移產生的資料和原本一致。'
      steps:
        - '把原始的 JSON 貼進第一個輸入框。'
        - '把要比較的 JSON 貼進第二個輸入框。'
        - '看下方的樹狀結果：新增、移除與修改的項目會被標示，未變動的項目則顯示作為上下文。'
      notes:
        - '物件是逐個鍵比較的，所以鍵的順序不影響結果，單純調整順序不會被視為差異。'
        - '陣列是依位置比較的。在開頭插入一個項目，後面所有項目都會往後移，可能出現大量「已修改」。順序沒有意義的陣列，請先排序或改用鍵值結構再比較。'
        - '值的型別改變（例如數字 1 變成字串 "1"）會被視為差異。'
        - '任一邊不是合法的 JSON 時，輸入框會顯示錯誤，也不會進行比較。'
      faq:
        - q: '這和一般的文字差異比對有什麼不同？'
          a: '文字比對是以行為單位，重新排版或調整鍵的順序都會產生大量雜訊。這個工具比對的是解析後的資料，所以只會顯示鍵、值與型別真正的差異。'
        - q: '可以忽略時間戳之類的特定欄位嗎？'
          a: '目前不行，請在比較前先從兩邊移除這些欄位。'

  jwt-parser:
    title: JWT 解析器
    description: 解析並解碼您的 JSON Web Token（JWT），顯示其內容。
    guide:
      intro: 'JSON Web Token（JWT）由三段以點號相連的 Base64URL 字串組成：標頭、帶有各種宣告（claims）的內容，以及簽章。這個工具會把標頭與內容解碼出來給您閱讀，並標示每個標準宣告的意思。'
      useCases:
        - 'API 回傳 401 時，確認權杖是否已過期、是不是發給別的對象（aud），或是缺少預期的權限範圍（scope）。'
        - '檢查登入流程發出的權杖，看後端實際收到哪些宣告，例如 sub、角色或租戶。'
        - '除錯時鐘誤差問題時，把 iat、nbf、exp 從 Unix 時間戳轉成看得懂的日期。'
      steps:
        - '把完整的權杖（三段以點號分隔）貼進輸入框。'
        - '從標頭看簽章演算法（alg）與權杖類型。'
        - '從內容看各項宣告；exp、nbf、iat 除了原始數字，也會顯示成本機時間。'
      notes:
        - '這個工具只做解碼，不會驗證簽章，所以能讀出內容不代表權杖是真的。簽章要在伺服器端驗證，或使用本站的「JWT 簽章與驗證」工具。'
        - '內容只是編碼，並未加密，拿到權杖的人都讀得到。不要把密碼或其他機密放進宣告。'
        - '解碼在瀏覽器內完成，權杖不會傳到任何地方。即便如此，仍有效的正式環境權杖要當成密碼看待，能用過期或測試用的權杖就盡量用。'
        - '日期會依您裝置的時區顯示，而 exp 與 iat 本身是以 UTC 為基準的 Unix 秒數。'
      faq:
        - q: '為什麼我的權杖無法解碼？'
          a: '有效的 JWT 一定是三段以點號分隔，且前兩段必須是 Base64URL 編碼的 JSON。常見原因是多帶了「Bearer 」前綴、複製時被截斷，或根本不是 JWT（例如隨機字串形式的不透明權杖）。'
        - q: '把權杖貼在這裡安全嗎？'
          a: '解碼在頁面本機執行，不會上傳。但權杖若仍有效，任何看到的人都能拿去使用，所以請避免把它貼進截圖、聊天室或會把資料送到伺服器的網站。'

  timestamp-batch-converter:
    title: '時間戳批次轉換'
    description: '一次把多筆 Unix 時間戳轉成你要的時區與格式。'
    input: '你的時間戳'
    inputPlaceholder: '一行一筆，或用逗號、分號、Tab 分隔…'
    output: '轉換結果'
    unit: '單位'
    format: '格式'
    timezone: '時區'
    result: '結果（{total} 筆中有 {valid} 筆有效）'
    units:
      auto: '自動偵測'
      seconds: '秒'
      milliseconds: '毫秒'
      microseconds: '微秒'
      nanoseconds: '奈秒'
    formats:
      iso8601: 'ISO 8601'
      iso9075: 'ISO 9075（yyyy-MM-dd HH:mm:ss）'
      dateOnly: '只要日期'
      timeOnly: '只要時間'
      verbose: '含星期與時區'
    columns:
      input: '輸入'
      unit: '單位'
      result: '結果（{timezone}）'
    errors:
      notANumber: '不是數字'
      outOfRange: '超出範圍'
    guide:
      intro: '一次轉換大量的 Unix 時間戳。把日誌、資料庫匯出檔或試算表裡的一整欄貼上來，就能得到您指定時區與格式的可讀日期，無效的行也會個別標示。'
      useCases:
        - '不必逐筆轉換，直接讀懂應用程式日誌或 API 回應裡的一整串 epoch 值。'
        - '把資料庫匯出的時間戳換成自己的時區，確認哪些落在某一天。'
        - '把數字時間戳轉成 ISO 8601 字串，貼進工單、測試資料或報告。'
      steps:
        - '貼上時間戳，可以一行一個，或用逗號、分號、Tab 分隔。'
        - '單位維持自動偵測，或手動選擇秒、毫秒、微秒、奈秒。'
        - '選擇輸出格式與時區，再閱讀或複製結果表格。'
      notes:
        - '自動偵測是看數字的位數：11 位以內視為秒，12 到 14 位視為毫秒，15 到 17 位視為微秒，更多則視為奈秒。很小的毫秒值（例如 1970 年附近）看起來會像秒，所以明確知道單位時請手動指定。'
        - '接受小數（例如 1700000000.5）和負數（1970 年以前的日期）。'
        - 'Unix 時間戳本身沒有時區。您選擇的時區只會改變顯示方式，不會改變它代表的那個時間點。'
        - '不是數字的行，或超出 JavaScript 日期可表示範圍的行會標示錯誤，其他行仍然會正常轉換。'
      faq:
        - q: '為什麼我的時間戳顯示成 1970 年的日期？'
          a: '這個值很可能是毫秒或微秒卻被當成秒，或是相反。請不要用自動偵測，改為明確指定單位。'
        - q: '一次可以貼多少筆？'
          a: '沒有固定上限。轉換在瀏覽器中進行，幾千行是瞬間完成，非常大量的內容則取決於您的裝置。'

