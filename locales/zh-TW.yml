    description: 將字串轉換為適合用於網址、檔名與 ID 的安全格式。

  encryption:
    title: 文字加密／解密
    description: 使用 AES、TripleDES、Rabbit 或 RC4 等加密演算法，將明文加密或將密文解密。
    guide:
      intro: '用密碼短語快速加密一段文字，可選 AES、TripleDES、Rabbit 或 RC4，也能解密以相同方式產生的文字。它以 CryptoJS 函式庫為基礎，其密碼短語模式與 OpenSSL 格式相容。'
      useCases:
        - '在傳送到不完全可信的管道之前，先保護一段簡短的筆記或程式片段。'
        - '給定密碼短語，解開網頁應用程式中用 CryptoJS 產生的值。'
        - '在教學中示範或測試以密碼短語為基礎的加密。'
      steps:
        - '輸入文字、密鑰（密碼短語）並選擇演算法，下方就會顯示加密後的文字。'
        - '要解密時，貼上加密後的文字，輸入相同的密鑰並選擇相同的演算法。'
        - '複製結果。密鑰或演算法錯誤時會顯示錯誤，而不是文字。'
      notes:
        - '輸出是以 U2FsdGVkX1 開頭的 Base64 字串，那是 Salted__ 經過編碼的結果。每次都會產生隨機鹽，所以同一段文字加密兩次會得到不同的結果，而且兩者都能正確解密。'
        - '金鑰與 IV 是用 OpenSSL 風格的金鑰推導（單輪、以 MD5 為基礎）從密碼短語產生的，抵擋猜測的能力很弱，請使用長且隨機的密碼短語。'
        - 'AES 是合理的選擇。TripleDES 速度慢且正在被淘汰，RC4 已被破解，Rabbit 很少使用，其他演算法是為了相容性而提供。'
        - '沒有驗證機制，所以被修改過的密文可能解出亂碼而不是乾淨地失敗。這不適合用來保護真正的機密或密碼。'
      faq:
        - q: '為什麼相同的輸入每次結果都不同？'
          a: '因為有隨機鹽，這是刻意的設計：避免兩則相同的訊息產生相同的密文。解密時會從密文開頭讀回鹽。'
        - q: '什麼時候該改用 AES 進階工具？'
          a: '需要配合其他系統所用的特定金鑰、IV 與模式時。這個工具把這些細節隱藏起來，無法重現它們。'

  aes-advanced-encryption:
    title: AES 進階加密／解密
    description: 使用明確指定的金鑰與 IV（hex、base64 或文字），以 CBC、GCM、CTR 或 ECB 模式進行 AES 加密與解密，方便與其他系統互通。
    guide:
      intro: '使用您自己指定的金鑰與 IV，以 CBC、GCM、CTR 或 ECB 模式進行 AES 加密與解密。和以密碼短語為基礎的工具不同，它能精確重現其他系統或函式庫的做法，這正是做互通性測試所需要的。'
      useCases:
        - '給定金鑰與 IV，重現 API 或舊系統預期的密文，或解開它傳來的值。'
        - '確認自己寫的程式對測試向量加密後，和參考實作得到相同的位元組。'
        - '學習模式、IV 長度與填充（padding）如何改變輸出。'
      steps:
        - '選擇模式，輸入金鑰，並選擇它的編碼（十六進位、base64 或 UTF-8 文字）。'
        - '用同樣的方式輸入 IV 或 nonce；ECB 不需要。GCM 還可以加入選用的額外驗證資料。'
        - '輸入明文就會得到您所選編碼的密文；在解密區貼上密文，則會顯示明文。'
      notes:
        - '金鑰長度必須剛好是 16、24 或 32 位元組（AES-128、192、256），工具會告訴您收到的長度。請注意 64 個字元的十六進位金鑰是 32 位元組，但同樣 64 個字元若當成文字輸入就是 64 位元組，會被拒絕。'
        - 'CBC 與 CTR 需要 16 位元組的 IV，GCM 使用 12 位元組的 nonce（建議），ECB 不使用 IV。'
        - 'GCM 是帶驗證的加密：16 位元組的驗證標籤會附加在密文後面，只要內容被改過，解密就會失敗。CBC、CTR、ECB 則沒有完整性保護。'
        - '在 GCM 或 CTR 中，絕對不要用同一把金鑰重複使用同一個 IV，否則可能洩漏明文。每則訊息都要產生新的隨機 IV。'
        - 'ECB 會把相同的區塊加密成相同的結果，洩漏資料的規律，只為了相容性而提供，不要用在新的設計上。'
      faq:
        - q: '為什麼解密失敗或得到亂碼？'
          a: '幾乎都是設定不一致：金鑰或 IV 不同、模式選錯、密文編碼不對（十六進位與 base64），或在 GCM 中缺少驗證標籤、額外資料不同。請逐項對照產生資料的那個系統。'
        - q: '這和簡易的加密／解密工具一樣嗎？'
          a: '不一樣。簡易工具輸入的是密碼短語，並用隨機鹽自行推導金鑰與 IV，所以每次輸出都不同，也只和採用相同做法的工具相容。這個工具直接使用原始的金鑰與 IV，每個位元組都由您決定。'

