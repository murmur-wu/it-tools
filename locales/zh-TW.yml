  csv-to-json:
    title: 'CSV 轉 JSON'
    description: '把 CSV（或 TSV）解析成 JSON，可自動偵測分隔符號、轉換型別，並提供表格預覽。'
    input: '你的 CSV'
    inputPlaceholder: '把 CSV 貼在這裡…'
    output: '轉換後的 JSON'
    preview: '表格預覽'
    previewTruncated: '顯示前 {shown} 列，共 {total} 列。'
    delimiter: '分隔符號'
    autoDetect: '自動偵測'
    comma: '逗號（,）'
    semicolon: '分號（;）'
    tab: 'Tab'
    pipe: '直線（|）'
    indent: '縮排空格數'
    hasHeader: '第一列是標題'
    inferTypes: '轉換數字與布林值'
    trimValues: '去除值前後空白'
    guide:
      intro: 'CSV 是試算表與資料庫最通用的交換格式，JSON 則是 API 與程式最常用的格式。這個工具依 RFC 4180 解析 CSV，正確處理引號內的逗號與換行，並輸出結構化的 JSON。'
      useCases:
        - '把 Excel 或 Google 試算表匯出的資料餵給 API 或前端程式。'
        - '拿到一份 CSV，想先用表格預覽確認欄位對齊、有沒有解析錯位。'
        - '把資料庫匯出的 CSV 轉成 JSON 當作測試資料或設定檔。'
      steps:
        - '把 CSV 內容貼進輸入框，分隔符號預設自動偵測。'
        - '在表格預覽確認欄位切得正確，特別注意含逗號的欄位有沒有被切開。'
        - '視需要調整「第一列是標題」「轉換數字與布林值」等選項。'
        - '從下方的 JSON 輸出複製結果。'
      notes:
        - '含有逗號、換行或雙引號的欄位，在 CSV 裡必須用雙引號包住，內部的雙引號要寫成兩個。工具會正確還原這類欄位。'
        - '「轉換數字與布林值」刻意保守：像 007、1.0、超過安全整數範圍的長數字都會保持字串，避免靜默失真。'
        - '如果自動偵測選錯分隔符號，手動指定即可。分號常見於歐洲地區的 Excel 匯出檔。'
        - '所有解析都在你的瀏覽器裡完成，資料不會上傳。'
      faq:
        - q: '中文顯示成亂碼怎麼辦？'
          a: '那是檔案編碼問題，不是這個工具造成的。Excel 匯出的 CSV 常是 Big5 或帶 BOM 的 UTF-8。用文字編輯器另存成 UTF-8 之後再貼進來即可。'
        - q: '可以反過來把 JSON 轉成 CSV 嗎？'
          a: '可以，用「JSON 轉 CSV」那個工具。兩者的引號處理都遵循 RFC 4180，所以來回轉換不會失真。'

  json-to-csv:
    title: JSON 轉 CSV
    description: 將 JSON 轉換為 CSV，並自動偵測欄位標題。
    guide:
      intro: '把 JSON 物件陣列轉成 CSV。標題列由所有物件出現過的鍵聯集而成，所以欄位不一致的紀錄也會對齊到正確的欄。'
      useCases:
        - '在 Excel 或 Google 試算表中開啟 API 回應或資料庫匯出的資料。'
        - '把一份紀錄清單交給習慣用試算表工作的同事。'
        - '把 JSON 日誌或問卷結果轉換後在 BI 工具中分析。'
      steps:
        - '貼上 JSON 物件陣列，例如 [{''{''}"name":"Ann","age":30{''}''},{''{''}"name":"Bob"{''}''}]。接受 JSON5 語法。'
        - '右側會顯示 CSV：第一行是標題，之後每個物件一行。'
        - '複製結果並存成 .csv 檔。'
      notes:
        - '標題是所有鍵的聯集，依第一次出現的順序排列。缺少的鍵會是空白儲存格；值為 null 會寫成 null。'
        - '含有逗號或雙引號的欄位會加引號，內部的引號會寫成兩個，符合 RFC 4180。值裡的換行會寫成 \n，讓每筆紀錄維持一行。'
        - '巢狀物件與陣列不會被攤平：會顯示成 [object Object]，或是以逗號相連的項目。轉換前請先把資料攤平（例如 address.city）。'
        - '輸入必須是物件陣列。單一物件或純量陣列無法產生有用的表格。'
      faq:
        - q: '為什麼某一欄顯示 [object Object]？'
          a: '那個欄位放的是巢狀物件。CSV 是平面的，請先把巢狀資料攤平成獨立的鍵，例如 address_city，再轉換。'
        - q: 'Excel 把所有內容塞在同一欄，怎麼回事？'
          a: '某些語系的 Excel 預期分號作為分隔符號。請用「資料 > 從文字/CSV」匯入並選逗號作為分隔符號，或改用 Google 試算表開啟。'

  camera-recorder:
    title: 相機錄影
    description: 使用網路攝影機或相機拍照或錄影。

  keycode-info:
    title: 按鍵代碼資訊
    description: 查詢任意按鍵在 JavaScript 中的 keycode、code、位置與修飾鍵。

  emoji-picker:
    title: Emoji 選擇器
    description: 輕鬆複製與貼上 Emoji，並取得每個 Emoji 的 Unicode 與 code point 值。

  color-converter:
    title: 顏色轉換器
    description: 在不同的顏色格式（hex、rgb、hsl 與 CSS 顏色名稱）之間轉換

  bcrypt:
    title: Bcrypt
    description: 使用 bcrypt 對文字進行雜湊與比對。Bcrypt 是一種基於 Blowfish 加密演算法的密碼雜湊函式。
    guide:
      intro: 'bcrypt 是以 Blowfish 加密演算法為基礎的密碼雜湊函式。和一般的雜湊不同，它刻意設計得很慢，還會加入隨機鹽（salt），讓外洩的密碼資料庫更難被破解。這個工具可以產生 bcrypt 雜湊，也能檢查某段文字是否符合既有的雜湊。'
      useCases:
        - '替測試帳號產生雜湊，放進資料庫或種子（seed）腳本。'
        - '除錯登入問題時，確認資料庫中的雜湊是否真的對應某組密碼。'
        - '試不同的成本係數，看在您的裝置上雜湊要多久，再決定正式環境用多少。'
      steps:
        - '在雜湊區塊輸入文字，並設定 salt 次數（成本係數，預設 10）。'
        - '複製產生的雜湊，開頭是 $2，接著是成本與鹽。'
        - '在比對區塊輸入文字與雜湊，看結果是否相符。'
      notes:
        - '次數每加 1，運算量大約變成兩倍。目前常見設定是 10 到 12；設得越高，每個人登入都會越慢，太高甚至會讓這個頁面卡住。'
        - '每次的結果都不同，因為每次都會產生新的隨機鹽。同一段文字的兩個不同雜湊都是有效的，所以驗證時必須用比對功能，不能直接比較字串。'
        - 'bcrypt 只會讀取輸入的前 72 個位元組，超過的部分（包括很長的密碼短語）會被忽略。'
        - '雜湊在瀏覽器中計算。不要在任何線上工具輸入真實使用者的密碼，包括這個工具，請用測試值。'
      faq:
        - q: '為什麼我算出的雜湊和資料庫裡的不一樣？'
          a: '這是正常的。鹽是隨機的，而且存放在雜湊裡面，所以同一組密碼每次產生的字串都不同。請用比對功能驗證，它會從雜湊中讀出鹽再計算。'
        - q: '成本係數該選多少？'
          a: '選一個能讓單次雜湊在正式環境硬體上約耗時 100 到 300 毫秒的最高值，之後隨著電腦變快，每隔幾年再檢討調整。'

  crontab-generator:
    title: Crontab 產生器
    description: 驗證並產生 crontab，並取得 cron 排程的易讀說明。
    verbose: '詳細說明'
    use24Hour: '使用 24 小時制'
    daysStartAtZero: '星期從 0 開始'
    invalid: '這個 cron 表達式無效'
    nextRuns: '接下來的執行時間'
    timezone: '時區'
    runAt: '執行時間（{timezone}）'
    rebootHint: '這個表達式只在系統啟動時執行一次，沒有排程可以預覽。'
    noNextRuns: '輸入有效的 cron 表達式即可預覽接下來的執行時間。'
    builder:
      title: '組出表達式'
      frequency: '頻率'
      everyMinutes: '每幾分鐘'
      minute: '分'
      hour: '時'
      dayOfWeek: '星期'
      dayOfMonth: '日'
      month: '月份'
      apply: '套用這個表達式'
      frequencies:
        minutely: '每幾分鐘'
        hourly: '每小時'
        daily: '每天'
        weekly: '每週'
        monthly: '每月'
        yearly: '每年'
      weekDays:
        0: '星期日'
        1: '星期一'
        2: '星期二'
        3: '星期三'
        4: '星期四'
        5: '星期五'
        6: '星期六'
      months:
        1: '一月'
        2: '二月'
        3: '三月'
        4: '四月'
        5: '五月'
        6: '六月'
        7: '七月'
        8: '八月'
        9: '九月'
        10: '十月'
        11: '十一月'
        12: '十二月'
    guide:
      intro: 'Cron 是 Unix 與 Linux 上的排程格式，用五個（或六個）欄位描述「什麼時候要執行」。這個工具幫你驗證表達式、翻成易讀的說明，並列出接下來幾次實際的執行時間，讓你在寫進 crontab 之前就先確認排程是對的。'
      useCases:
        - '設定伺服器的定期備份、日誌輪替或資料同步，寫完想先確認排程真的如預期。'
        - '看到同事或舊專案留下的 cron 表達式，想知道它到底多久跑一次。'
        - '設定 GitHub Actions、Kubernetes CronJob 或 Cloudflare Workers 的排程，這些平台都用同一套語法。'
      steps:
        - '在上方輸入框填入 cron 表達式，或用下方的「組出表達式」用選單組出來再套用。'
        - '看中間那行易讀說明，確認語意與你想的一致。'
        - '在「接下來的執行時間」選擇時區，核對列出的五次時間點。'
      notes:
        - '五欄格式是「分 時 日 月 星期」，六欄則在最前面多一個「秒」。多數伺服器的 crontab 只支援五欄，秒欄位常見於應用層的排程器。'
        - '星期日可以寫 0 或 7，兩者等價。「星期從 0 開始」的開關只影響易讀說明的文字，不影響表達式本身。'
        - '時區很重要。伺服器的 crontab 通常跑在系統時區（常是 UTC），而不是你所在的時區，所以務必用時區選單核對。'
        - "{'@'}reboot 只在系統啟動時執行一次，沒有固定排程，因此不會列出執行時間。"
      faq:
        - q: '每 15 分鐘執行一次要怎麼寫？'
          a: '寫成 */15 * * * *。斜線代表間隔，所以會在每小時的 0、15、30、45 分執行。'
        - q: '為什麼我的排程在伺服器上跑的時間跟這裡顯示的不一樣？'
          a: '幾乎都是時區問題。用 date 指令確認伺服器時區，再把上面的時區選單切到同一個時區重新核對。另一個常見原因是 crontab 的 PATH 與登入 shell 不同，導致指令找不到而沒有實際執行。'

  http-status-codes:
    title: HTTP 狀態碼
    description: 所有 HTTP 狀態碼的清單，包含名稱與含義。
    guide:
      intro: '可搜尋的 HTTP 狀態碼速查表，收錄所有標準狀態碼，依五大類（1xx 資訊、2xx 成功、3xx 重新導向、4xx 客戶端錯誤、5xx 伺服器錯誤）分組，每個都有正式名稱與簡短說明。'
      useCases:
        - '查詢在日誌、瀏覽器網路面板或 API 回應中看到的陌生狀態碼。'
        - '替 API 端點選擇正確的回傳碼，例如 204 還是 200、401 還是 403。'
        - '複習相似狀態碼的差別，例如 301、302、307、308。'
      steps:
        - '在搜尋框輸入狀態碼、名稱或關鍵字；結果會隨輸入即時更新，並支援模糊比對。'
        - '搜尋框留空可以依分類瀏覽全部狀態碼。'
        - '閱讀您需要的狀態碼的名稱與說明。'
      notes:
        - '第一個數字代表分類：2xx 請求成功、3xx 到別處找、4xx 客戶端弄錯了、5xx 伺服器失敗。遇到不認識的狀態碼，應依它的分類處理。'
        - '401 表示未驗證（沒有憑證或憑證無效），403 表示已驗證但沒有權限。選錯會讓客戶端困惑，也可能洩漏資訊。'
        - '301 與 308 是永久重新導向，302 與 307 是暫時的。307 與 308 會保留請求方法與內容，而 301 與 302 時瀏覽器可能把 POST 改成 GET。'
        - '有些狀態碼只屬於特定的協定擴充，或是非正式的（例如 418 與 451）；在依賴某個狀態碼之前，先確認您的框架與客戶端支援它。'
      faq:
        - q: 'API 找不到資源時應該回傳哪個狀態碼？'
          a: '路徑正確但資源不存在用 404；資源曾經存在但已刻意移除用 410。如果問題出在請求內容而不是路徑，用 400 或 422。'
        - q: '500、502、503、504 有什麼差別？'
          a: '500 是泛用的伺服器錯誤；502 表示閘道從上游伺服器收到無效回應；503 表示服務暫時無法使用或過載；504 表示上游沒有在時限內回應。'

  sql-prettify:
    title: SQL 美化與格式化
    description: 線上格式化並美化您的 SQL 查詢（支援多種 SQL 方言）。
    guide:
      intro: '把 SQL 整理成一致縮排、易讀的版面，可選擇資料庫方言（PostgreSQL、MySQL、SQL Server、BigQuery 等）、關鍵字大小寫與縮排樣式。由 sql-formatter 函式庫驅動。'
      useCases:
        - '從日誌、ORM 或 BI 工具複製出來的一長串查詢，先整理成可讀再除錯。'
        - '提交或貼進審查之前，統一查詢的風格。'
        - '整理腳本產生的單行查詢。'
      steps:
        - '選擇符合您資料庫的方言，讓它特有的關鍵字與語法能被正確辨識。'
        - '選擇關鍵字大小寫（大寫、小寫或保留）與縮排樣式。'
        - '貼上查詢，複製整理後的結果。'
      notes:
        - '格式化只調整空白與關鍵字大小寫，絕不改變查詢的意義，也不會對照資料庫結構做驗證。'
        - '選錯方言可能誤讀方言特有的語法（例如 T-SQL 的中括號或 PostgreSQL 的 :: 轉型），產生奇怪的斷行。Standard SQL 是安全的保底選項。'
        - '表格式縮排會把關鍵字對齊成一欄，有些團隊偏好用在很長的 SELECT 清單；Standard 則是常見的巢狀版面。'
        - '以分號分隔的多個敘述會依序逐一格式化。'
      faq:
        - q: '為什麼某個語法附近的輸出看起來不對？'
          a: '最可能是方言不符。請切換到您資料庫的方言；如果是不常見的語法，Standard SQL 可能會格式化得比較穩定。'
        - q: '格式化會改變資料庫執行查詢的方式嗎？'
          a: '不會。空白與關鍵字大小寫對資料庫沒有影響，字串常值與識別字也都不會被動到，查詢的行為完全一樣。'

  benchmark-builder:
    title: 效能測試建構器
    description: 用這個簡單的線上效能測試建構器，輕鬆比較各項任務的執行時間。

  git-memo:
    title: Git 速查表
    description: Git 是一套分散式版本控制軟體。透過這份速查表，您可以快速找到最常用的 git 指令。

  slugify-string:
    title: 字串 Slug 化
    description: 將字串轉換為適合用於網址、檔名與 ID 的安全格式。
    guide:
      intro: '把任意文字轉成 slug：以連字號分隔的小寫 ASCII 字母與數字，可以安全地用在網址、檔名或 HTML id。帶重音的字母會轉寫成基本字母，符號會被移除或改寫成單字。'
      useCases:
        - '從部落格文章或商品頁的標題產生網址路徑。'
        - '從使用者輸入的標籤建立沒有空格與特殊字元的檔案或資料夾名稱。'
        - '替產生的 HTML 標題建立錨點 id。'
      steps:
        - '貼上文字，例如一個標題。'
        - '下方會顯示 slug，隨輸入即時更新。'
        - '複製它。'
      notes:
        - '帶重音與特殊的拉丁字母會被轉寫（é 變 e、ö 變 oe、ß 變 ss），& 會變成 and，其他非字母數字的字元都會變成連字號。連續的連字號會合併，開頭與結尾的連字號會移除。'
        - '中文、日文、阿拉伯文等非拉丁文字在這裡沒有轉寫規則，會被直接丟掉。只用這些文字寫的標題會得到空的 slug，請提供拉丁字母的標題，或先用轉寫工具處理。'
        - '單字內的大小寫變化會被視為單字邊界，所以 fooBar 會變成 foo-bar。'
        - 'slug 不保證唯一。只差在標點或重音的兩個標題會產生相同的 slug，所以系統通常會在後面加上 id 或流水號。'
      faq:
        - q: '為什麼網址用 slug 比直接用原始標題好？'
          a: '它可以避免百分比編碼、容易閱讀、在處理 Unicode 有問題的系統間也穩定，而且是搜尋引擎與使用者預期的形式。連字號比底線好，因為搜尋引擎把連字號當成單字分隔。'
        - q: '為什麼我的中文標題什麼都沒產生？'
          a: '這個函式庫只轉寫拉丁字母系的字元。其他文字請先翻譯或羅馬化（例如用拼音）再做 slug。'

  encryption:
    title: 文字加密／解密
    description: 使用 AES、TripleDES、Rabbit 或 RC4 等加密演算法，將明文加密或將密文解密。
    guide:
      intro: '用密碼短語快速加密一段文字，可選 AES、TripleDES、Rabbit 或 RC4，也能解密以相同方式產生的文字。它以 CryptoJS 函式庫為基礎，其密碼短語模式與 OpenSSL 格式相容。'
      useCases:
        - '在傳送到不完全可信的管道之前，先保護一段簡短的筆記或程式片段。'
        - '給定密碼短語，解開網頁應用程式中用 CryptoJS 產生的值。'
        - '在教學中示範或測試以密碼短語為基礎的加密。'
      steps:
        - '輸入文字、密鑰（密碼短語）並選擇演算法，下方就會顯示加密後的文字。'
        - '要解密時，貼上加密後的文字，輸入相同的密鑰並選擇相同的演算法。'
        - '複製結果。密鑰或演算法錯誤時會顯示錯誤，而不是文字。'
      notes:
        - '輸出是以 U2FsdGVkX1 開頭的 Base64 字串，那是 Salted__ 經過編碼的結果。每次都會產生隨機鹽，所以同一段文字加密兩次會得到不同的結果，而且兩者都能正確解密。'
        - '金鑰與 IV 是用 OpenSSL 風格的金鑰推導（單輪、以 MD5 為基礎）從密碼短語產生的，抵擋猜測的能力很弱，請使用長且隨機的密碼短語。'
        - 'AES 是合理的選擇。TripleDES 速度慢且正在被淘汰，RC4 已被破解，Rabbit 很少使用，其他演算法是為了相容性而提供。'
        - '沒有驗證機制，所以被修改過的密文可能解出亂碼而不是乾淨地失敗。這不適合用來保護真正的機密或密碼。'
      faq:
        - q: '為什麼相同的輸入每次結果都不同？'
          a: '因為有隨機鹽，這是刻意的設計：避免兩則相同的訊息產生相同的密文。解密時會從密文開頭讀回鹽。'
        - q: '什麼時候該改用 AES 進階工具？'
          a: '需要配合其他系統所用的特定金鑰、IV 與模式時。這個工具把這些細節隱藏起來，無法重現它們。'

  aes-advanced-encryption:
    title: AES 進階加密／解密
    description: 使用明確指定的金鑰與 IV（hex、base64 或文字），以 CBC、GCM、CTR 或 ECB 模式進行 AES 加密與解密，方便與其他系統互通。
    guide:
      intro: '使用您自己指定的金鑰與 IV，以 CBC、GCM、CTR 或 ECB 模式進行 AES 加密與解密。和以密碼短語為基礎的工具不同，它能精確重現其他系統或函式庫的做法，這正是做互通性測試所需要的。'
      useCases:
        - '給定金鑰與 IV，重現 API 或舊系統預期的密文，或解開它傳來的值。'
        - '確認自己寫的程式對測試向量加密後，和參考實作得到相同的位元組。'
        - '學習模式、IV 長度與填充（padding）如何改變輸出。'
      steps:
        - '選擇模式，輸入金鑰，並選擇它的編碼（十六進位、base64 或 UTF-8 文字）。'
        - '用同樣的方式輸入 IV 或 nonce；ECB 不需要。GCM 還可以加入選用的額外驗證資料。'
        - '輸入明文就會得到您所選編碼的密文；在解密區貼上密文，則會顯示明文。'
      notes:
        - '金鑰長度必須剛好是 16、24 或 32 位元組（AES-128、192、256），工具會告訴您收到的長度。請注意 64 個字元的十六進位金鑰是 32 位元組，但同樣 64 個字元若當成文字輸入就是 64 位元組，會被拒絕。'
        - 'CBC 與 CTR 需要 16 位元組的 IV，GCM 使用 12 位元組的 nonce（建議），ECB 不使用 IV。'
        - 'GCM 是帶驗證的加密：16 位元組的驗證標籤會附加在密文後面，只要內容被改過，解密就會失敗。CBC、CTR、ECB 則沒有完整性保護。'
        - '在 GCM 或 CTR 中，絕對不要用同一把金鑰重複使用同一個 IV，否則可能洩漏明文。每則訊息都要產生新的隨機 IV。'
        - 'ECB 會把相同的區塊加密成相同的結果，洩漏資料的規律，只為了相容性而提供，不要用在新的設計上。'
      faq:
        - q: '為什麼解密失敗或得到亂碼？'
          a: '幾乎都是設定不一致：金鑰或 IV 不同、模式選錯、密文編碼不對（十六進位與 base64），或在 GCM 中缺少驗證標籤、額外資料不同。請逐項對照產生資料的那個系統。'
        - q: '這和簡易的加密／解密工具一樣嗎？'
          a: '不一樣。簡易工具輸入的是密碼短語，並用隨機鹽自行推導金鑰與 IV，所以每次輸出都不同，也只和採用相同做法的工具相容。這個工具直接使用原始的金鑰與 IV，每個位元組都由您決定。'

  random-port-generator:
    title: 隨機連接埠產生器
    description: 產生「已知連接埠」範圍（0-1023）以外的隨機連接埠號碼。
    guide:
      intro: '在 1024 到 65535 之間隨機挑一個 TCP/UDP 連接埠號，避開需要管理員權限、保留給標準服務的知名連接埠範圍（0 到 1023）。'
      useCases:
        - '替新的開發伺服器、測試資料庫或本機服務挑一個不會和常見預設值撞到的連接埠。'
        - '替通道、代理或暫時的容器連接埠對應隨意挑一個埠號。'
        - '替設定檔產生測試值。'
      steps:
        - '閱讀產生的連接埠號。'
        - '按重新整理（或 Ctrl+Enter）再抽一個。'
        - '複製到您的設定中。'
      notes:
        - '1024 到 49151 是 IANA 分配給特定應用程式的註冊連接埠；隨機抽到的號碼可能正好是您機器上其他程式已在用的，例如 3306（MySQL）或 5432（PostgreSQL）。決定使用前請用 netstat、ss 或 lsof 確認。'
        - '49152 到 65535 是作業系統分配給對外連線用的動態（暫時）範圍。服務監聽這段可以運作，但偶爾會和正在使用的暫時連接埠衝突。'
        - '產生器不會檢查您的機器，它只是抽一個數字。'
      faq:
        - q: '為什麼要避開 1024 以下的連接埠？'
          a: '那些是知名連接埠（HTTP 80、HTTPS 443、SSH 22 等）。在多數系統上綁定它們需要 root 或管理員權限，也可能和標準服務衝突。'
        - q: '用隨機連接埠算是一種安全措施嗎？'
          a: '幾乎不算。連接埠掃描器幾秒內就能找到開放的埠，不常見的埠號只能減少自動探測的雜訊。請改用身分驗證與防火牆保護服務。'

  yaml-prettify:
    title: YAML 美化與格式化
    description: 將您的 YAML 字串美化為友善、易讀的格式。

  eta-calculator:
    title: 預計完成時間計算器
    description: 用於估算任務大約完成時間的 ETA（預計完成時間）計算器，例如檔案下載的完成時間與所需時長。

  roman-numeral-converter:
    title: 羅馬數字轉換器
    description: 將羅馬數字轉換為阿拉伯數字，或將阿拉伯數字轉換為羅馬數字。

  hmac-generator:
    title: HMAC 產生器
    description: 使用密鑰與您偏好的雜湊函式，計算雜湊訊息驗證碼（HMAC）。
    guide:
      intro: '計算 HMAC，也就是把訊息和密鑰混在一起產生的雜湊，可使用 MD5、SHA-1、SHA-2（224、256、384、512）、SHA-3 或 RIPEMD-160。HMAC 能證明訊息是由知道密鑰的人產生，而且傳遞過程中沒有被改動。'
      useCases:
        - '驗證服務用共享密鑰對請求內容簽署的 Webhook 簽章。'
        - '重現 API 預期的簽章（請求簽署、簽名網址），找出自己的簽章為什麼被拒絕。'
        - '拿已知正確的結果檢查自己的 HMAC 實作。'
      steps:
        - '在明文欄位輸入訊息，在密鑰欄位輸入共享密鑰。'
        - '選擇雜湊函式，一般使用 SHA256。'
        - '選擇輸出編碼（十六進位、base64、base64url 或二進位），複製 HMAC。'
      notes:
        - '訊息和密鑰都是當成 UTF-8 文字處理。如果您的密鑰是二進位，或以十六進位、base64 提供，請先解碼；否則工具會把那串文字的字元本身當成密鑰。'
        - '訊息中多一個空白或換行，整個結果就會完全不同，所以請貼上實際被簽署的位元組，例如原始的請求內容，而不是重新排版過的版本。'
        - '建議使用 SHA-256 或更強的函式。HMAC-MD5 與 HMAC-SHA1 作為訊息驗證碼仍被認為安全，但主要是為了舊系統而保留。'
        - '在伺服器上請以固定時間的方式比較 HMAC（例如 crypto.timingSafeEqual），而不是用一般的字串比較。'
      faq:
        - q: 'HMAC 和單純的雜湊有什麼不同？'
          a: '單純的雜湊任何人都能算，所以只能偵測意外的變動。HMAC 需要密鑰，因此還能證明訊息的來源，並讓攻擊者無法偽造出相符的值。'
        - q: '為什麼我算出的 HMAC 和服務傳來的不一樣？'
          a: '常見原因是輸出編碼不同（十六進位與 base64）、密鑰應該先解碼、雜湊函式選錯，或是請求內容在您簽署之前已被框架修改過。'

  bip39-generator:
    title: BIP39 密語產生器
    description: 從既有或隨機的助記詞產生 BIP39 密語，或從密語取得助記詞。

  base64-file-converter:
    title: Base64 檔案轉換器
    description: 將字串、檔案或圖片轉換為 base64 表示形式。

  list-converter:
    title: 清單轉換器
    description: 這個工具可以處理以欄為主的資料，並對每一列套用各種變更（轉置、加上前綴與後綴、反轉清單、排序清單、轉為小寫、截斷內容）。
    guide:
      intro: '把一行一項的清單重新整理成需要的格式：修剪空白、去重複、轉小寫、排序或反轉，替每一項加上前綴與後綴，用分隔符號相連，再把整個清單包起來。常見的輸出是逗號分隔清單或可直接用在 SQL 的清單。'
      useCases:
        - '把從試算表複製的一欄轉成 ''a'', ''b'', ''c''，給 SQL 的 IN 子句或程式碼的陣列用。'
        - '清理清單：移除重複與空行、修剪空白、排序。'
        - '一次替每一項加上引號、括號或網址前綴。'
      steps:
        - '貼上項目，一行一個。'
        - '切換要做的轉換：修剪、去重複、轉小寫、排序、反轉、保留換行。'
        - '設定項目的前綴與後綴、分隔符號，以及整個清單的前綴與後綴，然後複製結果。'
      notes:
        - '轉換以固定順序進行：轉小寫、去重複、反轉、排序、修剪、移除空行，最後包裝與相連。因此去重複發生在修剪之前，即使開啟修剪，''a'' 與 ''a '' 仍是兩個項目；在意的話把修剪後的輸出再貼回來跑第二次。'
        - '排序是以文字方式按字母順序，所以 10 會排在 2 前面。需要數值順序時請先補零或在別處排序。'
        - '分隔符號只插在項目之間；搭配「Keep line breaks」可以得到一行一項、每行結尾仍有逗號的格式。'
        - '設定會記在這個瀏覽器中，下次開啟會是上次使用的配置。'
      faq:
        - q: '怎麼做出 SQL 的 IN 清單？'
          a: '把項目前綴與後綴各設為一個單引號，分隔符號設為逗號加空格，清單前綴與後綴設為 ( 與 )。a、b、c 三行就會變成 (''a'', ''b'', ''c'')。'
        - q: '為什麼重複的項目沒有被移除？'
          a: '項目是在轉小寫之後、修剪之前精確比對的，所以結尾空格或看不見的字元會讓兩項不同。請先只開修剪跑一次，再把結果貼回來做第二次去重複。'

  base64-string-converter:
    title: Base64 字串編碼／解碼
    description: 輕鬆將字串編碼為 base64，或從 base64 解碼。
    guide:
      intro: 'Base64 會把任意位元組轉成由 64 個可列印字元組成的文字，讓資料能通過只能處理文字的管道，例如 JSON 欄位、網址、電子郵件或 HTTP 標頭。這個工具可以把文字編碼成 Base64，也能解碼還原，並正確處理 UTF-8 字元。'
      useCases:
        - '解讀設定檔、HTTP 標頭或 JSON 資料中的 Base64 值，看裡面實際是什麼。'
        - '產生要放進環境變數或 Kubernetes Secret 清單的 Base64 字串。'
        - '產生可放在網址參數或類似 JWT 片段中的 URL 安全版本。'
      steps:
        - '要編碼時，在「String to encode」輸入或貼上文字，下方會顯示 Base64 結果。'
        - '要解碼時，在第二張卡片貼上 Base64 字串，下方會顯示解碼後的文字。'
        - '如果值要用在網址或 JWT 中，打開任一邊的 URL 安全選項。'
        - '用複製按鈕取用結果。'
      notes:
        - 'Base64 只是編碼，不是加密，任何人都能解開，無法用來保護機密。'
        - 'URL 安全版本會把 + 和 / 換成 - 和 _，並省略結尾的 = 補位。用錯選項解碼會顯示字串無效。'
        - '編碼後的資料約比原本大三分之一（3 個位元組變成 4 個字元）。'
        - '如果解碼出來的位元組不是合法文字（例如圖片、壓縮檔），在這裡看不出有意義的內容，二進位資料請改用檔案轉換工具。'
      faq:
        - q: '為什麼解碼時顯示字串無效？'
          a: '常見原因：URL 安全字串沒開 URL 安全選項解碼（或反過來）、含有不屬於字母表的字元，或複製時被截斷。'
        - q: '解碼後為什麼出現亂碼？'
          a: '原始位元組可能不是 UTF-8 文字，例如二進位檔案或其他編碼的文字。解碼只有對從 UTF-8 編碼來的文字才有意義。'

  toml-to-yaml:
    title: TOML 轉 YAML
    description: 解析 TOML 並轉換為 YAML。
    guide:
      intro: '把 TOML 文件轉成 YAML。從以 TOML 為主的工具把設定搬到需要 YAML 的工具時很有用，也可以用較熟悉的 YAML 排版檢視 TOML 檔。'
      useCases:
        - '把 TOML 設定轉成 Kubernetes、Compose、CI 或 Ansible 用的 YAML 檔。'
        - '把有許多巢狀表格的密集 TOML 檔讀成縮排的 YAML 樹。'
        - '從 TOML 文件準備 YAML 範例。'
      steps:
        - '把 TOML 貼進左側欄位。'
        - '右側會顯示 YAML。'
        - '複製結果。'
      notes:
        - 'TOML 的日期時間會變成 ISO 8601 時間戳，例如 1979-05-27T07:32:00.000Z，YAML 同樣把它視為時間戳。'
        - '像 [server.tls] 這樣的表格標頭在 YAML 中會變成巢狀對應表，[[items]] 表格陣列會變成對應表的清單。'
        - '註解會被丟掉。輸出使用兩個空格縮排。'
        - '會被 YAML 讀成其他型別的字串（true、1.0、null）會自動加引號以保留原意。'
      faq:
        - q: '為什麼 YAML 幫我某些值加了引號？'
          a: '只有讀回 YAML 時會改變型別的值才會加引號，例如字串 "on" 或以字串保存的數字。資料本身完全相同。'
        - q: '可以反過來轉嗎？'
          a: '可以，用「YAML 轉 TOML」工具，但文件最上層必須是對應表；null 值會被丟掉。'

  math-evaluator:
    title: 數學運算式計算器
    description: 用於計算數學運算式的計算機，可使用 sqrt、cos、sin、abs 等函式。

  json-to-yaml-converter:
    title: JSON 轉 YAML
    description: 使用這個線上即時轉換器，輕鬆將 JSON 轉換為 YAML。
    guide:
      intro: '即時把 JSON 轉成 YAML。YAML 是多數設定檔的格式（Kubernetes、GitHub Actions、Docker Compose、Ansible），這個工具讓您輸入或貼上 JSON，得到等價的 YAML 文件。'
      useCases:
        - '把 JSON 設定或 API 回應轉成 YAML 的 manifest 或 workflow 檔。'
        - '在手動編輯一份很長的設定檔之前，先看看 JSON 結構在 YAML 中長什麼樣。'
        - '把 JSON 測試資料轉成 Ansible、Helm 等工具需要的 YAML。'
      steps:
        - '把 JSON 貼進左側欄位。接受較寬鬆的 JSON5 語法（註解、結尾逗號、不加引號的鍵）。'
        - '右側會顯示 YAML，每次修改都會即時更新。'
        - '用複製按鈕取用結果。'
      notes:
        - 'JSON5 輸入中的註解會被丟掉：轉換是對解析後的資料進行，不是對文字。'
        - '會被 YAML 讀成其他型別的字串，例如 "true"、"null" 或寫成字串的數字，會自動加上引號以保留原意。yes、no 這類字在 YAML 1.2 中就是一般字串，不會加引號。'
        - '輸出使用兩個空格縮排與區塊樣式。含有空格的長字串可能會被折成多行，這仍是合法的 YAML，但看起來可能有點意外。'
        - '鍵的順序會保留。JSON 沒有註解、錨點或多文件的概念，所以輸出中也不會出現。'
      faq:
        - q: '為什麼有些字串有引號、有些沒有？'
          a: 'YAML 只在裸值會被解讀成其他東西時才需要引號，例如字串 "true" 或 "1.0"。轉換器就只在這些情況加引號。'
        - q: '可以把 YAML 轉回 JSON 嗎？'
          a: '可以，請用「YAML 轉 JSON」工具。來回轉換資料不會變，但註解和排版不會保留。'

  url-parser:
    title: URL 解析器
    description: 將 URL 解析為各個組成部分（協定、來源、參數、連接埠、使用者名稱與密碼等）
    guide:
      intro: '把網址拆成各個部分：通訊協定、使用者名稱與密碼、主機名稱、連接埠、路徑、查詢字串與片段（hash），並把每個查詢參數分開列出，使用的是和瀏覽器相同的網址解析器。'
      useCases:
        - '閱讀又長又亂的追蹤網址或 OAuth 轉址網址，看它實際帶了哪些參數。'
        - '確認程式組出來的網址，主機、連接埠與路徑是否符合預期。'
        - '不必手動數字元，直接取出主機名稱或某個參數的值。'
      steps:
        - '貼上完整網址，包含 https:// 這類的 scheme。'
        - '每個部分會顯示在各自的欄位中，旁邊的複製按鈕只複製那一部分。'
        - '往下捲到參數表格，可看到每個查詢鍵解碼後的值。'
      notes:
        - '網址必須是絕對網址。像 /api/users 這種純路徑，或沒有 scheme 的主機名稱會被判定為無效；在前面加上 https:// 就能解析。'
        - '網址使用該 scheme 的預設連接埠時（http 的 80、https 的 443），連接埠欄位會是空的，因為瀏覽器的解析器會把它正規化掉。'
        - '參數表格中的值已經過百分比解碼，而原始查詢字串欄位則維持原本的寫法。'
        - '同一個鍵出現多次（?tag=a&tag=b）時，表格只會顯示一次並取最後一個值。要看全部請看原始查詢字串。'
      faq:
        - q: '為什麼主機名稱的大寫字母消失了？'
          a: '主機名稱不分大小寫，所以解析器會轉成小寫。國際化網域名稱也會轉成 punycode（xn--）形式。'
        - q: '使用者名稱與密碼是用在哪裡的？'
          a: '那是嵌在主機前面、以 user:password{''@''} 形式寫的憑證，是舊的 HTTP 功能。現在的瀏覽器大多忽略它，而且請不要分享含有真實帳密的網址。'

  iban-validator-and-parser:
    title: IBAN 驗證與解析器
    description: 驗證並解析 IBAN 號碼。檢查 IBAN 是否有效，並取得國家、BBAN、是否為 QR-IBAN，以及 IBAN 的易讀格式。

  user-agent-parser:
    title: User-agent 解析器
    description: 從 user-agent 字串偵測並解析瀏覽器、引擎、作業系統、CPU 與裝置類型／型號。
    guide:
      intro: '用 ua-parser-js 函式庫把瀏覽器的 User-Agent 字串解讀成瀏覽器名稱與版本、渲染引擎、作業系統、裝置類型與型號，以及 CPU 架構。預設會帶入您自己瀏覽器的字串。'
      useCases:
        - '閱讀錯誤回報或伺服器日誌時，找出使用者當時用的瀏覽器與作業系統。'
        - '看看自己的瀏覽器對外宣告的資訊是什麼。'
        - '用真實的 User-Agent 字串建立或測試裝置偵測規則。'
      steps:
        - '貼上 User-Agent 字串，或直接使用預先帶入的瀏覽器字串。'
        - '閱讀各張卡片：瀏覽器、引擎、作業系統、裝置與 CPU。'
        - '空白的欄位表示字串中沒有那項資訊。'
      notes:
        - 'User-Agent 是瀏覽器自行宣告的，而且常刻意誤導：所有現代瀏覽器都自稱 Mozilla，Chrome 系瀏覽器會包含 Safari 和 AppleWebKit，Edge 會包含 Chrome。請相信解析結果，而不是原始文字。'
        - '從 2021 年起 Chrome 凍結了部分字串（reduced User-Agent）：Android 與 Windows 的版本不再精確，瀏覽器的次版號永遠是 0，Android 上通常也沒有裝置型號。'
        - '桌機瀏覽器很少回報裝置類型，在 PC 上裝置欄位空白是正常的。'
        - '解析是依函式庫的規則做啟發式判斷，非常新的瀏覽器或特殊的 App 可能會部分誤判。'
      faq:
        - q: '為什麼我的 iPad 顯示成 Mac？'
          a: '從 iPadOS 13 起，iPad 上的 Safari 會要求桌面版網站，並使用類似 Mac 的 User-Agent 字串。字串本身已經不再提到 iPad，所以任何解析器都分不出來。'
        - q: '為什麼作業系統版本看起來不對？'
          a: 'Chrome 與 Chromium 系瀏覽器回報的是凍結的通用版本（例如 Windows 11 顯示成 Windows 10）。精確版本只能透過 Client Hints 取得，User-Agent 字串裡沒有。'

  numeronym-generator:
    title: 數字縮寫產生器
    description: 數字縮寫（numeronym）是以數字組成縮寫的詞。例如「i18n」是「internationalization」的數字縮寫，18 代表第一個 i 與最後一個 n 之間的字母數量。
    guide:
      intro: '產生單字的數字縮寫（numeronym）：第一個字母、中間字母的數量、最後一個字母，也就是 i18n（internationalization）、l10n（localization）、a11y（accessibility）背後的規則。'
      useCases:
        - '替程式碼、資料夾名稱、工單或聊天中的長術語創造簡短的標籤。'
        - '解讀或核對既有的縮寫，例如 k8s 或 o11y。'
        - '替功能旗標或設定鍵挑選一致的短名稱。'
      steps:
        - '輸入一個單字。'
        - '旁邊會顯示它的數字縮寫。'
        - '複製它。'
      notes:
        - '三個字母以內的單字會原樣回傳，因為縮寫不會比原字短。'
        - '一次只處理一個單字；空格也會被算成字母，所以請輸入沒有空格或連字號的單一單字。'
        - '數字是第一個與最後一個字元之間的字元數，不是總長度：internationalization 有 20 個字母，所以變成 i18n。'
        - '數字縮寫很方便但對新人不透明，請在文件中定義一次。'
      faq:
        - q: 'k8s 代表什麼？'
          a: 'Kubernetes：k，接著 8 個字母 ubernete，再接 s。同理 o11y 是 observability，a11y 是 accessibility。'
        - q: '兩個不同的單字可能有相同的數字縮寫嗎？'
          a: '很容易：首尾字母相同且長度相同的任兩個單字就會撞到。只在上下文足以說明意思的地方使用數字縮寫。'

  case-converter:
    title: 大小寫轉換器
    description: 轉換字串的大小寫，並在多種格式之間選擇
    guide:
      intro: '一次把一段文字顯示成所有常見的命名慣例：小寫、大寫、camelCase、PascalCase、snake_case、CONSTANT_CASE、kebab-case（param case）、dot.case、path/case、Header-Case、Sentence case、Capital Case、no case 與 mOcKiNg cAsE。'
      useCases:
        - '在不同語言或層次之間轉換識別字，例如 JSON 欄位（snake_case）轉成 JavaScript 屬性（camelCase），再轉成 CSS 類別（kebab-case）。'
        - '從人類可讀的標籤產生常數名稱（CONSTANT_CASE）或檔案路徑（path/case）。'
        - '把風格不一致的標題或標籤統一成同一種寫法。'
      steps:
        - '在輸入欄位輸入或貼上文字。'
        - '下方會列出所有轉換結果，每個都有複製按鈕。'
        - '複製需要的那一種。'
      notes:
        - '單字是依空格、標點與大小寫變化切分的，所以 helloWorld、hello_world 和 Hello World 都會切成同樣的兩個字。數字會被當成分隔符號並移除（v2 會變成 v）。'
        - '小寫與大寫會保留原文只改字母；其他變體則是用切出來的單字重組，標點會被去掉。'
        - '帶重音的拉丁字母（é、ö、ñ）算是單字字元；中文、日文等其他文字不會被切成單字，在以單字為基礎的變體中可能被移除。'
        - 'Mocking case 逐字交替大小寫，空格也算在計數內，所以每個空格之後規律會重新開始。'
      faq:
        - q: 'camelCase 和 PascalCase 有什麼差別？'
          a: '兩者都把單字直接相連並讓每個字首大寫；camelCase 第一個字母維持小寫（userName），PascalCase 連第一個字母也大寫（UserName）。JavaScript 的變數用 camelCase，類別用 PascalCase。'
        - q: '為什麼我文字中的數字不見了？'
          a: '切字規則把數字當成分隔符號，所以 item2name 會變成 item name。數字是識別字的一部分時，請手動加回去。'

  html-entities:
    title: HTML 實體轉義
    description: 轉義或還原 HTML 實體（將 <、>、&、" 與 \' 等字元替換為 HTML 版本）
    guide:
      intro: '把 HTML 中有特殊意義的五個字元（&、<、>、" 與 ''）轉成實體寫法（&amp;、&lt;、&gt;、&quot;、&#39;），也能把這些實體還原成一般文字。'
      useCases:
        - '在 HTML 頁面中顯示程式碼範例或使用者輸入的文字，而不被當成標記解讀。'
        - '閱讀從網頁原始碼或 API 複製來、帶有實體的文字。'
        - '準備要放進 HTML 屬性中的值。'
      steps:
        - '要轉義時，在第一個欄位輸入文字，下方會顯示轉義後的版本。'
        - '要還原時，在第二區貼上含有實體的文字，就會顯示一般文字。'
        - '複製結果。'
      notes:
        - '轉義這五個字元正是把不可信的文字插入 HTML 時防止跨站腳本攻擊（XSS）的方法。請在輸出時用框架提供的轉義函式處理，不要手動做。'
        - '只會轉義 &、<、>、" 與 ''，其他字元（包括非 ASCII 文字）會原樣保留，這對 UTF-8 頁面來說是正確的。'
        - '還原時處理同樣的五個實體加上 &#39; 這類數字形式；&apos;、&nbsp;、&copy; 這類具名實體不會被處理。'
        - '這種轉義只適用於 HTML 文字與屬性。在 <script> 內、網址中或 CSS 裡，各有不同的轉義規則。'
      faq:
        - q: '為什麼還原後 &apos; 沒有變？'
          a: '&apos; 是 XML 的實體，舊版 HTML 並沒有定義它，所以這個工具和許多函式庫一樣不會轉換。HTML 中的單引號請用 &#39;。'
        - q: '在 Vue 或 React 這類框架裡還需要轉義嗎？'
          a: '使用一般的文字繫結時不需要，它們會自動轉義。只有直接插入原始 HTML（v-html、dangerouslySetInnerHTML、innerHTML）時才需要自行注意。'

  json-prettify:
    title: JSON 美化與格式化
    description: 將您的 JSON 字串美化為友善、易讀的格式。
    guide:
      intro: '把一長串 JSON 整理成有縮排、方便閱讀的格式。也接受較寬鬆的 JSON5 寫法（可含註解、結尾逗號、不加引號的鍵），輸出一律是標準 JSON。'
      useCases:
        - '閱讀被壓縮成單行的 API 回應或日誌內容。'
        - '提交設定檔之前先整理格式，讓 diff 只顯示真正的修改。'
        - '找出 JSON 壞在哪裡，輸入不合法時會顯示錯誤訊息。'
      steps:
        - '把 JSON 貼進上方輸入框，下方會立刻顯示整理後的結果。'
        - '選擇縮排大小（0 到 10 個空格）。'
        - '視需要開關「排序鍵」，再按複製取用結果。'
      notes:
        - '「排序鍵」預設是開啟的，會把每個物件的鍵依字母重新排序。這對比對差異很方便，但會改變資料的順序，如果鍵的順序對您有意義，請把它關掉。'
        - '因為接受 JSON5，帶有註解或結尾逗號的輸入也能成功整理，但輸出會移除註解，變成純 JSON。'
        - '超出 JavaScript 安全整數範圍（約 9×10^15）的數字在解析時可能損失精度，過長的 ID 可能被改掉，這類值請用字串保存。'
        - '上次輸入的內容與設定只記錄在這個瀏覽器中，不會傳到伺服器。'
      faq:
        - q: '為什麼沒有輸出結果？'
          a: '輸入不是合法的 JSON 或 JSON5 時，輸入框下方會顯示錯誤訊息，輸出會是空的。常見原因是漏了逗號、括號沒有成對，或是 JSON 前後多貼了其他文字。'
        - q: '可以用 Schema 驗證欄位嗎？'
          a: '不行。這個工具只檢查語法是否正確並重新排版，不會檢查欄位型別或必填欄位。'

  docker-run-to-docker-compose-converter:
    title: Docker run 轉 Docker compose
    description: 將「docker run」指令轉換為 docker-compose 檔案！

  mac-address-lookup:
    title: MAC 位址查詢
    description: 透過 MAC 位址查詢裝置的供應商與製造商。
    guide:
      intro: '從 MAC 位址的前三個位元組，也就是 IEEE 分配的 OUI（組織唯一識別碼），查出背後的製造商，使用的是離線的註冊資料庫副本。查詢完全在瀏覽器中進行。'
      useCases:
        - '辨識 Wi-Fi 或 DHCP 租約表中不認識的裝置。'
        - '確認某台裝置是否真的是它宣稱的品牌。'
        - '稽核網路時依廠商把裝置分組。'
      steps:
        - '以任何常見寫法輸入或貼上 MAC 位址：冒號、連字號、點，或不加分隔符號都可以。'
        - '下方會顯示廠商名稱與登記地址。'
        - '需要的話複製結果。'
      notes:
        - '只有前六個十六進位數字有意義；剩下的三個位元組用來識別個別裝置，查詢時不會用到。'
        - '現代手機與筆電在 Wi-Fi 上會使用隨機化的 MAC 位址以保護隱私。隨機位址的第二個十六進位數字是 2、6、A 或 E，查不到任何廠商。'
        - '資料庫是隨網站打包的快照，非常新註冊的前綴在依賴套件更新之前可能查不到。'
        - '有些前綴登記在零件製造商（網路晶片廠）名下，而不是裝置上的品牌，所以結果可能顯示晶片廠。'
      faq:
        - q: '為什麼我的位址查不到廠商？'
          a: '最常見的原因是它是隨機化（私有）的 MAC 位址，這在近年的 iOS、Android 與 Windows 裝置上很正常。否則就是前綴比打包的資料庫新，或屬於本地管理的範圍。'
        - q: '可以從 MAC 位址查出裝置的擁有者或位置嗎？'
          a: '不行。註冊資料庫只把前綴對應到購買它的公司，完全不涉及特定裝置的擁有者或所在位置。'

  mime-types:
    title: MIME 類型
    description: 將 MIME 類型轉換為副檔名，或反向轉換。
    guide:
      intro: '查詢某個 MIME 類型對應的副檔名，以及某個副檔名對應的 MIME 類型，使用的是多數網頁伺服器與 Node.js 共用的資料庫（mime-db 專案）。'
      useCases:
        - '找出伺服器傳送某種檔案時應該帶的 Content-Type 標頭。'
        - '確認收到某個 MIME 類型的檔案時，應該用什麼副檔名儲存。'
        - '設定需要列出 MIME 類型的上傳過濾規則或 accept 屬性。'
      steps:
        - '在第一個清單選擇或輸入 MIME 類型，例如 application/pdf，就能看到它的副檔名。'
        - '在第二個清單選擇或輸入副檔名，例如 png，就能看到它的 MIME 類型。'
        - '兩個清單都可以搜尋，開始輸入就會過濾。'
      notes:
        - '有些類型有多個副檔名（image/jpeg 有 jpeg、jpg、jpe、jfif），有些副檔名也登記了不只一種類型。第一個通常是建議使用的。'
        - 'application/octet-stream 是未知二進位資料的保底類型；瀏覽器會下載這類檔案，而不是直接顯示。'
        - 'MIME 類型是伺服器宣告的，不是檔案實際的內容。兩者不一致時，瀏覽器可能拒絕執行指令碼或套用樣式。'
        - '文字類型通常需要加上字元集，例如 text/html; charset=utf-8。清單中只顯示類型本身。'
      faq:
        - q: '為什麼找不到我要的副檔名？'
          a: '資料庫只收錄已登記或廣泛使用的類型。非常新或專有的格式可能沒有；請改用 application/octet-stream，或廠商文件中列出的類型。'
        - q: 'text/javascript 和 application/javascript 有什麼差別？'
          a: '兩者都曾被使用，目前的標準是 text/javascript。瀏覽器對指令碼檔案兩種都接受。'

  toml-to-json:
    title: TOML 轉 JSON
    description: 解析 TOML 並轉換為 JSON。
    guide:
      intro: '解析 TOML 文件並輸出成縮排的 JSON，方便檢視 Cargo.toml、pyproject.toml 或其他 TOML 設定，或交給只讀 JSON 的程式。'
      useCases:
        - '在預期 JSON 的腳本或 jq 管線中讀取 TOML 檔。'
        - '確認 TOML 的表格、點號鍵與表格陣列如何對應到巢狀物件。'
        - '驗證 TOML 檔案：語法錯誤會在輸入時即時顯示。'
      steps:
        - '把 TOML 貼進左側欄位。'
        - '右側會顯示以三個空格縮排的 JSON。'
        - '複製結果。'
      notes:
        - 'TOML 的日期時間（例如 1979-05-27T07:32:00Z）在 JSON 中會變成 ISO 8601 字串，因為 JSON 沒有日期型別。'
        - '超出 JavaScript 安全範圍（約 9×10^15）的整數不被支援，輸出會是空的。'
        - '註解會被丟掉，輸出一定是 JSON 物件，因為 TOML 文件本身就是一個表格。'
        - '重複的鍵與定義兩次的表格在 TOML 中是錯誤，轉換器會直接拒絕，而不是默默保留其中一個。'
      faq:
        - q: '為什麼我的日期變成了字串？'
          a: 'TOML 有原生的日期時間值，但 JSON 沒有，所以會序列化成 ISO 8601 文字。需要的話請在讀取端再解析回日期。'
        - q: '可以把 JSON 轉回 TOML 嗎？'
          a: '可以，用「JSON 轉 TOML」工具，但 JSON 的最上層必須是物件；null 值在轉換時會被丟掉。'

  lorem-ipsum-generator:
    title: Lorem ipsum 產生器
    description: Lorem ipsum 是一種常用的佔位文字，用於展示文件或字體的視覺效果，而不需依賴有意義的內容
    guide:
      intro: '依您指定的段落數、每段句數與每句字數產生 Lorem ipsum 佔位文字，可選擇以 HTML 段落標籤包起來，用來在真實內容還沒有之前填滿版面與原型。'
      useCases:
        - '用看起來像真實文字的內容填滿頁面設計、範本或元件，以評估版面與字型排版。'
        - '替 CMS、資料庫種子資料或 UI 測試建立範例內容。'
        - '產生特定長度的假段落，測試截斷與溢出的行為。'
      steps:
        - '設定段落數，以及每段句數與每句字數的範圍。'
        - '選擇是否以經典的 Lorem ipsum dolor sit amet 開頭，以及是否用 <p> 標籤包住每個段落。'
        - '複製文字，或按重新整理（Ctrl+Enter）用相同設定產生另一段隨機文字。'
      notes:
        - '這些是偽拉丁文，沒有任何意義，而這正是重點：讀者會專注在設計上，而不是去讀內容。'
        - '句數與字數是在範圍內隨機挑選的，每個段落各自決定，所以兩個段落很少長度相同，和真實文字類似。'
        - 'HTML 選項會把每個段落用 <p>...</p> 包起來並各自成行，可直接貼進範本。'
        - 'Lorem ipsum 只有拉丁字母的單字，無法反映中文、日文等文字的寬度與斷行方式。這類版面請改用目標語言的真實範例文字。'
      faq:
        - q: 'Lorem ipsum 是從哪裡來的？'
          a: '它是西塞羅《論善與惡之極限》（De finibus bonorum et malorum）中一段被打亂的文字，至少從 1960 年代起就被印刷業當作填充文字，後來因桌面出版軟體而普及。'
        - q: '為什麼每次產生的文字都不同？'
          a: '單字是在您設定的範圍內隨機挑選的，所以每次重新整理都會得到新的文字。喜歡的版本請直接複製，因為無法再產生一模一樣的。'

  image-compressor:
    title: '圖片壓縮'
    description: '壓縮圖片並轉成 WebP、JPEG 或 PNG，可調整尺寸，單張下載或打包成 zip。'
    format: '輸出格式'
    keepFormat: '維持原格式'
    quality: '品質'
    maxWidth: '最大寬度（px）'
    maxHeight: '最大高度（px）'
    noLimit: '不限制'
    upload: '把圖片拖曳到這裡，或點擊選擇圖片'
    privacy: '圖片只在你的瀏覽器裡處理，不會上傳。'
    pngHint: 'PNG 是無損格式，品質滑桿對它沒有作用。'
    download: '下載'
    downloadAll: '全部下載（zip）'
    clear: '清除'
    notAnImage: '{name} 不是圖片。'
    failed: '無法壓縮 {name}。'
    guide:
      intro: '把照片和截圖重新編碼成 WebP、JPEG 或 PNG，並可選擇縮小尺寸，藉此減少檔案大小。可以一次處理多張圖片，再逐張下載或打包成一個 zip。全部在瀏覽器中完成。'
      useCases:
        - '圖片太大無法通過上傳限制、電子郵件附件限制，或內容管理系統拒收超過數 MB 的檔案時，把它壓小。'
        - '提升網頁速度：把很大的 PNG、JPEG 轉成 WebP，並把寬度限制在版面實際需要的大小。'
        - '替文件或商店商品頁準備一批截圖或商品照片。'
      steps:
        - '把圖片拖曳到上傳區，或點一下選擇檔案。'
        - '選擇輸出格式（或保留每張圖片原本的格式）、品質，以及選用的最大寬度與高度。'
        - '確認每張結果的大小，再逐張下載，或全部打包成 zip 下載。'
      notes:
        - '品質只對 WebP 和 JPEG 有效。PNG 是無損格式，滑桿會停用，PNG 主要靠降低像素尺寸來縮小。品質設在 75 到 85 之間通常是不錯的平衡。'
        - '最大寬度和高度只會縮小圖片，並保持長寬比；小圖不會被放大。'
        - 'JPEG 不支援透明，透明的區域會變成白色。想保留透明請用 WebP 或 PNG。'
        - '重新編碼會移除 EXIF 等中繼資料，包括相機資訊與 GPS 位置；動畫 GIF 則只會保留第一個影格。'
        - '已經優化過的圖片壓縮後可能反而變大，這時請比較大小，保留原檔即可。'
      faq:
        - q: '我的圖片會被上傳到伺服器嗎？'
          a: '不會。壓縮是用瀏覽器的 canvas 完成的，檔案留在您的裝置上。這也表示非常大的圖片會使用裝置的記憶體，處理時可能需要一點時間。'
        - q: '該選哪種格式？'
          a: '多數照片用 WebP 能得到最小的檔案，目前主流瀏覽器都支援。需要與舊軟體最大相容性時選 JPEG，有銳利線條的圖形或需要透明時選 PNG。'
  video-compressor:
    title: '影片壓縮'
    description: '壓縮影片並轉成 MP4 或 WebM，可縮小到 1080p 或 720p，顯示進度，完全不上傳。使用瀏覽器的硬體影片編碼器。'
    format: '輸出格式'
    quality: '畫質'
    maxResolution: '最大解析度'
    original: '保留原始'
    upload: '把影片拖曳到這裡，或點一下選擇檔案'
    privacy: '影片透過 WebCodecs 在您的瀏覽器中處理，不會上傳。'
    unsupported: '這個瀏覽器不支援本工具需要的 WebCodecs。請使用新版的 Chrome、Edge、Safari（16.4 以上）或 Firefox（130 以上）。'
    cancel: '取消'
    clear: '清除'
    download: '下載'
    notAVideo: '{name} 不是影片。'
    qualityLevels:
      high: '高（檔案較大）'
      medium: '中（建議）'
      low: '低（檔案最小）'
    status:
      queued: '等待中'
      error: '失敗'
    errors:
      noVideoTrack: '這個檔案沒有影片軌。'
      undecodable: '這個瀏覽器無法解碼此檔案的影片編碼。'
      noEncoder: '這個瀏覽器沒有所選輸出格式的編碼器，請試試另一種格式。'
      unsupportedInput: '不支援的檔案格式。支援 MP4、MOV、WebM 與 MKV。'
      canceled: '已取消。'
      failed: '無法壓縮這個影片。'
    guide:
      intro: '用瀏覽器內建的硬體編碼器（WebCodecs）重新編碼影片，讓檔案變小，並可同時縮小解析度、把容器換成 MP4 或 WebM。只要輸出格式允許，聲音軌會原樣複製，音質不會改變。'
      useCases:
        - '把手機錄的影片壓到通訊軟體、電子郵件或表單上傳的大小限制以內。'
        - '分享或歸檔之前，把螢幕錄影或 4K 片段縮到 1080p 或 720p。'
        - '不安裝軟體，把 MOV 或 MKV 轉成到處都能播放的 MP4。'
      steps:
        - '選擇輸出格式（MP4 相容性最好，WebM 適合網頁）、畫質等級與最大解析度。'
        - '把一個或多個影片拖到上傳區。它們會依序處理，每一個都有進度條。'
        - '比較大小後下載結果。按「取消」會停止目前的檔案，並放棄還在等待的檔案。'
      notes:
        - '壓縮的原理是用較低的位元率重新編碼，所以每次都會損失一些細節。之後可能還要剪輯的話請保留原檔，也避免把同一個檔案反覆壓縮。'
        - '降低解析度省下的空間遠比降低畫質等級多。1080p 對多數螢幕已經足夠，720p 用於通訊軟體和預覽很合適。來源不會被放大。'
        - '畫質等級是依解析度換算的位元率目標：「中」是合理的預設值，「高」保留細節但檔案約大一倍，「低」給最在意大小的情況。'
        - '編碼器由瀏覽器能編碼的格式決定：MP4 通常是 H.264，WebM 通常是 VP9。容器允許時聲音會原樣複製（MP4 的 AAC、WebM 的 Opus），否則才重新編碼。'
        - '全部在瀏覽器中執行，不會上傳，這也表示非常大的檔案（數 GB）可能超出瀏覽器可用的記憶體。速度取決於裝置；多數筆電的硬體編碼器處理 1080p 比即時播放還快。'
        - '有 DRM 加密的影片與部分專業用編碼無法在瀏覽器中解碼，會顯示為不支援。'
      faq:
        - q: '為什麼壓縮後的檔案比原本還大？'
          a: '原始檔案的位元率本來就比您選的畫質等級還低。請選較低的畫質或較小的解析度，或是直接保留原檔。'
        - q: '為什麼顯示我的瀏覽器不支援？'
          a: '這個工具需要 WebCodecs API，Chrome 與 Edge、Safari 16.4 以上、Firefox 130 以上都有提供。較舊的瀏覽器和部分強化隱私的瀏覽器沒有。'
        - q: '可以剪輯或裁切影片嗎？'
          a: '目前不行。它會重新編碼整個檔案，這個工具沒有剪輯與裁切功能。'

  pdf-compressor:
    title: 'PDF 壓縮'
    description: '在瀏覽器裡壓縮 PDF，大幅縮小掃描檔與照片多的文件，文字仍可選取，檔案不會上傳。'
    preset: '壓縮程度'
    presets:
      screen:
        label: '最小檔案'
        hint: '適合螢幕閱讀、Email 或通訊軟體傳送'
      ebook:
        label: '平衡'
        hint: '大多數情況的最佳選擇'
      printer:
        label: '高品質'
        hint: '需要列印時使用，縮小幅度較小'
    upload: '把 PDF 拖曳到這裡，或點擊選擇檔案'
    privacy: 'PDF 只在你的瀏覽器裡處理，不會上傳。'
    engine: '壓縮引擎：Ghostscript（AGPL-3.0）。'
    sourceCode: '本站原始碼'
    largeFile: '有檔案超過 100 MB，處理需要較久，在手機上可能因記憶體不足而失敗。'
    clear: '清除'
    download: '下載'
    recompress: '用目前設定重新壓縮'
    waiting: '等待中…'
    loadingEngine: '正在下載壓縮引擎（約 15 MB，只需下載一次）…'
    compressing: '壓縮中…'
    progress: '正在處理第 {page} / {total} 頁'
    notSmaller: '用這個設定無法再縮小，原始檔案已經很精簡。可以換成較小的壓縮程度再試一次。'
    errors:
      notPdf: '這不是 PDF 檔案。'
      password: '這個 PDF 有開啟密碼，請先移除密碼再壓縮。'
      invalid: '無法讀取這個 PDF，檔案可能已損毀或不完整。'
      failed: '壓縮失敗，請再試一次。'
      engine: '無法下載壓縮引擎，請確認網路連線後再試一次。'
    guide:
      intro: 'PDF 會變大，通常不是因為文字，而是裡面的圖片：掃描檔的每一頁都是一張高解析度照片，報告或型錄也常直接放入手機拍的原圖。這個工具用 Ghostscript 把圖片重新取樣到適合用途的解析度並重新壓縮，文字、字型與版面維持原樣，全程在你的瀏覽器裡完成。'
      useCases:
        - 'Email 附件超過大小限制（常見上限是 10 到 25 MB），需要縮小後再寄出。'
        - '上傳到政府、學校或求職網站時，系統限制檔案不能超過某個大小。'
        - '手機掃描的合約、收據或證件，一頁就好幾 MB，想縮小後再存檔或傳送。'
        - '照片很多的報告或型錄，想在不影響閱讀的前提下減少容量。'
      steps:
        - '選擇壓縮程度：一般情況選「平衡」，要傳送或只在螢幕上看選「最小檔案」，需要列印選「高品質」。'
        - '把一個或多個 PDF 拖曳到上方區域，或點擊選擇檔案。第一次使用會先下載約 15 MB 的壓縮引擎。'
        - '等待處理完成，進度會依頁數顯示，完成後會列出壓縮前後的大小。'
        - '按「下載」取得壓縮後的檔案。不滿意的話，換一個壓縮程度後按「用目前設定重新壓縮」。'
      notes:
        - '壓縮效果取決於檔案內容：掃描檔與照片多的 PDF 通常可以縮小一半以上，甚至 90%；純文字的 PDF 本來就很小，可能只省下一點點。'
        - '「最小檔案」會把圖片降到 72 dpi，在螢幕上看沒問題，但列印時照片和小字可能會模糊。要列印的文件請用「高品質」。'
        - '如果壓縮後反而變大，工具會提示並保留原始檔案，不會提供較大的版本下載。這通常代表原始檔已經過最佳化。'
        - '有開啟密碼的 PDF 無法處理，請先用原本的軟體移除密碼。壓縮會重新產生檔案，數位簽章會因此失效，互動表單等進階功能也可能無法完整保留，重要文件請確認壓縮後的內容。'
        - '所有處理都在你的瀏覽器中進行，PDF 不會上傳。檔案很大（超過 100 MB）時，特別是在手機上，可能因記憶體不足而失敗，建議改用電腦處理。'
      faq:
        - q: '壓縮後文字還能選取和搜尋嗎？'
          a: '可以。這個工具只重新壓縮圖片，文字仍然是文字，可以選取、搜尋與複製。如果原始檔是沒有經過文字辨識的掃描圖，壓縮後也一樣只是圖片。'
        - q: '為什麼有些 PDF 幾乎沒有變小？'
          a: 'PDF 的大小主要來自圖片。以文字或向量圖為主的檔案，或是已經用其他工具壓縮過的檔案，能再縮小的空間很有限。'
        - q: '三種壓縮程度差在哪裡？'
          a: '差別在圖片的解析度：最小檔案是 72 dpi、平衡是 150 dpi、高品質是 300 dpi。解析度越低檔案越小，但放大或列印時越容易看出模糊。'
        - q: '我的檔案會被上傳嗎？'
          a: '不會。壓縮引擎 Ghostscript 會下載到你的瀏覽器，在你的裝置上執行，PDF 不會離開你的電腦或手機。'

  qrcode-generator:
    title: QR Code 產生器
    description: 為網址（或純文字）產生並下載 QR Code，並可自訂前景與背景顏色。
    decode:
      title: '從圖片讀取 QR Code'
      upload: '把圖片拖曳到這裡，或點擊選擇圖片'
      pasteHint: '也可以直接從剪貼簿貼上圖片（Ctrl+V）。'
      result: '解碼內容'
      notFound: '這張圖片裡找不到 QR Code。'
      error: '無法讀取這張圖片。'
      useAsInput: '帶入上方文字'
      privacy: '圖片只在你的瀏覽器裡處理，不會上傳。'
    guide:
      intro: '把網址或任何文字轉成 QR Code，可下載成圖片，並自訂顏色與容錯等級。也可以從圖片中讀出 QR Code 的內容。'
      useCases:
        - '替連結、Wi-Fi 密碼提示、聯絡資訊或活動頁面建立代碼，印在海報或名片上。'
        - '使用自己的前景與背景顏色，做出符合品牌風格的代碼。'
        - '開啟來路不明的 QR Code 之前，先上傳或貼上截圖，看它實際指向哪裡。'
      steps:
        - '在文字欄位輸入文字或網址，代碼會隨輸入即時更新。'
        - '視需要調整前景色、背景色與容錯等級。'
        - '下載圖片。要讀取代碼時，把圖片拖曳到讀取區，或按 Ctrl+V 貼上。'
      notes:
        - '容錯等級 low、medium、quartile、high 分別約可容許 7%、15%、25%、30% 的面積損毀仍可掃描。等級越高，代碼越密，內容很長時建議用較低的等級。'
        - '兩種顏色要保持明顯的對比，而且前景要比背景深。對比太低或顏色反相，在很多掃描器上會失敗。'
        - '內容越長，代碼越密，需要印得更大。掃不好時請縮短內容，例如改用短網址。'
        - 'QR Code 儲存的是固定內容，印出後就不能更改。建立與讀取都在瀏覽器中進行，圖片不會上傳。'
      faq:
        - q: '為什麼我的 QR Code 掃不出來？'
          a: '常見原因：對比不足、資料量大但印得太小、代碼四周沒有留白，或是內容很長又選了很高的容錯等級，導致代碼太密。'
        - q: 'QR Code 會過期嗎？'
          a: '不會。代碼只是把您輸入的文字編碼起來，如果內容是網址，只要那個網址還能用，代碼就有效。'

  wifi-qrcode-generator:
    title: WiFi QR Code 產生器
    description: 產生並下載可快速連線 WiFi 網路的 QR Code。

  xml-formatter:
    title: XML 格式化
    description: 將您的 XML 字串美化為友善、易讀的格式。
    guide:
      intro: '替 XML 文件加上縮排，讓結構容易閱讀，可設定縮排大小，並可選擇讓簡短的文字內容和元素留在同一行。不合法的 XML 會回報錯誤而不是硬排版。'
      useCases:
        - '閱讀被壓成單行的 XML 內容、SOAP 封包或設定檔。'
        - '提交之前統一 XML 檔的格式，讓 diff 只顯示真正的修改。'
        - '檢查一份 XML 文件是否格式良好（well-formed）。'
      steps:
        - '把 XML 貼進左側欄位。'
        - '設定縮排大小（0 到 10 個空格），並切換「Collapse content」。'
        - '複製整理後的結果。'
      notes:
        - '「Collapse content」會讓元素和它的文字留在同一行（<name>Ann</name>）。關掉後文字會移到獨立的縮排行，更整齊但也更長。'
        - '格式化會改變元素之間的空白，通常不影響意義。但在文字內的空白有意義的文件（混合內容、預先排版的文字）中，請檢查結果。'
        - '檢查只測試格式良好與否：標籤成對、正確巢狀、屬性加引號。不會對照 DTD 或 XML Schema 驗證。'
        - '註解、CDATA 區段與 XML 宣告都會保留。'
      faq:
        - q: '為什麼我的 XML 被判定為不合法？'
          a: '常見原因：標籤沒關閉、文字中有未轉義的 & 或 <（要寫成 &amp; 與 &lt;）、屬性值沒加引號，或有多個根元素。HTML 不是 XML，所以 HTML 網頁通常也會失敗。'
        - q: '可以反過來壓縮 XML 嗎？'
          a: '不能直接做。把縮排大小設為 0 可以去掉縮排，得到緊湊但仍有換行的文件。'

  temperature-converter:
    title: 溫度轉換器
    description: 在克耳文、攝氏、華氏、蘭金、德利爾、牛頓、列氏與羅默等溫標之間轉換。

  chmod-calculator:
    title: Chmod 計算器
    description: 使用這個線上 chmod 計算器，計算您的 chmod 權限與指令。

  rsa-key-pair-generator:
    title: RSA 金鑰對產生器
    description: 產生一組新的隨機 RSA 私鑰與公鑰 PEM 憑證金鑰對。
    guide:
      intro: '產生一組全新的隨機 RSA 私鑰與公鑰，並以 PEM 文字顯示。產生過程在瀏覽器中以背景工作執行緒完成，頁面不會卡住，金鑰也不會傳到任何地方。'
      useCases:
        - '建立一組用完即丟的金鑰，測試簽章、加密、SSH 或 JWT 的程式。'
        - '替本機開發環境或教學範例產生金鑰。'
        - '嘗試不同的金鑰長度，看產生需要多久。'
      steps:
        - '設定位元數（預設 2048，範圍 256 到 16384，以 8 為間隔）。'
        - '等待金鑰產生；長度越大，花的時間越明顯越長。'
        - '複製公鑰和私鑰，或按按鈕重新產生一組。'
      notes:
        - '至少使用 2048 位元；長期使用的金鑰建議 3072 或 4096。低於 2048 位元的金鑰被認為不安全，在這裡只用於實驗。'
        - '4096 位元以上的金鑰可能要數秒到更久才能產生，時間不固定，因為是隨機搜尋質數。'
        - '私鑰是傳統格式（-----BEGIN RSA PRIVATE KEY-----，PKCS#1），公鑰是 -----BEGIN PUBLIC KEY-----。有些函式庫需要 PKCS#8（-----BEGIN PRIVATE KEY-----），可用以下指令轉換：openssl pkcs8 -topk8 -nocrypt -in key.pem。'
        - '不要把在網頁上產生的金鑰用在正式系統或任何有價值的東西。那些金鑰請在可信任的機器上用 openssl 或雲端平台的金鑰管理服務產生。'
      faq:
        - q: '產生的金鑰真的是隨機的嗎？'
          a: '是的。產生過程使用 node-forge 函式庫與瀏覽器的安全亂數來源，每次按下去都會建立獨立的金鑰。但和所有網頁工具一樣，您無法審查正在使用的頁面，所以正式環境的金鑰仍應在其他地方產生。'
        - q: '為什麼頁面要一段時間才產生金鑰？'
          a: '慢的部分是尋找兩個很大的隨機質數，而且耗時會隨金鑰長度快速增加。2048 位元的金鑰通常幾秒內就會出現。'

  html-wysiwyg-editor:
    title: HTML 所見即所得編輯器
    description: 功能豐富的線上所見即所得 HTML 編輯器，可即時產生內容的原始碼。

  yaml-to-toml:
    title: YAML 轉 TOML
    description: 解析 YAML 並轉換為 TOML。
    guide:
      intro: '把 YAML 文件直接轉成 TOML，不必手動經過 JSON。專案從 YAML 設定改用 TOML，或某個工具只讀 TOML 時很方便。'
      useCases:
        - '把設定檔從 YAML 遷移到 TOML，例如改成 pyproject.toml。'
        - '從文件中找到的 YAML 範例產生 TOML 片段。'
        - '比較同一份資料在兩種格式中的寫法。'
      steps:
        - '把 YAML 貼進左側欄位。'
        - '右側會顯示 TOML。'
        - '複製結果。'
      notes:
        - '結果要符合 TOML 的規則：最上層必須是對應表（mapping），null 值會被丟掉。最上層是清單或純量的 YAML 文件不會有輸出。'
        - 'YAML 的隱含型別會先發生：沒加引號的 true 在轉換前就已經變成布林值，1.10 變成數字。想維持字串請在 YAML 中加引號。'
        - '錨點、別名與合併鍵會被展開，所以重複的資料在 TOML 中會完整寫出。'
        - '註解不會帶過去。'
      faq:
        - q: '錯誤訊息說我的 JSON 不合法，但我貼的是 YAML？'
          a: '這個訊息是通用的，意思是 YAML 無法解析。如果 YAML 合法但輸出一直是空的，文件的最上層很可能是清單或純量，TOML 無法表示。'
        - q: '為什麼 TOML 中少了一些鍵？'
          a: '值為 null 的鍵（YAML 中的空值也會解析成 null）會被省略，因為 TOML 無法表示 null。'

  mac-address-generator:
    title: MAC 位址產生器
    description: 輸入數量與前綴，即可以您選擇的大小寫（大寫或小寫）產生 MAC 位址
    guide:
      intro: '產生隨機的 MAC 位址，可選擇指定開頭的前綴、大寫或小寫，以及需要的分隔符號（冒號、連字號、點或不加）。一次最多 100 個。'
      useCases:
        - '替虛擬機、容器或網路模擬器指派位址。'
        - '替資產管理系統、DHCP 設定或解析器建立測試資料。'
        - '替實驗室設備產生特定廠商前綴（OUI）範圍內的位址。'
      steps:
        - '設定數量（1 到 100），需要的話輸入前綴，例如 64:16:7F。'
        - '選擇大寫或小寫，以及分隔符號。'
        - '複製產生的清單，或重新整理取得新的一批。'
      notes:
        - '前綴可以用任何分隔符號或不加分隔符號輸入；會先正規化，剩下的位元組再隨機填入。給滿 6 個位元組的前綴就會得到那個固定位址。'
        - '沒有前綴時第一個位元組完全隨機，所以有些位址會是多播位址（第一個位元組為奇數）或被標記為本地管理。要產生不會和真實廠商衝突的單播位址，請設定第二個十六進位數字為 2、6、A 或 E 的前綴，例如 02:00:00。'
        - '這裡的亂數不是密碼學等級，當測試資料沒問題，但不適合任何與安全相關的用途。'
        - '數量、前綴與分隔符號會記在這個瀏覽器中。'
      faq:
        - q: '為什麼我的虛擬化平台拒絕產生的位址？'
          a: '許多虛擬化平台要求單播且本地管理的位址，會拒絕多播位址。請使用 02:xx:xx 這類前綴，或平台文件列出的廠商範圍，例如 QEMU/KVM 的 52:54:00 或 VMware 的 00:50:56。'
        - q: '分隔符號有什麼意義？'
          a: '技術上沒有差別，只是顯示慣例。Linux 與 macOS 常用冒號，Windows 用連字號，Cisco 設備則用四位一組的點分寫法（0000.0000.0000）。'

  json-diff:
    title: JSON 差異比對
    description: 比較兩個 JSON 物件，並找出它們之間的差異。
    guide:
      intro: '比較兩份 JSON 文件，以帶顏色標示的樹狀結構顯示哪些內容被新增、移除或修改。兩個輸入框都接受較寬鬆的 JSON5，所以註解和結尾逗號不會造成困擾。'
      useCases:
        - '比較部署前後的 API 回應，確切找出哪些欄位改變了。'
        - '檢視設定檔的兩個版本，不必依賴逐行的文字差異。'
        - '確認序列化程式或資料遷移產生的資料和原本一致。'
      steps:
        - '把原始的 JSON 貼進第一個輸入框。'
        - '把要比較的 JSON 貼進第二個輸入框。'
        - '看下方的樹狀結果：新增、移除與修改的項目會被標示，未變動的項目則顯示作為上下文。'
      notes:
        - '物件是逐個鍵比較的，所以鍵的順序不影響結果，單純調整順序不會被視為差異。'
        - '陣列是依位置比較的。在開頭插入一個項目，後面所有項目都會往後移，可能出現大量「已修改」。順序沒有意義的陣列，請先排序或改用鍵值結構再比較。'
        - '值的型別改變（例如數字 1 變成字串 "1"）會被視為差異。'
        - '任一邊不是合法的 JSON 時，輸入框會顯示錯誤，也不會進行比較。'
      faq:
        - q: '這和一般的文字差異比對有什麼不同？'
          a: '文字比對是以行為單位，重新排版或調整鍵的順序都會產生大量雜訊。這個工具比對的是解析後的資料，所以只會顯示鍵、值與型別真正的差異。'
        - q: '可以忽略時間戳之類的特定欄位嗎？'
          a: '目前不行，請在比較前先從兩邊移除這些欄位。'

  jwt-parser:
    title: JWT 解析器
    description: 解析並解碼您的 JSON Web Token（JWT），顯示其內容。
    guide:
      intro: 'JSON Web Token（JWT）由三段以點號相連的 Base64URL 字串組成：標頭、帶有各種宣告（claims）的內容，以及簽章。這個工具會把標頭與內容解碼出來給您閱讀，並標示每個標準宣告的意思。'
      useCases:
        - 'API 回傳 401 時，確認權杖是否已過期、是不是發給別的對象（aud），或是缺少預期的權限範圍（scope）。'
        - '檢查登入流程發出的權杖，看後端實際收到哪些宣告，例如 sub、角色或租戶。'
        - '除錯時鐘誤差問題時，把 iat、nbf、exp 從 Unix 時間戳轉成看得懂的日期。'
      steps:
        - '把完整的權杖（三段以點號分隔）貼進輸入框。'
        - '從標頭看簽章演算法（alg）與權杖類型。'
        - '從內容看各項宣告；exp、nbf、iat 除了原始數字，也會顯示成本機時間。'
      notes:
        - '這個工具只做解碼，不會驗證簽章，所以能讀出內容不代表權杖是真的。簽章要在伺服器端驗證，或使用本站的「JWT 簽章與驗證」工具。'
        - '內容只是編碼，並未加密，拿到權杖的人都讀得到。不要把密碼或其他機密放進宣告。'
        - '解碼在瀏覽器內完成，權杖不會傳到任何地方。即便如此，仍有效的正式環境權杖要當成密碼看待，能用過期或測試用的權杖就盡量用。'
        - '日期會依您裝置的時區顯示，而 exp 與 iat 本身是以 UTC 為基準的 Unix 秒數。'
      faq:
        - q: '為什麼我的權杖無法解碼？'
          a: '有效的 JWT 一定是三段以點號分隔，且前兩段必須是 Base64URL 編碼的 JSON。常見原因是多帶了「Bearer 」前綴、複製時被截斷，或根本不是 JWT（例如隨機字串形式的不透明權杖）。'
        - q: '把權杖貼在這裡安全嗎？'
          a: '解碼在頁面本機執行，不會上傳。但權杖若仍有效，任何看到的人都能拿去使用，所以請避免把它貼進截圖、聊天室或會把資料送到伺服器的網站。'

  timestamp-batch-converter:
    title: '時間戳批次轉換'
    description: '一次把多筆 Unix 時間戳轉成你要的時區與格式。'
    input: '你的時間戳'
    inputPlaceholder: '一行一筆，或用逗號、分號、Tab 分隔…'
    output: '轉換結果'
    unit: '單位'
    format: '格式'
    timezone: '時區'
    result: '結果（{total} 筆中有 {valid} 筆有效）'
    units:
      auto: '自動偵測'
      seconds: '秒'
      milliseconds: '毫秒'
      microseconds: '微秒'
      nanoseconds: '奈秒'
    formats:
      iso8601: 'ISO 8601'
      iso9075: 'ISO 9075（yyyy-MM-dd HH:mm:ss）'
      dateOnly: '只要日期'
      timeOnly: '只要時間'
      verbose: '含星期與時區'
    columns:
      input: '輸入'
      unit: '單位'
      result: '結果（{timezone}）'
    errors:
      notANumber: '不是數字'
      outOfRange: '超出範圍'
    guide:
      intro: '一次轉換大量的 Unix 時間戳。把日誌、資料庫匯出檔或試算表裡的一整欄貼上來，就能得到您指定時區與格式的可讀日期，無效的行也會個別標示。'
      useCases:
        - '不必逐筆轉換，直接讀懂應用程式日誌或 API 回應裡的一整串 epoch 值。'
        - '把資料庫匯出的時間戳換成自己的時區，確認哪些落在某一天。'
        - '把數字時間戳轉成 ISO 8601 字串，貼進工單、測試資料或報告。'
      steps:
        - '貼上時間戳，可以一行一個，或用逗號、分號、Tab 分隔。'
        - '單位維持自動偵測，或手動選擇秒、毫秒、微秒、奈秒。'
        - '選擇輸出格式與時區，再閱讀或複製結果表格。'
      notes:
        - '自動偵測是看數字的位數：11 位以內視為秒，12 到 14 位視為毫秒，15 到 17 位視為微秒，更多則視為奈秒。很小的毫秒值（例如 1970 年附近）看起來會像秒，所以明確知道單位時請手動指定。'
        - '接受小數（例如 1700000000.5）和負數（1970 年以前的日期）。'
        - 'Unix 時間戳本身沒有時區。您選擇的時區只會改變顯示方式，不會改變它代表的那個時間點。'
        - '不是數字的行，或超出 JavaScript 日期可表示範圍的行會標示錯誤，其他行仍然會正常轉換。'
      faq:
        - q: '為什麼我的時間戳顯示成 1970 年的日期？'
          a: '這個值很可能是毫秒或微秒卻被當成秒，或是相反。請不要用自動偵測，改為明確指定單位。'
        - q: '一次可以貼多少筆？'
          a: '沒有固定上限。轉換在瀏覽器中進行，幾千行是瞬間完成，非常大量的內容則取決於您的裝置。'

  date-calculator:
    title: '日期計算器'
    description: '計算兩個日期之間的天數，或從某天加減天數；可排除指定星期與台灣國定假日，算出工作天。'
    modes:
      count: '計算天數'
      add: '增加天數'
      subtract: '減去天數'
    startDate: '開始日期'
    endDate: '結束日期'
    today: '今天'
    pickDate: '選擇日期'
    daysToAdd: '要增加的天數'
    daysToSubtract: '要減去的天數'
    settings: '計算設定'
    includeEnd: '包含結束日期'
    exclude: '排除'
    workdaysPreset: '只算工作天'
    clearExclusions: '清除'
    excludeHolidays: '排除國定假日'
    holidaysHint: '依人事行政總處公布的辦公日曆表（{first}–{last} 年），包含補假；週六補班日會算成工作天。'
    calculate: '計算'
    weekdays:
      mon: '星期一'
      tue: '星期二'
      wed: '星期三'
      thu: '星期四'
      fri: '星期五'
      sat: '星期六'
      sun: '星期日'
    errors:
      startDate: '請選擇開始日期。'
      endDate: '請選擇結束日期。'
      amount: '請輸入天數。'
      allExcluded: '不能排除一週中的每一天，否則沒有任何一天可以計算。'
    result:
      days: '相差天數'
      countedDays: '排除後的天數'
      daysValue: '{count} 天'
      reversed: '結束日期早於開始日期，所以結果是負數。'
      calendarDays: '日曆天數 {count} 天'
      excludedPrefix: '，已排除 {count} 天：'
      excludedWeekday: '{weekday} {count} 天'
      excludedHolidays: '國定假日 {count} 天'
      separator: '、'
      weeks: '相當於 {weeks} 週又 {days} 天'
      calendarDifference: '兩個日期相差 {value}'
      unitSeparator: ' '
      units:
        years: '{count} 年'
        months: '{count} 個月'
        days: '{count} 天'
      date: '結果日期'
      shiftedAfter: '開始日期之後第 {count} 個計算日，日曆上相隔 {calendarDays} 天'
      shiftedBefore: '開始日期之前第 {count} 個計算日，日曆上相隔 {calendarDays} 天'
      skippedPrefix: '途中跳過 {count} 天：'
      holidaysInRange: '期間的國定假日'
      missingHolidayYears: '{years} 年還沒有國定假日資料（目前涵蓋 {first}–{last} 年），這些年份的國定假日沒有被排除。'
    guide:
      intro: '日期計算器有三種用法：算出兩個日期之間有幾天、從某一天往後推算，以及往前推算。可以排除指定的星期幾，也能依人事行政總處公布的辦公日曆表排除台灣的國定假日與補假，直接算出「工作天」。'
      useCases:
        - '計算合約、租約或試用期從哪天到哪天共有幾天，或還剩幾天。'
        - '公文、法規或合約寫「於 10 個工作天內」，要算出實際的截止日期。'
        - '專案排程：從開工日往後推算 30 個工作天，跳過週末、春節與連假。'
        - '回推日期：交件日往前 5 個工作天要先完成內部審核，算出最晚哪天要送審。'
      steps:
        - '在上方選擇模式：「計算天數」、「增加天數」或「減去天數」。'
        - '選擇開始日期（可按「今天」快速帶入）；計算天數時再選結束日期，加減天數時輸入天數。'
        - '在「計算設定」勾選要排除的星期與國定假日；按「只算工作天」可一次勾好週六、週日與國定假日。'
        - '按「計算」看結果。結果會列出排除了哪些天與期間的國定假日；之後修改日期或設定，結果會自動更新。'
      notes:
        - '計算天數時，預設算到結束日期的前一天為止，也就是「1 月 1 日到 1 月 31 日」是 30 天；要把結束日期也算進去，請勾選「包含結束日期」。'
        - '增加或減去天數時，開始日期本身不算在內：從星期五往後加 1 個工作天，結果是下週一。'
        - '同時排除週六、週日與國定假日時，人事行政總處公告的週六補班日會算成工作天，結果與政府機關的上班日一致。'
        - '國定假日資料涵蓋的年份寫在「排除國定假日」下方。政府每年約 6 月公布隔年的辦公日曆表後會再更新，超出範圍的年份會顯示提醒。'
        - '這裡的國定假日指政府行政機關的放假日。民營企業、學校或特定行業（如勞動節只有勞工放假）的實際休假可能不同，重要期限請以主管機關或契約規定為準。'
      faq:
        - q: '為什麼 1 月 1 日到 1 月 31 日是 30 天，不是 31 天？'
          a: '兩個日期「相差」的天數不含結束日期，這和大多數行事曆與試算表的算法一致。如果要算「共幾天」（頭尾都算），請勾選「包含結束日期」，結果就會是 31 天。'
        - q: '工作天是怎麼算的？'
          a: '按「只算工作天」會排除週六、週日與國定假日（含補假），並把週六補班日算回來。用這個設定算出的一整年天數，與人事行政總處辦公日曆表上的上班日完全相同。'
        - q: '颱風假會算進去嗎？'
          a: '不會。颱風假由各縣市臨時公布，無法事先列入；如果期間有放颱風假，請自行扣除。'
        - q: '可以算其他國家的假日嗎？'
          a: '目前只內建台灣的國定假日。其他國家可以只用「排除星期」的功能，再自行扣除當地假日。'

  date-converter:
    title: 日期時間轉換器
    description: 將日期與時間轉換為各種不同的格式
    timezone: '時區'
    guide:
      intro: '同一個時間點在不同系統裡有不同的寫法：Unix 時間戳、ISO 8601、RFC 3339、Excel 序列值、MongoDB ObjectID 等等。這個工具把你貼進去的值辨識出來，同時輸出所有常見格式，並可指定時區。'
      useCases:
        - '在日誌或 API 回應裡看到一串數字，想知道那是什麼時間。'
        - '要把時間寫進設定檔或資料庫，需要特定格式的字串。'
        - '跨時區協作時，想確認某個時間點在對方時區是幾點。'
        - '從 Excel 匯出的資料裡日期變成一串小數，需要還原成日期。'
      steps:
        - '把時間值貼進輸入框，工具會自動辨識格式並切換下方的格式選單。'
        - '若辨識錯誤，手動在右邊的選單指定輸入格式。'
        - '在時區選單選擇你要的時區，所有輸出會跟著換算。'
        - '點各欄位右側的複製圖示取用結果。'
      notes:
        - '輸入的字串如果沒有帶時區偏移（例如 2023-04-12 23:10:24），會以你選的時區解讀；帶了偏移（例如結尾有 Z 或 +08:00）則以該偏移為準，不受時區選單影響。'
        - 'Unix 時間戳有秒與毫秒兩種，十位數通常是秒、十三位數是毫秒。工具會依位數判斷。'
        - 'Excel 的日期序列值是從 1900 年起算的天數，小數部分代表當天的時間。'
      faq:
        - q: '要一次轉很多筆時間戳怎麼辦？'
          a: '用「時間戳批次轉換」那個工具，可以一次貼多筆並輸出成表格。'
        - q: 'ISO 8601 和 RFC 3339 有什麼差別？'
          a: 'RFC 3339 可以視為 ISO 8601 的嚴格子集，強制要求日期與時間之間用 T 分隔、並且一定要帶時區偏移。實務上要寫進 API 或設定檔時，選 RFC 3339 比較不會出錯。'

  phone-parser-and-formatter:
    title: 電話號碼解析與格式化
    description: 解析、驗證並格式化電話號碼。取得電話號碼的相關資訊，例如國碼、類型等。

  ipv4-subnet-calculator:
    title: IPv4 子網路計算器
    description: 解析您的 IPv4 CIDR 區塊，並取得子網路的所有相關資訊。
    guide:
      intro: '輸入帶有遮罩的 IPv4 位址（CIDR，例如 192.168.0.1/24，或子網路遮罩），就能得到網路位址、遮罩、萬用遮罩（wildcard）、第一個與最後一個可用位址、廣播位址與位址數量，同時顯示位址等級。'
      useCases:
        - '規劃如何把網路切成多個子網路，並檢查兩個範圍是否重疊。'
        - '弄清楚雲端安全群組或防火牆規則中的某個 CIDR 區塊實際涵蓋哪些位址。'
        - '找出某台主機所在網段的網路位址與廣播位址，或在 /24 與 255.255.255.0 兩種寫法之間轉換。'
      steps:
        - '輸入位址與遮罩，例如 10.0.0.0/22。'
        - '看表格：網路位址、點分十進位與二進位的遮罩、萬用遮罩、網路大小、第一個與最後一個位址、廣播位址與 IP 等級。'
        - '用上一個、下一個按鈕切換到相鄰且大小相同的區塊。'
      notes:
        - '「Network size」是區塊內的位址總數。一般子網路中，第一個（網路位址）與最後一個（廣播位址）不能指派給主機，所以可用主機數是總數減 2。'
        - '「First address」與「Last address」是第一個與最後一個可用的主機位址，因此和網路位址、廣播位址不同。'
        - '/31 與 /32 區塊沒有廣播位址，該欄位會顯示不存在。/31 用於點對點連線，/32 則代表單一主機。'
        - '萬用遮罩就是子網路遮罩反相，用於部分路由器的存取清單，例如 Cisco ACL。'
      faq:
        - q: '/24 可以放多少台主機？'
          a: '/24 共有 256 個位址，其中 254 個可指派給主機。前綴每縮短一位，大小就加倍，所以 /23 有 512 個位址。'
        - q: '支援 IPv6 嗎？'
          a: '不支援，這個計算器只處理 IPv4。'

  og-meta-generator:
    title: Open Graph meta 標籤產生器
    description: 為您的網站產生 Open Graph 與社群媒體的 HTML meta 標籤。

  ipv6-ula-generator:
    title: IPv6 ULA 產生器
    description: 依據 RFC4193，為您的網路產生本地、不可路由的 IP 位址。
    guide:
      intro: '依 RFC 4193 產生 IPv6 唯一本地位址（ULA，fd00::/8）前綴：用 MAC 位址與目前時間推導出 40 位元的偽隨機全域 ID，給您一個私有網路用的 /48 前綴，以及其中第一個與最後一個 /64 子網路。'
      useCases:
        - '替家用實驗室、辦公室區網、VPN 或容器網路挑選不需要在網際網路上路由的內部 IPv6 前綴。'
        - '避免兩個私有網路日後透過 VPN 相連時，因為都用 fd00::/48 或 fd00:1::/64 而撞號。'
        - '學習 ULA 前綴的結構。'
      steps:
        - '輸入您某張網路介面的 MAC 位址；任何合法的 MAC 都可以，它只用來當隨機部分的種子。'
        - '閱讀 /48 前綴（IPv6 ULA），以及可以從中切出的第一個與最後一個 /64 區塊。'
        - '複製前綴並記錄下來；結果每次重新整理都會變，不要期待能再產生同一個。'
      notes:
        - '全域 ID 是 MAC 位址與目前時間戳的雜湊，這是 RFC 4193 建議的做法，所以每次產生都會得到新的前綴。請把決定使用的那個存起來。'
        - '一個 /48 含有 65536 個 /64 子網路，從 xxxx:0::/64 到 xxxx:ffff::/64。每個區網段通常分配一個 /64。'
        - 'ULA 像 IPv4 的 10.0.0.0/8 一樣是私有的，但設計上不做 NAT；主機會同時擁有 ULA 與全球位址，隨機前綴則讓兩個網路合併時不會混在一起。'
        - 'fc00::/8 是 ULA 空間的另一半，保留給一個從未實施的集中分配方案，所以產生的前綴一律以 fd 開頭。'
      faq:
        - q: '直接用 fd00::/48 不行嗎？'
          a: '能用，但每個走這條捷徑的人都會選到同一個前綴，兩個這樣的網路一旦相連就會衝突。隨機的全域 ID 正是 RFC 4193 的重點。'
        - q: '產生的前綴保證唯一嗎？'
          a: '不保證，但有 40 個隨機位元，兩個獨立產生的前綴相撞的機率，對任何實際數量的網路來說都可以忽略。'

  hash-text:
    title: 文字雜湊
    description: '使用您需要的雜湊函式對文字進行雜湊：MD5、SHA1、SHA256、SHA224、SHA512、SHA384、SHA3 或 RIPEMD160'
    file:
      title: '檔案雜湊'
      upload: '把檔案拖曳到這裡，或點擊選擇檔案'
      algorithms: '演算法'
      compare: '比對雜湊值'
      comparePlaceholder: '貼上預期的雜湊值來驗證檔案…'
      match: '與 {algorithm} 相符'
      mismatch: '沒有任何雜湊值相符'
      hashing: '計算中…'
      clear: '清除檔案'
      privacy: '檔案只在你的瀏覽器裡計算，不會上傳。'
      error: '無法讀取這個檔案。'
    guide:
      intro: '雜湊函式把任意長度的資料轉成固定長度的指紋。相同輸入永遠得到相同結果，而且無法從結果反推原文。常用來驗證檔案完整性、比對資料是否被竄改。'
      useCases:
        - '下載檔案後比對官方提供的 SHA-256，確認檔案沒有損毀或被掉包。'
        - '確認兩份看起來一樣的檔案內容是否真的相同。'
        - '在開發時產生固定長度的識別碼，或為快取鍵值做正規化。'
      steps:
        - '把文字貼進上方輸入框，八種演算法的結果會即時算出來。'
        - '需要不同輸出格式時，用「Digest encoding」切換十六進位、Base64 或二進位。'
        - '要算檔案的話，捲到下方的「檔案雜湊」區塊，勾選需要的演算法後拖入檔案。'
        - '要驗證下載的檔案，把官方公布的雜湊值貼進「比對雜湊值」欄位，相符會顯示綠色標籤。'
      notes:
        - '檔案完全在你的瀏覽器裡計算，以分段串流處理，不會上傳，大檔案也不會吃爆記憶體。'
        - 'MD5 和 SHA-1 已被證實可以製造碰撞，不應再用於安全用途。僅用於比對非惡意情境下的檔案完整性時仍可接受。'
        - '本工具的「SHA3」實際上是 Keccak-512，也就是 NIST 定案前的版本，結果與 sha3sum 指令不同。需要標準 SHA3-512 時請勿使用這一欄。'
        - '雜湊不是加密，沒有金鑰也無法還原。要保護密碼請用 bcrypt，要加解密請用文字加密工具。'
      faq:
        - q: '為什麼同一個檔案在不同網站算出來的 SHA-256 不一樣？'
          a: '正常情況下不會不一樣。若結果不同，通常是檔案本身不同（例如換行符號 CRLF 與 LF 的差異、或下載不完整），或是其中一邊算的是文字而非二進位內容。'
        - q: '該選哪一種演算法？'
          a: '驗證檔案完整性用 SHA-256 就夠了，這是目前最通用的選擇。需要更長的摘要可以用 SHA-512。避免用 MD5 和 SHA-1 做任何安全相關的判斷。'

  json-to-toml:
    title: JSON 轉 TOML
    description: 解析 JSON 並轉換為 TOML。
    guide:
      intro: '把 JSON 轉成 TOML，也就是 Cargo（Rust）、pyproject.toml（Python）、Hugo 與許多命令列工具使用的設定格式。物件會變成表格（table），物件陣列會變成表格陣列。'
      useCases:
        - '用手上已有的 JSON 資料寫出 pyproject.toml 或 Cargo.toml 的區段。'
        - '把 JSON 設定翻成 TOML，給只讀 TOML 的工具。'
        - '透過熟悉的 JSON 結構在 TOML 中的寫法來學習 TOML 語法。'
      steps:
        - '把 JSON（接受 JSON5 語法）貼進左側欄位。'
        - '右側會顯示 TOML。'
        - '複製結果。'
      notes:
        - '最上層必須是物件。TOML 無法把整份文件表示成單純的陣列或純量，這類輸入不會有輸出。'
        - '混合型別的陣列（例如數字與字串）會寫成行內陣列，TOML 1.0 允許這樣做；仍要求陣列單一型別的舊版 TOML 解析器可能會拒絕。'
        - 'null 在 TOML 中沒有對應的寫法，值為 null 的鍵會從輸出中省略。'
        - '巢狀物件會寫成 [table] 與 [table.sub] 標頭，物件陣列會寫成 [[array]] 項目，這是慣用的 TOML 排版。'
      faq:
        - q: '為什麼合法的 JSON 轉換會失敗？'
          a: 'TOML 比 JSON 嚴格：文件必須是物件，而且沒有 null。最上層是陣列或純量時不會有輸出，值為 null 的鍵會默默消失。'
        - q: '我值為 null 的鍵跑去哪了？'
          a: '它被省略了，因為 TOML 無法表示 null。請改用空字串、特定的替代值，或在讀取端直接省略這個鍵。'

  device-information:
    title: 裝置資訊
    description: 取得您目前裝置的資訊（螢幕大小、像素比例、user agent 等）

  pdf-signature-checker:
    title: PDF 簽章檢查器
    description: 驗證 PDF 檔案的簽章。已簽章的 PDF 檔案包含一個或多個簽章，可用來判斷檔案內容在簽章後是否曾被更動。

  json-minify:
    title: JSON 壓縮
    description: 移除不必要的空白，將您的 JSON 最小化並壓縮。
    guide:
      intro: '移除 JSON 中所有不必要的空白，產生最短的等價單行文字。JSON5 輸入中的註解與結尾逗號也會被去掉，所以輸出一定是標準 JSON。'
      useCases:
        - '把 JSON 內容嵌進網址、HTML 屬性或設定字串之前先縮小。'
        - '把帶註解的 JSON5 設定轉成解析器要求的嚴格 JSON。'
        - '把 JSON 文件放成一行，用在日誌、環境變數或 curl 指令中。'
      steps:
        - '把 JSON 貼進左側欄位；接受帶註解的 JSON5 語法。'
        - '右側會顯示單行的結果。'
        - '複製它。'
      notes:
        - '只會移除字串以外的空白。字串值裡的空格與換行會保留，因為它們是資料的一部分。'
        - '輸入會被解析後重新序列化，所以註解會消失、重複的鍵只保留最後一個值，數字也會被正規化（1.0 變成 1，1e3 變成 1000）。'
        - '壓縮通常能讓有縮排的 JSON 縮小 20% 到 40%。真正要省頻寬，伺服器端的 gzip 或 brotli 壓縮重要得多。'
        - '輸入不合法時會顯示錯誤，沒有輸出。'
      faq:
        - q: '為什麼 1.0 變成了 1？'
          a: 'JSON 數字沒有格式的概念，1.0 和 1 是同一個值，序列化時會寫成最短的形式。如果這個差異很重要，請把值存成字串。'
        - q: '怎麼把它變回可讀的格式？'
          a: '用「JSON 美化與格式化」工具，它會把同樣的資料重新縮排成多行版面。'

  ulid-generator:
    title: ULID 產生器
    description: 產生隨機的通用唯一字典序可排序識別碼（ULID）。

  string-obfuscator:
    title: 字串混淆器
    description: 將字串（例如密鑰、IBAN 或 token）混淆處理，讓它在不洩漏內容的情況下仍可分享與辨識。
    guide:
      intro: '把字串中段換成星號，只保留開頭與結尾少數幾個字元，讓密鑰、權杖、IBAN 或卡號可以分享或放進截圖，既能辨識是哪一個，又無法被拿去使用。'
      useCases:
        - '把 API 金鑰或權杖貼進錯誤回報、工單或聊天室，讓對方知道是哪一把金鑰，卻看不到內容。'
        - '在介面或截圖中顯示部分遮蔽的 IBAN、卡號或電話號碼。'
        - '在日誌中記錄識別字，而不把完整的密鑰寫進日誌。'
      steps:
        - '貼上字串。'
        - '選擇開頭與結尾各保留幾個字元，以及空格是否維持可見。'
        - '複製遮蔽後的結果。'
      notes:
        - '保留部分之間的每個字元都會變成星號，所以原文的長度仍然看得出來。如果長度本身也是敏感資訊，請留意這點。'
        - '保留空格能讓分組的數字（IBAN、卡號）更容易閱讀，同時仍隱藏數字本身。'
        - '保留的字元越多，密鑰就越容易被猜到或和外洩資料比對。對 API 金鑰來說，開頭幾個字元通常就足以辨識。'
        - '這是顯示上的輔助，不是安全控制。遮蔽在瀏覽器中完成、不會傳送任何資料，但握有原始字串的人當然還是能使用它。'
      faq:
        - q: '遮蔽後的字串可以還原嗎？'
          a: '不能，被隱藏的字元已經被取代，無法從輸出復原。所以如果還需要原文，請另外安全保存。'
        - q: '信用卡號應該保留多少可見？'
          a: '業界慣例（PCI DSS）最多允許顯示前六碼與後四碼；多數收據只顯示後四碼。'

  base-converter:
    title: 整數進位制轉換器
    description: 在不同進位制之間轉換數字（十進位、十六進位、二進位、八進位、base64 等）

  yaml-to-json-converter:
    title: YAML 轉 JSON
    description: 使用這個線上即時轉換器，輕鬆將 YAML 轉換為 JSON。
    guide:
      intro: '解析 YAML 文件，輸出相同資料的縮排 JSON。適合把設定檔餵給只接受 JSON 的工具與 API，或確認一份 YAML 檔案到底被怎麼解讀。'
      useCases:
        - '把 Kubernetes manifest、Compose 檔或 CI workflow 轉成 JSON，用於 API 呼叫或腳本。'
        - '查看 YAML 的隱含型別如何解讀您的值：哪些變成了數字、布林或 null。'
        - '找出 YAML 檔的縮排錯誤，不合法的 YAML 會顯示錯誤。'
      steps:
        - '把 YAML 貼進左側欄位。'
        - '右側會顯示以三個空格縮排的 JSON。'
        - '用複製按鈕取用結果。'
      notes:
        - 'YAML 會隱含地判斷型別：沒加引號的 true、false 會變成布林值，1.10 會變成數字 1.1，空值或 ~ 會變成 null。這個解析器遵循 YAML 1.2，所以 yes、no、on、off 維持字串。如果某個值的型別不對，請在 YAML 中加上引號。'
        - '合併鍵（<<: *defaults）會被解析，錨點與別名會被展開，所以 JSON 中是合併、複製後的資料。'
        - '多文件檔案（用 --- 分隔的區段）會被拒絕並顯示錯誤，請一次轉換一份文件。'
        - '註解會遺失，因為 JSON 沒有註解。'
      faq:
        - q: '為什麼版本號 1.10 變成了 1.1？'
          a: '沒加引號的 1.10 在 YAML 中是浮點數，數字不會保留結尾的零。寫成帶引號的 "1.10" 才會維持字串。'
        - q: '為什麼輸出是空的卻沒有錯誤？'
          a: 'YAML 解析出來是空值，例如整個檔案只有註解。請確認文件至少有一個鍵或清單項目。'

  uuid-generator:
    title: UUID 產生器
    description: 通用唯一識別碼（UUID）是一個 128 位元的數字，用於在電腦系統中識別資訊。可能的 UUID 數量為 16^32，也就是 2^128，約為 3.4x10^38（非常多！）。
    guide:
      intro: 'UUID 是 128 位元的識別碼，設計目的是讓不同系統各自產生時幾乎不可能重複，因此不需要中央發號機制。常用於資料庫主鍵、交易追蹤編號、檔案命名等場景。'
      useCases:
        - '為資料表產生主鍵，特別是需要在寫入資料庫前就先決定 ID 的情況。'
        - '產生請求追蹤編號，方便在分散式系統的日誌中串起同一筆請求。'
        - '建立不會撞名的暫存檔名或上傳檔案識別碼。'
      steps:
        - '在版本選單選擇需要的 UUID 版本，預設是 v4。'
        - '調整數量後即時產生，點複製取用。'
        - '按 Ctrl+Enter 可以重新產生一批。'
      notes:
        - 'v4 是完全隨機，最常用，適合絕大多數情境。'
        - 'v1 內含時間戳與網路卡位址，可排序但會洩漏產生時間與機器資訊。'
        - 'v7 同樣內含時間戳但排在前面，所以字典序等同時間序，對資料庫索引比 v4 友善，是近年推薦的選擇。'
        - '產生過程使用瀏覽器的密碼學亂數來源，不會連到伺服器。'
      faq:
        - q: 'UUID 真的不會重複嗎？'
          a: 'v4 有 122 位元的隨機性。以實務角度，即使每秒產生十億個，要碰到一次重複也需要數十年以上的量級，可以視為不會重複。'
        - q: '拿 UUID 當資料庫主鍵會不會影響效能？'
          a: '會，特別是 v4。隨機值會讓 B-tree 索引頻繁分裂，寫入效能與索引大小都比遞增整數差。如果在意這點，改用 v7，它的時間前綴讓新資料集中在索引尾端。'

  ipv4-address-converter:
    title: IPv4 位址轉換器
    description: 將 IP 位址轉換為十進位、二進位、十六進位，甚至是 IPv6 表示形式。
    guide:
      intro: '顯示一個 IPv4 位址的各種寫法：單一十進位整數、十六進位、二進位，以及長格式與短格式的 IPv4 對應 IPv6 位址。'
      useCases:
        - '讀懂資料庫或日誌中以整數儲存的位址，或是把位址轉成整數以便儲存。'
        - '逐位元了解子網路遮罩或位址的組成。'
        - '替雙協定（dual-stack）設定或防火牆規則寫出 IPv4 位址的 IPv6 形式（::ffff:a.b.c.d）。'
      steps:
        - '以點分十進位輸入位址，例如 192.168.1.1。'
        - '閱讀十進位、十六進位、二進位與 IPv6 形式，每個都有複製按鈕。'
        - '位址無效時會顯示驗證訊息，結果欄位為空。'
      notes:
        - '十進位形式是把四個位元組當成一個 32 位元數字（a.b.c.d = a×16777216 + b×65536 + c×256 + d）。許多資料庫用這種方式儲存位址，因為整數排序與比較更快。'
        - '二進位形式有 32 位數；和子網路遮罩並排閱讀，網路部分與主機部分一目了然。'
        - '::ffff:192.168.1.1 是 IPv4 對應 IPv6 位址，也是雙協定伺服器看到 IPv4 客戶端時的形式。它是同一台主機，不是另一台。'
        - '輸入中不接受前導零（192.168.001.001），因為有些系統會把它當成八進位。'
      faq:
        - q: '為什麼瀏覽器接受 http://3232235777 這種位址？'
          a: '那是 192.168.1.1 的十進位形式。瀏覽器與許多工具接受整數寫法，這也是攻擊者用它來偽裝位址的原因。'
        - q: '可以反過來從數字轉成位址嗎？'
          a: '這個工具不行。位址運算請用 IPv4 範圍或子網路工具，或用進位轉換工具把數字轉成十六進位，再每兩位讀成一個位元組。'

  text-statistics:
    title: 文字統計
    description: 取得文字的相關資訊，包括字元數、字數、位元組大小等
    guide:
      intro: '計算一段文字的字元數、單字數與行數，並顯示它以 UTF-8 編碼後的位元組大小，隨輸入即時更新。'
      useCases:
        - '確認文字是否超過長度限制：推文、meta 描述、表單欄位或資料庫欄位。'
        - '估算一段內容的儲存空間或傳輸大小。'
        - '計算有字數限制的文章、摘要或答案的字數。'
      steps:
        - '貼上或輸入文字。'
        - '閱讀欄位上方的四個計數。'
        - '編輯文字，數字會跟著變。'
      notes:
        - '字元數是 UTF-16 碼元的數量，也就是 JavaScript 的 length 回報的值。多數表情符號與部分罕見字元會算成 2，所以數字可能和某些平台顯示的不同。'
        - '位元組大小是 UTF-8 長度：ASCII 字母佔 1 個位元組，多數歐洲重音字母 2 個，中日韓文字 3 個，表情符號通常 4 個。所以以位元組計的限制（資料庫欄位、某些 API）和以字元計的限制不一樣。'
        - '單字是依空白切分計算的，適用於用空格分隔單字的語言。沒有空格的中文、日文每一行只會算成一個單字。'
        - '行數依換行符號計算，所以在螢幕上自動折行的長段落仍然算一行。'
      faq:
        - q: '為什麼我的表情符號算成兩個字元？'
          a: '基本多文種平面以外的表情符號以兩個 UTF-16 碼元儲存。有些平台算一個、有些算兩個；這個工具遵循 JavaScript 的做法，算兩個。'
        - q: '為什麼位元組大小比字元數大？'
          a: '任何非純 ASCII 的字元在 UTF-8 中都佔超過一個位元組。含有重音、中日韓文字或表情符號的文字，位元組數因此會大於字元數。'

  text-to-nato-alphabet:
    title: 文字轉 NATO 音標字母
    description: 將文字轉換為 NATO 音標字母，方便口頭傳達。
    guide:
      intro: '用 NATO 音標字母（Alpha、Bravo、Charlie……）逐字拼出文字，這是航空、無線電與客服中心使用的標準，避免口頭傳達時字母被聽錯。'
      useCases:
        - '在電話中唸出訂位代號、車牌、序號或密碼。'
        - '準備無線電通訊或客服通話的講稿。'
        - '學習或核對音標字母。'
      steps:
        - '輸入文字。'
        - '下方會顯示拼讀版本，每個字母對應一個單字。'
        - '複製它或照著唸。'
      notes:
        - '只會轉換 26 個拉丁字母，不分大小寫。數字、標點與其他字元會原樣保留，所以 7 還是 7、空格還是空格。'
        - '實務上數字會逐個唸出（seven 而不是 seventy），航空用語還常用 tree、fife、niner 來避免混淆；這個工具不會改動數字。'
        - '帶重音的字母（é、ü）不會轉換；請用基本字母拼讀並說明重音，或先把重音去掉。'
        - '這是 ICAO／NATO 字母表（Alfa、Juliett 是官方拼法，發音相同）。還有其他拼讀字母表，例如 LAPD 或德國的版本，用的單字不同。'
      faq:
        - q: '為什麼輸出中的數字沒有變？'
          a: 'NATO 字母表只涵蓋字母。數字請照平常一個一個唸；工具把它們留在原位，讓整個序列仍然好讀。'
        - q: '為什麼是 Alpha 而不是 A for apple？'
          a: 'Alpha、Bravo 等單字是特別挑選過的，在各主要語言中和訊號不佳時都能清楚區分。像 apple、ice 這類臨時想到的詞更容易被聽錯。'

  basic-auth-generator:
    title: Basic auth 產生器
    description: 由使用者名稱與密碼產生 base64 編碼的 basic auth 標頭。
    guide:
      intro: '從使用者名稱與密碼組出 HTTP Basic 驗證的 Authorization 標頭：兩者以冒號相連後做 Base64 編碼，得到 Authorization: Basic dXNlcjpwYXNz 這樣的結果。'
      useCases:
        - '用 curl、Postman 或需要原始標頭的腳本呼叫 API 或受保護的端點。'
        - '確認客戶端使用 Basic 驗證時送出的內容，例如除錯 401 問題。'
        - '設定只接受預先組好標頭的 webhook 或整合。'
      steps:
        - '輸入使用者名稱與密碼。'
        - '閱讀完整的標頭字串。'
        - '複製到您的請求中（curl 寫法：-H "Authorization: Basic ..."）。'
      notes:
        - 'Base64 是編碼，不是加密。看到標頭的人都能讀出密碼，所以 Basic 驗證只能在 HTTPS 上使用。'
        - '使用者名稱不能含有冒號，因為冒號是它和密碼之間的分隔符號。密碼可以含冒號。'
        - '非 ASCII 字元會先以 UTF-8 編碼再做 Base64，這是現代伺服器預期的做法；少數舊系統預期 Latin-1，會拒絕這類密碼。'
        - '計算在瀏覽器中完成，不會傳到任何地方。即便如此，試用時仍建議用測試帳密。'
      faq:
        - q: '為什麼伺服器還是回 401？'
          a: '請確認標頭有送達伺服器（代理與某些框架會把它去掉）、該端點預期的是 Basic 而不是 Bearer 或 Digest，以及帳密正確。複製時夾帶的空白或換行也是常見原因。'
        - q: '可以把標頭解回帳密嗎？'
          a: '可以：把 Basic 後面那段貼進 Base64 解碼工具就行。這正是 Basic 驗證只能走加密連線的原因。'

  text-to-unicode:
    title: 文字轉 Unicode
    description: 解析並將文字轉換為 Unicode，或反向轉換
    guide:
      intro: '把文字轉成 HTML 數字字元參照（Hi 變成 &#72;&#105;），也能轉回來。這是在 HTML 或 XML 文件中只用 ASCII 寫出任何字元的方法之一。'
      useCases:
        - '在必須維持純 ASCII 的 HTML 檔或電子郵件範本中嵌入特殊字元、符號或非拉丁文字。'
        - '解讀網頁原始碼或資料匯出中出現的一串 &#...; 參照。'
        - '在網頁中稍微遮蔽電子郵件地址，讓簡單的爬蟲讀不到。'
      steps:
        - '要編碼時，在第一個欄位輸入文字，下方會顯示 &#...; 序列。'
        - '要解碼時，在第二個欄位貼上一串 &#...; 參照，就會顯示文字。'
        - '複製結果。'
      notes:
        - '每個字元都會被編碼，包括一般字母與空格，所以輸出比輸入長很多。瀏覽器顯示的結果完全相同。'
        - '參照使用十進位碼位（歐元符號是 &#8364;）。十六進位參照（&#x20AC;）在 HTML 中等價，但這裡不會產生也不會解碼。'
        - '基本多文種平面以外的字元，例如多數表情符號，會編碼成兩個代理對參照（例如 &#55357;&#56832;）。瀏覽器能正確顯示，但那不是該字元的單一碼位。'
        - '這不是加密也不是安全措施。任何人都能解碼，多數爬蟲也會。'
      faq:
        - q: '這和 Unicode 碼位 U+XXXX 一樣嗎？'
          a: '相關但不完全相同：&# 後面的數字是 U+FFFF 以內字元的十進位碼位。表情符號等補充字元在這個工具會輸出兩個代理對數字，而不是單一碼位。'
        - q: '什麼時候該用參照而不是直接輸入字元？'
          a: '只有在檔案無法以 UTF-8 儲存，或會經過破壞非 ASCII 文字的系統時。UTF-8 文件中直接輸入字元更簡單也更好讀。'

  ipv4-range-expander:
    title: IPv4 範圍展開器
    description: 給定起始與結束的 IPv4 位址，這個工具會計算出有效的 IPv4 子網路及其 CIDR 表示法。
    guide:
      intro: '給定一段範圍的起始與結束位址，找出能涵蓋整段範圍的最小 CIDR 區塊，並顯示該區塊涵蓋的位址數與您要求的範圍相差多少。'
      useCases:
        - '把 10.0.4.17 到 10.0.6.200 這類範圍轉成防火牆、安全群組或路由用的 CIDR。'
        - '確認對齊後的區塊比實際需要的範圍多了多少位址。'
        - '把舊式的起始／結束白名單轉成前綴表示法。'
      steps:
        - '輸入起始位址與結束位址。'
        - '閱讀結果表格：原始與擴展後的起始、結束位址、位址數量與 CIDR。'
        - '如果結束位址比起始位址小，用交換按鈕對調兩者。'
      notes:
        - 'CIDR 區塊必須對齊到 2 的次方，所以結果常常比範圍大：起始會往下取整、結束會往上取整到區塊邊界。把 CIDR 放進規則之前請先看「Addresses in range」那一列，因為多出來的位址也會被包含。'
        - '本身不是區塊的範圍，無法在不多包含位址的情況下寫成單一 CIDR。如果不能接受，請手動拆成多個區塊。'
        - '擴展的方式是逐位元比較兩個位址並保留共同前綴，所以起始與結束在高位元就不同的範圍，會擴展成非常大的區塊（甚至 /0）。'
        - '起始與結束位址會記在這個瀏覽器中，下次開啟仍在。'
      faq:
        - q: '為什麼我 1000 個位址的範圍變成了有 1024 個的 /22？'
          a: '因為 1000 不是 2 的次方，而且範圍沒有對齊。能包含全部 1000 個位址的最小區塊就是 1024 個位址寬。'
        - q: '我想要精確的多個區塊，而不是一個放大的區塊，怎麼做？'
          a: '在 2 的次方邊界把範圍切開：反覆取從目前起始位址開始、對齊且能放進範圍的最大區塊，再從下一個位址繼續。'

  text-diff:
    title: 文字差異比對
    description: 比較兩段文字，並查看它們之間的差異。
    guide:
      intro: '並排比較兩段文字，標示出不同的行與字元，使用的是和 Visual Studio Code 相同的差異編輯器。兩邊都可以編輯，所以可以邊修文字邊看差異消失。'
      useCases:
        - '找出設定檔、合約條款或程式碼兩個版本之間的改動。'
        - '確認複製或重新輸入的文字和原文完全一致。'
        - '把腳本的輸出和預期結果對照檢查。'
      steps:
        - '把原始文字貼在左側，修改後的文字貼在右側。'
        - '有改動的行會被標示；在同一行內，確切不同的字元也會標記出來。'
        - '可以直接編輯任一側，比較結果會隨輸入更新。'
      notes:
        - '比較先以行為單位，再在有改動的行內以字元為單位。行的順序調換會顯示成一個刪除加一個新增，而不是搬移。'
        - '空白的差異，例如 Tab 與空格、行尾多一個空格，都是真實差異，會被標示。如果這些是雜訊，請先把兩段文字正規化。'
        - '換行符號不同（Windows 的 CRLF 與 Unix 的 LF）會讓每一行都看起來有改動。比較前請先把兩段文字轉成相同的換行符號。'
        - '全部在瀏覽器中進行。大型文字也能用，但超過幾 MB 後編輯器可能變慢。'
      faq:
        - q: '為什麼每一行都顯示有改動？'
          a: '通常是看不見的差異：換行符號、縮排（Tab 與空格）或行尾空白。看任一行被標示的字元就能知道是哪一種。'
        - q: '可以直接比較兩個檔案嗎？'
          a: '請分別用文字編輯器打開檔案，複製內容後貼到各一側。這個工具不會直接讀取檔案。'

  otp-generator:
    title: OTP 驗證碼產生器
    description: 產生並驗證用於多重要素驗證的時間型 OTP（一次性密碼）。
    guide:
      intro: '產生並檢查以時間為基礎的一次性密碼（TOTP，RFC 6238），也就是驗證器 App 在雙重驗證登入時顯示的 6 位數代碼。它會顯示目前的代碼，連同前一個與下一個，並提供可轉成 QR Code 的金鑰 URI。'
      useCases:
        - '測試正在開發的雙重驗證登入，把伺服器產生的代碼和參考實作比對。'
        - '開發時產生密鑰與佈建用的 URI，加入驗證器 App。'
        - '找出代碼被拒絕的原因，例如伺服器與手機的時鐘有誤差。'
      steps:
        - '使用自動產生的密鑰，或貼上您自己的 Base32 密鑰。'
        - '查看目前的 6 位數代碼；每 30 秒會更換一次，旁邊也會顯示前一個與下一個代碼。'
        - '要在 App 中登錄時，使用金鑰 URI（otpauth://）或它的 QR Code，再把 App 顯示的代碼和這裡的比對。'
      notes:
        - '密鑰是 Base32 編碼（英文字母 A 到 Z 和數字 2 到 7）。不在這個範圍內的字元，例如 0、1、8、9，在密鑰中是無效的。'
        - '代碼使用 HMAC-SHA1、6 位數與 30 秒間隔，也就是幾乎所有驗證器 App 的預設值。8 位數或 SHA-256 等不同設定不在這個工具的範圍內。'
        - '代碼是依目前時間推導的，所以伺服器與裝置的時鐘都必須準確。伺服器通常也會接受前一個與下一個代碼，這就是這裡一併顯示它們的原因。'
        - '知道密鑰的人可以永遠產生有效的代碼。請把它當成密碼，並且只使用測試用的密鑰。'
      faq:
        - q: '為什麼我的代碼和手機 App 不一樣？'
          a: '可能是密鑰不同、App 使用其他設定（位數、演算法或週期），或是時鐘相差超過約 30 秒。請先檢查手機的時間，並確認已開啟自動設定時間。'
        - q: 'TOTP 和 HOTP 有什麼差別？'
          a: 'HOTP 使用每次使用後遞增的計數器，TOTP 則使用目前時間除以 30 秒所得的步數。驗證器 App 用的是 TOTP，這個工具也是圍繞它設計的。'

  url-encoder:
    title: URL 編碼／解碼
    description: 將文字編碼為 URL 編碼格式（又稱「百分號編碼」），或從該格式解碼。
    guide:
      intro: '網址只能包含有限的字元，其他字元（例如空白、中文或保留符號）必須改寫成百分比編碼，也就是 % 加上兩位十六進位數字。這個工具會做這樣的編碼與解碼，規則和 JavaScript 的 encodeURIComponent 相同。'
      useCases:
        - '組出含有空白、&、= 或中文的查詢參數值。'
        - '把日誌或網址列中一長串 %E4%B8%AD%E6%96%87 之類的內容解碼，看懂原文。'
        - '準備放在另一個網址裡的轉址目標或回呼網址（callback URL）。'
      steps:
        - '在編碼欄位輸入或貼上文字，取得百分比編碼的結果。'
        - '在解碼欄位貼上已編碼的字串，取得原始文字。'
        - '用複製按鈕取用結果。'
      notes:
        - '編碼時除了英文字母、數字和 - _ . ! ~ * '' ( ) 之外的字元都會被轉換，包括 / ? & = : #。所以不要對整個網址編碼，只編碼要放進網址的那個值，否則網址會失效。'
        - '空白會變成 %20，而不是 +。只有 HTML 表單送出時 + 才代表空白，所以解碼表單格式的字串時 + 會原樣保留。'
        - '非 ASCII 字元會先轉成 UTF-8 位元組，所以一個中文字會變成三組 %XX。'
        - '遇到 % 後面不是兩位十六進位數字，或位元組不是合法的 UTF-8 時，解碼會失敗。'
      faq:
        - q: '要編碼整個網址，還是只編碼參數值？'
          a: '只編碼參數值（必要時含參數名稱）。對整個網址編碼會連 :// 和 / 分隔符號一起轉掉，得到的字串就不再是可用的網址。'
        - q: '為什麼加號沒有被解回空白？'
          a: '百分比解碼不會特別處理 +。如果文字來自表單送出（application/x-www-form-urlencoded），請先把 + 換成空白再解碼。'

  text-to-binary:
    title: 文字轉 ASCII 二進位
    description: 將文字轉換為 ASCII 二進位表示形式，或反向轉換。
    guide:
      intro: '把文字寫成二進位，每個字元 8 個位元，也能把這種二進位轉回文字。每個字元會變成它的 ASCII 碼的二進位表示，補足 8 位數並以空格分隔。'
      useCases:
        - '教學或學習字元是如何以位元儲存的。'
        - '解開謎題、CTF 挑戰或地理藏寶線索中看起來像二進位的字串。'
        - '替設計、T 恤或展示製作二進位表示。'
      steps:
        - '在第一個欄位輸入文字，就會得到二進位形式。'
        - '在第二個欄位貼上每組 8 個 0 與 1，就會得到文字；空格與其他分隔符號會被忽略。'
        - '複製結果。'
      notes:
        - '每個字元以它的 UTF-16 碼元編成 8 位元，對 ASCII（0 到 127）與 Latin-1（最多 255）是精確的。超過 255 的字元，包括中文與多數表情符號，放不進 8 位元，編碼會不正確，請只使用 ASCII。'
        - '解碼時會先去掉所有非 0、1 的字元，然後要求位數是 8 的倍數，否則會回報二進位字串無效。'
        - '大寫字母和它的小寫形式只差一個位元（代表 32 的那一位）：A 是 01000001，a 是 01100001。'
        - '這只是一種表示法，不是壓縮也不是加密，會讓文字長度變成 8 倍。'
      faq:
        - q: '為什麼解碼出來的文字不對？'
          a: '可能是輸入沒有以 8 位元為一組（謎題中常見 7 位元一組，請在每組前面補一個 0），或是原文含有非 ASCII 字元，無法在 8 位元編碼中保留。'
        - q: '電腦真的是這樣儲存文字的嗎？'
          a: '對 ASCII 來說是的，一個字元一個位元組。現代系統使用 UTF-8，ASCII 以外的字元佔 2 到 4 個位元組；這個工具只呈現最簡單的單位元組情況。'

  ascii-text-drawer:
    title: ASCII 藝術字產生器
    description: 以多種字型與樣式產生 ASCII 藝術字。
    guide:
      intro: '用 FIGlet 字型把文字畫成大型的 ASCII 藝術字，有近 300 種樣式可選，並可調整每行寬度。適合用在終端機的歡迎橫幅、README 標題與程式碼註解。'
      useCases:
        - '替命令列工具的啟動畫面或 shell 腳本加上橫幅。'
        - '替 README、純文字電子郵件或註解區塊製作裝飾性標題。'
        - '替終端機風格的網站製作復古文字。'
      steps:
        - '輸入文字，再從清單挑選字型；Standard、Big、Slant、Shadow 是常用的選擇。'
        - '如果長文字需要提早或延後換行，調整寬度。'
        - '把結果複製到檔案或終端機。'
      notes:
        - 'ASCII 藝術字必須用等寬字型顯示。在比例字型（多數聊天軟體與文書處理器）中字母會散掉，所以請貼到終端機、程式碼區塊或 <pre> 元素中。'
        - '多數 FIGlet 字型只涵蓋 ASCII 字母、數字與標點。帶重音或非拉丁字元通常會留空，或畫成最接近的 ASCII 形式。'
        - '字型會在第一次選用時從 unpkg CDN 下載，所以每種字型第一次繪製需要網路連線。您輸入的文字不會傳到任何地方。'
        - '多行輸出很寬：大字型下一個短單字就可能超過 80 欄。要放進窄的終端機，請降低寬度或改用小字型（Small、Mini、Thin）。'
      faq:
        - q: '為什麼貼過去之後看起來是壞的？'
          a: '目的地沒有使用等寬字型，或是把連續空格合併了。請用程式碼區塊（Markdown 的三個反引號）、<pre> 標籤或終端機。'
        - q: '哪個字型像經典的 Linux 登入橫幅？'
          a: 'Standard 是許多橫幅使用的 FIGlet 預設字型；Slant、Big 與 Doom 也是廣為人知的樣式。'

  email-normalizer:
    title: Email 正規化
    description: 將電子郵件地址正規化為標準格式以便比對，適合用於去除重複與資料清理。

  json-to-xml:
    title: JSON 轉 XML
    description: 將 JSON 轉換為 XML
    guide:
      intro: '依 xml-js 函式庫的 compact 慣例把 JSON 轉成 XML：_attributes 物件變成元素屬性，_text 變成文字內容，陣列變成重複的元素。它是「XML 轉 JSON」工具的反向操作。'
      useCases:
        - '用保存為 JSON 的資料組出 SOAP 或舊式 API 的 XML 請求內容。'
        - '把先前轉成 JSON 編輯過的資料再轉回 XML。'
        - '從腳本輸出的 JSON 產生 XML 設定或 sitemap 片段。'
      steps:
        - '把 JSON（接受 JSON5 語法）貼進左側欄位。'
        - '右側會顯示 XML。'
        - '複製結果。'
      notes:
        - '一般的鍵會變成元素，一般的值會變成文字：{''{''}"a":"hi"{''}''} 會得到 <a>hi</a>。要得到 <a id="1">hi</a>，請寫成 {''{''}"a":{''{''}"_attributes":{''{''}"id":"1"{''}''},"_text":"hi"{''}''}{''}''}。'
        - 'XML 需要單一根元素，所以 JSON 物件最上層應該只有一個鍵。多個鍵會產生多個根元素，不是合法的文件。'
        - '鍵必須是合法的 XML 名稱：不能以數字開頭，也不能含空白。像 "1st" 或 "first name" 這樣的鍵會產生不合法的 XML。'
        - '數字、布林與 null 會寫成文字；null 和空物件會變成空元素。輸出是單行的，可以再丟進「XML 格式化」工具縮排。'
      faq:
        - q: '為什麼輸出沒有 XML 宣告？'
          a: '只有 JSON 中有 _declaration 鍵時才會寫出，例如 {''{''}"_declaration":{''{''}"_attributes":{''{''}"version":"1.0","encoding":"utf-8"{''}''}{''}''},"root":{''{''}...{''}''}{''}''}。'
        - q: '怎麼替元素設定屬性？'
          a: '把元素的值寫成物件，用 _attributes 鍵放屬性，需要文字內容的話再加 _text 鍵。'

  markdown-to-html:
    title: Markdown 轉 HTML
    description: 將 Markdown 轉換為 HTML，並可列印（存成 PDF）

  regex-memo:
    title: 正規表達式速查表
    description: JavaScript 正規表達式速查表

  regex-tester:
    title: 正規表達式測試器
    description: 用範例文字測試您的正規表達式。
    guide:
      intro: '用範例文字測試正規表達式，所有符合的部分會被標示出來，並列出位置與擷取群組。使用的是您瀏覽器內建的 JavaScript 正規表達式引擎。'
      useCases:
        - '在把規則貼進程式碼、驗證規則或日誌搜尋語法之前，先反覆調整測試。'
        - '透過每個符合結果與擷取群組，除錯規則為什麼匹配過多或過少。'
        - '邊試邊學正規表達式語法，立即看到結果。'
      steps:
        - '在規則欄位輸入表達式（不需要前後的斜線）。'
        - '勾選需要的旗標：全域、忽略大小寫、多行、dot-all、unicode 或 unicode sets。'
        - '輸入或貼上要比對的文字，下方會列出符合的結果與群組。'
      notes:
        - '這是 JavaScript 版本的語法。具名群組寫成 (?<name>...)，不是 Python 的 (?P<name>...)，也沒有佔有式量詞、原子群組等功能。要把規則用在其他語言之前，請先確認差異。'
        - '沒有開啟全域旗標時，只會回傳第一個符合結果。多行旗標讓 ^ 和 $ 對每一行生效，dot-all 則讓 . 可以匹配換行字元。'
        - 'Unicode（u）與 unicode sets（v）是二選一；兩者都勾選時會使用 u。規則含有表情符號或 \p{''{''}...{''}''} 屬性跳脫時，請開啟其中一個。'
        - '規則不合法時只會顯示沒有結果。像 (a+)+ 這種巢狀量詞，在某些輸入上會花費指數時間，可能讓分頁卡死。'
      faq:
        - q: '為什麼規則在這裡可以，換成其他語言卻不行？'
          a: '各語言的正規表達式引擎不同。後向斷言、具名群組、旗標與 Unicode 處理方式在 JavaScript、Python、PCRE、Java 之間都有差異，請用程式實際執行的引擎測試。'
        - q: '為什麼只看到一個符合結果？'
          a: '全域（g）旗標沒有開啟。打開它就會找出所有符合的結果，而不是找到第一個就停止。'

  safelink-decoder:
    title: Outlook Safelink 解碼器
    description: 解碼 Outlook SafeLink 連結

  xml-to-json:
    title: XML 轉 JSON
    description: 將 XML 轉換為 JSON
    guide:
      intro: '以 xml-js 函式庫的 compact 慣例把 XML 文件轉成 JSON：屬性放在 _attributes 底下，文字內容放在 _text，重複的元素會變成陣列。全部在瀏覽器中執行。'
      useCases:
        - '在腳本或瀏覽器工具中，把 SOAP 回應、RSS 訂閱或設定檔當成 JSON 讀取。'
        - '探索一份不熟悉的 XML 文件的結構。'
        - '把 XML 資料準備給只接受 JSON 的 API 或 NoSQL 資料庫。'
      steps:
        - '把 XML 貼進左側欄位。不合法的 XML 會顯示錯誤。'
        - '右側會顯示 JSON。'
        - '複製結果。'
      notes:
        - '屬性會集中在 _attributes 物件，元素文字放在 _text，所以 <a id="1">hi</a> 會變成 {''{''}"a":{''{''}"_attributes":{''{''}"id":"1"{''}''},"_text":"hi"{''}''}{''}''}。'
        - '只出現一次的元素會變成物件，同一個元素出現兩次就會變成陣列。讀取結果的程式必須處理這兩種形狀，或先把它們統一。'
        - '所有的值都是字串。XML 沒有型別，所以 42 和 true 會維持 "42" 與 "true"。'
        - 'XML 宣告、註解、CDATA 與處理指令會保留在 _declaration、_comment、_cdata 等鍵底下。命名空間會留在元素名稱裡（ns:item）。'
      faq:
        - q: '為什麼同一個元素有時是物件、有時是陣列？'
          a: '轉換器無法知道哪些元素是設計成會重複的。出現一次是物件，兩次以上是陣列。在程式中用類似 [].concat(value) 的方式統一即可。'
        - q: '為什麼我的數字變成字串？'
          a: 'XML 不帶型別資訊，所以每個值都是文字。請在讀取端再轉成數字或布林值。'

  certificate-parser:
    title: X.509 憑證解析
    description: 解析 PEM 或 DER 憑證（或整條憑證鏈），顯示主體、簽發者、有效期限與剩餘天數、SAN、金鑰類型、金鑰用途、擴充欄位與指紋。全部在瀏覽器中完成。
    guide:
      intro: '解析 X.509 憑證或整條憑證鏈，列出主體（subject）、簽發者、有效期間與剩餘天數、主體別名、公鑰類型、金鑰用途、擴充欄位，以及 SHA-1 和 SHA-256 指紋。解析在瀏覽器中進行。'
      useCases:
        - '查出 TLS 憑證何時到期，以及它實際涵蓋哪些網域名稱（SAN）。'
        - '比對指紋，確認伺服器出示的憑證就是您剛簽發的那一張。'
        - '檢視 PEM 合併檔裡的憑證鏈，看哪一張是終端憑證、哪一張是中繼憑證，以及各由誰簽發。'
      steps:
        - '貼上 PEM 區塊（-----BEGIN CERTIFICATE-----）或純 base64 的 DER 憑證。貼上多張憑證會被視為憑證鏈。'
        - '查看每張憑證的狀態標籤（有效、已過期或尚未生效）與剩餘天數。'
        - '展開詳細資料，查看名稱、金鑰資訊、用途與指紋，並複製需要的內容。'
      notes:
        - '現代瀏覽器是用主體別名（SAN）比對主機名稱，而不是一般名稱（CN），所以憑證因名稱不符被拒絕時，請檢查 SAN 清單。'
        - '這個工具只做解析，不會用受信任的根憑證驗證憑證鏈、檢查是否已撤銷，也不會確認憑證是否符合某把私鑰。'
        - '只會讀取憑證。貼上的內容裡如果有私鑰會被忽略，也請不要把私鑰貼進任何網頁工具。'
        - '有效期間是依您裝置的時鐘判斷的，系統日期不對的話，狀態標籤和剩餘天數也會跟著改變。'
      faq:
        - q: '怎麼取得網站的憑證？'
          a: '在瀏覽器中，從網址列的鎖頭開啟憑證詳細資料，匯出成 PEM。在命令列可以用 openssl s_client -connect example.com:443 -showcerts，它會以 PEM 格式印出憑證鏈。'
        - q: '指紋是做什麼用的？'
          a: '指紋是整張憑證的雜湊值。拿它和對方公布的值比對，就能確認看到的是完全相同的憑證，憑證釘選（certificate pinning）和許多手動信任檢查都是這個原理。'

  jwt-signer:
    title: JWT 簽章與驗證
    description: 由 header 與 payload 產生已簽章的 JSON Web Token，或驗證 token 的簽章，支援 HS256/384/512、RS256/384/512、PS256/384/512 與 ES256/384/512。金鑰不會離開瀏覽器。
    guide:
      intro: '依照您撰寫的標頭與內容產生簽署過的 JSON Web Token，也能驗證既有權杖的簽章。支援 HMAC（HS256/384/512）、RSA（RS 與 PS）和 ECDSA（ES256/384/512），使用瀏覽器內建的 Web Crypto，金鑰不會離開這個頁面。'
      useCases:
        - '不寫腳本，直接產生符合 API 需求（宣告、到期時間、演算法）的測試權杖。'
        - '除錯 401 或簽章無效的錯誤時，確認某個權杖的簽章是否符合特定的密鑰或公鑰。'
        - '在把演算法接進服務之前，先試試 HS256、RS256、ES256 的差異。'
      steps:
        - '選擇演算法，再編輯標頭與內容的 JSON。alg 欄位會自動設定，typ 預設為 JWT。'
        - 'HS 系列請輸入共享密鑰（可選 UTF-8 文字或 base64url）。RS、PS、ES 系列請貼上私鑰，或按按鈕產生一組金鑰。'
        - '複製簽署後的權杖。要驗證時，在驗證區貼上權杖與密鑰或公鑰，看結果。'
      notes:
        - '私鑰必須是 PKCS#8 格式的 PEM，開頭為 -----BEGIN PRIVATE KEY-----。以 BEGIN RSA PRIVATE KEY 或 BEGIN EC PRIVATE KEY 開頭的金鑰不被接受，請先轉換：openssl pkcs8 -topk8 -nocrypt -in key.pem。'
        - '曲線要和演算法對應：ES256 用 P-256，ES384 用 P-384，ES512 用 P-521（不是 P-512）。金鑰不符時會有明確的錯誤訊息。'
        - '驗證只檢查簽章，不會檢查 exp、nbf、aud、iss，所以已過期的權杖也可能顯示為有效。宣告請用 JWT 解析工具檢查。'
        - '驗證時可以貼公鑰（-----BEGIN PUBLIC KEY-----）；貼 PKCS#8 私鑰也可以，因為會從中推導出公鑰。'
        - '請只使用測試用的金鑰，不要把正式環境的私鑰或密鑰貼進任何網頁，即使它在本機執行也一樣。'
      faq:
        - q: 'HS256 和 RS256 有什麼差別？'
          a: 'HS256 用同一組共享密鑰簽署與驗證，所以能驗證的人也能偽造權杖。RS256 用私鑰簽署、公鑰驗證，因此可以公開驗證的能力，而不必公開簽署的能力。'
        - q: '為什麼驗證顯示簽章無效？'
          a: '最常見的原因是密鑰或金鑰不同、密鑰的編碼選錯（UTF-8 文字與 base64url）、權杖標頭指定的演算法和您預期的不同，或是權杖在簽署後被修改過。'

  chinese-converter:
    title: 繁簡中文轉換
    description: 使用 OpenCC 在簡體中文與繁體中文（台灣、香港，可選擇台灣慣用詞，例如「软件」→「軟體」）之間轉換文字，全部在瀏覽器中完成。
    guide:
      intro: '使用開源的 OpenCC 字典在簡體與繁體中文之間轉換。除了逐字轉換之外，也能套用台灣、香港的用字，並可選擇一併轉換台灣的慣用詞彙，例如「软件」變成「軟體」。'
      useCases:
        - '把簡體中文的文件、字幕檔或 README 轉成繁體，給台灣或香港的讀者。'
        - '在地化產品文案，讓用字和日常用語（軟體、記憶體、影片）都讀起來自然。'
        - '把繁體文字轉成簡體，提供給中國大陸的讀者，或用來比對簡體資料。'
      steps:
        - '在「From」選擇來源字體，在「To」選擇目標字體；交換按鈕可以對調兩者。'
        - '只轉換字形請選「台灣」；連用語一起轉換請選「台灣，含慣用詞」。'
        - '貼上文字，複製轉換後的結果。'
      notes:
        - '只做字形轉換無法得到自然的繁體中文，因為兩地對同一件事用不同的詞，例如「内存」與「記憶體」、「软件」與「軟體」。要給台灣讀者看的文字，請使用「台灣，含慣用詞」。'
        - '有些簡體字對應到多個繁體字（「发」可能是「發」或「髮」，「后」可能是「后」或「後」）。OpenCC 多半能依前後文判斷，但專有名詞和不常見的詞組仍可能轉錯，請務必校對。'
        - '轉換不等於翻譯。文法、標點風格和人名的地區寫法差異都不會被改動。'
        - '您上次選擇的轉換方向會記在這個瀏覽器中，文字內容不會上傳。'
      faq:
        - q: '繁體的幾個選項有什麼差別？'
          a: '「台灣」把字形轉成台灣標準用字；「台灣，含慣用詞」另外會替換地區性詞彙；「香港」使用香港字形；「OpenCC 標準」則是不含地區差異的中性字形。'
        - q: '為什麼有個詞轉錯了？'
          a: '轉換是以字典為基礎，所以罕見的人名、引文和有歧義的字可能對應錯誤。請手動修正，或把文字拆開，讓有歧義的詞有更多上下文。'
