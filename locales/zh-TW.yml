  sql-prettify:
    title: SQL 美化與格式化
    description: 線上格式化並美化您的 SQL 查詢（支援多種 SQL 方言）。
    guide:
      intro: '把 SQL 整理成一致縮排、易讀的版面，可選擇資料庫方言（PostgreSQL、MySQL、SQL Server、BigQuery 等）、關鍵字大小寫與縮排樣式。由 sql-formatter 函式庫驅動。'
      useCases:
        - '從日誌、ORM 或 BI 工具複製出來的一長串查詢，先整理成可讀再除錯。'
        - '提交或貼進審查之前，統一查詢的風格。'
        - '整理腳本產生的單行查詢。'
      steps:
        - '選擇符合您資料庫的方言，讓它特有的關鍵字與語法能被正確辨識。'
        - '選擇關鍵字大小寫（大寫、小寫或保留）與縮排樣式。'
        - '貼上查詢，複製整理後的結果。'
      notes:
        - '格式化只調整空白與關鍵字大小寫，絕不改變查詢的意義，也不會對照資料庫結構做驗證。'
        - '選錯方言可能誤讀方言特有的語法（例如 T-SQL 的中括號或 PostgreSQL 的 :: 轉型），產生奇怪的斷行。Standard SQL 是安全的保底選項。'
        - '表格式縮排會把關鍵字對齊成一欄，有些團隊偏好用在很長的 SELECT 清單；Standard 則是常見的巢狀版面。'
        - '以分號分隔的多個敘述會依序逐一格式化。'
      faq:
        - q: '為什麼某個語法附近的輸出看起來不對？'
          a: '最可能是方言不符。請切換到您資料庫的方言；如果是不常見的語法，Standard SQL 可能會格式化得比較穩定。'
        - q: '格式化會改變資料庫執行查詢的方式嗎？'
          a: '不會。空白與關鍵字大小寫對資料庫沒有影響，字串常值與識別字也都不會被動到，查詢的行為完全一樣。'

