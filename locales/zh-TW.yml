  csv-to-json:
    title: 'CSV 轉 JSON'
    description: '把 CSV（或 TSV）解析成 JSON，可自動偵測分隔符號、轉換型別，並提供表格預覽。'
    input: '你的 CSV'
    inputPlaceholder: '把 CSV 貼在這裡…'
    output: '轉換後的 JSON'
    preview: '表格預覽'
    previewTruncated: '顯示前 {shown} 列，共 {total} 列。'
    delimiter: '分隔符號'
    autoDetect: '自動偵測'
    comma: '逗號（,）'
    semicolon: '分號（;）'
    tab: 'Tab'
    pipe: '直線（|）'
    indent: '縮排空格數'
    hasHeader: '第一列是標題'
    inferTypes: '轉換數字與布林值'
    trimValues: '去除值前後空白'
    guide:
      intro: 'CSV 是試算表與資料庫最通用的交換格式，JSON 則是 API 與程式最常用的格式。這個工具依 RFC 4180 解析 CSV，正確處理引號內的逗號與換行，並輸出結構化的 JSON。'
      useCases:
        - '把 Excel 或 Google 試算表匯出的資料餵給 API 或前端程式。'
        - '拿到一份 CSV，想先用表格預覽確認欄位對齊、有沒有解析錯位。'
        - '把資料庫匯出的 CSV 轉成 JSON 當作測試資料或設定檔。'
      steps:
        - '把 CSV 內容貼進輸入框，分隔符號預設自動偵測。'
        - '在表格預覽確認欄位切得正確，特別注意含逗號的欄位有沒有被切開。'
        - '視需要調整「第一列是標題」「轉換數字與布林值」等選項。'
        - '從下方的 JSON 輸出複製結果。'
      notes:
        - '含有逗號、換行或雙引號的欄位，在 CSV 裡必須用雙引號包住，內部的雙引號要寫成兩個。工具會正確還原這類欄位。'
        - '「轉換數字與布林值」刻意保守：像 007、1.0、超過安全整數範圍的長數字都會保持字串，避免靜默失真。'
        - '如果自動偵測選錯分隔符號，手動指定即可。分號常見於歐洲地區的 Excel 匯出檔。'
        - '所有解析都在你的瀏覽器裡完成，資料不會上傳。'
      faq:
        - q: '中文顯示成亂碼怎麼辦？'
          a: '那是檔案編碼問題，不是這個工具造成的。Excel 匯出的 CSV 常是 Big5 或帶 BOM 的 UTF-8。用文字編輯器另存成 UTF-8 之後再貼進來即可。'
        - q: '可以反過來把 JSON 轉成 CSV 嗎？'
          a: '可以，用「JSON 轉 CSV」那個工具。兩者的引號處理都遵循 RFC 4180，所以來回轉換不會失真。'

  json-to-csv:
    title: JSON 轉 CSV
    description: 將 JSON 轉換為 CSV，並自動偵測欄位標題。
    guide:
      intro: '把 JSON 物件陣列轉成 CSV。標題列由所有物件出現過的鍵聯集而成，所以欄位不一致的紀錄也會對齊到正確的欄。'
      useCases:
        - '在 Excel 或 Google 試算表中開啟 API 回應或資料庫匯出的資料。'
        - '把一份紀錄清單交給習慣用試算表工作的同事。'
        - '把 JSON 日誌或問卷結果轉換後在 BI 工具中分析。'
      steps:
        - '貼上 JSON 物件陣列，例如 [{''{''}"name":"Ann","age":30{''}''},{''{''}"name":"Bob"{''}''}]。接受 JSON5 語法。'
        - '右側會顯示 CSV：第一行是標題，之後每個物件一行。'
        - '複製結果並存成 .csv 檔。'
      notes:
        - '標題是所有鍵的聯集，依第一次出現的順序排列。缺少的鍵會是空白儲存格；值為 null 會寫成 null。'
        - '含有逗號或雙引號的欄位會加引號，內部的引號會寫成兩個，符合 RFC 4180。值裡的換行會寫成 \n，讓每筆紀錄維持一行。'
        - '巢狀物件與陣列不會被攤平：會顯示成 [object Object]，或是以逗號相連的項目。轉換前請先把資料攤平（例如 address.city）。'
        - '輸入必須是物件陣列。單一物件或純量陣列無法產生有用的表格。'
      faq:
        - q: '為什麼某一欄顯示 [object Object]？'
          a: '那個欄位放的是巢狀物件。CSV 是平面的，請先把巢狀資料攤平成獨立的鍵，例如 address_city，再轉換。'
        - q: 'Excel 把所有內容塞在同一欄，怎麼回事？'
          a: '某些語系的 Excel 預期分號作為分隔符號。請用「資料 > 從文字/CSV」匯入並選逗號作為分隔符號，或改用 Google 試算表開啟。'

