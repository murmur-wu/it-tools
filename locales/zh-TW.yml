    numbers: '數字（0-9）'
    symbols: '符號（!#$%…）'
    excludeAmbiguous: '排除容易混淆的字元（0 O o 1 l I）'
    requireEach: '每種勾選的類型至少包含一個字元'
    noCharacterSet: '至少要勾選一種字元類型。'
    separator: '分隔符號'
    separators:
      hyphen: '連字號（-）'
      underscore: '底線（_）'
      space: '空格'
      dot: '句點（.）'
      none: '無'
    capitalize: '每個單字首字母大寫'
    addNumber: '結尾加上兩位數字'
    regenerate: '重新產生'
    strength: '強度'
    levels:
      0: '非常弱'
      1: '弱'
      2: '普通'
      3: '強'
      4: '非常強'
    entropy: '熵值 {bits} 位元'
    crackTime: '以每秒一百億次離線猜測，平均破解時間：'
    crack:
      instant: '瞬間'
      ages: '比宇宙年齡還長'
      seconds: '{n} 秒'
      minutes: '{n} 分鐘'
      hours: '{n} 小時'
      days: '{n} 天'
      years: '{n} 年'
    privacy: '由瀏覽器內建的密碼學亂數來源產生，不會傳送到任何地方，也不會儲存。'
    guide:
      intro: '好的密碼要夠長、夠隨機，而且一個帳號只用一次。這個工具用瀏覽器內建的密碼學亂數來源產生密碼，結果無法被預測，也不會離開你的裝置，同時估算攻擊者要猜多久才猜得到。'
      useCases:
        - '註冊新帳號，密碼打算存在密碼管理器裡而不是用背的。'
        - '需要一組真的打得出來、念得出來的密語，例如 Wi-Fi 密碼或筆電登入。'
        - '替手機、卡片或門鎖產生 PIN 碼。'
        - '一次產生好幾組，從中挑一個順眼的。'
      steps:
        - '選類型：存進密碼管理器的用隨機密碼，需要手打的用密語，數字鎖用 PIN。'
        - '調整長度或單字數與字元類型，下方的強度面板會即時更新。'
        - '點結果旁的複製圖示取用，或按 Ctrl+Enter 重新產生一批。'
      notes:
        - '長度比符號重要得多。16 個隨機英數字比 8 個混雜各種符號的字元強。'
        - '從 2048 個單字的清單挑四個字組成的密語約有 44 位元的熵值，跟 8 個字元的完全隨機密碼差不多，但好打非常多。'
        - '破解時間的估算假設攻擊者拿到雜湊後離線猜測，速度每秒一百億次。有登入次數限制的網站慢得多；用弱演算法雜湊的外洩資料庫大約就是這個速度。'
        - '產生的密碼不要在多個帳號重複使用，一個網站外洩就會連帶影響其他帳號。'
      faq:
        - q: '在網站上產生密碼安全嗎？'
          a: '在這裡是安全的：產生過程完全在你的瀏覽器裡用 Web Crypto API 完成，不會對任何伺服器發出請求。你可以在產生時打開瀏覽器的網路面板自行確認。'
        - q: '為什麼有些網站不接受產生出來的符號？'
          a: '有些服務只接受部分符號。把符號選項取消勾選，然後把長度多加幾個字元，強度一樣夠。'

  token-generator:
    title: Token 產生器
    description: 以您想要的字元（大寫或小寫字母、數字及／或符號）產生隨機字串。

    uppercase: '大寫 (ABC...)'
    lowercase: '小寫 (abc...)'
    numbers: '數字 (123...)'
    symbols: '符號 (!-;...)'
    length: '長度'
    tokenPlaceholder: 'Token...'
    copied: Token 已複製到剪貼簿
    button:
      copy: 複製
      refresh: 重新產生
    guide:
      intro: '依照您選擇的字元集合產生一串隨機字串，適合用來當作 API 金鑰、Session 密鑰、測試資料或一次性識別碼。亂數來源是瀏覽器內建的密碼學安全亂數。'
      useCases:
        - '替應用程式設定檔產生 API 金鑰、Webhook 密鑰或 Session 密鑰。'
        - '產生指定長度的隨機字串，當作測試資料或暫時的識別碼。'
        - '系統不接受符號時，產生只含英文字母與數字的權杖。'
      steps:
        - '開關字元集合：大寫、小寫、數字、符號。'
        - '拖曳滑桿設定長度（1 到 512，預設 64）。'
        - '複製權杖，或按重新整理（也可按 Ctrl+Enter）取得新的一組。'
      notes:
        - '亂數來自瀏覽器的 crypto.getRandomValues，並用拒絕取樣避免偏差，每個字元出現的機率相同，不會用到 Math.random。'
        - '強度取決於長度與字元集合大小。64 個英數字元約有 380 位元的熵，遠超過多數系統需求；當作密鑰的話 32 個字元就已經很夠。'
        - '四種字元集合全部關閉時，結果會是空的。'
        - '設定會記在網址上，把網址加入書籤，下次開啟會是相同選項；產生出來的權杖本身不會寫進網址。'
      faq:
        - q: '權杖會被傳送到哪裡嗎？'
          a: '不會。它在您的瀏覽器中產生，不會上傳也不會儲存，請複製後存放在密碼管理工具或密鑰管理服務中。'
        - q: '可以拿來產生使用者密碼嗎？'
          a: '需要人輸入或記憶的密碼，請改用「密碼產生器」，它可以避開容易混淆的字元。這個工具適合系統之間使用的密鑰。'
