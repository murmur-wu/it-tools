about:
  content: >
    # 關於 IT-Tools

    IT-Tools 匯集了對開發者與 IT 從業人員實用的線上工具，所有工具都直接在瀏覽器中執行。如果您覺得好用，歡迎分享給需要的朋友，也別忘了加入書籤！

    本站是開源專案 [IT-Tools](https://github.com/CorentinTh/it-tools)（作者 Corentin Thomasset，GPL-3.0 授權）的客製化部署版本。這個版本的原始碼公開在 [GitHub](https://github.com/murmur-wu/it-tools)。

    ## 技術

    IT-Tools 使用 Vue.js（Vue 3）搭配 Naive UI 元件庫開發，並託管於 Cloudflare。部分工具使用了第三方開源函式庫，完整清單請見儲存庫中的 [package.json](https://github.com/murmur-wu/it-tools/blob/main/package.json)。

    ## 發現錯誤？缺少想要的工具？

    歡迎到 GitHub 儲存庫的 [issues 區](https://github.com/murmur-wu/it-tools/issues) 提出功能需求或回報問題。

