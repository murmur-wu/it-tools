    result:
      days: '相差天數'
      countedDays: '排除後的天數'
      daysValue: '{count} 天'
      reversed: '結束日期早於開始日期，所以結果是負數。'
      calendarDays: '日曆天數 {count} 天'
      excludedPrefix: '，已排除 {count} 天：'
      excludedWeekday: '{weekday} {count} 天'
      excludedHolidays: '國定假日 {count} 天'
      separator: '、'
      weeks: '相當於 {weeks} 週又 {days} 天'
      calendarDifference: '兩個日期相差 {value}'
      unitSeparator: ' '
      units:
        years: '{count} 年'
        months: '{count} 個月'
        days: '{count} 天'
      date: '結果日期'
      shiftedAfter: '開始日期之後第 {count} 個計算日，日曆上相隔 {calendarDays} 天'
      shiftedBefore: '開始日期之前第 {count} 個計算日，日曆上相隔 {calendarDays} 天'
      skippedPrefix: '途中跳過 {count} 天：'
      holidaysInRange: '期間的國定假日'
      missingHolidayYears: '{years} 年還沒有國定假日資料（目前涵蓋 {first}–{last} 年），這些年份的國定假日沒有被排除。'
    guide:
      intro: '日期計算器有三種用法：算出兩個日期之間有幾天、從某一天往後推算，以及往前推算。可以排除指定的星期幾，也能依人事行政總處公布的辦公日曆表排除台灣的國定假日與補假，直接算出「工作天」。'
      useCases:
        - '計算合約、租約或試用期從哪天到哪天共有幾天，或還剩幾天。'
        - '公文、法規或合約寫「於 10 個工作天內」，要算出實際的截止日期。'
        - '專案排程：從開工日往後推算 30 個工作天，跳過週末、春節與連假。'
        - '回推日期：交件日往前 5 個工作天要先完成內部審核，算出最晚哪天要送審。'
      steps:
        - '在上方選擇模式：「計算天數」、「增加天數」或「減去天數」。'
        - '選擇開始日期（可按「今天」快速帶入）；計算天數時再選結束日期，加減天數時輸入天數。'
        - '在「計算設定」勾選要排除的星期與國定假日；按「只算工作天」可一次勾好週六、週日與國定假日。'
        - '按「計算」看結果。結果會列出排除了哪些天與期間的國定假日；之後修改日期或設定，結果會自動更新。'
      notes:
        - '計算天數時，預設算到結束日期的前一天為止，也就是「1 月 1 日到 1 月 31 日」是 30 天；要把結束日期也算進去，請勾選「包含結束日期」。'
        - '增加或減去天數時，開始日期本身不算在內：從星期五往後加 1 個工作天，結果是下週一。'
        - '同時排除週六、週日與國定假日時，人事行政總處公告的週六補班日會算成工作天，結果與政府機關的上班日一致。'
        - '國定假日資料涵蓋的年份寫在「排除國定假日」下方。政府每年約 6 月公布隔年的辦公日曆表後會再更新，超出範圍的年份會顯示提醒。'
        - '這裡的國定假日指政府行政機關的放假日。民營企業、學校或特定行業（如勞動節只有勞工放假）的實際休假可能不同，重要期限請以主管機關或契約規定為準。'
      faq:
        - q: '為什麼 1 月 1 日到 1 月 31 日是 30 天，不是 31 天？'
          a: '兩個日期「相差」的天數不含結束日期，這和大多數行事曆與試算表的算法一致。如果要算「共幾天」（頭尾都算），請勾選「包含結束日期」，結果就會是 31 天。'
        - q: '工作天是怎麼算的？'
          a: '按「只算工作天」會排除週六、週日與國定假日（含補假），並把週六補班日算回來。用這個設定算出的一整年天數，與人事行政總處辦公日曆表上的上班日完全相同。'
        - q: '颱風假會算進去嗎？'
          a: '不會。颱風假由各縣市臨時公布，無法事先列入；如果期間有放颱風假，請自行扣除。'
        - q: '可以算其他國家的假日嗎？'
          a: '目前只內建台灣的國定假日。其他國家可以只用「排除星期」的功能，再自行扣除當地假日。'

  date-converter:
    title: 日期時間轉換器
    description: 將日期與時間轉換為各種不同的格式
    timezone: '時區'
    guide:
      intro: '同一個時間點在不同系統裡有不同的寫法：Unix 時間戳、ISO 8601、RFC 3339、Excel 序列值、MongoDB ObjectID 等等。這個工具把你貼進去的值辨識出來，同時輸出所有常見格式，並可指定時區。'
      useCases:
        - '在日誌或 API 回應裡看到一串數字，想知道那是什麼時間。'
        - '要把時間寫進設定檔或資料庫，需要特定格式的字串。'
        - '跨時區協作時，想確認某個時間點在對方時區是幾點。'
        - '從 Excel 匯出的資料裡日期變成一串小數，需要還原成日期。'
      steps:
        - '把時間值貼進輸入框，工具會自動辨識格式並切換下方的格式選單。'
        - '若辨識錯誤，手動在右邊的選單指定輸入格式。'
        - '在時區選單選擇你要的時區，所有輸出會跟著換算。'
        - '點各欄位右側的複製圖示取用結果。'
      notes:
        - '輸入的字串如果沒有帶時區偏移（例如 2023-04-12 23:10:24），會以你選的時區解讀；帶了偏移（例如結尾有 Z 或 +08:00）則以該偏移為準，不受時區選單影響。'
        - 'Unix 時間戳有秒與毫秒兩種，十位數通常是秒、十三位數是毫秒。工具會依位數判斷。'
        - 'Excel 的日期序列值是從 1900 年起算的天數，小數部分代表當天的時間。'
      faq:
        - q: '要一次轉很多筆時間戳怎麼辦？'
          a: '用「時間戳批次轉換」那個工具，可以一次貼多筆並輸出成表格。'
        - q: 'ISO 8601 和 RFC 3339 有什麼差別？'
          a: 'RFC 3339 可以視為 ISO 8601 的嚴格子集，強制要求日期與時間之間用 T 分隔、並且一定要帶時區偏移。實務上要寫進 API 或設定檔時，選 RFC 3339 比較不會出錯。'

  phone-parser-and-formatter:
    title: 電話號碼解析與格式化
    description: 解析、驗證並格式化電話號碼。取得電話號碼的相關資訊，例如國碼、類型等。

  ipv4-subnet-calculator:
    title: IPv4 子網路計算器
    description: 解析您的 IPv4 CIDR 區塊，並取得子網路的所有相關資訊。
    guide:
      intro: '輸入帶有遮罩的 IPv4 位址（CIDR，例如 192.168.0.1/24，或子網路遮罩），就能得到網路位址、遮罩、萬用遮罩（wildcard）、第一個與最後一個可用位址、廣播位址與位址數量，同時顯示位址等級。'
      useCases:
        - '規劃如何把網路切成多個子網路，並檢查兩個範圍是否重疊。'
        - '弄清楚雲端安全群組或防火牆規則中的某個 CIDR 區塊實際涵蓋哪些位址。'
        - '找出某台主機所在網段的網路位址與廣播位址，或在 /24 與 255.255.255.0 兩種寫法之間轉換。'
      steps:
        - '輸入位址與遮罩，例如 10.0.0.0/22。'
        - '看表格：網路位址、點分十進位與二進位的遮罩、萬用遮罩、網路大小、第一個與最後一個位址、廣播位址與 IP 等級。'
        - '用上一個、下一個按鈕切換到相鄰且大小相同的區塊。'
      notes:
        - '「Network size」是區塊內的位址總數。一般子網路中，第一個（網路位址）與最後一個（廣播位址）不能指派給主機，所以可用主機數是總數減 2。'
        - '「First address」與「Last address」是第一個與最後一個可用的主機位址，因此和網路位址、廣播位址不同。'
        - '/31 與 /32 區塊沒有廣播位址，該欄位會顯示不存在。/31 用於點對點連線，/32 則代表單一主機。'
        - '萬用遮罩就是子網路遮罩反相，用於部分路由器的存取清單，例如 Cisco ACL。'
      faq:
        - q: '/24 可以放多少台主機？'
          a: '/24 共有 256 個位址，其中 254 個可指派給主機。前綴每縮短一位，大小就加倍，所以 /23 有 512 個位址。'
        - q: '支援 IPv6 嗎？'
          a: '不支援，這個計算器只處理 IPv4。'

