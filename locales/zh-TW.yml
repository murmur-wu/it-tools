  roman-numeral-converter:
    title: 羅馬數字轉換器
    description: 將羅馬數字轉換為阿拉伯數字，或將阿拉伯數字轉換為羅馬數字。

  hmac-generator:
    title: HMAC 產生器
    description: 使用密鑰與您偏好的雜湊函式，計算雜湊訊息驗證碼（HMAC）。
    guide:
      intro: '計算 HMAC，也就是把訊息和密鑰混在一起產生的雜湊，可使用 MD5、SHA-1、SHA-2（224、256、384、512）、SHA-3 或 RIPEMD-160。HMAC 能證明訊息是由知道密鑰的人產生，而且傳遞過程中沒有被改動。'
      useCases:
        - '驗證服務用共享密鑰對請求內容簽署的 Webhook 簽章。'
        - '重現 API 預期的簽章（請求簽署、簽名網址），找出自己的簽章為什麼被拒絕。'
        - '拿已知正確的結果檢查自己的 HMAC 實作。'
      steps:
        - '在明文欄位輸入訊息，在密鑰欄位輸入共享密鑰。'
        - '選擇雜湊函式，一般使用 SHA256。'
        - '選擇輸出編碼（十六進位、base64、base64url 或二進位），複製 HMAC。'
      notes:
        - '訊息和密鑰都是當成 UTF-8 文字處理。如果您的密鑰是二進位，或以十六進位、base64 提供，請先解碼；否則工具會把那串文字的字元本身當成密鑰。'
        - '訊息中多一個空白或換行，整個結果就會完全不同，所以請貼上實際被簽署的位元組，例如原始的請求內容，而不是重新排版過的版本。'
        - '建議使用 SHA-256 或更強的函式。HMAC-MD5 與 HMAC-SHA1 作為訊息驗證碼仍被認為安全，但主要是為了舊系統而保留。'
        - '在伺服器上請以固定時間的方式比較 HMAC（例如 crypto.timingSafeEqual），而不是用一般的字串比較。'
      faq:
        - q: 'HMAC 和單純的雜湊有什麼不同？'
          a: '單純的雜湊任何人都能算，所以只能偵測意外的變動。HMAC 需要密鑰，因此還能證明訊息的來源，並讓攻擊者無法偽造出相符的值。'
        - q: '為什麼我算出的 HMAC 和服務傳來的不一樣？'
          a: '常見原因是輸出編碼不同（十六進位與 base64）、密鑰應該先解碼、雜湊函式選錯，或是請求內容在您簽署之前已被框架修改過。'

  bip39-generator:
    title: BIP39 密語產生器
    description: 從既有或隨機的助記詞產生 BIP39 密語，或從密語取得助記詞。

  base64-file-converter:
    title: Base64 檔案轉換器
    description: 將字串、檔案或圖片轉換為 base64 表示形式。

  list-converter:
    title: 清單轉換器
    description: 這個工具可以處理以欄為主的資料，並對每一列套用各種變更（轉置、加上前綴與後綴、反轉清單、排序清單、轉為小寫、截斷內容）。

  base64-string-converter:
    title: Base64 字串編碼／解碼
    description: 輕鬆將字串編碼為 base64，或從 base64 解碼。
    guide:
      intro: 'Base64 會把任意位元組轉成由 64 個可列印字元組成的文字，讓資料能通過只能處理文字的管道，例如 JSON 欄位、網址、電子郵件或 HTTP 標頭。這個工具可以把文字編碼成 Base64，也能解碼還原，並正確處理 UTF-8 字元。'
      useCases:
        - '解讀設定檔、HTTP 標頭或 JSON 資料中的 Base64 值，看裡面實際是什麼。'
        - '產生要放進環境變數或 Kubernetes Secret 清單的 Base64 字串。'
        - '產生可放在網址參數或類似 JWT 片段中的 URL 安全版本。'
      steps:
        - '要編碼時，在「String to encode」輸入或貼上文字，下方會顯示 Base64 結果。'
        - '要解碼時，在第二張卡片貼上 Base64 字串，下方會顯示解碼後的文字。'
        - '如果值要用在網址或 JWT 中，打開任一邊的 URL 安全選項。'
        - '用複製按鈕取用結果。'
      notes:
        - 'Base64 只是編碼，不是加密，任何人都能解開，無法用來保護機密。'
        - 'URL 安全版本會把 + 和 / 換成 - 和 _，並省略結尾的 = 補位。用錯選項解碼會顯示字串無效。'
        - '編碼後的資料約比原本大三分之一（3 個位元組變成 4 個字元）。'
        - '如果解碼出來的位元組不是合法文字（例如圖片、壓縮檔），在這裡看不出有意義的內容，二進位資料請改用檔案轉換工具。'
      faq:
        - q: '為什麼解碼時顯示字串無效？'
          a: '常見原因：URL 安全字串沒開 URL 安全選項解碼（或反過來）、含有不屬於字母表的字元，或複製時被截斷。'
        - q: '解碼後為什麼出現亂碼？'
          a: '原始位元組可能不是 UTF-8 文字，例如二進位檔案或其他編碼的文字。解碼只有對從 UTF-8 編碼來的文字才有意義。'

  toml-to-yaml:
    title: TOML 轉 YAML
    description: 解析 TOML 並轉換為 YAML。
    guide:
      intro: '把 TOML 文件轉成 YAML。從以 TOML 為主的工具把設定搬到需要 YAML 的工具時很有用，也可以用較熟悉的 YAML 排版檢視 TOML 檔。'
      useCases:
        - '把 TOML 設定轉成 Kubernetes、Compose、CI 或 Ansible 用的 YAML 檔。'
        - '把有許多巢狀表格的密集 TOML 檔讀成縮排的 YAML 樹。'
        - '從 TOML 文件準備 YAML 範例。'
      steps:
        - '把 TOML 貼進左側欄位。'
        - '右側會顯示 YAML。'
        - '複製結果。'
      notes:
        - 'TOML 的日期時間會變成 ISO 8601 時間戳，例如 1979-05-27T07:32:00.000Z，YAML 同樣把它視為時間戳。'
        - '像 [server.tls] 這樣的表格標頭在 YAML 中會變成巢狀對應表，[[items]] 表格陣列會變成對應表的清單。'
        - '註解會被丟掉。輸出使用兩個空格縮排。'
        - '會被 YAML 讀成其他型別的字串（true、1.0、null）會自動加引號以保留原意。'
      faq:
        - q: '為什麼 YAML 幫我某些值加了引號？'
          a: '只有讀回 YAML 時會改變型別的值才會加引號，例如字串 "on" 或以字串保存的數字。資料本身完全相同。'
        - q: '可以反過來轉嗎？'
          a: '可以，用「YAML 轉 TOML」工具，但文件最上層必須是對應表；null 值會被丟掉。'

  math-evaluator:
    title: 數學運算式計算器
    description: 用於計算數學運算式的計算機，可使用 sqrt、cos、sin、abs 等函式。

  json-to-yaml-converter:
    title: JSON 轉 YAML
    description: 使用這個線上即時轉換器，輕鬆將 JSON 轉換為 YAML。
    guide:
      intro: '即時把 JSON 轉成 YAML。YAML 是多數設定檔的格式（Kubernetes、GitHub Actions、Docker Compose、Ansible），這個工具讓您輸入或貼上 JSON，得到等價的 YAML 文件。'
      useCases:
        - '把 JSON 設定或 API 回應轉成 YAML 的 manifest 或 workflow 檔。'
        - '在手動編輯一份很長的設定檔之前，先看看 JSON 結構在 YAML 中長什麼樣。'
        - '把 JSON 測試資料轉成 Ansible、Helm 等工具需要的 YAML。'
      steps:
        - '把 JSON 貼進左側欄位。接受較寬鬆的 JSON5 語法（註解、結尾逗號、不加引號的鍵）。'
        - '右側會顯示 YAML，每次修改都會即時更新。'
        - '用複製按鈕取用結果。'
      notes:
        - 'JSON5 輸入中的註解會被丟掉：轉換是對解析後的資料進行，不是對文字。'
        - '會被 YAML 讀成其他型別的字串，例如 "true"、"null" 或寫成字串的數字，會自動加上引號以保留原意。yes、no 這類字在 YAML 1.2 中就是一般字串，不會加引號。'
        - '輸出使用兩個空格縮排與區塊樣式。含有空格的長字串可能會被折成多行，這仍是合法的 YAML，但看起來可能有點意外。'
        - '鍵的順序會保留。JSON 沒有註解、錨點或多文件的概念，所以輸出中也不會出現。'
      faq:
        - q: '為什麼有些字串有引號、有些沒有？'
          a: 'YAML 只在裸值會被解讀成其他東西時才需要引號，例如字串 "true" 或 "1.0"。轉換器就只在這些情況加引號。'
        - q: '可以把 YAML 轉回 JSON 嗎？'
          a: '可以，請用「YAML 轉 JSON」工具。來回轉換資料不會變，但註解和排版不會保留。'

  url-parser:
    title: URL 解析器
    description: 將 URL 解析為各個組成部分（協定、來源、參數、連接埠、使用者名稱與密碼等）

  iban-validator-and-parser:
    title: IBAN 驗證與解析器
    description: 驗證並解析 IBAN 號碼。檢查 IBAN 是否有效，並取得國家、BBAN、是否為 QR-IBAN，以及 IBAN 的易讀格式。

  user-agent-parser:
    title: User-agent 解析器
    description: 從 user-agent 字串偵測並解析瀏覽器、引擎、作業系統、CPU 與裝置類型／型號。

  numeronym-generator:
    title: 數字縮寫產生器
    description: 數字縮寫（numeronym）是以數字組成縮寫的詞。例如「i18n」是「internationalization」的數字縮寫，18 代表第一個 i 與最後一個 n 之間的字母數量。

  case-converter:
    title: 大小寫轉換器
    description: 轉換字串的大小寫，並在多種格式之間選擇

  html-entities:
    title: HTML 實體轉義
    description: 轉義或還原 HTML 實體（將 <、>、&、" 與 \' 等字元替換為 HTML 版本）

  json-prettify:
    title: JSON 美化與格式化
    description: 將您的 JSON 字串美化為友善、易讀的格式。
    guide:
      intro: '把一長串 JSON 整理成有縮排、方便閱讀的格式。也接受較寬鬆的 JSON5 寫法（可含註解、結尾逗號、不加引號的鍵），輸出一律是標準 JSON。'
      useCases:
        - '閱讀被壓縮成單行的 API 回應或日誌內容。'
        - '提交設定檔之前先整理格式，讓 diff 只顯示真正的修改。'
        - '找出 JSON 壞在哪裡，輸入不合法時會顯示錯誤訊息。'
      steps:
        - '把 JSON 貼進上方輸入框，下方會立刻顯示整理後的結果。'
        - '選擇縮排大小（0 到 10 個空格）。'
        - '視需要開關「排序鍵」，再按複製取用結果。'
      notes:
        - '「排序鍵」預設是開啟的，會把每個物件的鍵依字母重新排序。這對比對差異很方便，但會改變資料的順序，如果鍵的順序對您有意義，請把它關掉。'
        - '因為接受 JSON5，帶有註解或結尾逗號的輸入也能成功整理，但輸出會移除註解，變成純 JSON。'
        - '超出 JavaScript 安全整數範圍（約 9×10^15）的數字在解析時可能損失精度，過長的 ID 可能被改掉，這類值請用字串保存。'
        - '上次輸入的內容與設定只記錄在這個瀏覽器中，不會傳到伺服器。'
      faq:
        - q: '為什麼沒有輸出結果？'
          a: '輸入不是合法的 JSON 或 JSON5 時，輸入框下方會顯示錯誤訊息，輸出會是空的。常見原因是漏了逗號、括號沒有成對，或是 JSON 前後多貼了其他文字。'
        - q: '可以用 Schema 驗證欄位嗎？'
          a: '不行。這個工具只檢查語法是否正確並重新排版，不會檢查欄位型別或必填欄位。'

  docker-run-to-docker-compose-converter:
    title: Docker run 轉 Docker compose
    description: 將「docker run」指令轉換為 docker-compose 檔案！

  mac-address-lookup:
    title: MAC 位址查詢
    description: 透過 MAC 位址查詢裝置的供應商與製造商。

  mime-types:
    title: MIME 類型
    description: 將 MIME 類型轉換為副檔名，或反向轉換。

  toml-to-json:
    title: TOML 轉 JSON
    description: 解析 TOML 並轉換為 JSON。
    guide:
      intro: '解析 TOML 文件並輸出成縮排的 JSON，方便檢視 Cargo.toml、pyproject.toml 或其他 TOML 設定，或交給只讀 JSON 的程式。'
      useCases:
        - '在預期 JSON 的腳本或 jq 管線中讀取 TOML 檔。'
        - '確認 TOML 的表格、點號鍵與表格陣列如何對應到巢狀物件。'
        - '驗證 TOML 檔案：語法錯誤會在輸入時即時顯示。'
      steps:
        - '把 TOML 貼進左側欄位。'
        - '右側會顯示以三個空格縮排的 JSON。'
        - '複製結果。'
      notes:
        - 'TOML 的日期時間（例如 1979-05-27T07:32:00Z）在 JSON 中會變成 ISO 8601 字串，因為 JSON 沒有日期型別。'
        - '超出 JavaScript 安全範圍（約 9×10^15）的整數不被支援，輸出會是空的。'
        - '註解會被丟掉，輸出一定是 JSON 物件，因為 TOML 文件本身就是一個表格。'
        - '重複的鍵與定義兩次的表格在 TOML 中是錯誤，轉換器會直接拒絕，而不是默默保留其中一個。'
      faq:
        - q: '為什麼我的日期變成了字串？'
          a: 'TOML 有原生的日期時間值，但 JSON 沒有，所以會序列化成 ISO 8601 文字。需要的話請在讀取端再解析回日期。'
        - q: '可以把 JSON 轉回 TOML 嗎？'
          a: '可以，用「JSON 轉 TOML」工具，但 JSON 的最上層必須是物件；null 值在轉換時會被丟掉。'

  lorem-ipsum-generator:
    title: Lorem ipsum 產生器
    description: Lorem ipsum 是一種常用的佔位文字，用於展示文件或字體的視覺效果，而不需依賴有意義的內容

  image-compressor:
    title: '圖片壓縮'
    description: '壓縮圖片並轉成 WebP、JPEG 或 PNG，可調整尺寸，單張下載或打包成 zip。'
    format: '輸出格式'
    keepFormat: '維持原格式'
    quality: '品質'
    maxWidth: '最大寬度（px）'
    maxHeight: '最大高度（px）'
    noLimit: '不限制'
    upload: '把圖片拖曳到這裡，或點擊選擇圖片'
    privacy: '圖片只在你的瀏覽器裡處理，不會上傳。'
    pngHint: 'PNG 是無損格式，品質滑桿對它沒有作用。'
    download: '下載'
    downloadAll: '全部下載（zip）'
    clear: '清除'
    notAnImage: '{name} 不是圖片。'
    failed: '無法壓縮 {name}。'
    guide:
      intro: '把照片和截圖重新編碼成 WebP、JPEG 或 PNG，並可選擇縮小尺寸，藉此減少檔案大小。可以一次處理多張圖片，再逐張下載或打包成一個 zip。全部在瀏覽器中完成。'
      useCases:
        - '圖片太大無法通過上傳限制、電子郵件附件限制，或內容管理系統拒收超過數 MB 的檔案時，把它壓小。'
        - '提升網頁速度：把很大的 PNG、JPEG 轉成 WebP，並把寬度限制在版面實際需要的大小。'
        - '替文件或商店商品頁準備一批截圖或商品照片。'
      steps:
        - '把圖片拖曳到上傳區，或點一下選擇檔案。'
        - '選擇輸出格式（或保留每張圖片原本的格式）、品質，以及選用的最大寬度與高度。'
        - '確認每張結果的大小，再逐張下載，或全部打包成 zip 下載。'
      notes:
        - '品質只對 WebP 和 JPEG 有效。PNG 是無損格式，滑桿會停用，PNG 主要靠降低像素尺寸來縮小。品質設在 75 到 85 之間通常是不錯的平衡。'
        - '最大寬度和高度只會縮小圖片，並保持長寬比；小圖不會被放大。'
        - 'JPEG 不支援透明，透明的區域會變成白色。想保留透明請用 WebP 或 PNG。'
        - '重新編碼會移除 EXIF 等中繼資料，包括相機資訊與 GPS 位置；動畫 GIF 則只會保留第一個影格。'
        - '已經優化過的圖片壓縮後可能反而變大，這時請比較大小，保留原檔即可。'
      faq:
        - q: '我的圖片會被上傳到伺服器嗎？'
          a: '不會。壓縮是用瀏覽器的 canvas 完成的，檔案留在您的裝置上。這也表示非常大的圖片會使用裝置的記憶體，處理時可能需要一點時間。'
        - q: '該選哪種格式？'
          a: '多數照片用 WebP 能得到最小的檔案，目前主流瀏覽器都支援。需要與舊軟體最大相容性時選 JPEG，有銳利線條的圖形或需要透明時選 PNG。'
  video-compressor:
    title: '影片壓縮'
    description: '壓縮影片並轉成 MP4 或 WebM，可縮小到 1080p 或 720p，顯示進度，完全不上傳。使用瀏覽器的硬體影片編碼器。'
