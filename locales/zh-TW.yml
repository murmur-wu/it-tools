  bcrypt:
    title: Bcrypt
    description: 使用 bcrypt 對文字進行雜湊與比對。Bcrypt 是一種基於 Blowfish 加密演算法的密碼雜湊函式。
    guide:
      intro: 'bcrypt 是以 Blowfish 加密演算法為基礎的密碼雜湊函式。和一般的雜湊不同，它刻意設計得很慢，還會加入隨機鹽（salt），讓外洩的密碼資料庫更難被破解。這個工具可以產生 bcrypt 雜湊，也能檢查某段文字是否符合既有的雜湊。'
      useCases:
        - '替測試帳號產生雜湊，放進資料庫或種子（seed）腳本。'
        - '除錯登入問題時，確認資料庫中的雜湊是否真的對應某組密碼。'
        - '試不同的成本係數，看在您的裝置上雜湊要多久，再決定正式環境用多少。'
      steps:
        - '在雜湊區塊輸入文字，並設定 salt 次數（成本係數，預設 10）。'
        - '複製產生的雜湊，開頭是 $2，接著是成本與鹽。'
        - '在比對區塊輸入文字與雜湊，看結果是否相符。'
      notes:
        - '次數每加 1，運算量大約變成兩倍。目前常見設定是 10 到 12；設得越高，每個人登入都會越慢，太高甚至會讓這個頁面卡住。'
        - '每次的結果都不同，因為每次都會產生新的隨機鹽。同一段文字的兩個不同雜湊都是有效的，所以驗證時必須用比對功能，不能直接比較字串。'
        - 'bcrypt 只會讀取輸入的前 72 個位元組，超過的部分（包括很長的密碼短語）會被忽略。'
        - '雜湊在瀏覽器中計算。不要在任何線上工具輸入真實使用者的密碼，包括這個工具，請用測試值。'
      faq:
        - q: '為什麼我算出的雜湊和資料庫裡的不一樣？'
          a: '這是正常的。鹽是隨機的，而且存放在雜湊裡面，所以同一組密碼每次產生的字串都不同。請用比對功能驗證，它會從雜湊中讀出鹽再計算。'
        - q: '成本係數該選多少？'
          a: '選一個能讓單次雜湊在正式環境硬體上約耗時 100 到 300 毫秒的最高值，之後隨著電腦變快，每隔幾年再檢討調整。'

  crontab-generator:
    title: Crontab 產生器
    description: 驗證並產生 crontab，並取得 cron 排程的易讀說明。
    verbose: '詳細說明'
    use24Hour: '使用 24 小時制'
    daysStartAtZero: '星期從 0 開始'
    invalid: '這個 cron 表達式無效'
    nextRuns: '接下來的執行時間'
    timezone: '時區'
    runAt: '執行時間（{timezone}）'
    rebootHint: '這個表達式只在系統啟動時執行一次，沒有排程可以預覽。'
    noNextRuns: '輸入有效的 cron 表達式即可預覽接下來的執行時間。'
    builder:
      title: '組出表達式'
      frequency: '頻率'
      everyMinutes: '每幾分鐘'
      minute: '分'
      hour: '時'
      dayOfWeek: '星期'
      dayOfMonth: '日'
      month: '月份'
      apply: '套用這個表達式'
      frequencies:
        minutely: '每幾分鐘'
        hourly: '每小時'
        daily: '每天'
        weekly: '每週'
        monthly: '每月'
        yearly: '每年'
      weekDays:
        0: '星期日'
        1: '星期一'
        2: '星期二'
        3: '星期三'
        4: '星期四'
        5: '星期五'
        6: '星期六'
      months:
        1: '一月'
        2: '二月'
        3: '三月'
        4: '四月'
        5: '五月'
        6: '六月'
        7: '七月'
        8: '八月'
        9: '九月'
        10: '十月'
        11: '十一月'
        12: '十二月'
    guide:
      intro: 'Cron 是 Unix 與 Linux 上的排程格式，用五個（或六個）欄位描述「什麼時候要執行」。這個工具幫你驗證表達式、翻成易讀的說明，並列出接下來幾次實際的執行時間，讓你在寫進 crontab 之前就先確認排程是對的。'
      useCases:
        - '設定伺服器的定期備份、日誌輪替或資料同步，寫完想先確認排程真的如預期。'
        - '看到同事或舊專案留下的 cron 表達式，想知道它到底多久跑一次。'
        - '設定 GitHub Actions、Kubernetes CronJob 或 Cloudflare Workers 的排程，這些平台都用同一套語法。'
      steps:
        - '在上方輸入框填入 cron 表達式，或用下方的「組出表達式」用選單組出來再套用。'
        - '看中間那行易讀說明，確認語意與你想的一致。'
        - '在「接下來的執行時間」選擇時區，核對列出的五次時間點。'
      notes:
        - '五欄格式是「分 時 日 月 星期」，六欄則在最前面多一個「秒」。多數伺服器的 crontab 只支援五欄，秒欄位常見於應用層的排程器。'
        - '星期日可以寫 0 或 7，兩者等價。「星期從 0 開始」的開關只影響易讀說明的文字，不影響表達式本身。'
        - '時區很重要。伺服器的 crontab 通常跑在系統時區（常是 UTC），而不是你所在的時區，所以務必用時區選單核對。'
        - "{'@'}reboot 只在系統啟動時執行一次，沒有固定排程，因此不會列出執行時間。"
      faq:
        - q: '每 15 分鐘執行一次要怎麼寫？'
          a: '寫成 */15 * * * *。斜線代表間隔，所以會在每小時的 0、15、30、45 分執行。'
        - q: '為什麼我的排程在伺服器上跑的時間跟這裡顯示的不一樣？'
          a: '幾乎都是時區問題。用 date 指令確認伺服器時區，再把上面的時區選單切到同一個時區重新核對。另一個常見原因是 crontab 的 PATH 與登入 shell 不同，導致指令找不到而沒有實際執行。'

