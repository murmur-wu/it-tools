  bcrypt:
    title: Bcrypt
    description: Hash and compare text string using bcrypt. Bcrypt is a password-hashing function based on the Blowfish cipher.
    guide:
      intro: 'bcrypt is a password-hashing function built on the Blowfish cipher. Unlike a plain hash, it is deliberately slow and adds a random salt, which makes stolen password databases far harder to crack. This tool creates a bcrypt hash and checks whether a text matches an existing one.'
      useCases:
        - 'Generating a hash to insert into a database or a seed script for a test user.'
        - 'Checking whether a stored hash really belongs to a given password while debugging a login problem.'
        - 'Trying different cost factors to see how long hashing takes on your device before choosing one for production.'
      steps:
        - 'In the hash section, enter the text and set the salt rounds (the cost factor, default 10).'
        - 'Copy the generated hash; it starts with $2 followed by the cost and the salt.'
        - 'In the compare section, enter a text and a hash and read whether they match.'
      notes:
        - 'Each extra round roughly doubles the work. 10 to 12 is common today; higher values make logins slower for everyone, and very high values can freeze this page.'
        - 'The result changes every time because a new random salt is generated. Two different hashes of the same text are both valid, which is why you must use compare, not string equality.'
        - 'bcrypt only reads the first 72 bytes of its input. Anything beyond that, including long passphrases, is ignored.'
        - 'Hashing runs in the browser. Do not enter real user passwords into any online tool, including this one; use test values.'
      faq:
        - q: 'Why is my hash different from the one in the database?'
          a: 'That is expected. The salt is random and stored inside the hash, so the same password produces a different string each time. Verify with the compare section, which reads the salt back out of the hash.'
        - q: 'What cost factor should I choose?'
          a: 'Pick the highest value that keeps a single hash at roughly 100 to 300 ms on your production hardware, and revisit it every few years as computers get faster.'

  crontab-generator:
    title: Crontab generator
    description: Validate and generate crontab and get the human-readable description of the cron schedule.
    verbose: Verbose
    use24Hour: Use 24 hour time format
    daysStartAtZero: Days start at 0
    invalid: This cron is invalid
    nextRuns: Next executions
    timezone: Timezone
    runAt: 'Run at ({timezone})'
    rebootHint: This expression runs once at startup, so there is no schedule to preview.
    noNextRuns: Enter a valid cron expression to preview its next executions.
    builder:
      title: Build an expression
      frequency: Frequency
      everyMinutes: Every N minutes
      minute: Minute
      hour: Hour
      dayOfWeek: Day of week
      dayOfMonth: Day of month
      month: Month
      apply: Use this expression
      frequencies:
        minutely: Every few minutes
        hourly: Every hour
        daily: Every day
        weekly: Every week
        monthly: Every month
        yearly: Every year
      weekDays:
        0: Sunday
        1: Monday
        2: Tuesday
        3: Wednesday
        4: Thursday
        5: Friday
        6: Saturday
      months:
        1: January
        2: February
        3: March
        4: April
        5: May
        6: June
        7: July
        8: August
        9: September
        10: October
        11: November
        12: December
    guide:
      intro: 'Cron is the scheduling format used on Unix and Linux. Five (or six) fields describe when a job should run. This tool validates the expression, translates it into plain language and lists the next executions, so you can check a schedule before putting it in a crontab.'
      useCases:
        - 'Setting up periodic backups, log rotation or data sync on a server and wanting to confirm the schedule behaves as intended.'
        - 'Reading a cron expression left behind by a colleague or an old project and wondering how often it actually fires.'
        - 'Scheduling GitHub Actions, Kubernetes CronJobs or Cloudflare Workers, which all use the same syntax.'
      steps:
        - 'Type an expression in the field at the top, or build one with the dropdowns below and apply it.'
        - 'Read the plain-language line in the middle and check it matches what you meant.'
        - 'Pick a timezone under "Next executions" and verify the five upcoming times.'
      notes:
        - 'The five-field form is "minute hour day-of-month month day-of-week". The six-field form adds seconds at the front. Most server crontabs only accept five fields; the seconds field is common in application-level schedulers.'
        - 'Sunday can be written as 0 or 7, both are equivalent. The "days start at 0" switch only changes the wording of the description, not the expression.'
        - 'Timezone matters. A server crontab usually runs in the system timezone, often UTC, rather than yours, so check with the timezone selector.'
        - "{'@'}reboot runs once at startup and has no recurring schedule, so no execution times are listed for it."
      faq:
        - q: 'How do I run something every 15 minutes?'
          a: 'Use */15 * * * *. The slash means a step, so it fires at minutes 0, 15, 30 and 45 of every hour.'
        - q: 'Why does my job run at a different time on the server than shown here?'
          a: 'Almost always a timezone difference. Check the server timezone with the date command and switch the selector above to match. The other common cause is that a crontab has a different PATH than your login shell, so the command is never found and never really runs.'

