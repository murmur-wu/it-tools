  json-diff:
    title: JSON diff
    description: Compare two JSON objects and get the differences between them.
    guide:
      intro: 'Compares two JSON documents and shows what was added, removed or changed, as a tree with colour coding. Both inputs accept relaxed JSON5, so comments and trailing commas do not get in the way.'
      useCases:
        - 'Comparing an API response before and after a deploy to see exactly which fields changed.'
        - 'Reviewing two versions of a configuration file without relying on line-by-line text diffs.'
        - 'Checking that a serializer or migration produced the same data as the original.'
      steps:
        - 'Paste the original JSON into the first field.'
        - 'Paste the JSON to compare into the second field.'
        - 'Read the tree below: added, removed and changed entries are highlighted, and unchanged ones are shown for context.'
      notes:
        - 'Objects are compared key by key, so the order of keys does not matter and reordering alone is not reported as a change.'
        - 'Arrays are compared by position. Inserting an item at the start shifts everything after it, so many entries may show as changed. Sort or key the arrays first when order is not meaningful.'
        - 'A value whose type changes (for example the number 1 to the string "1") is reported as a change.'
        - 'If either side is not valid JSON, the field shows an error and no comparison is made.'
      faq:
        - q: 'How is this different from a normal text diff?'
          a: 'A text diff compares lines, so reformatting or reordering keys produces a lot of noise. This tool compares the parsed data, so only real differences in keys, values and types appear.'
        - q: 'Can it ignore certain fields such as timestamps?'
          a: 'Not at the moment. Remove those fields from both inputs before comparing.'

  jwt-parser:
    title: JWT parser
    description: Parse and decode your JSON Web Token (jwt) and display its content.
    guide:
      intro: 'A JSON Web Token (JWT) is three Base64URL-encoded parts joined by dots: a header, a payload of claims, and a signature. This tool decodes the header and payload so you can read them, and shows what each standard claim means.'
      useCases:
        - 'Checking why an API returns 401: is the token expired, issued for another audience, or missing the scope you expected?'
        - 'Inspecting the tokens your login flow hands out to see which claims (sub, roles, tenant) the backend actually receives.'
        - 'Reading the iat, nbf and exp claims as dates instead of Unix timestamps while debugging clock-skew problems.'
      steps:
        - 'Paste the whole token (the three dot-separated parts) into the field.'
        - 'Read the header to see the signing algorithm (alg) and token type.'
        - 'Read the payload; exp, nbf and iat are also shown as local dates next to the raw number.'
      notes:
        - 'This tool only decodes. It does not verify the signature, so a readable token is not proof that it is genuine. Verify signatures on your server, or use the JWT signer tool here.'
        - 'The payload is encoded, not encrypted: anyone who holds the token can read it. Never put passwords or other secrets in claims.'
        - 'Decoding happens in your browser and the token is not sent anywhere. Even so, treat a live production token like a password and prefer expired or test tokens when you can.'
        - 'Dates are shown in your device''s time zone, while exp and iat are always UTC-based Unix seconds.'
      faq:
        - q: 'Why does my token fail to decode?'
          a: 'A valid JWT has exactly three dot-separated parts and each of the first two must be Base64URL-encoded JSON. Common causes are a leftover "Bearer " prefix, a truncated copy, or an opaque token (such as a random string) that is not a JWT at all.'
        - q: 'Is it safe to paste a token here?'
          a: 'The decoding runs locally in the page and nothing is uploaded. If the token is still valid, it can be used by anyone who sees it, so avoid pasting it into screenshots, chats or any site that sends data to a server.'

