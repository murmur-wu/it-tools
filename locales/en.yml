  password-strength-analyser:
    title: Password strength analyser
    description: Discover the strength of your password with this client-side-only password strength analyser and crack time estimation tool.
    guide:
      intro: 'Estimates how strong a password is from its length and the character classes it uses: it computes the entropy in bits, the size of the character set, a score, and how long a brute-force attack at one billion guesses per second would need. Nothing leaves your browser.'
      useCases:
        - 'Checking whether a password you are about to use is long and varied enough.'
        - 'Explaining to a team why length matters more than symbols, with concrete numbers.'
        - 'Comparing candidate password policies (8 mixed characters versus 16 lowercase letters).'
      steps:
        - 'Type or paste a password.'
        - 'Read the length, entropy, character set size, score and estimated crack time.'
        - 'Lengthen or vary the password and watch the numbers change.'
      notes:
        - 'Entropy is computed as log2(character set size) × length, so it measures brute-force resistance only. It does not know that password123 or a dictionary word is weak: real attackers try common passwords first, so a high score here is necessary but not sufficient.'
        - 'The crack time assumes 10^9 guesses per second against a fast hash. Against slow hashes such as bcrypt it is far longer; against a leaked fast hash with GPUs it can be shorter.'
        - 'The character set is 26 for lowercase, 52 with uppercase, 62 with digits and about 94 with symbols. Adding one more character to the length helps more than adding a symbol class.'
        - 'The password is analysed locally and never transmitted. Even so, avoid typing a password you already use into any website.'
      faq:
        - q: 'Why does a passphrase of four common words score high?'
          a: 'Because the analyser only counts characters, 25 lowercase letters give about 117 bits. A real dictionary attack on four words from a 7000-word list needs only about 51 bits, so treat word-based passphrases with this tool''s score as optimistic.'
        - q: 'What score should I aim for?'
          a: 'The score reaches 1 at 128 bits. For an account protected by a slow hash and rate limiting, 60 to 80 bits (a 12-character mixed password or a 5-word random passphrase) is already very strong. Use a password manager so length is free.'

  chronometer:
    title: Chronometer
    description: Monitor the duration of a thing. Basically a chronometer with simple chronometer features.
    guide:
      intro: 'A simple stopwatch: start, pause, resume and reset, with the elapsed time shown to the millisecond. It runs in your browser tab and needs no sign-in or installation.'
      useCases:
        - 'Timing a task, a presentation rehearsal, a brewing step or an exercise set.'
        - 'Measuring how long a manual procedure takes to estimate or document it.'
        - 'Having a stopwatch on a computer that has none built in.'
      steps:
        - 'Press Start.'
        - 'Press Stop to pause; press Start again to resume from where it stopped.'
        - 'Press Reset to return to zero.'
      notes:
        - 'Time is measured with the system clock, so pausing and resuming does not drift; the display is refreshed as fast as the browser repaints.'
        - 'The chronometer keeps running while the tab is in the background, but browsers slow down background tabs, so the display may jump when you come back. The elapsed time itself stays correct.'
        - 'Reloading or closing the page resets the chronometer; there is no persistence or lap memory.'
        - 'For long or important timings, note the start time as well, as a safety net.'
      faq:
        - q: 'Does it keep counting if I switch tabs or lock the screen?'
          a: 'Yes, elapsed time is computed from timestamps, so it is still correct when you return. Only the on-screen refresh pauses in the background.'
        - q: 'Can I record laps or several timers?'
          a: 'Not in this tool; it is a single stopwatch. Note intermediate times manually when you need splits.'

  password-generator:
    title: Password generator
    description: Generate strong random passwords, memorable passphrases or PIN codes in your browser, with a strength estimate.
    mode: Type
    modes:
      random: Random password
      passphrase: Passphrase
      pin: PIN code
    length: Length
    words: Words
    count: How many
    uppercase: Uppercase letters (A-Z)
    lowercase: Lowercase letters (a-z)
    numbers: Numbers (0-9)
    symbols: Symbols (!#$%...)
    excludeAmbiguous: Exclude look-alike characters (0 O o 1 l I)
    requireEach: Include at least one character of every selected type
    noCharacterSet: Select at least one character type.
    separator: Separator
    separators:
      hyphen: Hyphen (-)
      underscore: Underscore (_)
      space: Space
      dot: Dot (.)
      none: None
    capitalize: Capitalise each word
    addNumber: Append a two-digit number
    regenerate: Generate again
    strength: Strength
    levels:
      0: Very weak
      1: Weak
      2: Fair
      3: Strong
      4: Very strong
    entropy: '{bits} bits of entropy'
    crackTime: 'Average time to crack offline at 10 billion guesses per second:'
    crack:
      instant: instantly
      ages: longer than the age of the universe
      seconds: '{n} seconds'
      minutes: '{n} minutes'
      hours: '{n} hours'
      days: '{n} days'
      years: '{n} years'
    privacy: Generated in your browser from a cryptographic random source. Nothing is sent anywhere or stored.
    guide:
      intro: 'A good password is long, random and unique to one account. This tool generates them from the cryptographic random source built into your browser, so nothing is predictable and nothing leaves your device. It also estimates how long an attacker would need to guess the result.'
      useCases:
        - 'Creating a new account and wanting a password you will store in a password manager rather than remember.'
        - 'Needing a passphrase you can actually type or read out loud, for a Wi-Fi network or a laptop login.'
        - 'Generating a PIN for a phone, a card or a door lock.'
        - 'Producing several candidates at once to pick from.'
      steps:
        - 'Pick the type: random characters for password managers, a passphrase for something you must type, a PIN for numeric locks.'
        - 'Adjust the length or number of words and the character types. The strength panel updates as you change them.'
        - 'Click the copy icon next to a result, or press Ctrl+Enter to generate a fresh batch.'
      notes:
        - 'Length matters far more than symbols. Sixteen random letters and digits are stronger than eight characters that mix everything.'
        - 'A four-word passphrase from a 2048-word list carries about 44 bits of entropy, roughly the same as an eight-character fully random password, but it is much easier to type.'
        - 'The crack-time estimate assumes an offline attack against a fast hash at ten billion guesses per second. A website that rate-limits logins is far slower; a leaked database hashed with a weak algorithm is about this fast.'
        - 'Never reuse a generated password across accounts; a leak on one site then exposes the others.'
      faq:
        - q: 'Is it safe to generate a password on a website?'
          a: 'Here, yes: generation runs entirely in your browser with the Web Crypto API and no request is made to any server. You can verify this by opening the network panel of your browser while generating.'
        - q: 'Why do some sites reject the symbols in the generated password?'
          a: 'Some services only accept a subset of symbols. Untick the symbols option and increase the length by a few characters instead; the result is just as strong.'

  token-generator:
    title: Token generator
    description: Generate random string with the chars you want, uppercase or lowercase letters, numbers and/or symbols.

    uppercase: Uppercase (ABC...)
    lowercase: Lowercase (abc...)
    numbers: Numbers (123...)
    symbols: Symbols (!-;...)
    length: Length
    tokenPlaceholder: 'The token...'
    copied: Token copied to the clipboard
    button:
      copy: Copy
      refresh: Refresh
    guide:
      intro: 'Generates a random string from the character sets you choose. It is meant for things like API keys, session secrets, test fixtures and one-time identifiers, using the browser''s cryptographically secure random source.'
      useCases:
        - 'Creating an API key, webhook secret or session secret for an application''s configuration.'
        - 'Generating a random string of an exact length for test data or a temporary identifier.'
        - 'Making a token restricted to letters and digits when a system rejects symbols.'
      steps:
        - 'Switch the character sets on or off: uppercase, lowercase, numbers, symbols.'
        - 'Drag the slider to set the length (1 to 512, default 64).'
        - 'Copy the token, or press the refresh button (Ctrl+Enter also works) to get a new one.'
      notes:
        - 'Randomness comes from the browser''s crypto.getRandomValues with rejection sampling, so every character is equally likely. It never uses Math.random.'
        - 'Strength depends on length and alphabet size. A 64-character token from letters and digits carries roughly 380 bits of entropy, far more than most systems need; 32 characters is already plenty for a secret.'
        - 'If all four character sets are off, the result is empty.'
        - 'Settings are stored in the page address, so a bookmarked link reopens with the same options. The generated token itself is never put in the address.'
      faq:
        - q: 'Is the token sent anywhere?'
          a: 'No. It is generated in your browser and is not uploaded or stored. Copy it and keep it in a secrets manager.'
        - q: 'Should I use this for user passwords?'
          a: 'For passwords people have to type or remember, use the password generator, which can avoid look-alike characters. This tool is for machine-to-machine secrets.'
  percentage-calculator:
    title: Percentage calculator
    description: Easily calculate percentages from a value to another value, or from a percentage to a value.
    guide:
      intro: 'Answers the three everyday percentage questions: what is X% of Y, X is what percent of Y, and what is the percentage change from one value to another.'
      useCases:
        - 'Working out a discount, a tip, VAT or a commission (what is 15% of 80).'
        - 'Finding a share or a score as a percentage (45 out of 60 is what percent).'
        - 'Measuring growth or decline between two figures (from 120 to 150 is +25%).'
      steps:
        - 'Pick the row that matches your question and fill in the two numbers.'
        - 'Read the result next to them; it updates as you type.'
        - 'Copy it with the copy button.'
      notes:
        - 'Percentage change is computed relative to the starting value: (to − from) ÷ from × 100. Going from 100 to 150 is +50%, but going back from 150 to 100 is −33.3%, not −50%.'
        - 'A change in percentage points is not the same as a percentage change: moving from 10% to 15% is +5 points but a +50% change.'
        - 'Results are shown with limited rounding, so repeating decimals such as 33.33 appear truncated.'
        - 'Negative numbers are allowed in all rows, but a starting value of 0 has no defined percentage change.'
      faq:
        - q: 'How do I add a percentage to a price?'
          a: 'Compute X% of the price in the first row and add it, or multiply the price by (1 + X/100). To remove VAT from a gross price, divide by (1 + rate), do not subtract the percentage.'
        - q: 'Why does a 20% drop followed by a 20% rise not get back to the start?'
          a: 'Because each change is relative to the current value: 100 → 80 → 96. Percentage changes do not cancel out symmetrically.'

  svg-placeholder-generator:
    title: SVG placeholder generator
    description: Generate svg images to use as a placeholder in your applications.
    guide:
      intro: 'Creates a placeholder image as an SVG: a coloured rectangle with the dimensions written in the middle (or your own text), available as SVG source, as a Base64 data URL, or as a downloadable file.'
      useCases:
        - 'Filling image slots in a layout or a prototype before the real pictures exist.'
        - 'Providing a lightweight fallback or loading image in a web app.'
        - 'Generating a quick fixed-size image for a test or a documentation screenshot.'
      steps:
        - 'Set the width and height, the background and text colours, the font size and optionally a custom text.'
        - 'Choose whether the SVG declares its exact size or only a viewBox so it scales to its container.'
        - 'Copy the SVG source or the Base64 data URL, or download the .svg file.'
      notes:
        - 'SVG placeholders are a few hundred bytes regardless of their dimensions, unlike PNG or JPEG placeholders, and they stay sharp at any zoom level.'
        - 'With "use exact size" the SVG has width and height attributes and renders at that size; without it, only the viewBox is kept and the image fills whatever size the <img> or CSS gives it.'
        - 'The Base64 data URL can be pasted directly into an <img src> or a CSS background-image, which avoids an extra request.'
        - 'The text is rendered with the viewer''s default sans-serif font, so its exact look varies slightly between systems.'
      faq:
        - q: 'Why use SVG instead of a placeholder service?'
          a: 'No network request, no third-party dependency, works offline and in tests, and the file is tiny. A service is only better when you need realistic photos.'
        - q: 'Can I use it as the src of an img tag?'
          a: 'Yes, either save the file and reference it, or paste the data URL straight into src. Both work in all browsers.'

  csv-to-json:
    title: CSV to JSON
    description: Parse CSV (or TSV) into JSON, with delimiter detection, type inference and a table preview.
    input: Your CSV
    inputPlaceholder: Paste your CSV here...
    output: JSON version of your CSV
    preview: Table preview
    previewTruncated: 'Showing the first {shown} of {total} rows.'
    delimiter: Delimiter
    autoDetect: Detect automatically
    comma: 'Comma ( , )'
    semicolon: 'Semicolon ( ; )'
    tab: Tab
    pipe: 'Pipe ( | )'
    indent: Indent size
    hasHeader: First row is a header
    inferTypes: Convert numbers and booleans
    trimValues: Trim spaces around values
    guide:
      intro: 'CSV is the common exchange format for spreadsheets and databases; JSON is what APIs and programs prefer. This tool parses CSV according to RFC 4180, handling commas and line breaks inside quoted fields, and prints structured JSON.'
      useCases:
        - 'Feeding an export from Excel or Google Sheets into an API or a front-end.'
        - 'Checking a CSV in the table preview to confirm the columns line up before using it.'
        - 'Turning a database export into JSON for fixtures or configuration.'
      steps:
        - 'Paste the CSV into the input; the delimiter is detected automatically.'
        - 'Check the table preview, paying attention to fields that contain commas.'
        - 'Adjust the options as needed: header row, type conversion, trimming.'
        - 'Copy the JSON from the output below.'
      notes:
        - 'A field containing a comma, a line break or a double quote must be wrapped in double quotes, with inner quotes doubled. The parser restores such fields correctly.'
        - 'Type conversion is deliberately conservative: values such as 007, 1.0 and integers beyond the safe range stay strings so nothing is silently altered.'
        - 'If detection picks the wrong delimiter, set it manually. Semicolons are common in Excel exports from Europe.'
        - 'Everything is parsed in your browser; no data is uploaded.'
      faq:
        - q: 'Why do non-ASCII characters show up as garbage?'
          a: 'That is a file encoding problem rather than a parsing one. Excel often exports CSV in a regional encoding or UTF-8 with a BOM. Re-save the file as UTF-8 in a text editor and paste it again.'
        - q: 'Can I convert JSON back to CSV?'
          a: 'Yes, with the JSON to CSV tool. Both sides follow RFC 4180 quoting, so a round trip preserves the values.'

  json-to-csv:
    title: JSON to CSV
    description: Convert JSON to CSV with automatic header detection.
    guide:
      intro: 'Turns a JSON array of objects into CSV. The header row is built from the union of all keys found in the objects, so records with different fields still line up in the right columns.'
      useCases:
        - 'Opening an API response or a database export in Excel or Google Sheets.'
        - 'Handing a list of records to a colleague who works in spreadsheets.'
        - 'Converting JSON logs or survey results for analysis in a BI tool.'
      steps:
        - 'Paste a JSON array of objects, for example [{''{''}"name":"Ann","age":30{''}''},{''{''}"name":"Bob"{''}''}]. JSON5 syntax is accepted.'
        - 'Read the CSV on the right: the first line holds the headers, one line per object follows.'
        - 'Copy the result and save it as a .csv file.'
      notes:
        - 'Headers are the union of every key, in the order they are first seen. A missing key gives an empty cell; a null value is written as null.'
        - 'Fields containing a comma or a double quote are quoted and inner quotes are doubled, following RFC 4180. Line breaks inside a value are written as \n so each record stays on one line.'
        - 'Nested objects and arrays are not flattened: they appear as [object Object] or as their items joined by commas. Flatten the data (for example address.city) before converting.'
        - 'The input must be an array of objects. A single object or an array of plain values does not produce a useful table.'
      faq:
        - q: 'Why does a column show [object Object]?'
          a: 'That field holds a nested object. CSV is flat, so flatten nested data into separate keys such as address_city before converting.'
        - q: 'Excel shows everything in one column, what is wrong?'
          a: 'Some Excel locales expect a semicolon separator. Use the Data > From Text/CSV import and choose comma as the delimiter, or open the file in Google Sheets.'

  camera-recorder:
    title: Camera recorder
    description: Take a picture or record a video from your webcam or camera.
    guide:
      intro: 'Takes photos and records video clips with your webcam or phone camera, directly in the browser, and lets you download the results. Pick the camera and microphone to use; nothing is uploaded.'
      useCases:
        - 'Quickly capturing a photo of a whiteboard, a document or yourself without opening another app.'
        - 'Recording a short screencast-style clip or a message to attach to a ticket or a chat.'
        - 'Testing that a webcam and microphone work and which device the browser selects.'
      steps:
        - 'Allow camera and microphone access when the browser asks, then choose the devices from the lists.'
        - 'Press the photo button for a still image, or start and stop a recording for a video.'
        - 'Download the captured photo or clip.'
      notes:
        - 'Video is recorded as WebM, which plays in Chrome, Edge and Firefox. Convert it with the video compressor if you need MP4 for other players.'
        - 'Camera access requires a secure page (HTTPS) and your permission; if you denied it earlier, re-enable it from the browser''s site settings, since the page cannot ask again.'
        - 'Everything stays on your device. The stream is captured and encoded locally, and the files are only saved where you download them.'
        - 'Safari''s support for MediaRecorder and WebM is limited, so recording may be unavailable there while photos still work.'
      faq:
        - q: 'Why is my camera list empty?'
          a: 'The browser lists devices only after permission is granted, and some systems hide cameras in use by another app. Grant permission, close other apps using the camera, then reload.'
        - q: 'Why does the recording button say it is not supported?'
          a: 'The browser does not support recording WebM with MediaRecorder, which is the case in some Safari versions. Use Chrome, Edge or Firefox for video recording.'

  keycode-info:
    title: Keycode info
    description: Find the javascript keycode, code, location and modifiers of any pressed key.
    guide:
      intro: 'Press any key and see what JavaScript reports for it: the key value, the legacy keyCode number, the physical code, the location (left or right Shift, numpad) and which modifiers were held.'
      useCases:
        - 'Finding the right value to compare against in a keydown handler or a keyboard shortcut library.'
        - 'Debugging why a shortcut works on one keyboard layout and not another.'
        - 'Checking what a special key (media keys, Fn combinations, dead keys) sends to the page.'
      steps:
        - 'Click on the page so it has focus, then press a key.'
        - 'Read the values; each field has a copy button.'
        - 'Hold modifiers (Shift, Ctrl, Alt, Meta) to see them reported.'
      notes:
        - 'key is the character or name produced (a, A, Enter, ArrowLeft) and depends on the layout and modifiers; code is the physical position (KeyA, Digit1, NumpadEnter) and does not. Use code for game-style controls, key for typing-oriented shortcuts.'
        - 'keyCode is deprecated and inconsistent across browsers and layouts (and 0 for many keys). It is shown for legacy code only; new code should use key or code.'
        - 'Some keys never reach the page: the browser or operating system handles them first (Cmd+Q, Alt+Tab, some function keys, Print Screen).'
        - 'On macOS the Meta key is Cmd; on Windows it is the Windows key. AltGraph appears on European layouts for the right Alt key.'
      faq:
        - q: 'Why does the key show Dead or Unidentified?'
          a: 'Dead means a dead key (such as ´ or ^) waiting to combine with the next letter. Unidentified means the browser has no name for that key, common for some laptop-specific or media keys.'
        - q: 'Why is keyCode 0 or the same for different keys?'
          a: 'keyCode was never standardised. Browsers report 0 for keys they cannot map, and some keys share codes. That is exactly why key and code replaced it.'

  emoji-picker:
    title: Emoji picker
    description: Copy and paste emojis easily and get the unicode and code points value of each emoji.
    guide:
      intro: 'Browse and search about 1900 emoji, copy one with a click, and see its Unicode code points and the escaped forms you need in JavaScript, HTML or CSS.'
      useCases:
        - 'Finding and copying an emoji on a desktop computer without a built-in picker.'
        - 'Getting the code point (U+1F600) or the JavaScript escape sequence to use an emoji in source code.'
        - 'Looking up the official name of an emoji for documentation or accessibility text.'
      steps:
        - 'Type a keyword in the search box (smile, cat, flag, heart) or browse by category.'
        - 'Click an emoji to copy it.'
        - 'Open its card for the name, code points and escaped representations.'
      notes:
        - 'An emoji may be several code points joined by zero-width joiners (family, profession and flag emoji), so one visible symbol can be 2 to 7 code points and up to 20 UTF-16 code units. String length in JavaScript therefore does not equal the number of emoji.'
        - 'The way an emoji looks depends on the platform font (Apple, Google, Microsoft, Samsung) and recent emoji are missing on older systems, where they show as boxes or as separate parts.'
        - 'Skin-tone variants are the base emoji followed by a modifier code point (U+1F3FB to U+1F3FF).'
        - 'Searching uses English names and keywords from the Unicode data, so search in English even when the interface is in another language.'
      faq:
        - q: 'Why does an emoji appear as two symbols or a box on my computer?'
          a: 'Your system font lacks that emoji or the joiner sequence that combines its parts. Newer emoji need a recent operating system; the copied text is still correct and renders on up-to-date devices.'
        - q: 'How do I use an emoji in JavaScript source?'
          a: 'Either paste the character directly in a UTF-8 file, or use the escape shown on the card, such as \u{''{''}1F600{''}''}. For CSS content use the hexadecimal form \1F600.'

  color-converter:
    title: Color converter
    description: Convert color between the different formats (hex, rgb, hsl and css name)
    guide:
      intro: 'Converts a colour between the notations used on the web and in design tools: hex, rgb(), hsl(), hwb(), lch(), cmyk() and the CSS colour names. Edit any field or use the picker, and every other format updates.'
      useCases:
        - 'Turning a hex code from a design file into the hsl() or rgb() a stylesheet uses.'
        - 'Finding the nearest CSS colour name for a hex value, or the hex value of a name such as rebeccapurple.'
        - 'Getting CMYK values to hand a web colour to a print designer, or LCH values for perceptually even palettes.'
      steps:
        - 'Type a colour in any field (for example #1ea54c, rgb(30, 165, 76) or seagreen), or pick one with the colour picker.'
        - 'All other fields update as soon as the input is a valid colour.'
        - 'Copy the format you need with its copy button.'
      notes:
        - 'Hex accepts 3, 4, 6 and 8 digits; the 4- and 8-digit forms carry transparency, which rgb() and hsl() show as a fourth alpha value.'
        - 'CMYK here is a plain mathematical conversion from RGB, not a colour-managed one. Printed results depend on the paper, inks and ICC profile, so treat the numbers as a starting point.'
        - 'The name field shows a CSS colour name only when the colour matches one exactly; most colours have no name and the field stays empty.'
        - 'LCH and HWB are supported by current browsers in CSS, but older browsers ignore them, so keep a hex or rgb() fallback when you use them in stylesheets.'
      faq:
        - q: 'Why does the name field stay empty?'
          a: 'Only the 148 named CSS colours have a name, and the match must be exact. #1ea54c is close to seagreen but is not seagreen, so no name is shown.'
        - q: 'Which format should I use in CSS?'
          a: 'Hex is the most compact and universally supported. hsl() is easier to tweak by hand (lighter, darker, more saturated). Use the 8-digit hex or rgb() with alpha when you need transparency.'

  bcrypt:
    title: Bcrypt
    description: Hash and compare text string using bcrypt. Bcrypt is a password-hashing function based on the Blowfish cipher.
    guide:
      intro: 'bcrypt is a password-hashing function built on the Blowfish cipher. Unlike a plain hash, it is deliberately slow and adds a random salt, which makes stolen password databases far harder to crack. This tool creates a bcrypt hash and checks whether a text matches an existing one.'
      useCases:
        - 'Generating a hash to insert into a database or a seed script for a test user.'
        - 'Checking whether a stored hash really belongs to a given password while debugging a login problem.'
        - 'Trying different cost factors to see how long hashing takes on your device before choosing one for production.'
      steps:
        - 'In the hash section, enter the text and set the salt rounds (the cost factor, default 10).'
        - 'Copy the generated hash; it starts with $2 followed by the cost and the salt.'
        - 'In the compare section, enter a text and a hash and read whether they match.'
      notes:
        - 'Each extra round roughly doubles the work. 10 to 12 is common today; higher values make logins slower for everyone, and very high values can freeze this page.'
        - 'The result changes every time because a new random salt is generated. Two different hashes of the same text are both valid, which is why you must use compare, not string equality.'
        - 'bcrypt only reads the first 72 bytes of its input. Anything beyond that, including long passphrases, is ignored.'
        - 'Hashing runs in the browser. Do not enter real user passwords into any online tool, including this one; use test values.'
      faq:
        - q: 'Why is my hash different from the one in the database?'
          a: 'That is expected. The salt is random and stored inside the hash, so the same password produces a different string each time. Verify with the compare section, which reads the salt back out of the hash.'
        - q: 'What cost factor should I choose?'
          a: 'Pick the highest value that keeps a single hash at roughly 100 to 300 ms on your production hardware, and revisit it every few years as computers get faster.'

  crontab-generator:
    title: Crontab generator
    description: Validate and generate crontab and get the human-readable description of the cron schedule.
    verbose: Verbose
    use24Hour: Use 24 hour time format
    daysStartAtZero: Days start at 0
    invalid: This cron is invalid
    nextRuns: Next executions
    timezone: Timezone
    runAt: 'Run at ({timezone})'
    rebootHint: This expression runs once at startup, so there is no schedule to preview.
    noNextRuns: Enter a valid cron expression to preview its next executions.
    builder:
      title: Build an expression
      frequency: Frequency
      everyMinutes: Every N minutes
      minute: Minute
      hour: Hour
      dayOfWeek: Day of week
      dayOfMonth: Day of month
      month: Month
      apply: Use this expression
      frequencies:
        minutely: Every few minutes
        hourly: Every hour
        daily: Every day
        weekly: Every week
        monthly: Every month
        yearly: Every year
      weekDays:
        0: Sunday
        1: Monday
        2: Tuesday
        3: Wednesday
        4: Thursday
        5: Friday
        6: Saturday
      months:
        1: January
        2: February
        3: March
        4: April
        5: May
        6: June
        7: July
        8: August
        9: September
        10: October
        11: November
        12: December
    guide:
      intro: 'Cron is the scheduling format used on Unix and Linux. Five (or six) fields describe when a job should run. This tool validates the expression, translates it into plain language and lists the next executions, so you can check a schedule before putting it in a crontab.'
      useCases:
        - 'Setting up periodic backups, log rotation or data sync on a server and wanting to confirm the schedule behaves as intended.'
        - 'Reading a cron expression left behind by a colleague or an old project and wondering how often it actually fires.'
        - 'Scheduling GitHub Actions, Kubernetes CronJobs or Cloudflare Workers, which all use the same syntax.'
      steps:
        - 'Type an expression in the field at the top, or build one with the dropdowns below and apply it.'
        - 'Read the plain-language line in the middle and check it matches what you meant.'
        - 'Pick a timezone under "Next executions" and verify the five upcoming times.'
      notes:
        - 'The five-field form is "minute hour day-of-month month day-of-week". The six-field form adds seconds at the front. Most server crontabs only accept five fields; the seconds field is common in application-level schedulers.'
        - 'Sunday can be written as 0 or 7, both are equivalent. The "days start at 0" switch only changes the wording of the description, not the expression.'
        - 'Timezone matters. A server crontab usually runs in the system timezone, often UTC, rather than yours, so check with the timezone selector.'
        - "{'@'}reboot runs once at startup and has no recurring schedule, so no execution times are listed for it."
      faq:
        - q: 'How do I run something every 15 minutes?'
          a: 'Use */15 * * * *. The slash means a step, so it fires at minutes 0, 15, 30 and 45 of every hour.'
        - q: 'Why does my job run at a different time on the server than shown here?'
          a: 'Almost always a timezone difference. Check the server timezone with the date command and switch the selector above to match. The other common cause is that a crontab has a different PATH than your login shell, so the command is never found and never really runs.'

  http-status-codes:
    title: HTTP status codes
    description: The list of all HTTP status codes, their name, and their meaning.
    guide:
      intro: 'A searchable reference of every standard HTTP status code, grouped into the five classes (1xx informational, 2xx success, 3xx redirection, 4xx client error, 5xx server error), with the official name and a short explanation of each.'
      useCases:
        - 'Looking up an unfamiliar code seen in a log, a browser''s network panel or an API response.'
        - 'Choosing the right code to return from an API endpoint, for example 204 versus 200, or 401 versus 403.'
        - 'Refreshing the difference between similar codes such as 301, 302, 307 and 308.'
      steps:
        - 'Type a code, a name or a keyword in the search box; results update as you type and match approximately.'
        - 'Leave the search empty to browse all codes by class.'
        - 'Read the name and description of the code you need.'
      notes:
        - 'The first digit tells the class: 2xx the request worked, 3xx look elsewhere, 4xx the client got something wrong, 5xx the server failed. Unknown codes should be handled by their class.'
        - '401 means not authenticated (no or invalid credentials), 403 means authenticated but not allowed. Picking the wrong one confuses clients and leaks information.'
        - '301 and 308 are permanent redirects, 302 and 307 temporary. 307 and 308 keep the request method and body, while browsers may turn a POST into a GET on 301 and 302.'
        - 'Some codes are specific to one protocol extension or are unofficial (such as 418 and 451); check that your framework and clients support a code before relying on it.'
      faq:
        - q: 'Which code should an API return when a resource is not found?'
          a: '404 for a missing resource at a valid path, and 410 when it existed but was deliberately removed. Use 400 or 422 when the problem is the request body rather than the path.'
        - q: 'What is the difference between 500, 502, 503 and 504?'
          a: '500 is a generic server error, 502 means a gateway received an invalid response from an upstream server, 503 means the service is temporarily unavailable or overloaded, and 504 means the upstream did not answer in time.'

  sql-prettify:
    title: SQL prettify and format
    description: Format and prettify your SQL queries online (it supports various SQL dialects).
    guide:
      intro: 'Formats SQL into a consistently indented, readable layout, with the dialect of your database (PostgreSQL, MySQL, SQL Server, BigQuery and more), keyword casing and indent style of your choice. Powered by the sql-formatter library.'
      useCases:
        - 'Making a long query copied from logs, an ORM or a BI tool readable before debugging it.'
        - 'Normalising the style of queries before committing them or pasting them into a review.'
        - 'Cleaning up a one-line query generated by a script.'
      steps:
        - 'Choose the dialect that matches your database so its specific keywords and syntax are recognised.'
        - 'Pick the keyword case (UPPERCASE, lowercase or preserve) and the indent style.'
        - 'Paste the query and copy the formatted result.'
      notes:
        - 'The formatter only rearranges whitespace and keyword casing. It never changes the meaning of the query, and it does not validate it against a schema.'
        - 'Choosing the wrong dialect can misread dialect-specific syntax (for example T-SQL brackets or PostgreSQL casts with ::) and produce odd line breaks. Standard SQL is a safe fallback.'
        - 'Tabular indent styles align keywords in a column, which some teams prefer for long SELECT lists; Standard is the conventional nested layout.'
        - 'Several statements separated by semicolons are formatted one after the other.'
      faq:
        - q: 'Why does the output look wrong around a specific construct?'
          a: 'Most likely the dialect does not match. Switch to the dialect of your database; if the construct is unusual, Standard SQL may format it more predictably.'
        - q: 'Does formatting change how the database executes the query?'
          a: 'No. Whitespace and keyword case are irrelevant to the database. String literals and identifiers are left untouched, so the query behaves exactly the same.'

  benchmark-builder:
    title: Benchmark builder
    description: Easily compare execution time of tasks with this very simple online benchmark builder.
    guide:
      intro: 'Compares sets of measurements you have taken yourself, for example execution times of two implementations: enter the values for each suite and get the mean and variance, ranked, with a Markdown table ready to paste into an issue or a pull request.'
      useCases:
        - 'Presenting timings of two or three code variants in a pull request description.'
        - 'Summarising repeated manual measurements (page load, build time, request latency) without a spreadsheet.'
        - 'Checking whether a difference between two approaches is consistent or just noise.'
      steps:
        - 'Name each suite and type its measurements, one number per field; add suites with the plus button.'
        - 'Set the unit (ms, s, MB) so the table is labelled.'
        - 'Read the mean and variance, then copy the result as a Markdown table or as plain text.'
      notes:
        - 'The variance shown is the population variance (mean of squared deviations). A large variance relative to the mean means the measurements are noisy, and a small mean difference between suites may not be meaningful.'
        - 'Take at least five measurements per suite, discard the first run (cold caches, JIT warm-up) and measure the variants under the same conditions, or the comparison is not fair.'
        - 'The tool does not run any code. It only aggregates the numbers you provide; use your language''s benchmarking library to produce them.'
        - 'Suites and the unit are remembered in this browser, so you can come back and add measurements later.'
      faq:
        - q: 'Why does my faster variant sometimes measure slower?'
          a: 'Background activity, CPU frequency scaling and garbage collection all add noise. More repetitions and reporting the mean with its variance (or better, the median) make the comparison robust.'
        - q: 'Can I paste a list of numbers at once?'
          a: 'Not currently; values are entered one per field. For long series, aggregate them in your benchmarking tool and enter the summary values here.'

  git-memo:
    title: Git cheatsheet
    description: Git is a decentralized version management software. With this cheatsheet, you will have quick access to the most common git commands.
    guide:
      intro: 'A one-page Git cheat sheet with the commands you reach for most often, grouped by task: configuring Git, starting a repository, committing, undoing mistakes and miscellaneous day-to-day operations.'
      useCases:
        - 'Looking up the exact syntax of a command you use rarely, such as amending a commit or reverting a file.'
        - 'Recovering from a mistake (wrong branch, bad commit, accidental add) under pressure.'
        - 'Onboarding someone new to Git with a short, practical reference.'
      steps:
        - 'Scan the section headings for your task.'
        - 'Copy the command and replace the placeholders (branch names, file paths) with your own.'
        - 'Use the search in your browser (Ctrl+F) for a keyword.'
      notes:
        - 'Commands that rewrite history (amend, rebase, reset --hard, force push) are safe on commits you have not pushed. Once others may have pulled them, prefer git revert, which adds a new commit instead.'
        - 'git reset --hard and git checkout -- file discard uncommitted work permanently. Run git stash first if you might want it back.'
        - 'git pull is fetch plus merge; many teams prefer git pull --rebase to avoid merge commits on feature branches.'
        - 'The sheet covers the command-line client. Graphical clients and IDEs expose the same operations under different names.'
      faq:
        - q: 'How do I undo my last commit but keep the changes?'
          a: 'git reset --soft HEAD~1 moves the branch back one commit and leaves the files staged. Use --mixed (the default) to also unstage them, and --hard only if you want to discard the changes.'
        - q: 'What is the difference between git revert and git reset?'
          a: 'revert creates a new commit that undoes an earlier one, keeping history intact and safe to push. reset moves the branch pointer and rewrites history, so it is for local, unpushed commits.'

  slugify-string:
    title: Slugify string
    description: Make a string url, filename and id safe.
    guide:
      intro: 'Turns any text into a slug: lowercase ASCII letters and digits separated by hyphens, safe to use in a URL, a file name or an HTML id. Accented letters are transliterated and symbols are removed or spelled out.'
      useCases:
        - 'Building the URL path of a blog post or product page from its title.'
        - 'Creating file or folder names from user-entered labels without spaces or special characters.'
        - 'Generating anchor ids for headings in generated HTML.'
      steps:
        - 'Paste the text, a title for example.'
        - 'Read the slug below; it updates as you type.'
        - 'Copy it.'
      notes:
        - 'Accented and special Latin letters are transliterated (é to e, ö to oe, ß to ss), & becomes and, and everything that is not a letter or digit becomes a hyphen. Repeated hyphens are collapsed and leading or trailing ones removed.'
        - 'Non-Latin scripts such as Chinese, Japanese or Arabic have no transliteration here and are dropped. A title written only in those scripts gives an empty slug, so provide a Latin title or use a transliteration tool first.'
        - 'Case changes inside a word are treated as word boundaries, so fooBar becomes foo-bar.'
        - 'The slug is not guaranteed unique. Two titles that differ only in punctuation or accents produce the same slug, so systems usually append an id or a counter.'
      faq:
        - q: 'Why is a slug better than the raw title in a URL?'
          a: 'It avoids percent-encoding, is readable, stable across systems that mishandle Unicode, and is what search engines and users expect. Hyphens are preferred to underscores because search engines treat them as word separators.'
        - q: 'Why did my Chinese title produce nothing?'
          a: 'The library only transliterates Latin-based characters. For other scripts, translate or romanise the title (for example with pinyin) before slugifying.'

  encryption:
    title: Encrypt / decrypt text
    description: Encrypt clear text and decrypt ciphertext using crypto algorithms like AES, TripleDES, Rabbit or RC4.
    guide:
      intro: 'A quick way to encrypt a piece of text with a passphrase using AES, TripleDES, Rabbit or RC4, and to decrypt text produced the same way. It is based on the CryptoJS library, whose passphrase mode is compatible with the OpenSSL format.'
      useCases:
        - 'Protecting a short note or snippet before sending it through a channel you do not fully trust.'
        - 'Decrypting a value that was produced by CryptoJS in a web application, given the passphrase.'
        - 'Demonstrating or testing passphrase-based encryption in a tutorial.'
      steps:
        - 'Enter the text, the secret key (passphrase) and the algorithm; the encrypted text appears below.'
        - 'To decrypt, paste the encrypted text, enter the same secret key and choose the same algorithm.'
        - 'Copy the result. A wrong key or algorithm shows an error instead of the text.'
      notes:
        - 'The output is a Base64 string starting with U2FsdGVkX1, which is the text Salted__ encoded. A random salt is generated each time, so encrypting the same text twice gives different results, and both decrypt correctly.'
        - 'The key and IV are derived from your passphrase with the OpenSSL-style key derivation (a single MD5-based round), which is weak against guessing. Use a long, random passphrase.'
        - 'AES is the sensible choice. TripleDES is slow and being retired, RC4 is broken, and Rabbit is rarely used. The others exist for compatibility.'
        - 'There is no authentication, so a modified ciphertext may decrypt to garbage instead of failing cleanly. This is not suitable for protecting real secrets or passwords.'
      faq:
        - q: 'Why does the same input give a different result each time?'
          a: 'Because of the random salt. This is intended: it stops two identical messages from producing identical ciphertext. Decryption reads the salt back from the beginning of the ciphertext.'
        - q: 'When should I use the AES advanced tool instead?'
          a: 'When you must match a specific key, IV and mode used by another system. This tool hides those details and cannot reproduce them.'

  aes-advanced-encryption:
    title: AES advanced encrypt / decrypt
    description: Encrypt and decrypt text with AES using an explicit key and IV (hex, base64 or text) in CBC, GCM, CTR or ECB mode, for interoperability with other systems.
    guide:
      intro: 'Encrypts and decrypts text with AES using an explicit key and IV that you control, in CBC, GCM, CTR or ECB mode. Unlike a passphrase-based tool, it lets you reproduce exactly what another system or library does, which is what you need for interoperability work.'
      useCases:
        - 'Reproducing the ciphertext an API or a legacy system expects, or decrypting a value it sent you, given its key and IV.'
        - 'Checking that your own code encrypts a test vector to the same bytes as a reference implementation.'
        - 'Learning how modes, IV length and padding change the output.'
      steps:
        - 'Choose the mode, then enter the key and pick its encoding (hex, base64 or UTF-8 text).'
        - 'Enter the IV or nonce in the same way; ECB needs none. For GCM you can also add optional authenticated data.'
        - 'Type the plain text to get the ciphertext in the encoding you chose, or paste ciphertext in the decrypt section to read the plain text.'
      notes:
        - 'The key must be exactly 16, 24 or 32 bytes (AES-128, 192 or 256); the tool tells you the length it received. Remember that a hex key of 64 characters is 32 bytes, while the same 64 characters entered as text are 64 bytes and rejected.'
        - 'CBC and CTR need a 16-byte IV, GCM works with a 12-byte nonce (recommended), and ECB uses no IV.'
        - 'GCM is authenticated encryption: the 16-byte tag is appended to the ciphertext and decryption fails if anything was modified. CBC, CTR and ECB give no integrity protection.'
        - 'Never reuse the same IV with the same key in GCM or CTR. Doing so can reveal the plain text. Always generate a fresh random IV for each message.'
        - 'ECB encrypts identical blocks identically and leaks patterns. It is offered for compatibility only, not for new designs.'
      faq:
        - q: 'Why does decryption fail or give garbage?'
          a: 'Almost always a mismatch: a different key or IV, the wrong mode, the wrong ciphertext encoding (hex versus base64), or in GCM a missing tag or different additional data. Check each setting against the system that produced the data.'
        - q: 'Is this the same as the simple encrypt/decrypt tool?'
          a: 'No. The simple tool takes a passphrase and derives the key and IV itself using a random salt, so its output differs each time and only matches tools with the same scheme. This one takes the raw key and IV, so you control every byte.'

  random-port-generator:
    title: Random port generator
    description: Generate random port numbers outside of the range of "known" ports (0-1023).
    guide:
      intro: 'Picks a random TCP/UDP port number between 1024 and 65535, outside the well-known range (0 to 1023) that needs administrator rights and is reserved for standard services.'
      useCases:
        - 'Choosing a port for a new development server, test database or local service without colliding with the usual defaults.'
        - 'Picking an arbitrary port for a tunnel, a proxy or a temporary container mapping.'
        - 'Generating test values for configuration files.'
      steps:
        - 'Read the generated port number.'
        - 'Press refresh (or Ctrl+Enter) for another one.'
        - 'Copy it into your configuration.'
      notes:
        - 'Ports 1024 to 49151 are registered ports that IANA assigns to specific applications; a random pick may land on one that another program on your machine already uses, such as 3306 (MySQL) or 5432 (PostgreSQL). Check with netstat, ss or lsof before committing to it.'
        - 'Ports 49152 to 65535 are the dynamic (ephemeral) range that operating systems hand out for outgoing connections. A service listening there works, but can occasionally conflict with an ephemeral port in use.'
        - 'The generator does not check your machine, it only draws a number.'
      faq:
        - q: 'Why does it avoid ports below 1024?'
          a: 'Those are the well-known ports (HTTP 80, HTTPS 443, SSH 22 and so on). Binding to them requires root or administrator rights on most systems and risks clashing with standard services.'
        - q: 'Is a random port a security measure?'
          a: 'Barely. Port scanners find open ports in seconds, so an unusual port only reduces noise from automated probes. Protect the service with authentication and a firewall instead.'

  yaml-prettify:
    title: YAML prettify and format
    description: Prettify your YAML string into a friendly, human-readable format.
    guide:
      intro: 'Re-formats a YAML document with consistent indentation, optionally sorting the keys of every mapping. The document is parsed and written back, so the output is valid, canonical YAML.'
      useCases:
        - 'Normalising the indentation of a configuration file edited by several people or tools.'
        - 'Sorting keys so two YAML files can be compared with a plain diff.'
        - 'Validating a YAML file: syntax errors are reported instead of formatted output.'
      steps:
        - 'Paste the YAML into the input field.'
        - 'Set the indent size (1 to 10 spaces) and toggle "Sort keys".'
        - 'Copy the formatted output.'
      notes:
        - 'Because the document is parsed and re-serialised, comments are removed, anchors and aliases are expanded, and the original quoting style of strings may change. Values and structure stay identical.'
        - '"Sort keys" reorders mappings alphabetically at every level. Lists keep their order, since order in a list is meaningful.'
        - 'Strings that would be read as another type (true, 1.0, null) are quoted in the output so their meaning is preserved.'
        - 'Only one document is handled; a file with several documents separated by --- is rejected.'
      faq:
        - q: 'Why did my comments disappear?'
          a: 'YAML comments are not part of the data model, and the formatter works on the parsed data. Keep a copy of the original if the comments matter, or re-add them after formatting.'
        - q: 'Is this the same as the YAML to JSON converter?'
          a: 'They share the parser, but this tool writes YAML back out while the converter writes JSON. Use this one when the result must stay YAML.'

  eta-calculator:
    title: ETA calculator
    description: An ETA (Estimated Time of Arrival) calculator to determine the approximate end time of a task, for example, the end time and duration of a file download.
    guide:
      intro: 'Estimates when a task will finish from how fast it is going: give the total amount of work, when it started and the rate observed so far (so many units per so much time), and get the total duration and the expected end time.'
      useCases:
        - 'Predicting when a download, a backup, a data migration or a batch job will complete from its current throughput.'
        - 'Estimating how long a repetitive manual task will take at the pace observed so far.'
        - 'Planning: checking whether a process will finish before a deadline or a maintenance window closes.'
      steps:
        - 'Enter the total number of units to process (files, rows, megabytes, items).'
        - 'Set when the work started and the rate you observe, for example 3 units every 5 minutes.'
        - 'Read the total duration and the relative end time (for example tomorrow at 14:30).'
      notes:
        - 'The estimate assumes a constant rate. Downloads, builds and migrations often slow down or speed up, so re-measure the rate from time to time and update the fields.'
        - 'Duration is computed as total units divided by the rate; the end time adds that duration to the start time, in your device''s time zone.'
        - 'Use the same unit for the total and the rate. If the rate is in megabytes per second, the total must be in megabytes too.'
        - 'The end time is shown relative to now (today, tomorrow, a weekday), so it reads naturally but should be re-checked if you come back to the page much later.'
      faq:
        - q: 'How do I get the rate for a download?'
          a: 'Note the amount transferred over a minute or two (most download managers show it), then enter that amount and that time span. Longer measurement windows give steadier estimates.'
        - q: 'Why does the end time differ from what my tool predicts?'
          a: 'Tools often use a moving average of recent speed, while this calculator uses the single rate you entered. If the speed changed since you measured it, the estimates diverge.'

  roman-numeral-converter:
    title: Roman numeral converter
    description: Convert Roman numerals to numbers and convert numbers to Roman numerals.
    guide:
      intro: 'Converts numbers from 1 to 3999 into Roman numerals and Roman numerals back into numbers, following the standard subtractive notation (IV rather than IIII).'
      useCases:
        - 'Writing a year, a chapter number or a sequel title (Rocky IV) in Roman numerals.'
        - 'Reading a date on a monument, a film''s copyright notice or a clock face.'
        - 'Checking homework or a puzzle answer.'
      steps:
        - 'Type a number in the first field to see its Roman numeral.'
        - 'Type a Roman numeral in the second field to see the number.'
        - 'Copy either result.'
      notes:
        - 'The seven symbols are I (1), V (5), X (10), L (50), C (100), D (500) and M (1000). A smaller symbol before a larger one is subtracted (IX is 9), after it is added (XI is 11).'
        - 'Only 1 to 3999 are supported, because classical notation has no symbol above M and repeats a symbol at most three times. Larger numbers used a bar over the numerals, which cannot be typed as plain text.'
        - 'There is no zero and there are no negative or fractional numbers in Roman numerals.'
        - 'The validator accepts only the standard form: IIII, VX or IC are rejected even though they appear on some clock faces and inscriptions.'
      faq:
        - q: 'Why can I not convert 4000 or more?'
          a: 'Standard Roman numerals stop at 3999 (MMMCMXCIX). Romans wrote larger values with an overline meaning times one thousand, which has no plain-text equivalent.'
        - q: 'Why is MCMXCIX 1999 and not something else?'
          a: 'Read it in groups: M (1000), CM (900), XC (90), IX (9). Each group is a largest symbol minus a smaller one placed before it.'

  hmac-generator:
    title: Hmac generator
    description: Computes a hash-based message authentication code (HMAC) using a secret key and your favorite hashing function.
    guide:
      intro: 'Computes an HMAC, a hash of a message mixed with a secret key, using MD5, SHA-1, SHA-2 (224, 256, 384, 512), SHA-3 or RIPEMD-160. An HMAC proves that a message was produced by someone who knows the key and was not altered on the way.'
      useCases:
        - 'Verifying webhook signatures from services that sign the request body with a shared secret.'
        - 'Reproducing the signature an API expects (request signing, signed URLs) to find out why yours is rejected.'
        - 'Checking an HMAC implementation against a known-good result.'
      steps:
        - 'Enter the message in the plain text field and the shared secret in the secret key field.'
        - 'Choose the hashing function; SHA256 is the usual one.'
        - 'Choose the output encoding (hex, base64, base64url or binary) and copy the HMAC.'
      notes:
        - 'Both the message and the key are taken as UTF-8 text. If your key is binary or given as hex or base64, decode it first, because the tool will otherwise use the characters of that text as the key.'
        - 'A single extra space or newline in the message changes the whole result, so paste exactly the bytes that were signed, such as the raw request body, not a re-formatted version.'
        - 'Prefer SHA-256 or stronger. HMAC-MD5 and HMAC-SHA1 are still considered secure as MACs, but are kept mostly for older systems.'
        - 'Compare HMACs in constant time on your server (for example crypto.timingSafeEqual) rather than with ordinary string comparison.'
      faq:
        - q: 'What is the difference between HMAC and a plain hash?'
          a: 'A plain hash can be computed by anyone, so it only detects accidental changes. An HMAC needs the secret key, so it also proves who produced the message and stops an attacker from forging a matching value.'
        - q: 'Why does my HMAC not match the one the service sent?'
          a: 'Typical causes are a different output encoding (hex versus base64), a key that should have been decoded first, the wrong hash function, or a body that was changed by a framework before you signed it.'

  bip39-generator:
    title: BIP39 passphrase generator
    description: Generate a BIP39 passphrase from an existing or random mnemonic, or get the mnemonic from the passphrase.
    guide:
      intro: 'Works with BIP39 mnemonics, the 12- or 24-word recovery phrases used by cryptocurrency wallets: generate a new random phrase, derive the phrase from a hexadecimal entropy value, or recover the entropy from an existing phrase, in any of the ten official word lists.'
      useCases:
        - 'Understanding how a wallet''s recovery phrase is derived from random entropy.'
        - 'Creating test phrases for wallet software, tutorials or automated tests.'
        - 'Checking that a phrase is valid (correct words and checksum) in its language.'
      steps:
        - 'Pick the word list language.'
        - 'Press refresh for new random entropy, or paste your own hexadecimal entropy, to get the phrase.'
        - 'Or paste an existing phrase to see the entropy it encodes.'
      notes:
        - 'Never type a phrase that protects real funds into any website, including this one. Although the computation runs locally, a browser extension, screenshot or clipboard manager could capture it. Use this tool for learning and testing only.'
        - '128 bits of entropy give 12 words and 256 bits give 24; the last word contains a checksum, so a random set of words is almost never a valid phrase.'
        - 'The word list is part of the standard, and a phrase is only meaningful in its own language. Changing the language with the same entropy produces a different phrase.'
        - 'A phrase derives wallet keys only together with the derivation path and an optional passphrase (the "25th word"). This tool covers the mnemonic step only.'
      faq:
        - q: 'Why is my phrase reported as invalid?'
          a: 'A word is misspelled or from another language''s list, the word count is wrong (12, 15, 18, 21 or 24), or the checksum in the last word does not match. Compare each word against the official list.'
        - q: 'Can I make my own phrase from words I like?'
          a: 'Not safely. Human-chosen words have little entropy and the checksum would most likely fail. Always use entropy from a secure random source, ideally generated by the wallet itself.'

  base64-file-converter:
    title: Base64 file converter
    description: Convert a string, file, or image into its base64 representation.
    guide:
      intro: 'Encodes any file (image, PDF, font, archive) into a Base64 string, and turns a Base64 string back into a downloadable file, detecting the type from the data when possible. Everything happens in your browser.'
      useCases:
        - 'Embedding a small image or font directly in HTML, CSS or JSON as a data URL.'
        - 'Sending a binary file through a text-only channel such as a JSON API, an e-mail body or a configuration file.'
        - 'Saving a Base64 payload received from an API as a real file to open it.'
      steps:
        - 'To encode, drop a file onto the upload area and copy the Base64 output.'
        - 'To decode, paste a Base64 string (with or without the data: prefix), set a file name and extension if the type is not detected, and press download.'
        - 'Use the preview to confirm an image decoded correctly.'
      notes:
        - 'Base64 makes data about 33% larger. Embedding is sensible for files under a few kilobytes (icons, small fonts); larger assets are better served as separate files that the browser can cache.'
        - 'A data URL needs the MIME type in front (data:image/png;base64,...). The encoder output here is the raw Base64 body; prepend the type yourself when building a data URL, or copy it from the image preview.'
        - 'The file type is guessed from the first bytes of the decoded data. For formats without a recognisable header (plain text, CSV, some binaries) set the extension manually.'
        - 'Large files are encoded in memory, so files of several hundred megabytes may be slow or fail depending on the device.'
      faq:
        - q: 'Why is the decoded file damaged or will not open?'
          a: 'Usually the Base64 string was truncated, had line breaks or spaces inserted by an e-mail client, or was URL-safe Base64 (with - and _). Clean the string and make sure its length is a multiple of 4 (padding with =).'
        - q: 'Is Base64 a way to hide or protect a file?'
          a: 'No. It is an encoding anyone can reverse instantly. Use encryption if confidentiality matters.'

  list-converter:
    title: List converter
    description: This tool can process column-based data and apply various changes (transpose, add prefix and suffix, reverse list, sort list, lowercase values, truncate values) to each row.
    guide:
      intro: 'Reshapes a list of lines into the format you need: trim, deduplicate, lowercase, sort or reverse the items, add a prefix and suffix to each one, join them with a separator and wrap the whole list. Typical output is a comma-separated or SQL-ready list.'
      useCases:
        - 'Turning a column copied from a spreadsheet into ''a'', ''b'', ''c'' for an SQL IN clause or a code array.'
        - 'Cleaning a list: removing duplicates and blank lines, trimming spaces, sorting.'
        - 'Adding quotes, brackets or a URL prefix to every item at once.'
      steps:
        - 'Paste the items, one per line.'
        - 'Toggle the transformations: trim, remove duplicates, lowercase, sort, reverse, keep line breaks.'
        - 'Set the item prefix and suffix, the separator and the list prefix and suffix, then copy the result.'
      notes:
        - 'Transformations are applied in a fixed order: lowercase, deduplicate, reverse, sort, trim, remove empty lines, then wrap and join. Deduplication therefore happens before trimming, so ''a'' and ''a '' stay two items even with trimming on; paste the trimmed output back in for a second pass if that matters.'
        - 'Sorting is alphabetical as text, so 10 sorts before 2. Pad numbers or sort them elsewhere when numeric order matters.'
        - 'The separator is inserted between items only; combine it with "Keep line breaks" to get one item per line while still ending each line with a comma.'
        - 'Your settings are remembered in this browser, so the tool opens with the last configuration you used.'
      faq:
        - q: 'How do I make an SQL IN list?'
          a: 'Set the item prefix and suffix to a single quote each, the separator to a comma and a space, and the list prefix and suffix to ( and ). Lines like a, b, c become (''a'', ''b'', ''c'').'
        - q: 'Why is a duplicate not removed?'
          a: 'Items are compared exactly after lowercasing but before trimming, so a trailing space or an invisible character makes two items differ. Trim first (run the tool once with only trimming on), then deduplicate in a second pass.'

  base64-string-converter:
    title: Base64 string encoder/decoder
    description: Simply encode and decode strings into their base64 representation.
    guide:
      intro: 'Base64 turns arbitrary bytes into a text made of 64 printable characters so they can travel through channels that only handle text, such as JSON fields, URLs, e-mail or HTTP headers. This tool encodes text to Base64 and decodes it back, handling UTF-8 characters correctly.'
      useCases:
        - 'Reading a Base64 value taken from a config file, an HTTP header or a JSON payload to see what it holds.'
        - 'Producing a Base64 string to put in an environment variable or a Kubernetes secret manifest.'
        - 'Creating a URL-safe value for a query string or a JWT-style segment.'
      steps:
        - 'To encode, type or paste text in "String to encode"; the Base64 version appears below it.'
        - 'To decode, paste a Base64 string in the second card; the decoded text appears below it.'
        - 'Switch on the URL-safe option on either side when the value is used in a URL or a JWT.'
        - 'Use the copy buttons to take the result.'
      notes:
        - 'Base64 is an encoding, not encryption. Anyone can decode it, so it does not protect secrets.'
        - 'The URL-safe variant swaps + and / for - and _ and drops the trailing = padding. Decoding with the wrong setting reports an invalid string.'
        - 'Encoded data is about one third larger than the original (3 bytes become 4 characters).'
        - 'Decoded bytes that are not valid text, such as an image or a compressed file, are not shown meaningfully here. Use the file converter for binary data.'
      faq:
        - q: 'Why does decoding say my string is invalid?'
          a: 'Usual causes: a URL-safe string decoded without the URL-safe option (or the other way around), characters that are not part of the alphabet, or a truncated copy.'
        - q: 'Why do I see garbled characters after decoding?'
          a: 'The original bytes probably were not UTF-8 text, for example a binary file or text in another encoding. Decoding is only meaningful for text that was encoded from UTF-8.'

  toml-to-yaml:
    title: TOML to YAML
    description: Parse and convert TOML to YAML.
    guide:
      intro: 'Converts a TOML document into YAML. Useful when moving configuration from a TOML-based tool to one that expects YAML, or to view a TOML file in the more familiar YAML layout.'
      useCases:
        - 'Turning a TOML config into a YAML file for Kubernetes, Compose, CI or Ansible.'
        - 'Reading a dense TOML file with many nested tables as an indented YAML tree.'
        - 'Preparing YAML examples from TOML documentation.'
      steps:
        - 'Paste the TOML into the left field.'
        - 'Read the YAML on the right.'
        - 'Copy the result.'
      notes:
        - 'TOML dates and times become ISO 8601 timestamps such as 1979-05-27T07:32:00.000Z, which YAML also understands as timestamps.'
        - 'Table headers such as [server.tls] become nested mappings in YAML, and [[items]] arrays of tables become lists of mappings.'
        - 'Comments are dropped. The output uses two-space indentation.'
        - 'Strings that YAML would read as another type (true, 1.0, null) are quoted automatically to preserve their meaning.'
      faq:
        - q: 'Why does the YAML quote some of my values?'
          a: 'Only values that would change type when read back as YAML are quoted, for example the string "on" or a number stored as a string. The data stays identical.'
        - q: 'Can I go the other way?'
          a: 'Yes, with the YAML to TOML tool, as long as the document is a mapping at the top level; null values are dropped.'

  math-evaluator:
    title: Math evaluator
    description: A calculator for evaluating mathematical expressions. You can use functions like sqrt, cos, sin, abs, etc.
    guide:
      intro: 'Evaluates a mathematical expression as you type, with the functions and constants of the math.js library: arithmetic, powers, roots, trigonometry, logarithms, factorials, unit conversions and more.'
      useCases:
        - 'Quick calculations without opening a calculator app: 1920/1080, 2^32, sqrt(2)*10.'
        - 'Trigonometry and logarithms with proper functions: sin(pi/4), log(1000, 10), atan2(1, 1).'
        - 'Converting units inline: 5 inch to cm, 100 km/h to m/s, 72 degF to degC.'
      steps:
        - 'Type an expression in the field.'
        - 'Read the result below it; errors are shown while the expression is incomplete.'
        - 'Copy the result.'
      notes:
        - 'Standard operator precedence applies: ^ binds tighter than * and /, which bind tighter than + and −. Use parentheses when in doubt.'
        - 'Trigonometric functions take radians. Write sin(45 deg) or sin(45 * pi / 180) for degrees.'
        - 'log(x) is the natural logarithm; use log10(x) or log(x, 10) for base 10. The factorial is 5! and the modulo is mod or %.'
        - 'Numbers are IEEE double precision, so 0.1 + 0.2 shows 0.30000000000000004. Use round(x, 2) to round to two decimals.'
      faq:
        - q: 'Why does 0.1 + 0.2 not give exactly 0.3?'
          a: 'Binary floating point cannot represent 0.1 or 0.2 exactly, a limitation of nearly every calculator and programming language. Wrap the expression in round(..., 2) to display a clean result.'
        - q: 'Can I convert units?'
          a: 'Yes, math.js understands many units: write a value with its unit and to followed by the target unit, for example 3 ft to m or 1 GB to MB.'

  json-to-yaml-converter:
    title: JSON to YAML converter
    description: Simply convert JSON to YAML with this online live converter.
    guide:
      intro: 'Converts JSON into YAML as you type. YAML is the format of most configuration files (Kubernetes, GitHub Actions, Docker Compose, Ansible), and this tool lets you write or paste JSON and get an equivalent YAML document.'
      useCases:
        - 'Turning a JSON config or API response into a YAML manifest or workflow file.'
        - 'Checking how a JSON structure looks in YAML before hand-editing a long configuration file.'
        - 'Converting JSON test fixtures into the YAML a tool such as Ansible or Helm expects.'
      steps:
        - 'Paste JSON into the left field. Relaxed JSON5 syntax (comments, trailing commas, unquoted keys) is accepted.'
        - 'Read the YAML on the right; it updates on every change.'
        - 'Copy the result with the copy button.'
      notes:
        - 'Comments in the JSON5 input are dropped: the converter works on the parsed data, not the text.'
        - 'Strings that YAML would read as another type, such as "true", "null" or a number written as a string, are quoted automatically so their meaning is preserved. Words like yes and no are plain strings in YAML 1.2 and stay unquoted.'
        - 'Output uses two-space indentation and block style. Long strings containing spaces may be folded onto several lines, which is valid YAML but can look surprising.'
        - 'Key order is preserved. JSON has no comments, anchors or multiple documents, so none appear in the output.'
      faq:
        - q: 'Why are some of my strings quoted and others not?'
          a: 'YAML only needs quotes when a bare value would be interpreted as something else, for example the string "true" or "1.0". The converter adds quotes exactly in those cases.'
        - q: 'Can I convert YAML back to JSON?'
          a: 'Yes, use the YAML to JSON converter. Converting back and forth preserves the data, but not comments or formatting.'

  url-parser:
    title: URL parser
    description: Parse a URL into its separate constituent parts (protocol, origin, params, port, username-password, ...)
    guide:
      intro: 'Splits a URL into its parts, protocol, username and password, hostname, port, path, query string and hash, and lists every query parameter separately, using the same URL parser as your browser.'
      useCases:
        - 'Reading a long tracking or OAuth redirect URL to see which parameters it actually carries.'
        - 'Checking whether a URL built by your code has the host, port and path you intended.'
        - 'Extracting the host or a single parameter value without counting characters by hand.'
      steps:
        - 'Paste the full URL, including the scheme such as https://.'
        - 'Read each component in its own field; the copy button next to each one copies just that part.'
        - 'Scroll down to the parameter table for the decoded value of every query key.'
      notes:
        - 'The URL must be absolute. A bare path such as /api/users or a host without a scheme is reported as invalid; prepend https:// to parse it.'
        - 'Port is empty when the URL uses the default port of its scheme (80 for http, 443 for https), because the browser parser normalises it away.'
        - 'Parameter values in the table are percent-decoded, while the raw query string field shows them exactly as written.'
        - 'A key that appears several times (?tag=a&tag=b) is shown once with its last value in the table. Use the raw query string to see all occurrences.'
      faq:
        - q: 'Why does the hostname lose its uppercase letters?'
          a: 'Host names are case-insensitive, so the parser lowercases them. Internationalised domain names are also converted to their punycode (xn--) form.'
        - q: 'Where are the username and password used?'
          a: 'They are the credentials embedded as user:password{''@''} before the host, an old HTTP feature. Browsers mostly ignore them today, and you should never share URLs that contain real credentials.'

  iban-validator-and-parser:
    title: IBAN validator and parser
    description: Validate and parse IBAN numbers. Check if an IBAN is valid and get the country, BBAN, if it is a QR-IBAN and the IBAN friendly format.
    guide:
      intro: 'Checks whether an IBAN (International Bank Account Number) is valid and breaks it down: country, BBAN (the national account part), whether it is a Swiss QR-IBAN, and the standard grouped-by-four display format. Validation runs locally with the ibantools library.'
      useCases:
        - 'Verifying an IBAN typed into a form or received in an invoice before making a transfer.'
        - 'Finding out which country and bank an IBAN belongs to.'
        - 'Formatting an IBAN into readable groups of four characters for a document.'
      steps:
        - 'Paste the IBAN, with or without spaces.'
        - 'Read the validity, any errors found, the country code, the BBAN and the QR-IBAN flag.'
        - 'Copy the friendly format if you need it.'
      notes:
        - 'Validation checks the length and structure defined for the country and the ISO 7064 mod-97 checksum. A valid IBAN means the number is well-formed, not that the account exists or belongs to a given person.'
        - 'The checksum catches almost all single typos and transpositions, which is why banks reject invalid IBANs immediately.'
        - 'A QR-IBAN is a Swiss or Liechtenstein IBAN whose bank code is in the 30000 to 31999 range, used only with QR-bills; it cannot be used for ordinary transfers.'
        - 'The IBAN is checked in your browser and not sent anywhere. Still, treat account numbers as personal data.'
      faq:
        - q: 'Why is a real IBAN reported as invalid?'
          a: 'Most often a typo, a letter O instead of a zero, or a character lost when copying. Some countries also updated their format; make sure the full IBAN including the two check digits was pasted.'
        - q: 'Can it tell me the bank name?'
          a: 'Only the country and the BBAN are extracted. The bank identifier is part of the BBAN and its meaning differs per country; look it up in that country''s bank register.'

  user-agent-parser:
    title: User-agent parser
    description: Detect and parse Browser, Engine, OS, CPU, and Device type/model from an user-agent string.
    guide:
      intro: 'Decodes a browser User-Agent string into the browser name and version, rendering engine, operating system, device type and model, and CPU architecture, using the ua-parser-js library. Your own browser''s string is filled in by default.'
      useCases:
        - 'Finding out which browser and OS a user had when reading a bug report or a server log line.'
        - 'Checking what your own browser announces about itself.'
        - 'Building or testing device-detection rules against real User-Agent strings.'
      steps:
        - 'Paste a User-Agent string, or keep the one pre-filled from your browser.'
        - 'Read the cards: Browser, Engine, OS, Device and CPU.'
        - 'Empty fields mean the string does not carry that information.'
      notes:
        - 'User-Agent strings are self-declared and often misleading on purpose: every modern browser claims to be Mozilla, Chrome-based browsers include Safari and AppleWebKit, and Edge includes Chrome. Trust the parsed result over the raw text.'
        - 'Since 2021 Chrome freezes parts of its string (reduced User-Agent): the Android and Windows versions are no longer precise, and the minor browser version is always 0. Device model is usually missing on Android.'
        - 'Desktop browsers rarely report a device type; empty Device fields are normal on a PC.'
        - 'Parsing is heuristic and depends on the library''s rules, so very new browsers or unusual apps may be partly misidentified.'
      faq:
        - q: 'Why does my iPad show up as a Mac?'
          a: 'Since iPadOS 13, Safari on iPad requests desktop sites and uses a Mac-like User-Agent string. The string itself no longer says iPad, so no parser can tell.'
        - q: 'Why does the OS version look wrong?'
          a: 'Chrome and Chromium-based browsers report frozen, generic OS versions (for example Windows 10 for Windows 11). The precise version is only available through Client Hints, not the User-Agent string.'

  numeronym-generator:
    title: Numeronym generator
    description: A numeronym is a word where a number is used to form an abbreviation. For example, "i18n" is a numeronym of "internationalization" where 18 stands for the number of letters between the first i and the last n in the word.
    guide:
      intro: 'Builds the numeronym of a word: its first letter, the number of letters in between, and its last letter, the pattern behind i18n (internationalization), l10n (localization) and a11y (accessibility).'
      useCases:
        - 'Coining a short tag for a long term in code, folder names, tickets or chat.'
        - 'Decoding or checking an existing abbreviation such as k8s or o11y.'
        - 'Picking consistent short names for feature flags or configuration keys.'
      steps:
        - 'Type a word.'
        - 'Read the numeronym next to it.'
        - 'Copy it.'
      notes:
        - 'Words of three letters or fewer are returned unchanged, because a numeronym would not be shorter.'
        - 'Only one word is processed; spaces count as letters, so enter a single word without spaces or hyphens.'
        - 'The count is the number of characters between the first and last one, not the total length: internationalization has 20 letters, so it becomes i18n.'
        - 'Numeronyms are handy but opaque to newcomers; define them once in your documentation.'
      faq:
        - q: 'What does k8s stand for?'
          a: 'Kubernetes: k, then the 8 letters ubernete, then s. Likewise o11y is observability and a11y is accessibility.'
        - q: 'Can two different words have the same numeronym?'
          a: 'Yes, easily: any two words with the same first and last letter and the same length collide. Use numeronyms only where the context makes the meaning clear.'

  case-converter:
    title: Case converter
    description: Transform the case of a string and choose between different formats
    guide:
      intro: 'Shows a piece of text in every common naming convention at once: lowercase, UPPERCASE, camelCase, PascalCase, snake_case, CONSTANT_CASE, kebab-case (param case), dot.case, path/case, Header-Case, Sentence case, Capital Case, no case and mOcKiNg cAsE.'
      useCases:
        - 'Renaming an identifier when moving between languages or layers, for example a JSON field (snake_case) to a JavaScript property (camelCase) to a CSS class (kebab-case).'
        - 'Producing a constant name (CONSTANT_CASE) or a file path (path/case) from a human-readable label.'
        - 'Normalising inconsistent titles or labels to one style.'
      steps:
        - 'Type or paste the text in the input field.'
        - 'Every conversion appears below, each with its own copy button.'
        - 'Copy the variant you need.'
      notes:
        - 'Words are detected from spaces, punctuation and case changes, so helloWorld, hello_world and Hello World all split into the same two words. Digits are treated as separators and dropped (v2 becomes v).'
        - 'Lowercase and uppercase keep the text as is and only change the letters; all other variants rebuild the text from the detected words, removing punctuation.'
        - 'Accented Latin letters (é, ö, ñ) are kept as word characters; other scripts such as Chinese or Japanese are not split into words and may be removed by the word-based variants.'
        - 'Mocking case alternates upper and lower case letter by letter, including spaces in the count, so the pattern restarts after each space.'
      faq:
        - q: 'What is the difference between camelCase and PascalCase?'
          a: 'Both join words without separators and capitalise each word; camelCase keeps the first letter lowercase (userName), PascalCase capitalises it too (UserName). JavaScript uses camelCase for variables and PascalCase for classes.'
        - q: 'Why did the numbers disappear from my text?'
          a: 'The word splitter treats digits as separators, so item2name becomes item name. Add the numbers back by hand when they are part of the identifier.'

  html-entities:
    title: Escape HTML entities
    description: Escape or unescape HTML entities (replace characters like <,>, &, " and \' with their HTML version)
    guide:
      intro: 'Escapes the five characters that are special in HTML (&, <, >, " and '') into their entity form (&amp;, &lt;, &gt;, &quot;, &#39;), and unescapes such entities back to plain text.'
      useCases:
        - 'Showing a code sample or user-provided text inside an HTML page without it being interpreted as markup.'
        - 'Reading text copied from page source or an API that arrived with entities in it.'
        - 'Preparing a value to put inside an HTML attribute.'
      steps:
        - 'To escape, type text in the first field and read the escaped version below it.'
        - 'To unescape, paste text containing entities in the second section and read the plain text.'
        - 'Copy the result.'
      notes:
        - 'Escaping these five characters is what prevents cross-site scripting (XSS) when inserting untrusted text into HTML. Do it on output, with your framework''s escaping function, not by hand.'
        - 'Only &, <, >, " and '' are escaped; other characters, including non-ASCII text, are left as they are, which is correct for UTF-8 pages.'
        - 'Unescaping handles the same five entities plus numeric forms such as &#39;; named entities like &apos;, &nbsp; or &copy; are left untouched.'
        - 'Escaping is for HTML text and attributes only. Inside <script>, in URLs or in CSS, different escaping rules apply.'
      faq:
        - q: 'Why does &apos; stay as it is after unescaping?'
          a: '&apos; is an XML entity that older HTML did not define, so this tool, like many libraries, does not translate it. Use &#39; for an apostrophe in HTML.'
        - q: 'Do I need to escape text in a JavaScript framework like Vue or React?'
          a: 'Not when using normal text bindings: they escape automatically. Only raw HTML insertion (v-html, dangerouslySetInnerHTML, innerHTML) needs manual care.'

  json-prettify:
    title: JSON prettify and format
    description: Prettify your JSON string into a friendly, human-readable format.
    guide:
      intro: 'Formats a JSON string into an indented, readable layout. It also accepts relaxed JSON5 input (comments, trailing commas, unquoted keys) and always outputs standard JSON.'
      useCases:
        - 'Reading a minified API response or log line that arrives as a single long line.'
        - 'Cleaning up a config file before committing it, so the diff shows only real changes.'
        - 'Finding out where a JSON document is broken, since invalid input is flagged with an error message.'
      steps:
        - 'Paste or type your JSON into the left field; the formatted result appears below right away.'
        - 'Choose the indent size (0 to 10 spaces).'
        - 'Turn "Sort keys" on or off, then copy the result with the copy button.'
      notes:
        - '"Sort keys" is on by default and reorders every object alphabetically. That is good for diffing but changes the order of your data, so turn it off if key order matters to you.'
        - 'Because JSON5 is accepted, input with comments or trailing commas is formatted successfully, but the output drops the comments and is plain JSON.'
        - 'Numbers beyond JavaScript''s safe integer range (about 9 quadrillion) can lose precision when parsed, so long IDs may change. Keep such values as strings.'
        - 'Your last input and settings are remembered in this browser only, never sent to a server.'
      faq:
        - q: 'Why does the output not appear?'
          a: 'When the input is not valid JSON or JSON5, the validation message under the input shows the problem and the output stays empty. Typical causes are a missing comma, an unmatched bracket, or text pasted before or after the JSON.'
        - q: 'Does it validate against a schema?'
          a: 'No. It only checks that the text is syntactically valid and then reformats it. It does not check types or required fields.'

  docker-run-to-docker-compose-converter:
    title: Docker run to Docker compose converter
    description: Transforms "docker run" commands into docker-compose files!
    guide:
      intro: 'Translates a docker run command into an equivalent docker-compose.yml service definition, mapping ports, volumes, environment variables, restart policy, networks and the other common flags, using the composerize library.'
      useCases:
        - 'Turning the one-line docker run from an image''s README into a Compose file you can keep in version control.'
        - 'Consolidating several containers started by hand into a single stack.'
        - 'Learning how a docker run flag is spelled in Compose syntax.'
      steps:
        - 'Paste the complete docker run command, including the image name.'
        - 'Read the generated Compose file on the right.'
        - 'Check the notices below it for flags that could not be translated, then copy the result.'
      notes:
        - 'Flags that Compose cannot express, or that the library does not know, are listed as not translatable or not implemented. Review them rather than assuming the output is complete; --rm and -it, for example, have no equivalent because Compose services are long-running.'
        - 'Relative volume paths and environment variables are copied as written. Make sure they make sense relative to the directory where the Compose file lives.'
        - 'The output describes one service. For several containers, convert each command and merge the services blocks under a single services key.'
        - 'Quoting matters: a command with unbalanced quotes or shell line continuations (trailing backslashes) must be cleaned up before pasting.'
      faq:
        - q: 'Why does the output not include a version key?'
          a: 'Recent versions of Docker Compose treat the version field as obsolete and ignore it. The generated file follows the current Compose specification, which does not need it.'
        - q: 'How do I start the stack?'
          a: 'Save the output as docker-compose.yml (or compose.yaml) and run docker compose up -d in the same directory. docker compose down stops and removes the containers.'

  mac-address-lookup:
    title: MAC address lookup
    description: Find the vendor and manufacturer of a device by its MAC address.
    guide:
      intro: 'Finds the manufacturer behind a MAC address from its first three bytes, the OUI (Organizationally Unique Identifier) assigned by the IEEE, using an offline copy of the registry. The lookup runs entirely in your browser.'
      useCases:
        - 'Identifying an unknown device on your Wi-Fi or in a DHCP lease table.'
        - 'Checking whether a device really is the brand it claims to be.'
        - 'Grouping devices by vendor when auditing a network.'
      steps:
        - 'Type or paste a MAC address in any common notation: colons, hyphens, dots or no separators.'
        - 'Read the vendor name and registered address below.'
        - 'Copy the result if you need it elsewhere.'
      notes:
        - 'Only the first six hex digits matter; the remaining three bytes identify the individual device and are not used.'
        - 'Modern phones and laptops use randomised MAC addresses on Wi-Fi for privacy. A randomised address has the second hex digit set to 2, 6, A or E and will not match any vendor.'
        - 'The database is a snapshot bundled with the site, so very recently registered prefixes may be missing until the dependency is updated.'
        - 'Some prefixes are registered to component makers (network chip vendors) rather than the brand on the device, so the result may name the chip manufacturer.'
      faq:
        - q: 'Why is no vendor found for my address?'
          a: 'Most often it is a randomised (private) MAC address, which is normal on recent iOS, Android and Windows devices. Otherwise the prefix is newer than the bundled database or belongs to a locally administered range.'
        - q: 'Can I find the device owner or location from a MAC address?'
          a: 'No. The registry only maps the prefix to the company that bought it. It says nothing about who owns a specific device or where it is.'

  mime-types:
    title: MIME types
    description: Convert MIME types to file extensions and vice-versa.
    guide:
      intro: 'Looks up the file extensions that belong to a MIME type, and the MIME type that belongs to a file extension, using the same database as most web servers and Node.js (the mime-db project).'
      useCases:
        - 'Finding the correct Content-Type header to send for a file your server delivers.'
        - 'Checking which extension to give a file received with a given MIME type.'
        - 'Configuring upload filters or accept attributes that must list MIME types.'
      steps:
        - 'In the first list, pick or type a MIME type such as application/pdf to see its extensions.'
        - 'In the second list, pick or type an extension such as png to see its MIME type(s).'
        - 'Both lists are searchable: start typing to filter them.'
      notes:
        - 'Some types have several extensions (image/jpeg has jpeg, jpg, jpe, jfif) and some extensions have more than one registered type. The first entry is usually the preferred one.'
        - 'application/octet-stream is the fallback for unknown binary data; browsers download such files rather than displaying them.'
        - 'The MIME type is what the server declares, not what the file contains. A mismatch between the two can make browsers refuse to run scripts or styles.'
        - 'Text types usually need a charset, for example text/html; charset=utf-8. The list shows the type only.'
      faq:
        - q: 'Why is the extension I am looking for missing?'
          a: 'The database only lists registered or widely used types. Very new or proprietary formats may be absent; use application/octet-stream or the vendor''s documented type.'
        - q: 'What is the difference between text/javascript and application/javascript?'
          a: 'Both have been used; the current standard is text/javascript. Browsers accept either for script files.'

  toml-to-json:
    title: TOML to JSON
    description: Parse and convert TOML to JSON.
    guide:
      intro: 'Parses a TOML document and outputs it as indented JSON, so you can inspect a Cargo.toml, pyproject.toml or other TOML configuration, or hand it to a program that only reads JSON.'
      useCases:
        - 'Reading a TOML file in a script or a jq pipeline that expects JSON.'
        - 'Checking how TOML tables, dotted keys and arrays of tables map to nested objects.'
        - 'Validating a TOML file: syntax errors are reported as you type.'
      steps:
        - 'Paste the TOML into the left field.'
        - 'Read the JSON on the right, indented with three spaces.'
        - 'Copy the result.'
      notes:
        - 'TOML dates and times (for example 1979-05-27T07:32:00Z) become ISO 8601 strings in JSON, since JSON has no date type.'
        - 'Integers beyond JavaScript''s safe range (about 9 quadrillion) are not supported and leave the output empty.'
        - 'Comments are dropped, and the output is always a JSON object because a TOML document is always a table.'
        - 'Duplicate keys and tables defined twice are errors in TOML, so the converter rejects them rather than silently keeping one.'
      faq:
        - q: 'Why do my dates come out as strings?'
          a: 'TOML has native date-time values but JSON does not, so they are serialised as ISO 8601 text. Parse them back into dates in the consuming program if needed.'
        - q: 'Can I convert JSON back to TOML?'
          a: 'Yes, with the JSON to TOML tool, as long as the JSON has an object at the top level; null values are dropped on the way.'

  lorem-ipsum-generator:
    title: Lorem ipsum generator
    description: Lorem ipsum is a placeholder text commonly used to demonstrate the visual form of a document or a typeface without relying on meaningful content
    guide:
      intro: 'Generates Lorem ipsum placeholder text with the number of paragraphs, sentences and words you choose, optionally wrapped in HTML paragraph tags, to fill layouts and mock-ups before the real content exists.'
      useCases:
        - 'Filling a page design, a template or a component with realistic-looking text to judge layout and typography.'
        - 'Creating sample content for a CMS, a database seed or a UI test.'
        - 'Producing dummy paragraphs of a specific length to test truncation and overflow.'
      steps:
        - 'Set the number of paragraphs, and the range of sentences per paragraph and words per sentence.'
        - 'Choose whether the text must start with the classic Lorem ipsum dolor sit amet and whether to wrap paragraphs in <p> tags.'
        - 'Copy the text, or refresh (Ctrl+Enter) for a different random text with the same settings.'
      notes:
        - 'The text is pseudo-Latin and carries no meaning, which is the point: readers judge the design instead of reading the content.'
        - 'Sentence and word counts are ranges picked at random for each paragraph, so two paragraphs are rarely the same length, much like real text.'
        - 'The HTML option wraps each paragraph in <p>...</p> on its own line, ready to paste into a template.'
        - 'Lorem ipsum has only Latin-like words, so it does not represent the width or line breaks of Chinese, Japanese or other scripts. Use real sample text in the target language for those layouts.'
      faq:
        - q: 'Where does Lorem ipsum come from?'
          a: 'It is a scrambled passage from Cicero''s De finibus bonorum et malorum, used by printers as filler since at least the 1960s and popularised by desktop publishing software.'
        - q: 'Why does the generated text change each time?'
          a: 'Words are chosen at random within your ranges, so every refresh yields a new text. Copy the one you like, because it cannot be regenerated identically.'

  image-compressor:
    title: Image compressor
    description: Compress images and convert them to WebP, JPEG or PNG, resize them, and download them one by one or as a zip.
    format: Output format
    keepFormat: Keep original format
    quality: Quality
    maxWidth: Max width (px)
    maxHeight: Max height (px)
    noLimit: No limit
    upload: Drag and drop images here, or click to select them
    privacy: Images are processed in your browser and never uploaded.
    pngHint: PNG is lossless, so the quality slider has no effect on it.
    download: Download
    downloadAll: Download all (zip)
    clear: Clear
    notAnImage: '{name} is not an image.'
    failed: 'Unable to compress {name}.'
    guide:
      intro: 'Shrinks photos and screenshots by re-encoding them as WebP, JPEG or PNG and optionally scaling them down. Several images can be processed at once and downloaded one by one or as a single zip. Everything runs in your browser.'
      useCases:
        - 'Making images small enough for an upload limit, an e-mail attachment or a CMS that rejects files over a few megabytes.'
        - 'Improving page speed by converting heavy PNG or JPEG files to WebP and limiting their width to what the layout really needs.'
        - 'Preparing a batch of screenshots or product photos for a document or a store listing.'
      steps:
        - 'Drop images onto the upload area, or click it to choose files.'
        - 'Choose the output format (or keep each image''s original format), the quality, and an optional maximum width and height.'
        - 'Check the size shown for each result, then download images individually or all together as a zip.'
      notes:
        - 'Quality applies to WebP and JPEG only. PNG is lossless, so its slider is disabled and PNG files shrink mainly by lowering the pixel dimensions. Quality around 75 to 85 is usually a good balance.'
        - 'Maximum width and height only ever scale an image down and keep its aspect ratio; a small image is never enlarged.'
        - 'JPEG has no transparency, so transparent areas become white. Use WebP or PNG to keep transparency.'
        - 'Re-encoding drops metadata such as EXIF data, including camera details and GPS location, and an animated GIF keeps only its first frame.'
        - 'An already well-optimised image can come out larger. Compare the sizes and keep the original in that case.'
      faq:
        - q: 'Are my images uploaded to a server?'
          a: 'No. Compression uses your browser''s canvas, so the files stay on your device. That also means very large images use your device''s memory and may take a moment.'
        - q: 'Which format should I choose?'
          a: 'WebP gives the smallest files for most photos and is supported by all current browsers. Choose JPEG when you need maximum compatibility with older software, and PNG for graphics with sharp edges or transparency.'
  video-compressor:
    title: 'Video compressor'
    description: 'Compress videos and convert them to MP4 or WebM, scale them down to 1080p or 720p, with progress and without uploading anything. Uses the hardware video encoder of your browser.'
    format: 'Output format'
    quality: 'Quality'
    maxResolution: 'Max resolution'
    original: 'Keep original'
    upload: 'Drag and drop videos here, or click to select them'
    privacy: 'Videos are processed in your browser with WebCodecs and never uploaded.'
    unsupported: 'This browser does not support WebCodecs, which this tool needs. Use a recent Chrome, Edge, Safari (16.4 or later) or Firefox (130 or later).'
    cancel: 'Cancel'
    clear: 'Clear'
    download: 'Download'
    notAVideo: '{name} is not a video.'
    qualityLevels:
      high: 'High (larger file)'
      medium: 'Medium (recommended)'
      low: 'Low (smallest file)'
    status:
      queued: 'Queued'
      error: 'Failed'
    errors:
      noVideoTrack: 'This file has no video track.'
      undecodable: 'This browser cannot decode the video codec of this file.'
      noEncoder: 'This browser has no encoder for the chosen output format. Try the other format.'
      unsupportedInput: 'Unsupported file format. MP4, MOV, WebM and MKV are supported.'
      canceled: 'Canceled.'
      failed: 'Unable to compress this video.'
    guide:
      intro: 'Re-encodes a video with your browser''s built-in hardware encoder (WebCodecs) to make the file smaller, optionally scaling it down and changing the container to MP4 or WebM. The audio track is copied as is whenever the output format allows it, so sound quality does not change.'
      useCases:
        - 'Getting a phone recording under the size limit of a chat app, an e-mail or a form upload.'
        - 'Shrinking screen recordings or 4K clips to 1080p or 720p before sharing or archiving them.'
        - 'Converting a MOV or MKV file into an MP4 that plays everywhere, without installing software.'
      steps:
        - 'Choose the output format (MP4 for compatibility, WebM for the web), the quality level and the maximum resolution.'
        - 'Drop one or more videos onto the upload area. They are processed one after another and a progress bar shows each one.'
        - 'Compare the sizes and download the results. Cancel stops the current file and drops the ones still waiting.'
      notes:
        - 'Compression works by re-encoding at a lower bitrate, so some detail is lost each time. Keep the original if you may need to edit it later, and avoid compressing a file several times in a row.'
        - 'Lowering the resolution saves far more than lowering the quality level. 1080p is enough for most screens; 720p is fine for chat apps and previews. The source is never upscaled.'
        - 'Quality levels are bitrate targets scaled to the resolution: medium is a sensible default, high keeps fine detail at roughly double the size, low is for when size matters most.'
        - 'The codec is chosen by what your browser can encode: usually H.264 for MP4 and VP9 for WebM. The audio is copied unchanged when the container allows it (AAC in MP4, Opus in WebM) and re-encoded otherwise.'
        - 'Everything runs in your browser and nothing is uploaded, which also means very large files (several GB) may exceed the memory the browser can use. Speed depends on your device; a hardware encoder handles 1080p faster than real time on most laptops.'
        - 'Encrypted (DRM) videos and some professional codecs cannot be decoded in a browser and are reported as unsupported.'
      faq:
        - q: 'Why is the compressed file larger than the original?'
          a: 'The original was already encoded at a lower bitrate than the quality level you picked. Choose a lower quality or a smaller resolution, or keep the original file.'
        - q: 'Why does it say my browser is not supported?'
          a: 'The tool needs the WebCodecs API, available in Chrome and Edge, Safari 16.4 or later, and Firefox 130 or later. Older browsers, and some privacy-hardened ones, do not provide it.'
        - q: 'Can it trim or cut a video?'
          a: 'Not at the moment. It re-encodes the whole file; trimming and cropping are not available in this tool.'

  pdf-compressor:
    title: 'PDF compressor'
    description: 'Compress PDFs in your browser: shrink scans and photo-heavy documents while keeping text selectable. Files are never uploaded.'
    preset: 'Compression level'
    presets:
      screen:
        label: 'Smallest file'
        hint: 'For reading on screen, email or messaging apps'
      ebook:
        label: 'Balanced'
        hint: 'The best choice in most cases'
      printer:
        label: 'High quality'
        hint: 'For printing, shrinks less'
    upload: 'Drag and drop PDFs here, or click to select files'
    privacy: 'PDFs are processed in your browser only and never uploaded.'
    engine: 'Compression engine: Ghostscript (AGPL-3.0).'
    sourceCode: 'Source code of this site'
    largeFile: 'A file is larger than 100 MB. It will take a while, and may fail on phones because of limited memory.'
    clear: 'Clear'
    download: 'Download'
    recompress: 'Compress again with current setting'
    waiting: 'Waiting…'
    loadingEngine: 'Downloading the compression engine (about 15 MB, only once)…'
    compressing: 'Compressing…'
    progress: 'Processing page {page} of {total}'
    notSmaller: 'This setting cannot make the file any smaller, the original is already compact. Try a smaller compression level.'
    errors:
      notPdf: 'This is not a PDF file.'
      password: 'This PDF is password-protected. Remove the password first, then compress it.'
      invalid: 'This PDF cannot be read. The file may be damaged or incomplete.'
      failed: 'Compression failed, please try again.'
      engine: 'The compression engine could not be downloaded. Check your connection and try again.'
    guide:
      intro: 'A large PDF is rarely large because of its text. The weight is in the images: every page of a scan is a high-resolution photo, and reports or catalogues often embed full-size phone pictures. This tool uses Ghostscript to resample those images to a resolution that suits the purpose and recompress them, while text, fonts and layout stay as they are. Everything happens in your browser.'
      useCases:
        - 'An email attachment is over the size limit (usually 10 to 25 MB) and needs to be smaller before sending.'
        - 'A government, school or job site only accepts uploads up to a certain size.'
        - 'Contracts, receipts or IDs scanned with a phone take several MB per page and you want to archive or send them.'
        - 'A report or catalogue with many photos should be lighter without hurting readability.'
      steps:
        - 'Pick a compression level: "Balanced" in most cases, "Smallest file" to send or read on screen, "High quality" to print.'
        - 'Drop one or more PDFs on the area above, or click to select them. The first time, the compression engine (about 15 MB) is downloaded.'
        - 'Wait for the processing to finish. Progress is shown per page, and the size before and after is listed at the end.'
        - 'Click "Download" to save the compressed file. Not happy with it? Pick another level and click "Compress again with current setting".'
      notes:
        - 'Results depend on the content: scans and photo-heavy PDFs often shrink by half or more, sometimes by 90%. Text-only PDFs are already small and may barely change.'
        - '"Smallest file" brings images down to 72 dpi. That is fine on screen, but photos and small print can look blurry when printed. Use "High quality" for documents you will print.'
        - 'If the result would be larger than the original, the tool says so and keeps the original instead of offering the bigger file. It usually means the PDF was already optimised.'
        - 'Password-protected PDFs cannot be processed; remove the password with the original software first. Compression rewrites the file, so digital signatures become invalid and interactive forms may not be fully preserved. Check the result for important documents.'
        - 'Everything runs in your browser and PDFs are never uploaded. Very large files (over 100 MB) may fail because of limited memory, especially on phones; a computer works better for those.'
      faq:
        - q: 'Can I still select and search the text after compression?'
          a: 'Yes. Only the images are recompressed; text stays text and can be selected, searched and copied. If the original is a scan without text recognition, it remains an image after compression too.'
        - q: 'Why do some PDFs barely get smaller?'
          a: 'Most of a PDF''s size comes from images. Files that are mainly text or vector graphics, or that were already compressed by another tool, have little room left to shrink.'
        - q: 'What is the difference between the three levels?'
          a: 'The image resolution: Smallest file uses 72 dpi, Balanced 150 dpi and High quality 300 dpi. A lower resolution gives a smaller file but looks blurrier when zoomed in or printed.'
        - q: 'Are my files uploaded?'
          a: 'No. The Ghostscript engine is downloaded to your browser and runs on your device, so your PDFs never leave your computer or phone.'

  qrcode-generator:
    title: QR Code generator
    description: Generate and download a QR code for a URL (or just plain text), and customize the background and foreground colors.
    decode:
      title: Read a QR code from an image
      upload: Drag and drop an image here, or click to select one
      pasteHint: You can also paste an image from the clipboard (Ctrl+V).
      result: Decoded content
      notFound: No QR code found in this image.
      error: Unable to read this image.
      useAsInput: Use as text above
      privacy: The image is processed in your browser and never uploaded.
    guide:
      intro: 'Turns a URL or any text into a QR code that you can download as an image, with your own colours and error-correction level. It can also read the content of a QR code from an image.'
      useCases:
        - 'Creating a code for a link, a Wi-Fi password note, a contact, or an event page to print on a poster or card.'
        - 'Making a branded code with your own foreground and background colours.'
        - 'Reading what an unknown QR code points to before you open it, by uploading or pasting a screenshot.'
      steps:
        - 'Enter the text or URL in the Text field; the code updates as you type.'
        - 'Optionally change the foreground and background colours and the error resistance level.'
        - 'Download the image. To read a code, drop an image onto the reading area or paste one with Ctrl+V.'
      notes:
        - 'Error resistance levels low, medium, quartile and high allow roughly 7%, 15%, 25% and 30% of the code to be damaged and still scan. Higher levels make the code denser, so keep it low for long text.'
        - 'Keep strong contrast between the two colours, and keep the foreground darker than the background. Low contrast or inverted colours fail on many scanners.'
        - 'Longer content creates a denser code that needs a larger print size. If a code scans poorly, shorten the text, for example with a short link.'
        - 'A QR code stores static content: once printed it cannot be changed. Both creating and reading happen in your browser; images are not uploaded.'
      faq:
        - q: 'Why will my QR code not scan?'
          a: 'Common reasons: too little contrast, too small a print size for the amount of data, a missing blank margin around the code, or a very high error level on long text that makes it too dense.'
        - q: 'Does the code expire?'
          a: 'No. The code simply encodes the text you entered. If it points to a URL, it works as long as that URL does.'

  wifi-qrcode-generator:
    title: WiFi QR Code generator
    description: Generate and download QR codes for quick connections to WiFi networks.
    guide:
      intro: 'Creates a QR code that connects a phone to a Wi-Fi network when scanned: enter the network name, the security type and the password, and download the code to print or display. Hidden networks and WPA2-Enterprise (EAP) are supported.'
      useCases:
        - 'Letting guests join your home or office Wi-Fi without spelling out a long password.'
        - 'Printing a connection card for a café, a meeting room or a holiday rental.'
        - 'Sharing a hidden network that phones cannot find by browsing.'
      steps:
        - 'Choose the encryption method (WPA/WPA2 for most networks, WEP for very old ones, none for open networks, WPA2-EAP for enterprise login).'
        - 'Type the network name (SSID) exactly as broadcast, the password, and tick hidden SSID if needed.'
        - 'Download the QR code and print or display it.'
      notes:
        - 'The code encodes the password in plain text (WIFI:S:name;T:WPA;P:password;;). Anyone who scans or photographs it can read the password, so place it where only intended people see it.'
        - 'iOS (11 and later) and Android (10 and later) scan Wi-Fi codes with the built-in camera app; older devices need a QR scanner app that understands the format.'
        - 'The SSID and password are case-sensitive and must match exactly. Special characters are escaped automatically.'
        - 'WPA3 networks use the WPA option, which phones accept. For WPA2-EAP you also provide the EAP method, phase 2 method and identity.'
      faq:
        - q: 'Why does my phone not connect after scanning?'
          a: 'Check that the SSID and password match exactly, including case, and that the security type is right (a WPA network scanned as WEP fails). Some phones also need the network to be in range at the moment of scanning.'
        - q: 'Can I change the password later?'
          a: 'The code is static: a new password means printing a new code. Consider a dedicated guest network whose password you rotate rarely.'

  xml-formatter:
    title: XML formatter
    description: Prettify your XML string into a friendly, human-readable format.
    guide:
      intro: 'Indents an XML document so its structure is easy to read, with a configurable indent size and an option to keep short text content on the same line as its element. Invalid XML is reported instead of being formatted.'
      useCases:
        - 'Reading a minified XML payload, SOAP envelope or configuration file that arrived as a single line.'
        - 'Normalising the formatting of an XML file before committing it, so diffs show real changes.'
        - 'Checking that an XML document is well-formed.'
      steps:
        - 'Paste the XML into the left field.'
        - 'Set the indent size (0 to 10 spaces) and toggle "Collapse content".'
        - 'Copy the formatted result.'
      notes:
        - '"Collapse content" keeps an element and its text on one line (<name>Ann</name>). Switched off, the text is moved to its own indented line, which is more uniform but longer.'
        - 'Formatting changes whitespace between elements, which is usually insignificant. In documents where whitespace inside text matters (mixed content, pre-formatted text), check the result.'
        - 'The checker only tests well-formedness: matching tags, proper nesting and quoting. It does not validate against a DTD or XML Schema.'
        - 'Comments, CDATA sections and the XML declaration are preserved.'
      faq:
        - q: 'Why is my XML reported as invalid?'
          a: 'Common causes are an unclosed tag, an unescaped & or < in text (write &amp; and &lt;), attribute values without quotes, or several root elements. HTML is not XML, so an HTML page usually fails too.'
        - q: 'Can it minify XML instead?'
          a: 'Not directly. Set the indent size to 0 to remove indentation, which produces a compact but still line-broken document.'

  temperature-converter:
    title: Temperature converter
    description: Degrees temperature conversions for Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur, and Rømer.
    guide:
      intro: 'Converts a temperature between Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur and Rømer at once. Type a value in any scale and the others update.'
      useCases:
        - 'Reading a recipe, weather report or datasheet written in Fahrenheit when you think in Celsius, or the other way round.'
        - 'Converting to Kelvin for a physics or chemistry calculation.'
        - 'Checking the historical scales (Delisle, Réaumur, Rømer, Newton) found in old texts and instruments.'
      steps:
        - 'Type a temperature in the field of the scale you have.'
        - 'Read the same temperature in all the other scales.'
        - 'Use the plus and minus buttons for small adjustments.'
      notes:
        - 'Conversions go through Kelvin using the exact definitions: 0 °C is 273.15 K and °F = K × 9/5 − 459.67. Results are not rounded, so you may see long decimals.'
        - 'Kelvin and Rankine are absolute scales and cannot be negative. Entering a Celsius value below −273.15 gives a negative Kelvin, which is not a physical temperature.'
        - 'Delisle runs backwards: higher Delisle values are colder, with 0 °De at the boiling point of water and 150 °De at freezing.'
        - 'A quick mental check for Fahrenheit: double the Celsius value and add 30 (20 °C is about 70 °F). The tool gives the exact value, 68 °F.'
      faq:
        - q: 'Why is 0 K shown as −273.15 °C and not −273?'
          a: 'The Kelvin scale is defined so that absolute zero is exactly −273.15 °C. Rounding to −273 is a common approximation, but the converter uses the exact value.'
        - q: 'What are Rankine and Rømer used for?'
          a: 'Rankine is the absolute scale paired with Fahrenheit, still seen in some US engineering fields. Rømer, Delisle, Newton and Réaumur are historical scales from the 1700s, mostly of interest when reading old scientific literature.'

  chmod-calculator:
    title: Chmod calculator
    description: Compute your chmod permissions and commands with this online chmod calculator.
    guide:
      intro: 'Builds a Unix file permission from checkboxes: tick read, write and execute for the owner, the group and everyone else, and get the octal value (such as 755), the symbolic form (rwxr-xr-x) and the ready-to-run chmod command.'
      useCases:
        - 'Working out the right chmod value for a script, a web directory or a private key file.'
        - 'Decoding a permission string seen in ls -l into what each class may do.'
        - 'Checking what 644, 600 or 777 actually grant before copying a command from the internet.'
      steps:
        - 'Tick the permissions for owner (u), group (g) and public (o).'
        - 'Read the octal and symbolic representations.'
        - 'Copy the chmod command and replace path with your file or directory.'
      notes:
        - 'Each digit adds read (4), write (2) and execute (1): 7 is rwx, 6 is rw-, 5 is r-x, 4 is r--, 0 is ---. The three digits are owner, group and others in that order.'
        - 'For directories, execute means being allowed to enter and list the directory, so directories normally need x (755 or 700) where files need only r (644 or 600).'
        - 'Private key files and credentials should be 600 (or 400): SSH refuses keys readable by others. 777 gives everyone write access and is almost never the right fix.'
        - 'This tool covers the basic bits only. The setuid, setgid and sticky bits (a leading fourth digit such as 4755) and ACLs are not represented.'
      faq:
        - q: 'What is the difference between 755 and 644?'
          a: 'Both let the owner read and write and everyone else read; 755 also lets everyone execute. Use 755 for directories and scripts, 644 for ordinary files such as HTML or images.'
        - q: 'How do I apply a permission to a whole directory tree?'
          a: 'Add -R to the command (chmod -R 755 dir), but be careful: it gives the same bits to files and directories. Prefer find dir -type d -exec chmod 755 {''{''}{''}''} + and find dir -type f -exec chmod 644 {''{''}{''}''} + to treat them separately.'

  rsa-key-pair-generator:
    title: RSA key pair generator
    description: Generate a new random RSA private and public pem certificate key pair.
    guide:
      intro: 'Generates a new random RSA private and public key pair and shows both as PEM text. Generation happens in your browser with a background worker, so the page stays responsive and the keys are never sent anywhere.'
      useCases:
        - 'Creating a throwaway key pair for testing signing, encryption, SSH or JWT code.'
        - 'Producing keys for a local development environment or a tutorial.'
        - 'Trying different key sizes to see how long generation takes.'
      steps:
        - 'Set the number of bits (2048 by default, from 256 to 16384 in steps of 8).'
        - 'Wait for the key pair to be generated; larger sizes take noticeably longer.'
        - 'Copy the public key and the private key, or press the button to generate a new pair.'
      notes:
        - 'Use 2048 bits at least; 3072 or 4096 for long-lived keys. Keys below 2048 bits are considered insecure and exist here only for experiments.'
        - 'A 4096-bit or larger key can take several seconds to many seconds to generate, and the time varies because prime numbers are searched at random.'
        - 'The private key is written in the traditional format (-----BEGIN RSA PRIVATE KEY-----, PKCS#1) and the public key in -----BEGIN PUBLIC KEY-----. Some libraries want PKCS#8 (-----BEGIN PRIVATE KEY-----); convert with: openssl pkcs8 -topk8 -nocrypt -in key.pem.'
        - 'Do not use keys generated in a web page for production systems or anything valuable. Generate those on a trusted machine with openssl or your platform''s key management service.'
      faq:
        - q: 'Is the generated key really random?'
          a: 'Yes. Generation uses the node-forge library with your browser''s secure random source, and each click creates an independent key. But as with any web tool, you cannot audit the page you are using, which is why production keys should be made elsewhere.'
        - q: 'Why does the page take a while to produce a key?'
          a: 'Finding two large random prime numbers is the slow part, and it grows quickly with key size. A 2048-bit key usually appears within a few seconds.'

  html-wysiwyg-editor:
    title: HTML WYSIWYG editor
    description: Online, feature-rich WYSIWYG HTML editor which generates the source code of the content immediately.
    guide:
      intro: 'A rich-text editor that writes HTML for you: format text with the toolbar as in a word processor, and the corresponding source code appears below, cleanly indented. Built on the Tiptap editor.'
      useCases:
        - 'Writing a formatted description, announcement or e-mail body and grabbing the HTML for a CMS or template.'
        - 'Producing clean HTML for headings, lists, quotes and code blocks without typing tags.'
        - 'Learning what HTML a given formatting produces.'
      steps:
        - 'Type in the editor and use the toolbar for headings, bold, italic, lists, quotes, code and horizontal rules.'
        - 'Read the generated HTML below; it updates as you edit.'
        - 'Copy the HTML into your page or system.'
      notes:
        - 'The output is semantic HTML (<h1>, <p>, <ul>, <blockquote>, <pre>) without inline styles or classes, so it inherits the styling of wherever you paste it.'
        - 'Pasting formatted text from a word processor is cleaned to the supported elements; colours, fonts and tables are dropped.'
        - 'Your content is saved in this browser between visits, so you can leave and come back. Clear it manually if the device is shared.'
        - 'The editor covers common formatting only: no images, tables or links in this version. Add those in the HTML by hand.'
      faq:
        - q: 'Can I edit the HTML directly and see it in the editor?'
          a: 'Not in this tool: the flow is editor to HTML. Edit in the visual editor and copy the result; for HTML-first work, use a code editor.'
        - q: 'Why is the HTML so much shorter than what my word processor exports?'
          a: 'Word processors embed fonts, sizes and layout as inline styles and wrappers. This editor emits only structural tags, which is what web pages and CMSs want.'

  yaml-to-toml:
    title: YAML to TOML
    description: Parse and convert YAML to TOML.
    guide:
      intro: 'Converts a YAML document directly into TOML, without going through JSON by hand. Handy when a project moves from a YAML configuration to a TOML one, or when a tool only reads TOML.'
      useCases:
        - 'Migrating a configuration file from YAML to TOML, for example to pyproject.toml.'
        - 'Producing a TOML snippet from a YAML example found in documentation.'
        - 'Comparing how the same data looks in both formats.'
      steps:
        - 'Paste the YAML into the left field.'
        - 'Read the TOML on the right.'
        - 'Copy the result.'
      notes:
        - 'TOML''s rules apply to the result: the top level must be a mapping and null values are dropped. A YAML document that is a list or a scalar at the top level produces no output.'
        - 'YAML''s implicit typing happens first: an unquoted true becomes a boolean and 1.10 a number before conversion. Quote values in the YAML to keep them as strings.'
        - 'Anchors, aliases and merge keys are expanded, so repeated data is written out in full in the TOML.'
        - 'Comments are not carried over.'
      faq:
        - q: 'The error says my JSON is not valid, but I pasted YAML?'
          a: 'The message is generic: it means the YAML could not be parsed. If the YAML is valid but the output stays empty, the document is probably a list or a scalar at the top level, which TOML cannot represent.'
        - q: 'Why are some keys missing from the TOML?'
          a: 'Keys whose value was null (or an empty value in YAML, which parses to null) are omitted because TOML cannot represent null.'

  mac-address-generator:
    title: MAC address generator
    description: Enter the quantity and prefix. MAC addresses will be generated in your chosen case (uppercase or lowercase)
    guide:
      intro: 'Generates random MAC addresses, optionally starting with a prefix you choose, in upper or lower case and with the separator you need (colon, hyphen, dot or none). Up to 100 addresses at a time.'
      useCases:
        - 'Assigning addresses to virtual machines, containers or network simulators.'
        - 'Creating test data for inventory systems, DHCP configurations or parsers.'
        - 'Producing addresses within a given vendor prefix (OUI) for lab equipment.'
      steps:
        - 'Set the quantity (1 to 100) and, if needed, a prefix such as 64:16:7F.'
        - 'Choose upper or lower case and the separator.'
        - 'Copy the generated list, or refresh for a new one.'
      notes:
        - 'The prefix can be given with any separator or none; it is normalised and the remaining bytes are filled randomly. A full 6-byte prefix yields that exact address.'
        - 'Without a prefix the first byte is fully random, so some addresses will be multicast (first byte odd) or marked as locally administered. For a unicast address that cannot clash with a real vendor, set a prefix whose second hex digit is 2, 6, A or E, for example 02:00:00.'
        - 'Randomness is not cryptographic here, which is fine for test data but not for anything security-sensitive.'
        - 'Quantity, prefix and separator are remembered in this browser.'
      faq:
        - q: 'Why does my hypervisor reject a generated address?'
          a: 'Many hypervisors require a unicast, locally administered address and refuse multicast ones. Use a prefix such as 02:xx:xx or the vendor range your hypervisor documents (for example 52:54:00 for QEMU/KVM or 00:50:56 for VMware).'
        - q: 'What do the separators mean?'
          a: 'Nothing technically; they are display conventions. Colons are usual on Linux and macOS, hyphens on Windows, and dotted groups of four digits (0000.0000.0000) on Cisco equipment.'

  json-diff:
    title: JSON diff
    description: Compare two JSON objects and get the differences between them.
    guide:
      intro: 'Compares two JSON documents and shows what was added, removed or changed, as a tree with colour coding. Both inputs accept relaxed JSON5, so comments and trailing commas do not get in the way.'
      useCases:
        - 'Comparing an API response before and after a deploy to see exactly which fields changed.'
        - 'Reviewing two versions of a configuration file without relying on line-by-line text diffs.'
        - 'Checking that a serializer or migration produced the same data as the original.'
      steps:
        - 'Paste the original JSON into the first field.'
        - 'Paste the JSON to compare into the second field.'
        - 'Read the tree below: added, removed and changed entries are highlighted, and unchanged ones are shown for context.'
      notes:
        - 'Objects are compared key by key, so the order of keys does not matter and reordering alone is not reported as a change.'
        - 'Arrays are compared by position. Inserting an item at the start shifts everything after it, so many entries may show as changed. Sort or key the arrays first when order is not meaningful.'
        - 'A value whose type changes (for example the number 1 to the string "1") is reported as a change.'
        - 'If either side is not valid JSON, the field shows an error and no comparison is made.'
      faq:
        - q: 'How is this different from a normal text diff?'
          a: 'A text diff compares lines, so reformatting or reordering keys produces a lot of noise. This tool compares the parsed data, so only real differences in keys, values and types appear.'
        - q: 'Can it ignore certain fields such as timestamps?'
          a: 'Not at the moment. Remove those fields from both inputs before comparing.'

  jwt-parser:
    title: JWT parser
    description: Parse and decode your JSON Web Token (jwt) and display its content.
    guide:
      intro: 'A JSON Web Token (JWT) is three Base64URL-encoded parts joined by dots: a header, a payload of claims, and a signature. This tool decodes the header and payload so you can read them, and shows what each standard claim means.'
      useCases:
        - 'Checking why an API returns 401: is the token expired, issued for another audience, or missing the scope you expected?'
        - 'Inspecting the tokens your login flow hands out to see which claims (sub, roles, tenant) the backend actually receives.'
        - 'Reading the iat, nbf and exp claims as dates instead of Unix timestamps while debugging clock-skew problems.'
      steps:
        - 'Paste the whole token (the three dot-separated parts) into the field.'
        - 'Read the header to see the signing algorithm (alg) and token type.'
        - 'Read the payload; exp, nbf and iat are also shown as local dates next to the raw number.'
      notes:
        - 'This tool only decodes. It does not verify the signature, so a readable token is not proof that it is genuine. Verify signatures on your server, or use the JWT signer tool here.'
        - 'The payload is encoded, not encrypted: anyone who holds the token can read it. Never put passwords or other secrets in claims.'
        - 'Decoding happens in your browser and the token is not sent anywhere. Even so, treat a live production token like a password and prefer expired or test tokens when you can.'
        - 'Dates are shown in your device''s time zone, while exp and iat are always UTC-based Unix seconds.'
      faq:
        - q: 'Why does my token fail to decode?'
          a: 'A valid JWT has exactly three dot-separated parts and each of the first two must be Base64URL-encoded JSON. Common causes are a leftover "Bearer " prefix, a truncated copy, or an opaque token (such as a random string) that is not a JWT at all.'
        - q: 'Is it safe to paste a token here?'
          a: 'The decoding runs locally in the page and nothing is uploaded. If the token is still valid, it can be used by anyone who sees it, so avoid pasting it into screenshots, chats or any site that sends data to a server.'

  timestamp-batch-converter:
    title: Timestamp batch converter
    description: Convert many Unix timestamps at once into the timezone and format you need.
    input: Your timestamps
    inputPlaceholder: 'One per line, or separated by commas, semicolons or tabs...'
    output: Converted timestamps
    unit: Unit
    format: Format
    timezone: Timezone
    result: 'Results ({valid} of {total} valid)'
    units:
      auto: Detect automatically
      seconds: Seconds
      milliseconds: Milliseconds
      microseconds: Microseconds
      nanoseconds: Nanoseconds
    formats:
      iso8601: ISO 8601
      iso9075: 'ISO 9075 (yyyy-MM-dd HH:mm:ss)'
      dateOnly: Date only
      timeOnly: Time only
      verbose: With weekday and zone
    columns:
      input: Input
      unit: Unit
      result: 'Result ({timezone})'
    errors:
      notANumber: Not a number
      outOfRange: Out of range
    guide:
      intro: 'Converts many Unix timestamps at once. Paste a column from a log, a database export or a spreadsheet and get readable dates in the timezone and format you choose, with invalid lines flagged individually.'
      useCases:
        - 'Reading a list of epoch values from application logs or an API response without converting them one by one.'
        - 'Checking which timestamps in a database export fall in a given day once you view them in your own timezone.'
        - 'Producing ISO 8601 strings from numeric timestamps to paste into a ticket, a test fixture or a report.'
      steps:
        - 'Paste the timestamps, one per line or separated by commas, semicolons or tabs.'
        - 'Leave the unit on automatic detection, or pick seconds, milliseconds, microseconds or nanoseconds.'
        - 'Choose the output format and the timezone, then read or copy the results table.'
      notes:
        - 'Automatic detection looks at the number of digits: up to 11 digits is read as seconds, 12 to 14 as milliseconds, 15 to 17 as microseconds and more as nanoseconds. A small millisecond value, such as one from 1970, looks like seconds, so set the unit by hand when you know it.'
        - 'Fractional values such as 1700000000.5 and negative values (dates before 1970) are accepted.'
        - 'A Unix timestamp has no timezone of its own. The timezone you select only changes how the moment is displayed, not which moment it is.'
        - 'Lines that are not numbers, or that fall outside the range JavaScript dates can represent, are marked with an error while the other lines are still converted.'
      faq:
        - q: 'Why does my timestamp show a date in 1970?'
          a: 'The value is probably in milliseconds or microseconds but was read as seconds, or the other way around. Set the unit explicitly instead of using automatic detection.'
        - q: 'Is there a limit on how many I can paste?'
          a: 'There is no fixed limit. Conversion runs in your browser, so a few thousand lines are instant, while a very large paste depends on your device.'

  date-calculator:
    title: 'Date calculator'
    description: 'Count the days between two dates, or add and subtract days from a date. Exclude chosen weekdays and Taiwan public holidays to count working days.'
    modes:
      count: 'Days between'
      add: 'Add days'
      subtract: 'Subtract days'
    startDate: 'Start date'
    endDate: 'End date'
    today: 'Today'
    pickDate: 'Pick a date'
    daysToAdd: 'Days to add'
    daysToSubtract: 'Days to subtract'
    settings: 'Settings'
    includeEnd: 'Include the end date'
    exclude: 'Exclude'
    workdaysPreset: 'Working days only'
    clearExclusions: 'Clear'
    excludeHolidays: 'Exclude Taiwan public holidays'
    holidaysHint: 'Based on the official Taiwan government office calendar ({first}–{last}), including substitute days off. Saturdays declared as working days count as working days.'
    calculate: 'Calculate'
    weekdays:
      mon: 'Monday'
      tue: 'Tuesday'
      wed: 'Wednesday'
      thu: 'Thursday'
      fri: 'Friday'
      sat: 'Saturday'
      sun: 'Sunday'
    errors:
      startDate: 'Pick a start date.'
      endDate: 'Pick an end date.'
      amount: 'Enter a number of days.'
      allExcluded: 'Every day of the week is excluded, so no day can be counted.'
    result:
      days: 'Days between'
      countedDays: 'Days after exclusions'
      daysValue: '{count} days'
      reversed: 'The end date is before the start date, so the result is negative.'
      calendarDays: '{count} calendar days'
      excludedPrefix: ', {count} excluded: '
      excludedWeekday: '{count} × {weekday}'
      excludedHolidays: '{count} × public holiday'
      separator: ', '
      weeks: 'That is {weeks} weeks and {days} days'
      calendarDifference: 'The dates are {value} apart'
      unitSeparator: ', '
      units:
        years: '{count} years'
        months: '{count} months'
        days: '{count} days'
      date: 'Resulting date'
      shiftedAfter: 'Day number {count} counted after the start date, {calendarDays} calendar days later'
      shiftedBefore: 'Day number {count} counted before the start date, {calendarDays} calendar days earlier'
      skippedPrefix: '{count} days skipped: '
      holidaysInRange: 'Public holidays in this period'
      missingHolidayYears: 'There is no public holiday data for {years} yet (currently {first}–{last}), so holidays in those years are not excluded.'
    guide:
      intro: 'The date calculator works three ways: it counts the days between two dates, and it moves forward or backward from a date by a number of days. You can exclude chosen weekdays and, based on the official calendar published by Taiwan''s Directorate-General of Personnel Administration, Taiwan public holidays and substitute days off, which gives you working days directly.'
      useCases:
        - 'Find how many days a contract, lease or probation period lasts, or how many are left.'
        - 'A letter, regulation or contract says "within 10 working days" and you need the actual deadline.'
        - 'Project planning: count 30 working days forward from the start date, skipping weekends, Lunar New Year and long weekends.'
        - 'Working backwards: an internal review must be done 5 working days before the submission date, so find the latest day to send it for review.'
      steps:
        - 'Choose a mode at the top: "Days between", "Add days" or "Subtract days".'
        - 'Pick the start date ("Today" fills it in). To count days, pick the end date too; to add or subtract, enter the number of days.'
        - 'In "Settings", tick the weekdays and holidays to exclude. "Working days only" ticks Saturday, Sunday and public holidays in one go.'
        - 'Click "Calculate". The result lists what was excluded and the public holidays in the period, and it updates as you change the dates or settings.'
      notes:
        - 'When counting days, the end date itself is not counted by default, so 1 January to 31 January is 30 days. Tick "Include the end date" to count it too.'
        - 'When adding or subtracting, the start date itself is not counted: adding 1 working day to a Friday gives the following Monday.'
        - 'With Saturday, Sunday and public holidays excluded, Saturdays the government declared working days are counted, so the result matches the official working days.'
        - 'The years covered by the holiday data are shown under "Exclude Taiwan public holidays". The government publishes the next year''s calendar around June and the data is updated then; years outside the range show a warning.'
        - 'Public holidays here are days off for government offices. Private companies, schools and some trades (Labour Day is a day off for workers only, for example) may differ, so check important deadlines against the competent authority or the contract.'
      faq:
        - q: 'Why is 1 to 31 January 30 days and not 31?'
          a: 'The number of days between two dates does not include the end date, like most calendars and spreadsheets. To count every day from the first to the last, tick "Include the end date" and the result becomes 31.'
        - q: 'How are working days counted?'
          a: '"Working days only" excludes Saturdays, Sundays and public holidays (including substitute days off) and counts Saturdays declared as working days. Over a full year it gives exactly the working days of the official government calendar.'
        - q: 'Are typhoon days included?'
          a: 'No. Typhoon days off are announced by each city or county at short notice and cannot be known in advance; subtract them yourself if there were any.'
        - q: 'Can it count other countries'' holidays?'
          a: 'Only Taiwan public holidays are built in. For other countries, use the weekday exclusions and subtract local holidays yourself.'

  date-converter:
    title: Date-time converter
    description: Convert date and time into the various different formats
    timezone: Timezone
    guide:
      intro: 'The same instant is written differently across systems: Unix timestamps, ISO 8601, RFC 3339, Excel serial numbers, MongoDB ObjectIDs. This tool detects what you paste in and prints every common format at once, in the timezone you choose.'
      useCases:
        - 'Seeing a bare number in a log line or an API response and wanting to know what time it represents.'
        - 'Needing a specific format to write into a config file or a database.'
        - 'Working across timezones and wanting to know what a given instant is for the other side.'
        - 'Recovering dates from an Excel export where they turned into decimal numbers.'
      steps:
        - 'Paste the value into the input; the format is detected and the selector switches automatically.'
        - 'If detection gets it wrong, pick the input format manually in the selector on the right.'
        - 'Choose a timezone; every output is converted accordingly.'
        - 'Use the copy icon next to a field to take the result.'
      notes:
        - 'An input without an offset (for example 2023-04-12 23:10:24) is read in the timezone you selected. An input with an offset (ending in Z or +08:00) keeps that offset and ignores the selector.'
        - 'Unix timestamps come in seconds and milliseconds; ten digits is usually seconds, thirteen is milliseconds. The tool decides from the digit count.'
        - 'The Excel serial value counts days since 1900, and the fractional part is the time of day.'
      faq:
        - q: 'What if I need to convert many timestamps at once?'
          a: 'Use the timestamp batch converter, which takes many values at once and prints them as a table.'
        - q: 'What is the difference between ISO 8601 and RFC 3339?'
          a: 'RFC 3339 is effectively a strict subset of ISO 8601: it requires a T between date and time and always requires a timezone offset. For APIs and config files, RFC 3339 is the safer choice.'

  phone-parser-and-formatter:
    title: Phone parser and formatter
    description: Parse, validate and format phone numbers. Get information about the phone number, like the country code, type, etc.
    guide:
      intro: 'Parses a phone number with Google''s libphonenumber rules: tells you the country and calling code, whether the number is valid or merely possible, its type (mobile, fixed line, toll-free...), and formats it in international, national, E.164 and RFC 3966 styles.'
      useCases:
        - 'Normalising phone numbers collected from a form into E.164 (+886912345678) before storing them.'
        - 'Checking whether a number is valid for its country and whether it is a mobile that can receive SMS.'
        - 'Formatting a number for display in the local or international convention.'
      steps:
        - 'Choose the default country, used when the number has no + prefix; it is preselected from your browser language.'
        - 'Type the number in any common form (spaces, dashes, parentheses, leading 0 or +).'
        - 'Read the country, validity, type and the four formats, and copy the one you need.'
      notes:
        - 'Possible means the length fits the country''s patterns; valid means the number matches an actually assigned range. Store E.164 only for valid numbers.'
        - 'A number without + is interpreted in the default country, so 0912 345 678 is Taiwanese with Taiwan selected and invalid with another country selected.'
        - 'Type detection (mobile versus fixed line) is reliable in most countries but ambiguous in some, notably the United States, where both share the same ranges.'
        - 'Numbering plans change; the library is updated regularly but a brand-new range may be reported as invalid for a while.'
      faq:
        - q: 'Which format should I store in a database?'
          a: 'E.164: a plus sign, the country code and the national number with no spaces (+886912345678). It is unambiguous and what SMS and telephony APIs expect.'
        - q: 'Why is a number I can call reported as invalid?'
          a: 'Either the default country is wrong for a number without +, or the number belongs to a range the library does not yet know. Try adding the country code with + to rule out the first cause.'

  ipv4-subnet-calculator:
    title: IPv4 subnet calculator
    description: Parse your IPv4 CIDR blocks and get all the info you need about your subnet.
    guide:
      intro: 'Enter an IPv4 address with a mask (CIDR such as 192.168.0.1/24, or a netmask) and get the network address, mask, wildcard, first and last usable address, broadcast address and number of addresses. It also shows the address class.'
      useCases:
        - 'Planning how to split a network into subnets and checking that two ranges do not overlap.'
        - 'Working out which range a CIDR block in a cloud security group or firewall rule really covers.'
        - 'Finding the network and broadcast address of a host, or converting between /24 and 255.255.255.0 notation.'
      steps:
        - 'Type an address with a mask, for example 10.0.0.0/22.'
        - 'Read the table: network address, netmask in dotted and binary form, wildcard mask, network size, first and last address, broadcast address and IP class.'
        - 'Use the previous and next buttons to move to the neighbouring block of the same size.'
      notes:
        - '"Network size" is the total number of addresses in the block. In a normal subnet, the first (network) and last (broadcast) addresses cannot be given to hosts, so the usable host count is the size minus 2.'
        - '"First address" and "last address" are the first and last usable host addresses, so they differ from the network and broadcast addresses.'
        - '/31 and /32 blocks have no broadcast address, so the field reports that none exists. A /31 is used for point-to-point links and a /32 identifies a single host.'
        - 'The wildcard mask is the netmask inverted, as used in some router access lists such as Cisco ACLs.'
      faq:
        - q: 'How many hosts fit in a /24?'
          a: 'A /24 holds 256 addresses, of which 254 are usable by hosts. Each step shorter in the prefix doubles the size, so a /23 has 512 addresses.'
        - q: 'Does this support IPv6?'
          a: 'No. This calculator is for IPv4 only.'

  og-meta-generator:
    title: Open graph meta generator
    description: Generate open-graph and socials HTML meta tags for your website.
    guide:
      intro: 'Generates the Open Graph and Twitter Card meta tags that control how a page looks when shared on social networks and in chat apps: title, description, image, URL, page type and the type-specific fields for articles, books, profiles, music and video.'
      useCases:
        - 'Adding share previews to a new website, landing page or blog.'
        - 'Fixing a link that shows no image or the wrong title when pasted into Slack, Facebook, X or LINE.'
        - 'Producing the right tags for an article (author, publish date) or a video page.'
      steps:
        - 'Choose the page type and fill in the title, description, URL and image.'
        - 'Fill in the type-specific fields and the Twitter card settings if you want them.'
        - 'Copy the generated tags into the <head> of your page.'
      notes:
        - 'Use an absolute URL for og:image (https://...), and an image of at least 1200×630 pixels for large previews. Many platforms reject relative paths and small images.'
        - 'Platforms cache previews aggressively. After changing tags, use their debug tools (Facebook Sharing Debugger, LinkedIn Post Inspector, X Card Validator) to refresh the cache.'
        - 'Tags must be in the HTML served to crawlers. Pages that only add them with JavaScript after loading are usually not read by social scrapers.'
        - 'Keep og:title under about 60 characters and og:description under about 160, as longer values are truncated in previews.'
      faq:
        - q: 'Why does my link preview not update after I changed the tags?'
          a: 'The platform cached the old version. Run the URL through the platform''s sharing debugger to force a re-scrape, or append a query parameter to the URL as a last resort.'
        - q: 'Do I need both Open Graph and Twitter tags?'
          a: 'X falls back to Open Graph tags when Twitter tags are missing, but twitter:card is needed to get the large-image layout. Most sites include both sets.'

  ipv6-ula-generator:
    title: IPv6 ULA generator
    description: Generate your own local, non-routable IP addresses for your network according to RFC4193.
    guide:
      intro: 'Generates an IPv6 Unique Local Address prefix (fd00::/8) following RFC 4193: a pseudo-random 40-bit global ID derived from a MAC address and the current time, giving you a /48 prefix for your private network plus its first and last /64 subnets.'
      useCases:
        - 'Choosing an internal IPv6 prefix for a home lab, office LAN, VPN or container network that does not need to be routable on the internet.'
        - 'Avoiding the collisions that fd00::/48 or fd00:1::/64 cause when two private networks are later joined by a VPN.'
        - 'Learning how ULA prefixes are structured.'
      steps:
        - 'Enter a MAC address of one of your network interfaces; any valid MAC works and it only seeds the random part.'
        - 'Read the /48 prefix (IPv6 ULA) and the first and last /64 blocks you can carve out of it.'
        - 'Copy the prefix and record it; the result changes on every refresh, so do not expect to regenerate the same one.'
      notes:
        - 'The global ID is a hash of the MAC address and the current timestamp, as RFC 4193 recommends, so each generation gives a new prefix. Save the one you decide to use.'
        - 'A /48 contains 65536 /64 subnets, from xxxx:0::/64 to xxxx:ffff::/64. Each LAN segment normally gets one /64.'
        - 'ULAs are private, like 10.0.0.0/8 in IPv4, but they are not meant to be NATed; hosts use them alongside a global address, and a random prefix keeps the two networks distinct when merged.'
        - 'fc00::/8, the other half of the ULA space, is reserved for a centrally assigned scheme that was never deployed, so generated prefixes always start with fd.'
      faq:
        - q: 'Can I just use fd00::/48?'
          a: 'It works, but everyone who takes that shortcut picks the same prefix, so two such networks collide as soon as they are connected. A random global ID is the whole point of RFC 4193.'
        - q: 'Is the generated prefix guaranteed unique?'
          a: 'Not guaranteed, but with 40 random bits the chance that two independently generated prefixes collide is negligible for any realistic number of networks.'

  hash-text:
    title: Hash text
    description: 'Hash a text string using the function you need : MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 or RIPEMD160'
    file:
      title: Hash a file
      upload: Drag and drop files here, or click to select files
      algorithms: Algorithms
      compare: Compare with
      comparePlaceholder: Paste an expected hash to verify the file...
      match: 'Matches {algorithm}'
      mismatch: No computed hash matches
      hashing: Hashing...
      clear: Clear files
      privacy: Files are hashed in your browser and never uploaded.
      error: Unable to read this file.
    guide:
      intro: 'A hash function turns data of any length into a fixed-length fingerprint. The same input always gives the same result, and the original cannot be recovered from it. Hashes are mainly used to verify that a file or a piece of data has not changed.'
      useCases:
        - 'Comparing a downloaded file against the SHA-256 published by the vendor to confirm it is intact and not tampered with.'
        - 'Checking whether two seemingly identical files really hold the same bytes.'
        - 'Producing fixed-length identifiers during development, or normalising cache keys.'
      steps:
        - 'Paste text into the field at the top; all eight algorithms are computed as you type.'
        - 'Switch the digest encoding to get hexadecimal, Base64 or binary output.'
        - 'To hash a file, scroll to the file section, tick the algorithms you need and drop the file in.'
        - 'To verify a download, paste the published hash into the compare field; a match shows a green tag.'
      notes:
        - 'Files are hashed entirely in your browser, in streamed chunks, so nothing is uploaded and large files do not exhaust memory.'
        - 'MD5 and SHA-1 have practical collision attacks and should not be used for security. They are still fine for detecting accidental corruption.'
        - 'The "SHA3" row here is actually Keccak-512, the pre-NIST variant, so it does not match the sha3sum command. Do not use it when you need standard SHA3-512.'
        - 'Hashing is not encryption: there is no key and nothing to reverse. Use bcrypt for passwords and the encryption tool to encrypt text.'
      faq:
        - q: 'Why does the same file give a different SHA-256 elsewhere?'
          a: 'It should not. A difference usually means the files differ (CRLF versus LF line endings, or an incomplete download), or that one side hashed the text rather than the raw bytes.'
        - q: 'Which algorithm should I pick?'
          a: 'SHA-256 is the general-purpose choice for file integrity. Use SHA-512 if you want a longer digest. Avoid MD5 and SHA-1 for anything security related.'

  json-to-toml:
    title: JSON to TOML
    description: Parse and convert JSON to TOML.
    guide:
      intro: 'Converts JSON into TOML, the configuration format used by Cargo (Rust), pyproject.toml (Python), Hugo and many CLI tools. Objects become tables, arrays of objects become arrays of tables.'
      useCases:
        - 'Writing a pyproject.toml or Cargo.toml section from data you already have as JSON.'
        - 'Translating a JSON configuration into TOML for a tool that only reads TOML.'
        - 'Learning TOML syntax by seeing how a familiar JSON structure is expressed.'
      steps:
        - 'Paste JSON (JSON5 syntax is accepted) into the left field.'
        - 'Read the TOML on the right.'
        - 'Copy the result.'
      notes:
        - 'The top level must be an object. TOML has no way to represent a bare array or scalar as a whole document, so those inputs produce no output.'
        - 'Arrays mixing types (numbers and strings, for example) are written as inline arrays, which TOML 1.0 allows; older TOML parsers that still require a single type per array may reject them.'
        - 'null has no TOML equivalent; keys with a null value are omitted from the output.'
        - 'Nested objects are written as [table] and [table.sub] headers, and arrays of objects as [[array]] entries, which is the idiomatic TOML layout.'
      faq:
        - q: 'Why does the conversion fail on valid JSON?'
          a: 'TOML is stricter than JSON: the document must be an object and null does not exist. A top-level array or scalar gives no output, and null keys silently disappear.'
        - q: 'Where did my key with a null value go?'
          a: 'It was dropped, because TOML cannot express null. Use an empty string, a sentinel value, or simply omit the key in the consuming program.'

  device-information:
    title: Device information
    description: Get information about your current device (screen size, pixel-ratio, user agent, ...)
    guide:
      intro: 'Shows what the browser knows about the device it runs on: screen size, orientation, colour depth, pixel ratio, window size, browser vendor, languages, platform and User-Agent string.'
      useCases:
        - 'Telling support which screen size, pixel ratio and browser you have when reporting a display bug.'
        - 'Checking the CSS pixel dimensions of a phone or tablet while designing responsive layouts.'
        - 'Confirming the languages your browser sends to websites, which decide their default language.'
      steps:
        - 'Open the page on the device you want to inspect.'
        - 'Read the values; resize or rotate the device and watch them update.'
        - 'Copy any value with its copy button.'
      notes:
        - 'Screen and window sizes are in CSS pixels, not physical pixels. Multiply by the pixel ratio for the physical resolution: a phone showing 390×844 at ratio 3 has a 1170×2532 screen.'
        - 'Window size is the viewport available to the page and shrinks when the address bar, developer tools or a side panel are visible.'
        - 'The User-Agent string is partly frozen in modern Chrome, so OS and device details are deliberately coarse; use the User-Agent parser tool to decode it.'
        - 'Everything shown is already available to any website you visit; this page just displays it and sends nothing anywhere.'
      faq:
        - q: 'Why does the screen size not match my monitor''s resolution?'
          a: 'Browsers report CSS pixels, which are scaled by the operating system''s display scaling and the browser zoom. A 4K monitor at 200% scaling reports 1920×1080 with a pixel ratio of 2.'
        - q: 'What is the pixel ratio used for?'
          a: 'It tells a site how many physical pixels make one CSS pixel, so it can serve sharper images (srcset, 2x assets) on high-density screens.'

  pdf-signature-checker:
    title: PDF signature checker
    description: Verify the signatures of a PDF file. A signed PDF file contains one or more signatures that may be used to determine whether the contents of the file have been altered since the file was signed.
    guide:
      intro: 'Reads the digital signatures embedded in a PDF and shows, for each one, whether the document is unchanged since signing and who signed it: the signer''s certificate details (name, organisation, country) and its validity period. The file is parsed in your browser.'
      useCases:
        - 'Checking that a signed contract, invoice or official document has not been altered after signing.'
        - 'Seeing who signed a PDF and whether their certificate was valid at the time.'
        - 'Confirming that a document you signed actually contains the signature before sending it.'
      steps:
        - 'Drop the PDF onto the upload area or click to select it.'
        - 'Each signature is listed with its verification result.'
        - 'Expand a signature for the certificate details.'
      notes:
        - 'Integrity verified means the signed byte range still matches the signature. If the document was modified afterwards without a new signature, the check fails.'
        - 'The tool validates the signature mathematically, but it does not check the certificate chain against trusted roots or revocation lists like Adobe Reader does. A verified signature from an unknown or self-signed certificate still proves integrity, not identity.'
        - 'Some PDFs use visible signature images that are just pictures with no cryptographic signature; those are reported as no signatures found.'
        - 'Nothing is uploaded; the PDF stays on your device.'
      faq:
        - q: 'Why does it say no signatures were found?'
          a: 'The PDF either has no digital signature (a scanned or drawn signature is just an image) or uses a signature format the parser does not understand. Open it in a PDF reader to see its signature panel.'
        - q: 'Is a verified signature enough to trust the document?'
          a: 'It proves the content is unchanged and tied to the shown certificate. To trust the identity, confirm that the certificate was issued by an authority you recognise, which this tool does not do.'

  json-minify:
    title: JSON minify
    description: Minify and compress your JSON by removing unnecessary whitespace.
    guide:
      intro: 'Removes all unnecessary whitespace from JSON, producing the smallest equivalent text on a single line. Comments and trailing commas in JSON5 input are stripped too, so the output is always standard JSON.'
      useCases:
        - 'Shrinking a JSON payload before embedding it in a URL, an HTML attribute or a configuration string.'
        - 'Converting a commented JSON5 config into the strict JSON a parser demands.'
        - 'Putting a JSON document on one line for a log entry, an environment variable or a curl command.'
      steps:
        - 'Paste the JSON into the left field; JSON5 syntax with comments is accepted.'
        - 'Read the single-line result on the right.'
        - 'Copy it.'
      notes:
        - 'Only whitespace outside of strings is removed. Spaces and line breaks inside string values are kept, because they are part of the data.'
        - 'The input is parsed and re-serialised, so comments disappear, duplicate keys keep only the last value, and numbers are normalised (1.0 becomes 1, 1e3 becomes 1000).'
        - 'Minifying typically saves 20 to 40 percent on indented JSON. For real bandwidth savings, gzip or brotli compression on the server matters far more.'
        - 'Invalid input shows an error and no output.'
      faq:
        - q: 'Why did 1.0 become 1?'
          a: 'JSON numbers have no formatting; 1.0 and 1 are the same value, and the serialiser writes the shortest form. If the distinction matters, store the value as a string.'
        - q: 'How do I make it readable again?'
          a: 'Use the JSON prettify and format tool, which indents the same data back into a multi-line layout.'

  ulid-generator:
    title: ULID generator
    description: Generate random Universally Unique Lexicographically Sortable Identifier (ULID).
    guide:
      intro: 'Generates ULIDs (Universally Unique Lexicographically Sortable Identifiers): 26-character identifiers that start with a timestamp, so they sort by creation time, followed by 80 bits of randomness. Output as plain lines or as a JSON array.'
      useCases:
        - 'Primary keys or object ids that must be unique and sort chronologically, such as events, orders or log entries.'
        - 'Replacing UUID v4 where index locality and readable, URL-safe ids matter.'
        - 'Generating test fixtures with realistic, ordered identifiers.'
      steps:
        - 'Set how many ULIDs you need (1 to 100).'
        - 'Choose raw lines or a JSON array.'
        - 'Copy the result, or refresh (Ctrl+Enter) for a new batch.'
      notes:
        - 'The first 10 characters encode the millisecond timestamp, the last 16 are random. ULIDs created in the same millisecond are made monotonic (the random part is incremented) so they still sort in creation order.'
        - 'ULIDs use Crockford''s Base32 alphabet, which omits I, L, O and U to avoid confusion; they are case-insensitive and safe in URLs.'
        - 'Because the timestamp is visible, a ULID reveals roughly when the record was created. If that is sensitive, use UUID v4 instead.'
        - 'A ULID is 128 bits, the same size as a UUID, and can be stored in a UUID column by converting its bits; many databases and libraries support this.'
      faq:
        - q: 'ULID or UUID v7?'
          a: 'Both are time-ordered 128-bit ids. UUID v7 is the newer standard with native support in more databases and libraries; ULID has a shorter, friendlier text form. Pick whichever your stack supports best.'
        - q: 'Why do consecutive ULIDs differ only in the last characters?'
          a: 'They were generated in the same millisecond, so the timestamp part is identical and the random part is incremented to keep them sortable. This is by design.'

  string-obfuscator:
    title: String obfuscator
    description: Obfuscate a string (like a secret, an IBAN, or a token) to make it shareable and identifiable without revealing its content.
    guide:
      intro: 'Masks the middle of a string with asterisks while keeping a few characters at the start and end visible, so a secret, token, IBAN or card number can be shared or shown in a screenshot and still be recognised without being usable.'
      useCases:
        - 'Pasting an API key or token into a bug report, a ticket or a chat so the reader can identify which key it is without seeing it.'
        - 'Showing a partially hidden IBAN, card number or phone number in a UI or a screenshot.'
        - 'Logging an identifier without writing the full secret to the log.'
      steps:
        - 'Paste the string.'
        - 'Choose how many characters to keep at the start and at the end, and whether spaces stay visible.'
        - 'Copy the masked result.'
      notes:
        - 'Every character between the kept parts becomes an asterisk, so the length of the original is still visible. Keep that in mind if the length itself is sensitive.'
        - 'Keeping spaces makes grouped numbers (IBANs, card numbers) easier to read while still hiding the digits.'
        - 'The more characters you keep, the easier the secret is to guess or match against leaks. For API keys, a few leading characters are usually enough to identify them.'
        - 'This is a display aid, not a security control. The masking is done in your browser and nothing is sent anywhere, but anyone with the original string can of course still use it.'
      faq:
        - q: 'Can the masked string be reversed?'
          a: 'No, the hidden characters are replaced and not recoverable from the output. That is why you should keep the original somewhere safe if you still need it.'
        - q: 'How much should I keep visible for a credit card number?'
          a: 'Industry practice (PCI DSS) allows at most the first six and last four digits to be shown; most receipts show only the last four.'

  base-converter:
    title: Integer base converter
    description: Convert a number between different bases (decimal, hexadecimal, binary, octal, base64, ...)
    guide:
      intro: 'Converts an integer between number bases from 2 to 64: binary, octal, decimal, hexadecimal, base64-style digits and anything in between. Handles numbers far beyond 64 bits without losing precision.'
      useCases:
        - 'Reading a hexadecimal or binary constant from code, a register map or a packet dump as a decimal.'
        - 'Writing a decimal value as hex for a colour, a memory address or a bitmask.'
        - 'Checking file permissions or flags in octal and binary side by side.'
      steps:
        - 'Type the number and set the base it is written in (2 to 64).'
        - 'Read it in binary, octal, decimal and hexadecimal at once.'
        - 'Set a custom output base at the bottom for anything else, for example base 36 or 58.'
      notes:
        - 'Digits are 0-9, then a-z, then A-Z, then + and /, in that order. So bases above 10 use lowercase letters first (hex a-f), and bases above 36 are case-sensitive, where a and A are different digits.'
        - 'The custom base 64 here is positional (a true base-64 number), not the Base64 text encoding used for files and strings. Use the Base64 tools for that.'
        - 'Only non-negative integers are supported: no minus sign, decimal point or prefixes such as 0x or 0b. Strip the prefix before pasting.'
        - 'Arithmetic uses arbitrary-precision integers, so 128-bit values and longer convert exactly.'
      faq:
        - q: 'Why is my hexadecimal input rejected?'
          a: 'Probably because of uppercase letters or a 0x prefix. Hex digits must be lowercase a-f here (uppercase letters are digits of bases above 36), and the prefix must be removed.'
        - q: 'What is base 36 or base 58 used for?'
          a: 'Base 36 (0-9, a-z) gives compact, case-insensitive identifiers such as short URLs. Base 58 is used by Bitcoin addresses, although Bitcoin''s alphabet differs from the one here, so results are not interchangeable.'

  yaml-to-json-converter:
    title: YAML to JSON converter
    description: Simply convert YAML to JSON with this online live converter.
    guide:
      intro: 'Parses a YAML document and outputs the same data as indented JSON. Useful for feeding configuration files to tools and APIs that only speak JSON, or for checking exactly how a YAML file is interpreted.'
      useCases:
        - 'Converting a Kubernetes manifest, a Compose file or a CI workflow into JSON for an API call or a script.'
        - 'Seeing how YAML''s implicit typing read your values: which ones became numbers, booleans or null.'
        - 'Finding indentation mistakes in a YAML file, since invalid YAML is flagged with an error.'
      steps:
        - 'Paste the YAML into the left field.'
        - 'Read the JSON on the right, indented with three spaces.'
        - 'Copy the result with the copy button.'
      notes:
        - 'YAML types values implicitly: unquoted true and false become booleans, 1.10 becomes the number 1.1, and an empty value or ~ becomes null. This parser follows YAML 1.2, so yes, no, on and off stay strings. If a value came out as the wrong type, quote it in the YAML.'
        - 'Merge keys (<<: *defaults) are resolved, and anchors and aliases are expanded, so the JSON contains the merged, duplicated data.'
        - 'Multi-document files (sections separated by ---) are rejected with an error; convert one document at a time.'
        - 'Comments are lost, because JSON has no comments.'
      faq:
        - q: 'Why did my version number 1.10 become 1.1?'
          a: 'Unquoted 1.10 is a floating-point number in YAML, and numbers do not keep trailing zeros. Write it as "1.10" with quotes to keep it a string.'
        - q: 'Why is the output empty with no error?'
          a: 'The YAML parsed to an empty value, for example a file with only comments. Make sure the document contains at least one key or list item.'

  uuid-generator:
    title: UUIDs generator
    description: A Universally Unique Identifier (UUID) is a 128-bit number used to identify information in computer systems. The number of possible UUIDs is 16^32, which is 2^128 or about 3.4x10^38 (which is a lot!).
    guide:
      intro: 'A UUID is a 128-bit identifier designed so that separate systems can each mint their own without coordination and still practically never collide. They are common as database keys, request identifiers and generated file names.'
      useCases:
        - 'Producing primary keys, especially when the ID must exist before the row is written.'
        - 'Generating request or trace identifiers so a single request can be followed across distributed logs.'
        - 'Creating temporary file names or upload identifiers that will not clash.'
      steps:
        - 'Choose the version you need; v4 is the default.'
        - 'Set how many you want; they are generated as you change the options.'
        - 'Press Ctrl+Enter to generate a fresh batch.'
      notes:
        - 'v4 is fully random and is the right default for almost every use.'
        - 'v1 embeds a timestamp and a network card address, so it sorts by time but leaks when and where it was generated.'
        - 'v7 also embeds a timestamp, but at the front, so lexicographic order matches time order. That is much friendlier to database indexes than v4 and is the current recommendation.'
        - 'Values come from the browser cryptographic random source; nothing is requested from a server.'
      faq:
        - q: 'Can UUIDs really never collide?'
          a: 'v4 carries 122 random bits. Even generating a billion per second, a collision would take decades of output to become likely, so in practice you can treat them as unique.'
        - q: 'Do UUID primary keys hurt database performance?'
          a: 'They can, especially v4. Random values make B-tree indexes split constantly, which costs write throughput and index size compared with an incrementing integer. Use v7 if this matters: its time prefix keeps new rows at the end of the index.'

  ipv4-address-converter:
    title: IPv4 address converter
    description: Convert an IP address into decimal, binary, hexadecimal, or even an IPv6 representation of it.
    guide:
      intro: 'Shows an IPv4 address in the other notations it can take: as a single decimal integer, in hexadecimal, in binary, and as an IPv4-mapped IPv6 address in both long and short form.'
      useCases:
        - 'Reading an address stored as an integer in a database or a log, or converting one to store it that way.'
        - 'Understanding how a subnet mask or address looks bit by bit.'
        - 'Writing the IPv6 form (::ffff:a.b.c.d) of an IPv4 address for a dual-stack configuration or firewall rule.'
      steps:
        - 'Type the address in dotted form, for example 192.168.1.1.'
        - 'Read the decimal, hexadecimal, binary and IPv6 forms, each with a copy button.'
        - 'An invalid address shows a validation message and empty results.'
      notes:
        - 'The decimal form is the four bytes read as one 32-bit number (a.b.c.d = a×16777216 + b×65536 + c×256 + d). Many databases store addresses this way because integers sort and compare faster.'
        - 'The binary form has 32 digits; reading it next to a netmask makes the network and host parts obvious.'
        - '::ffff:192.168.1.1 is an IPv4-mapped IPv6 address, the form in which dual-stack servers see IPv4 clients. It is the same host, not a different one.'
        - 'Leading zeros in the input (192.168.001.001) are not accepted, because some systems read them as octal.'
      faq:
        - q: 'Why does a browser accept http://3232235777 as an address?'
          a: 'That is the decimal form of 192.168.1.1. Browsers and many tools accept the integer notation, which is also why attackers use it to disguise addresses.'
        - q: 'Can I convert the other way, from a number to an address?'
          a: 'Not in this tool. Use the IPv4 range or subnet tools for address math, or convert the number to hexadecimal with the base converter and read it two digits per byte.'

  text-statistics:
    title: Text statistics
    description: Get information about a text, the number of characters, the number of words, its size in bytes, ...
    guide:
      intro: 'Counts the characters, words and lines of a text and shows its size in bytes when encoded as UTF-8, updating as you type.'
      useCases:
        - 'Checking a text against a length limit: a tweet, a meta description, a form field or a database column.'
        - 'Estimating the storage or payload size of a piece of content.'
        - 'Counting the words of an essay, an abstract or an answer with a word limit.'
      steps:
        - 'Paste or type the text.'
        - 'Read the four counters above the field.'
        - 'Edit the text and watch the numbers follow.'
      notes:
        - 'Character count is the number of UTF-16 code units, which is what JavaScript''s length reports. Most emoji and some rare characters count as 2, so the number can differ from what a platform shows.'
        - 'Byte size is the UTF-8 length: ASCII letters take 1 byte, most European accented letters 2, Chinese, Japanese and Korean characters 3, and emoji usually 4. A limit expressed in bytes (database columns, some APIs) therefore differs from a limit in characters.'
        - 'Words are counted by splitting on whitespace, which works for languages that separate words with spaces. Chinese and Japanese text without spaces counts as one word per line.'
        - 'Line count follows line breaks, so a long paragraph that wraps on screen is still one line.'
      faq:
        - q: 'Why does my emoji count as two characters?'
          a: 'Emoji outside the Basic Multilingual Plane are stored as two UTF-16 code units. Some platforms count them as one, others as two; this tool follows JavaScript, which counts two.'
        - q: 'Why is the byte size larger than the character count?'
          a: 'Any character outside plain ASCII takes more than one byte in UTF-8. Text with accents, CJK characters or emoji is therefore larger in bytes than in characters.'

  text-to-nato-alphabet:
    title: Text to NATO alphabet
    description: Transform text into the NATO phonetic alphabet for oral transmission.
    guide:
      intro: 'Spells out text letter by letter with the NATO phonetic alphabet (Alpha, Bravo, Charlie...), the standard used in aviation, radio and call centres so that letters are not confused when spoken aloud.'
      useCases:
        - 'Reading a booking reference, licence plate, serial number or password over the phone.'
        - 'Preparing a script for radio communication or a support call.'
        - 'Learning or checking the phonetic alphabet.'
      steps:
        - 'Type the text.'
        - 'Read the spelled-out version below, one word per letter.'
        - 'Copy it or read it aloud.'
      notes:
        - 'Only the 26 Latin letters are converted, case-insensitively. Digits, punctuation and other characters are left as they are, so 7 stays 7 and a space stays a space.'
        - 'In practice digits are read individually (seven, not seventy) and often with the aviation forms tree, fife and niner to avoid confusion; the tool does not change them.'
        - 'Accented letters (é, ü) are not converted; spell them with the base letter and mention the accent, or remove the accent first.'
        - 'This is the ICAO/NATO alphabet (Alfa, Juliett are the official spellings, pronounced the same). Other spelling alphabets exist, such as the LAPD or the German one, with different words.'
      faq:
        - q: 'Why does the output show my digits unchanged?'
          a: 'The NATO alphabet covers letters only. Read digits one at a time as you would normally; the tool leaves them in place so the sequence stays readable.'
        - q: 'Why Alpha and not A for apple?'
          a: 'Alpha, Bravo and the other words were chosen so that each is distinct in every major language and over poor audio. Ad hoc words such as apple or ice are more easily misheard.'

  basic-auth-generator:
    title: Basic auth generator
    description: Generate a base64 basic auth header from a username and password.
    guide:
      intro: 'Builds the Authorization header for HTTP Basic authentication from a username and password: the two are joined with a colon and Base64-encoded, giving Authorization: Basic dXNlcjpwYXNz.'
      useCases:
        - 'Calling an API or a protected endpoint with curl, Postman or a script that needs the raw header.'
        - 'Checking what a client sends when it uses Basic auth, for example to debug a 401.'
        - 'Configuring a webhook or an integration that only accepts a pre-built header.'
      steps:
        - 'Type the username and the password.'
        - 'Read the complete header line.'
        - 'Copy it into your request (for curl: -H "Authorization: Basic ...").'
      notes:
        - 'Base64 is encoding, not encryption. Anyone who sees the header can read the password, so Basic auth is only acceptable over HTTPS.'
        - 'The username cannot contain a colon, because the colon separates it from the password. Passwords may contain colons.'
        - 'Non-ASCII characters are encoded as UTF-8 before Base64, which is what modern servers expect; a few old systems expect Latin-1 and will reject such passwords.'
        - 'The computation happens in your browser; nothing is sent anywhere. Still, prefer test credentials when trying things out.'
      faq:
        - q: 'Why does the server still answer 401?'
          a: 'Check that the header reaches the server (proxies and some frameworks strip it), that the realm expects Basic rather than Bearer or Digest, and that the credentials are correct. Spaces or line breaks copied around the header are another frequent cause.'
        - q: 'Can I decode a header back to the credentials?'
          a: 'Yes: paste the part after Basic into the Base64 decoder tool. That is exactly why Basic auth must only be used over an encrypted connection.'

  text-to-unicode:
    title: Text to Unicode
    description: Parse and convert text to unicode and vice-versa
    guide:
      intro: 'Converts text into HTML numeric character references (&#72;&#105; for Hi) and back. This is one way to write any character in an HTML or XML document using only ASCII.'
      useCases:
        - 'Embedding special characters, symbols or non-Latin text in an HTML file or e-mail template that must stay pure ASCII.'
        - 'Decoding a string of &#...; references found in page source or a data export.'
        - 'Lightly obscuring an e-mail address in a web page so simple scrapers do not read it.'
      steps:
        - 'To encode, type text in the first field and read the &#...; sequence below it.'
        - 'To decode, paste a sequence of &#...; references in the second field and read the text.'
        - 'Copy the result.'
      notes:
        - 'Every character is encoded, including plain letters and spaces, so the output is much longer than the input. Browsers render it identically.'
        - 'The references are decimal code points (&#8364; for the euro sign). Hexadecimal references (&#x20AC;) are equivalent in HTML but are not produced or decoded here.'
        - 'Characters outside the Basic Multilingual Plane, such as most emoji, are encoded as two surrogate references (for example &#55357;&#56832;). Browsers display them correctly, but they are not the character''s single code point.'
        - 'This is not encryption or a security measure. Anyone can decode it, and most scrapers do.'
      faq:
        - q: 'Is this the same as the Unicode code point U+XXXX?'
          a: 'Related but not identical: the number after &# is the decimal code point for characters up to U+FFFF. For emoji and other supplementary characters this tool emits two surrogate numbers instead of the single code point.'
        - q: 'When should I use references instead of typing the character?'
          a: 'Only when the file cannot be saved as UTF-8 or passes through a system that corrupts non-ASCII text. In a UTF-8 document, typing the character directly is simpler and more readable.'

  ipv4-range-expander:
    title: IPv4 range expander
    description: Given a start and an end IPv4 address, this tool calculates a valid IPv4 subnet along with its CIDR notation.
    guide:
      intro: 'Given the first and last address of a range, finds the smallest CIDR block that contains the whole range, and shows how many addresses the block covers compared with the range you asked for.'
      useCases:
        - 'Turning a range such as 10.0.4.17 to 10.0.6.200 into a CIDR for a firewall, security group or route.'
        - 'Checking how much larger the aligned block is than the range you actually need.'
        - 'Converting legacy start/end style allow-lists into prefix notation.'
      steps:
        - 'Enter the start and the end address.'
        - 'Read the result table: the original and the expanded start and end, the number of addresses and the CIDR.'
        - 'If the end is lower than the start, use the swap button to exchange them.'
      notes:
        - 'A CIDR block must be aligned to a power of two, so the result is often larger than the range: the start is rounded down and the end rounded up to the block boundaries. Check the "addresses in range" row before using the CIDR in a rule, because the extra addresses are included too.'
        - 'A range that is not already a block cannot be expressed as one CIDR without including extra addresses. If that is unacceptable, split it into several blocks by hand.'
        - 'The expansion compares the two addresses bit by bit and keeps the common prefix, so ranges whose start and end differ in a high bit expand to a very large block (even /0).'
        - 'Start and end are remembered in this browser between visits.'
      faq:
        - q: 'Why does my range of 1000 addresses become a /22 with 1024?'
          a: 'Because 1000 is not a power of two and the range is not aligned. The smallest block that contains all 1000 addresses is 1024 addresses wide.'
        - q: 'How do I get an exact list of blocks instead?'
          a: 'Split the range at power-of-two boundaries: repeatedly take the largest aligned block that starts at the current start address and fits in the range, then continue from the next address.'

  text-diff:
    title: Text diff
    description: Compare two texts and see the differences between them.
    guide:
      intro: 'Compares two texts side by side and highlights the lines and characters that differ, using the same diff editor as Visual Studio Code. Both sides are editable, so you can fix a text and watch the differences disappear.'
      useCases:
        - 'Spotting what changed between two versions of a configuration file, a contract clause or a block of code.'
        - 'Checking that a copied or re-typed text matches the original exactly.'
        - 'Reviewing the output of a script against the expected result.'
      steps:
        - 'Paste the original text on the left and the modified text on the right.'
        - 'Changed lines are highlighted; within a line, the exact characters that differ are marked.'
        - 'Edit either side; the comparison updates as you type.'
      notes:
        - 'The comparison is line-based first, then character-based within changed lines. Reordering lines shows up as a removal plus an addition, not as a move.'
        - 'Whitespace differences, such as tabs versus spaces or a trailing space, are real differences and are highlighted. If they are noise, normalise both texts first.'
        - 'Different line endings (Windows CRLF versus Unix LF) can make every line look changed. Convert the texts to the same line ending before comparing.'
        - 'Everything stays in your browser. Large texts work, but the editor can become slow beyond a few megabytes.'
      faq:
        - q: 'Why does every line show as changed?'
          a: 'Usually because of invisible differences: line endings, indentation (tabs versus spaces) or trailing whitespace. Check a single line''s highlighted characters to see which.'
        - q: 'Can I compare two files?'
          a: 'Open each file in a text editor, copy its content and paste it into one side. The tool does not read files directly.'

  otp-generator:
    title: OTP code generator
    description: Generate and validate time-based OTP (one time password) for multi-factor authentication.
    guide:
      intro: 'Generates and checks time-based one-time passwords (TOTP, RFC 6238), the 6-digit codes that authenticator apps show for two-factor login. It shows the current code with the previous and next one, and gives you a key URI that can be turned into a QR code.'
      useCases:
        - 'Testing a two-factor login you are building, by comparing your server''s code with a reference implementation.'
        - 'Generating a secret and a provisioning URI to add to an authenticator app during development.'
        - 'Working out why codes are rejected, for example because of clock drift between the server and the phone.'
      steps:
        - 'Use the generated secret or paste your own Base32 secret.'
        - 'Read the current 6-digit code; it changes every 30 seconds, and the previous and next codes are shown beside it.'
        - 'To enrol an app, use the key URI (otpauth://) or its QR code, then compare the app''s code with the one shown here.'
      notes:
        - 'The secret is Base32 (letters A to Z and digits 2 to 7). Characters outside that set, such as 0, 1, 8 and 9, are not valid in it.'
        - 'Codes use HMAC-SHA1, 6 digits and a 30-second step, the defaults of nearly all authenticator apps. Settings that differ, such as 8 digits or SHA-256, are not covered here.'
        - 'A code is derived from the current time, so the server and the device must have accurate clocks. Servers usually accept the previous and next code as well, which is why those are shown.'
        - 'Anyone who knows the secret can generate valid codes forever. Treat it as a password, and use test secrets only.'
      faq:
        - q: 'Why is my code different from my phone app?'
          a: 'Either the secret differs, the app uses other settings (digits, algorithm or period), or a clock is off by more than about 30 seconds. Check the phone''s time first, and make sure automatic time is on.'
        - q: 'What is the difference between TOTP and HOTP?'
          a: 'HOTP uses a counter that increases with each use, while TOTP uses the current time divided into 30-second steps. TOTP is what authenticator apps use, and this tool is built around it.'

  url-encoder:
    title: Encode/decode URL-formatted strings
    description: Encode text to URL-encoded format (also known as "percent-encoded"), or decode from it.
    guide:
      intro: 'URLs may only contain a limited set of characters, so anything else, such as spaces, non-Latin text or reserved symbols, is written as percent-encoding (a % followed by two hex digits). This tool encodes text that way and decodes it again, using the same rules as JavaScript''s encodeURIComponent.'
      useCases:
        - 'Building a query-string value that contains spaces, &, = or non-English characters.'
        - 'Decoding a long %E4%B8%AD%E6%96%87-style string from a log or browser address bar to read it.'
        - 'Preparing a redirect target or callback URL that is passed inside another URL.'
      steps:
        - 'Type or paste text in the encode field to get the percent-encoded form.'
        - 'Paste an encoded string in the decode field to get the original text.'
        - 'Copy the result with the copy button.'
      notes:
        - 'The encoder escapes every character except letters, digits and - _ . ! ~ * '' ( ). That includes / ? & = : #, so do not encode a whole URL, only the individual value you are inserting into it. Otherwise the URL stops working.'
        - 'A space becomes %20, not +. The + sign means a space only in HTML form submissions, so decoding a form-encoded string leaves the + signs in place.'
        - 'Non-ASCII characters are first converted to UTF-8 bytes, so one Chinese character becomes three %XX groups.'
        - 'Decoding fails on a % that is not followed by two hex digits, or on bytes that are not valid UTF-8.'
      faq:
        - q: 'Should I encode the whole URL or just the parameter values?'
          a: 'Only the values (and key names, if needed). Encoding the whole URL also escapes the :// and the / separators and produces a string that is no longer a usable address.'
        - q: 'Why is a plus sign not decoded back to a space?'
          a: 'Percent-decoding does not treat + specially. If the text came from a form submission (application/x-www-form-urlencoded), replace + with a space before decoding.'

  text-to-binary:
    title: Text to ASCII binary
    description: Convert text to its ASCII binary representation and vice-versa.
    guide:
      intro: 'Writes text as binary, eight bits per character, and turns such binary back into text. Each character becomes its ASCII code in base 2, padded to 8 digits and separated by spaces.'
      useCases:
        - 'Teaching or learning how characters are stored as bits.'
        - 'Decoding binary-looking strings in puzzles, CTF challenges or geocaching clues.'
        - 'Producing a binary representation for a design, a T-shirt or a demo.'
      steps:
        - 'Type text in the first field to get its binary form.'
        - 'Paste groups of eight 0s and 1s in the second field to get the text back; spaces and other separators are ignored.'
        - 'Copy the result.'
      notes:
        - 'Each character is encoded as its UTF-16 code unit in 8 bits, which is exact for ASCII (0 to 127) and Latin-1 (up to 255). Characters above 255, including Chinese text and most emoji, do not fit in 8 bits and are encoded incorrectly, so stick to ASCII.'
        - 'Decoding removes everything that is not 0 or 1 and then requires a multiple of 8 digits; otherwise it reports an invalid binary string.'
        - 'A capital letter and its lowercase form differ by exactly one bit (the 32 bit): A is 01000001, a is 01100001.'
        - 'This is a representation, not a compression or encryption. It makes text 8 times longer.'
      faq:
        - q: 'Why does my decoded text look wrong?'
          a: 'Either the input was not grouped in 8-bit bytes (7-bit groups are common in puzzles, so add a leading 0 to each group), or the original text contained non-ASCII characters that do not survive the 8-bit encoding.'
        - q: 'Is this how computers really store text?'
          a: 'For ASCII, yes, one byte per character. Modern systems use UTF-8, where characters beyond ASCII take 2 to 4 bytes; this tool only shows the simple one-byte case.'

  ascii-text-drawer:
    title: ASCII Art Text Generator
    description: Create ASCII art text with many fonts and styles.
    guide:
      intro: 'Renders text as large ASCII art letters using FIGlet fonts, with nearly 300 styles to choose from and an adjustable line width. Handy for terminal banners, README headers and code comments.'
      useCases:
        - 'Adding a banner to a CLI tool''s start-up output or a shell script.'
        - 'Making a decorative heading for a README, a plain-text e-mail or a comment block.'
        - 'Creating retro-style text for a terminal-themed website.'
      steps:
        - 'Type the text, then pick a font from the list; Standard, Big, Slant and Shadow are popular choices.'
        - 'Adjust the width if long text should wrap sooner or later.'
        - 'Copy the result into a file or terminal.'
      notes:
        - 'ASCII art depends on a monospaced font. In a proportional font (most chat apps and word processors) the letters fall apart, so paste it into a terminal, a code block or a <pre> element.'
        - 'Most FIGlet fonts cover ASCII letters, digits and punctuation only. Accented or non-Latin characters are usually left blank or rendered as their closest ASCII form.'
        - 'Fonts are served by this site and loaded the first time you select each one, so the first render of a new font needs a short network request; fonts you have used are cached for offline use. The text you type is not sent anywhere.'
        - 'Multi-line output is wide: a short word in a large font can exceed 80 columns. Lower the width or choose a smaller font (Small, Mini, Thin) if it must fit a narrow terminal.'
      faq:
        - q: 'Why does the output look broken where I pasted it?'
          a: 'The destination is not using a monospaced font, or it collapsed repeated spaces. Use a code block (triple backticks in Markdown), a <pre> tag or a terminal.'
        - q: 'Which font looks like the classic Linux login banner?'
          a: 'Standard is the default FIGlet font seen in many banners; Slant, Big and Doom are other widely recognised ones.'

  email-normalizer:
    title: Email normalizer
    description: Normalize email addresses to a standard format for easier comparison. Useful for deduplication and data cleaning.
    guide:
      intro: 'Rewrites e-mail addresses into the canonical form their provider actually delivers to: lowercases the address, removes dots and +tags where the provider ignores them (Gmail), strips +tags where supported (Outlook, Hotmail, Live) and maps alias domains such as googlemail.com to gmail.com. Paste many addresses, one per line.'
      useCases:
        - 'Detecting duplicate sign-ups that use john.doe+promo{''@''}gmail.com and johndoe{''@''}gmail.com for the same inbox.'
        - 'Cleaning a mailing list or CRM export before deduplicating or merging records.'
        - 'Matching user accounts across systems that stored the same address in different spellings.'
      steps:
        - 'Paste the addresses, one per line.'
        - 'Read the normalised list on the right; lines that are not valid addresses are flagged.'
        - 'Copy the result.'
      notes:
        - 'Rules are provider-specific: Gmail ignores dots and anything after + in the local part, Outlook, Hotmail and Live ignore +tags but not dots, and most other providers treat dots and + as significant, so for them only the case is normalised.'
        - 'Normalisation is for comparison and deduplication. Keep the address the user actually typed for sending mail and for display, since some providers do deliver to the exact form only.'
        - 'Lowercasing the local part is technically not guaranteed by the standard, but every major provider is case-insensitive, so it is safe in practice.'
        - 'Custom domains hosted on Google Workspace or Microsoft 365 are not recognised as Gmail or Outlook, because the domain alone does not reveal the provider.'
      faq:
        - q: 'Why was a.b+c{''@''}yahoo.com left unchanged?'
          a: 'Yahoo treats dots as significant and uses a different disposable-address scheme (a hyphen), so only the case is normalised. Only providers with known rules are rewritten.'
        - q: 'Can I use the normalised address to send mail?'
          a: 'It will usually arrive for the providers listed, but the safe practice is to store both: the normalised form for matching and the original for correspondence.'

  json-to-xml:
    title: JSON to XML
    description: Convert JSON to XML
    guide:
      intro: 'Converts JSON into XML following the compact convention of the xml-js library: an _attributes object becomes element attributes, _text becomes the text content, and arrays become repeated elements. It is the inverse of the XML to JSON tool.'
      useCases:
        - 'Building an XML request body for a SOAP or legacy API from data held as JSON.'
        - 'Converting JSON back to XML after editing data that was converted the other way.'
        - 'Generating XML configuration or sitemap snippets from a script''s JSON output.'
      steps:
        - 'Paste JSON (JSON5 syntax is accepted) into the left field.'
        - 'Read the XML on the right.'
        - 'Copy the result.'
      notes:
        - 'Plain keys become elements and plain values their text: {''{''}"a":"hi"{''}''} gives <a>hi</a>. Use {''{''}"a":{''{''}"_attributes":{''{''}"id":"1"{''}''},"_text":"hi"{''}''}{''}''} to get <a id="1">hi</a>.'
        - 'XML needs a single root element, so the JSON object should have exactly one top-level key. Several keys produce several root elements, which is not a well-formed document.'
        - 'Keys must be valid XML names: they cannot start with a digit or contain spaces. Keys such as "1st" or "first name" produce invalid XML.'
        - 'Numbers, booleans and null are written as text; null and empty objects give empty elements. The output is on one line, so run it through the XML formatter to indent it.'
      faq:
        - q: 'Why does the output have no XML declaration?'
          a: 'One is only written when the JSON has a _declaration key, for example {''{''}"_declaration":{''{''}"_attributes":{''{''}"version":"1.0","encoding":"utf-8"{''}''}{''}''},"root":{''{''}...{''}''}{''}''}.'
        - q: 'How do I set attributes on an element?'
          a: 'Give the element an object value with an _attributes key holding the attributes and, if needed, a _text key for its text content.'

  markdown-to-html:
    title: Markdown to HTML
    description: Convert Markdown to Html and allow to print (as PDF)
    guide:
      intro: 'Converts Markdown into HTML with the markdown-it parser (CommonMark plus tables and strikethrough), shows the rendered result, and can send it to the print dialog to save it as a PDF.'
      useCases:
        - 'Getting the HTML of a README or a note to paste into a CMS, an e-mail or a web page.'
        - 'Printing or saving a Markdown document as a PDF without installing anything.'
        - 'Checking how a Markdown snippet renders before publishing it.'
      steps:
        - 'Paste or type Markdown in the left field.'
        - 'Read the generated HTML on the right and the rendered preview.'
        - 'Copy the HTML, or use the print button to open the print dialog and choose Save as PDF.'
      notes:
        - 'Raw HTML inside the Markdown is not passed through: it is shown as text. Use Markdown syntax for formatting instead.'
        - 'Supported beyond basic CommonMark: tables and strikethrough (~~text~~), which markdown-it enables by default; task lists, footnotes and math are not.'
        - 'The output is a fragment (no <html>, <head> or <body>), ready to insert into an existing page or template.'
        - 'Printing uses your browser''s print dialog, so page size, margins and headers are controlled there. Choose Save as PDF as the destination.'
      faq:
        - q: 'Why does my inline HTML show up as text?'
          a: 'HTML passthrough is disabled for safety, so tags are escaped and displayed literally. Express the formatting in Markdown, or add the HTML after conversion.'
        - q: 'Can I style the PDF?'
          a: 'Only through the browser''s print options (paper size, margins, scale). For custom fonts or colours, paste the HTML into your own page with a stylesheet and print from there.'

  regex-memo:
    title: Regex cheatsheet
    description: Javascript Regex/Regular Expression cheatsheet
    guide:
      intro: 'A compact reference for JavaScript regular expressions: character classes, anchors, quantifiers, groups and backreferences, lookaround, flags and the escape sequences, with the meaning of each token.'
      useCases:
        - 'Recalling the exact syntax of a lookbehind, a named group or a lazy quantifier while writing a pattern.'
        - 'Checking which flags exist and what the u, s and y flags do.'
        - 'Teaching regular expressions with a one-page overview.'
      steps:
        - 'Find the section for the construct you need.'
        - 'Read the token and its meaning, then try it in the Regex Tester tool.'
        - 'Use your browser''s search (Ctrl+F) for a specific token.'
      notes:
        - 'This sheet describes the JavaScript flavour. Named groups are (?<name>...), and \d, \w and \s match ASCII only unless the u flag and Unicode property escapes such as \p{''{''}L{''}''} are used.'
        - 'Quantifiers are greedy by default; add ? (as in .*?) to make them lazy. Nested quantifiers such as (a+)+ can cause catastrophic backtracking on some inputs.'
        - 'Lookbehind ((?<=...) and (?<!...)) is supported in all current browsers but was missing in Safari before 16.4; check your target environment.'
        - 'Inside a character class most metacharacters lose their meaning, so [.] matches a literal dot, while - and ] need escaping or careful placement.'
      faq:
        - q: 'What is the difference between .* and .*?'
          a: '.* is greedy and takes as much as possible, then backs off; .*? is lazy and takes as little as possible. On <b>a</b><b>b</b>, <b>.*</b> matches everything while <b>.*?</b> matches the first tag pair only.'
        - q: 'Why does \d not match Arabic-Indic or other digits?'
          a: 'In JavaScript \d is always [0-9]. To match digits in other scripts use \p{''{''}Nd{''}''} with the u flag.'

  regex-tester:
    title: Regex Tester
    description: Test your regular expressions with sample text.
    guide:
      intro: 'Test a regular expression against sample text and see every match highlighted, with its position and capture groups. It uses the JavaScript regular-expression engine of your browser.'
      useCases:
        - 'Building and refining a pattern before pasting it into code, a validation rule or a log-search query.'
        - 'Debugging why a pattern matches too much or too little by seeing each match and capture group.'
        - 'Learning regex syntax interactively with immediate feedback.'
      steps:
        - 'Type the pattern (without the surrounding slashes) in the regex field.'
        - 'Tick the flags you need: global, ignore case, multiline, dot-all, unicode or unicode sets.'
        - 'Enter or paste the text to match; the matches and their groups are listed below.'
      notes:
        - 'This is the JavaScript flavour. Syntax such as named groups is (?<name>...), not (?P<name>...) as in Python, and features like possessive quantifiers or atomic groups are not available. Check how your target language differs before reusing a pattern.'
        - 'Without the global flag only the first match is returned. Multiline makes ^ and $ match at each line, and dot-all lets . match newlines.'
        - 'Unicode (u) and unicode sets (v) are alternatives; when both are ticked, u is used. Use one of them for patterns with emoji or \p{''{''}...{''}''} property escapes.'
        - 'An invalid pattern simply shows no matches. A pattern with nested quantifiers such as (a+)+ can take exponential time on some inputs and freeze the tab.'
      faq:
        - q: 'Why does my pattern work here but not in another language?'
          a: 'Regex engines differ. Lookbehind, named groups, flags and Unicode handling vary between JavaScript, Python, PCRE, Java and others. Test with the engine your code actually runs on.'
        - q: 'Why do I only see one match?'
          a: 'The global (g) flag is off. Turn it on to find all matches instead of stopping at the first one.'

  safelink-decoder:
    title: Outlook Safelink decoder
    description: Decode Outlook SafeLink links
    guide:
      intro: 'Recovers the original web address from a Microsoft Outlook Safe Links URL, the long https://...safelinks.protection.outlook.com/?url=... links that Microsoft 365 substitutes for links in e-mails.'
      useCases:
        - 'Seeing where a link in a forwarded or quoted e-mail really points before opening it.'
        - 'Cleaning Safe Links wrappers out of URLs you want to save, share or paste into a document.'
        - 'Checking a suspicious link without clicking it.'
      steps:
        - 'Paste the Safe Links URL.'
        - 'Read the decoded destination below.'
        - 'Copy it.'
      notes:
        - 'Safe Links rewrites links so Microsoft can scan the destination at click time. The original address is carried in the url parameter, URL-encoded; this tool just extracts and decodes it.'
        - 'Only URLs on a safelinks.protection.outlook.com host are accepted. Other link-wrapping services (Proofpoint urldefense, Mimecast, Google) use different formats.'
        - 'Decoding bypasses Microsoft''s click-time check. Look at the decoded address carefully before visiting it, especially for login pages or unexpected domains.'
        - 'The decoding happens in your browser; the link is not visited or sent anywhere.'
      faq:
        - q: 'Why do my e-mails contain these long links at all?'
          a: 'Your organisation enabled Safe Links in Microsoft Defender for Office 365. It rewrites links so that known-malicious destinations can be blocked even after the e-mail was delivered.'
        - q: 'The decoded URL itself looks like another tracker; can I decode further?'
          a: 'Marketing links often chain several redirects. Paste the result into the URL parser to inspect its parameters; the final destination may only be known by following the redirect.'

  xml-to-json:
    title: XML to JSON
    description: Convert XML to JSON
    guide:
      intro: 'Converts an XML document into JSON using the compact convention of the xml-js library: attributes go under _attributes, text content under _text, and repeated elements become arrays. Everything runs in your browser.'
      useCases:
        - 'Reading a SOAP response, an RSS feed or a configuration file as JSON in a script or a browser tool.'
        - 'Exploring the structure of an unfamiliar XML document.'
        - 'Preparing XML data for a JSON-only API or a NoSQL database.'
      steps:
        - 'Paste the XML into the left field. Invalid XML is flagged with an error.'
        - 'Read the JSON on the right.'
        - 'Copy the result.'
      notes:
        - 'Attributes are grouped in an _attributes object and element text in _text, so <a id="1">hi</a> becomes {''{''}"a":{''{''}"_attributes":{''{''}"id":"1"{''}''},"_text":"hi"{''}''}{''}''}.'
        - 'An element that appears once becomes an object, the same element appearing twice becomes an array. Code that reads the result must handle both shapes, or normalise them.'
        - 'All values are strings. XML has no types, so 42 and true stay "42" and "true".'
        - 'The XML declaration, comments, CDATA and processing instructions are kept under keys such as _declaration, _comment and _cdata. Namespaces are kept as part of the element name (ns:item).'
      faq:
        - q: 'Why is the same element sometimes an object and sometimes an array?'
          a: 'The converter cannot know which elements are meant to repeat. One occurrence gives an object, two or more give an array. Normalise with something like [].concat(value) in your code.'
        - q: 'Why do my numbers appear as strings?'
          a: 'XML carries no type information, so every value is text. Convert to numbers or booleans in the consuming program.'

  certificate-parser:
    title: X.509 certificate parser
    description: Decode a PEM or DER certificate (or a whole chain) and see the subject, issuer, validity and days left, SAN, key type, key usage, extensions and fingerprints. Everything runs in your browser.
    guide:
      intro: 'Decodes an X.509 certificate, or a whole chain, and lays out the subject, issuer, validity period with days remaining, subject alternative names, public key type, key usage, extensions and SHA-1 and SHA-256 fingerprints. Parsing runs in your browser.'
      useCases:
        - 'Finding out when a TLS certificate expires and which domain names (SAN) it actually covers.'
        - 'Checking that the certificate a server presents is the one you just issued, by comparing fingerprints.'
        - 'Inspecting a chain from a PEM bundle to see which certificate is the leaf, which is the intermediate and who issued each.'
      steps:
        - 'Paste a PEM block (-----BEGIN CERTIFICATE-----) or a bare base64 DER certificate. Several certificates pasted together are read as a chain.'
        - 'Read the status tag (valid, expired or not yet valid) and the days remaining for each certificate.'
        - 'Open the details for names, key information, usage and fingerprints, and copy what you need.'
      notes:
        - 'Modern browsers match the host name against the subject alternative names, not the common name (CN), so check the SAN list when a certificate is rejected for a name mismatch.'
        - 'This tool only parses the certificate. It does not validate the chain against trusted roots, check revocation, or confirm that the certificate matches a private key.'
        - 'Only certificates are read. A private key in the pasted text is ignored, and you should never paste one into a web tool.'
        - 'Validity dates are interpreted against your device''s clock, so a wrong system date changes the status tag and days remaining.'
      faq:
        - q: 'How do I get the certificate of a website?'
          a: 'In a browser, open the certificate details from the padlock and export it as PEM. On the command line, openssl s_client -connect example.com:443 -showcerts prints the chain in PEM form.'
        - q: 'What is the fingerprint used for?'
          a: 'A fingerprint is a hash of the whole certificate. Comparing it with the value published by the other party confirms that you are looking at exactly the same certificate, which is how certificate pinning and many manual trust checks work.'

  jwt-signer:
    title: JWT sign and verify
    description: Create a signed JSON Web Token from a header and payload, or verify a token's signature, with HS256/384/512, RS256/384/512, PS256/384/512 and ES256/384/512. Keys stay in your browser.
    guide:
      intro: 'Creates a signed JSON Web Token from a header and payload you write, and verifies the signature of an existing token. It supports HMAC (HS256/384/512), RSA (RS and PS) and ECDSA (ES256/384/512), using your browser''s built-in Web Crypto, so keys never leave the page.'
      useCases:
        - 'Generating test tokens with exactly the claims, expiry and algorithm your API needs, without writing a script.'
        - 'Checking whether a token''s signature matches a given secret or public key while debugging a 401 or an invalid signature error.'
        - 'Trying an algorithm (HS256 versus RS256 versus ES256) before wiring it into a service.'
      steps:
        - 'Choose the algorithm, then edit the header and payload JSON. The alg field is set for you, and typ defaults to JWT.'
        - 'For HS algorithms enter a shared secret (as UTF-8 text or base64url). For RS, PS and ES algorithms paste a private key, or use the button that generates a key pair.'
        - 'Copy the signed token. To verify, paste a token into the verify section with the secret or the public key and read the result.'
      notes:
        - 'Private keys must be PKCS#8 PEM, starting with -----BEGIN PRIVATE KEY-----. A key that starts with BEGIN RSA PRIVATE KEY or BEGIN EC PRIVATE KEY is not accepted; convert it with: openssl pkcs8 -topk8 -nocrypt -in key.pem.'
        - 'The curve must match the algorithm: ES256 uses P-256, ES384 uses P-384 and ES512 uses P-521 (not P-512). A mismatched key is rejected with a clear message.'
        - 'Verification checks the signature only. It does not check exp, nbf, aud or iss, so an expired token can still show as valid. Check the claims with the JWT parser.'
        - 'For verification you can paste a public key (-----BEGIN PUBLIC KEY-----); a PKCS#8 private key also works, because the public part is derived from it.'
        - 'Use test keys only. Do not paste a production private key or secret into any web page, even one that runs locally.'
      faq:
        - q: 'What is the difference between HS256 and RS256?'
          a: 'HS256 uses one shared secret for both signing and verifying, so every party that can verify can also forge tokens. RS256 signs with a private key and verifies with a public key, which lets you share verification without sharing the ability to sign.'
        - q: 'Why does verification say the signature is invalid?'
          a: 'The most common causes are a different secret or key, a secret decoded with the wrong encoding (UTF-8 text versus base64url), a token whose header names another algorithm than the one you expect, or a token that was edited after signing.'

  chinese-converter:
    title: Traditional / Simplified Chinese converter
    description: Convert text between Simplified Chinese and Traditional Chinese (Taiwan, Hong Kong, with optional Taiwanese phrases such as 软件 → 軟體) using OpenCC, entirely in your browser.
    guide:
      intro: 'Converts text between Simplified and Traditional Chinese using OpenCC, the open-source conversion dictionaries. Besides character-by-character conversion it can apply Taiwan and Hong Kong forms and, optionally, Taiwanese vocabulary such as 软件 to 軟體.'
      useCases:
        - 'Turning a Simplified Chinese document, subtitle file or README into Traditional Chinese for readers in Taiwan or Hong Kong.'
        - 'Localising product copy, so that both the characters and the everyday terms (软件, 内存, 视频) read naturally.'
        - 'Converting Traditional text to Simplified for a mainland audience or for matching against Simplified data.'
      steps:
        - 'Choose the source variant in From and the target in To; the swap button reverses them.'
        - 'Pick Taiwan (characters only) or Taiwan with idioms if you also want vocabulary changed.'
        - 'Paste the text and copy the converted result.'
      notes:
        - 'Plain character conversion is not enough for natural Traditional Chinese, because the two communities use different words for the same thing, for example 内存 versus 記憶體 and 软件 versus 軟體. Use the Taiwan with idioms option for text aimed at Taiwanese readers.'
        - 'Some Simplified characters map to several Traditional ones (发 can be 發 or 髮, 后 can be 后 or 後). OpenCC resolves most cases from the surrounding words, but proper nouns and unusual phrases can still come out wrong, so proofread the result.'
        - 'Conversion does not translate. Differences in grammar, punctuation style or regional spelling of names are left as they are.'
        - 'Your last chosen directions are remembered in this browser. The text itself is not uploaded.'
      faq:
        - q: 'What is the difference between the Traditional options?'
          a: 'Taiwan changes characters to the standard used in Taiwan. Taiwan with idioms also replaces regional vocabulary. Hong Kong uses Hong Kong character forms, and the OpenCC standard option uses a neutral set without regional variants.'
        - q: 'Why did a word come out wrong?'
          a: 'Conversion is dictionary-based, so rare names, quotations and ambiguous characters can be mapped incorrectly. Fix those by hand, or split the text so the ambiguous word appears with more context.'
