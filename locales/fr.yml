about:
  content: >
    # À propos d'IT-Tools

    IT-Tools regroupe des outils en ligne pratiques pour les développeurs et les personnes travaillant dans l'informatique. Tous les outils s'exécutent dans votre navigateur. Si le site vous est utile, partagez-le et ajoutez-le à vos favoris !

    Ce site est un déploiement personnalisé du projet open source [IT-Tools](https://github.com/CorentinTh/it-tools) de Corentin Thomasset (licence GPL-3.0). Le code source de cette version est disponible sur [GitHub](https://github.com/murmur-wu/it-tools).

    ## Technologies

    IT-Tools est construit avec Vue.js (Vue 3) et la bibliothèque de composants Naive UI, et est hébergé sur Cloudflare. Certains outils utilisent des bibliothèques open source tierces ; la liste complète se trouve dans le [package.json](https://github.com/murmur-wu/it-tools/blob/main/package.json) du dépôt.

    ## Un bug ? Un outil manquant ?

    Les demandes de fonctionnalités et les rapports de bugs sont les bienvenus dans la [section issues](https://github.com/murmur-wu/it-tools/issues) du dépôt GitHub.

