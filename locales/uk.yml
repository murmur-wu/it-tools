about:
  content: >
    # Про IT-Tools

    IT-Tools — це добірка зручних онлайн-інструментів для розробників та IT-фахівців. Усі інструменти працюють у вашому браузері. Якщо сайт вам корисний, поділіться ним та додайте в закладки!

    Цей сайт є налаштованою версією проєкту з відкритим кодом [IT-Tools](https://github.com/CorentinTh/it-tools) від Corentin Thomasset (ліцензія GPL-3.0). Вихідний код цієї версії доступний на [GitHub](https://github.com/murmur-wu/it-tools).

    ## Технології

    IT-Tools створено на Vue.js (Vue 3) з бібліотекою компонентів Naive UI та розміщено на Cloudflare. Деякі інструменти використовують сторонні бібліотеки з відкритим кодом; повний перелік у файлі [package.json](https://github.com/murmur-wu/it-tools/blob/main/package.json) репозиторію.

    ## Знайшли помилку? Бракує інструмента?

    Запити на нові функції та повідомлення про помилки вітаються в [розділі issues](https://github.com/murmur-wu/it-tools/issues) репозиторію GitHub.

