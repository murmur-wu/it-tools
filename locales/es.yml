about:
  content: >
    # Acerca de IT-Tools

    IT-Tools es una colección de herramientas en línea útiles para desarrolladores y profesionales de TI. Todas las herramientas se ejecutan en tu navegador. Si te resulta útil, compártela y añádela a tus marcadores.

    Este sitio es un despliegue personalizado del proyecto de código abierto [IT-Tools](https://github.com/CorentinTh/it-tools) de Corentin Thomasset (licencia GPL-3.0). El código fuente de esta versión está disponible en [GitHub](https://github.com/murmur-wu/it-tools).

    ## Tecnologías

    IT-Tools está construido con Vue.js (Vue 3) y la biblioteca de componentes Naive UI, y se aloja en Cloudflare. Algunas herramientas usan bibliotecas de código abierto de terceros; la lista completa está en el [package.json](https://github.com/murmur-wu/it-tools/blob/main/package.json) del repositorio.

    ## ¿Encontraste un error? ¿Falta una herramienta?

    Las solicitudes de funciones y los informes de errores son bienvenidos en la [sección de issues](https://github.com/murmur-wu/it-tools/issues) del repositorio de GitHub.

