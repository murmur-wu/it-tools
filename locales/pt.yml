about:
  content: >
    # Sobre o IT-Tools

    O IT-Tools é uma coleção de ferramentas online úteis para desenvolvedores e profissionais de TI. Todas as ferramentas são executadas no seu navegador. Se achar útil, compartilhe e adicione aos favoritos!

    Este site é uma implantação personalizada do projeto de código aberto [IT-Tools](https://github.com/CorentinTh/it-tools) de Corentin Thomasset (licença GPL-3.0). O código-fonte desta versão está disponível no [GitHub](https://github.com/murmur-wu/it-tools).

    ## Tecnologias

    O IT-Tools é construído com Vue.js (Vue 3) e a biblioteca de componentes Naive UI, e está hospedado na Cloudflare. Algumas ferramentas usam bibliotecas de código aberto de terceiros; a lista completa está no [package.json](https://github.com/murmur-wu/it-tools/blob/main/package.json) do repositório.

    ## Encontrou um bug? Falta uma ferramenta?

    Pedidos de funcionalidades e relatórios de bugs são bem-vindos na [seção de issues](https://github.com/murmur-wu/it-tools/issues) do repositório no GitHub.

